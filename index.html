    --warn:#b23a2e; --warn-soft:#f5e4e1; --locked:#97a39c; --locked-soft:#edf0ee;

    --paper:#14181a; --surface:#1b201f; --ink:#e9edea; --ink-muted:#9aa6a0;
    --rule:#2b332f; --accent:#5db494; --accent-strong:#8fd0b6; --accent-soft:#1e332b;
    --warn:#e2857a; --warn-soft:#3a2320; --locked:#6b776f; --locked-soft:#232925;
    --late:#d9a54a; --late-soft:#3a2f18;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--paper); color:var(--ink); font-family:'IBM Plex Sans',system-ui,sans-serif; font-size:15.5px; line-height:1.55; }
  h1,h2,h3{ font-family:'Newsreader',Georgia,serif; font-weight:600; text-wrap:balance; margin:0; color:var(--ink); }
  .mono{ font-family:'IBM Plex Mono',monospace; }
  button{ font-family:inherit; cursor:pointer; }
  input,textarea,select{ font-family:inherit; font-size:14.5px; }
  [hidden]{ display:none !important; }

  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:14px 24px; border-bottom:1px solid var(--rule); background:var(--surface); }
  .topbar .brand{ font-family:'Newsreader',serif; font-weight:600; font-size:17px; }
  .topbar .brand span{ color:var(--accent-strong); }
  .btn{ border:1px solid var(--rule); background:var(--surface); color:var(--ink); border-radius:7px; padding:8px 14px; font-size:13.5px; font-weight:500; }
  .btn:hover{ border-color:var(--accent); color:var(--accent-strong); }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.primary:hover{ background:var(--accent-strong); border-color:var(--accent-strong); color:#fff; }
  .btn.danger{ color:var(--warn); }
  .btn.danger:hover{ border-color:var(--warn); }
  .btn.ghost{ border-color:transparent; background:transparent; }
  .btn.small{ padding:5px 10px; font-size:12.5px; }
  .btn:disabled{ opacity:0.4; cursor:default; }
  .btn:disabled:hover{ border-color:var(--rule); color:var(--ink); }
  .inp{ width:100%; padding:9px 11px; border:1px solid var(--rule); border-radius:7px; background:var(--paper); color:var(--ink); margin-bottom:10px; }
  select.inp{ appearance:auto; }

  .login-wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .login-card{ width:100%; max-width:400px; background:var(--surface); border:1px solid var(--rule); border-radius:14px; padding:32px 30px; box-shadow:var(--shadow); }
  .login-card .eyebrow{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; letter-spacing:0.08em; text-transform:uppercase; color:var(--accent); }
  .login-card h1{ font-size:22px; margin:8px 0 22px; }
  .tabs{ display:flex; gap:4px; background:var(--paper); border:1px solid var(--rule); border-radius:9px; padding:4px; margin-bottom:20px; }
  .tabs button{ flex:1; border:none; background:transparent; border-radius:6px; padding:8px 4px; font-size:13px; font-weight:500; color:var(--ink-muted); }
  .tabs button.active{ background:var(--surface); color:var(--accent-strong); box-shadow:var(--shadow); }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12.5px; color:var(--ink-muted); margin-bottom:5px; }
  .field input{ width:100%; padding:9px 11px; border:1px solid var(--rule); border-radius:7px; background:var(--paper); color:var(--ink); }
  .login-err{ font-size:13px; color:var(--warn); margin-bottom:10px; min-height:18px; }
  .demo-hint{ margin-top:18px; font-size:12px; color:var(--ink-muted); background:var(--paper); border:1px dashed var(--rule); border-radius:8px; padding:10px 12px; }

  .view-wrap{ height:100vh; display:flex; flex-direction:column; }
  .shell{ display:grid; grid-template-columns:220px minmax(0,1fr) 240px; flex:1; min-height:0; }
  .side{ border-right:1px solid var(--rule); padding:22px 14px; background:var(--surface); overflow-y:auto; min-height:0; }
  .center{ overflow-y:auto; min-height:0; }
  .side .side-label{ font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.07em; text-transform:uppercase; color:var(--ink-muted); margin:0 8px 10px; }
  .week-row{ display:flex; align-items:center; gap:9px; padding:9px 10px; border-radius:8px; font-size:13.5px; margin-bottom:3px; color:var(--ink-muted); cursor:pointer; }
  .week-row.active{ background:var(--accent-soft); color:var(--accent-strong); font-weight:600; }
  .week-row.locked{ color:var(--locked); cursor:default; }
  .week-row .lockhint{ font-size:11px; margin-left:auto; }
  .dot{ width:7px; height:7px; border-radius:50%; flex-shrink:0; }
  .dot.now{ background:var(--accent-strong); }
  .dot.locked{ background:var(--locked); }
  .dot.done{ background:var(--accent); }

  main.center{ padding:30px 40px 100px; min-width:0; }
  .progress-strip{ display:flex; align-items:center; gap:16px; margin-bottom:24px; padding:14px 18px; background:var(--surface); border:1px solid var(--rule); border-radius:10px; box-shadow:var(--shadow); flex-wrap:wrap; }
  .progress-strip .badge{ width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
  .badge.ok{ background:var(--accent-soft); color:var(--accent-strong); }
  .badge.warn{ background:var(--warn-soft); color:var(--warn); }
  .badge.locked{ background:var(--locked-soft); color:var(--locked); }
  .badge.late{ background:var(--late-soft); color:var(--late); }
  .progress-strip .txt b{ display:block; font-size:14px; }
  .progress-strip .txt span{ font-size:12.5px; color:var(--ink-muted); }
  .bar-track{ flex:1; min-width:80px; height:7px; border-radius:99px; background:var(--rule); overflow:hidden; }
  .bar-fill{ height:100%; background:var(--accent); border-radius:99px; transition:width .4s ease; }

  .section-tabs{ display:flex; gap:4px; background:var(--surface); border:1px solid var(--rule); border-radius:9px; padding:4px; margin-bottom:26px; width:fit-content; flex-wrap:wrap; }
  .section-tabs button{ border:none; background:transparent; border-radius:6px; padding:8px 16px; font-size:13.5px; font-weight:500; color:var(--ink-muted); }
  .section-tabs button.active{ background:var(--accent-soft); color:var(--accent-strong); }

  .reader{ background:var(--surface); border:1px solid var(--rule); border-radius:12px; padding:30px 34px; box-shadow:var(--shadow); }
  .reader-dots{ display:flex; align-items:center; gap:8px; margin-bottom:22px; flex-wrap:wrap; }
  .reader-dots .rd{ width:26px; height:5px; border-radius:99px; background:var(--rule); }
  .reader-dots .rd.read{ background:var(--accent); }
  .reader-dots .rd.current{ background:var(--accent-strong); }
  .reader-dots .rd-label{ margin-left:8px; font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--ink-muted); }
  .reader h3{ font-size:19px; margin-bottom:14px; }
  .reader .body{ color:var(--ink); font-size:15.5px; max-width:68ch; line-height:1.7; margin-bottom:30px; white-space:pre-wrap; }
  .reader-nav{ display:flex; justify-content:space-between; align-items:center; border-top:1px solid var(--rule); padding-top:20px; }
  .empty-hint{ color:var(--ink-muted); font-size:14.5px; }

  .ex{ margin-bottom:18px; padding:18px 20px; background:var(--surface); border:1px solid var(--rule); border-radius:10px; box-shadow:var(--shadow); }
  .ex .ex-kicker{ font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.06em; text-transform:uppercase; margin-bottom:8px; }
  .ex .ex-kicker.closed{ color:var(--accent-strong); }
  .ex .ex-kicker.open{ color:var(--late); }
  .ex p.q{ margin:0 0 12px; font-size:14.5px; white-space:pre-wrap; }
  .opts{ display:flex; flex-direction:column; gap:7px; margin-bottom:10px; }
  .opts label{ display:flex; align-items:center; gap:8px; font-size:14px; padding:7px 10px; border:1px solid var(--rule); border-radius:7px; background:var(--paper); }
  .opts label:has(input:checked){ border-color:var(--accent); background:var(--accent-soft); }
  .ex input[type="text"], .ex textarea{ width:100%; padding:9px 11px; border:1px solid var(--rule); border-radius:7px; background:var(--paper); color:var(--ink); }
  .ex textarea{ min-height:78px; resize:vertical; }
  .ex-result{ margin-top:10px; font-size:13px; padding:8px 11px; border-radius:7px; }
  .ex-result.correct{ background:var(--accent-soft); color:var(--accent-strong); }
  .ex-result.wrong{ background:var(--warn-soft); color:var(--warn); }
  .ex-result.pending{ background:var(--late-soft); color:var(--late); }
  .ex-result.reviewed-ok{ background:var(--accent-soft); color:var(--accent-strong); }
  .ex-result.reviewed-bad{ background:var(--warn-soft); color:var(--warn); }
  .ex-foot{ display:flex; justify-content:flex-end; gap:8px; margin-top:6px; }

  .side.right{ border-right:none; border-left:1px solid var(--rule); }

  .bubble b{ display:block; color:var(--ink); font-size:13px; margin-bottom:3px; }

  .teacher-wrap{ padding:28px 40px 80px; max-width:1080px; margin:0 auto; flex:1; min-height:0; overflow-y:auto; }
  .t-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; flex-wrap:wrap; gap:12px; }
  .t-head-left{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .t-config{ display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--rule); border-radius:9px; padding:10px 14px; margin-bottom:16px; font-size:13.5px; flex-wrap:wrap; }
  table.roster{ width:100%; border-collapse:collapse; background:var(--surface); border:1px solid var(--rule); border-radius:10px; overflow:hidden; }
  table.roster th{ text-align:left; font-size:11.5px; letter-spacing:0.05em; text-transform:uppercase; color:var(--ink-muted); font-weight:500; padding:11px 14px; border-bottom:1px solid var(--rule); background:var(--paper); }
  table.roster td{ padding:12px 14px; border-bottom:1px solid var(--rule); font-size:14px; vertical-align:middle; }
  table.roster tr:last-child td{ border-bottom:none; }
  table.roster tr.clickable:hover{ background:var(--paper); cursor:pointer; }
  table.roster tr.needs-review{ background:var(--late-soft); }
  table.roster tr.needs-review:hover{ background:var(--late-soft); filter:brightness(0.97); }
  .status-pill{ display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:500; padding:4px 10px; border-radius:99px; }
  .status-pill.ok{ background:var(--accent-soft); color:var(--accent-strong); }
  .status-pill.warn{ background:var(--warn-soft); color:var(--warn); }
  .status-pill.late{ background:var(--late-soft); color:var(--late); }
  .status-pill.progress{ background:var(--locked-soft); color:var(--ink-muted); }

  .section-block{ margin-bottom:22px; }
  .section-block h3{ font-size:16px; margin-bottom:12px; }
  .kq-card{ border:1px solid var(--rule); border-radius:9px; padding:14px 16px; margin-bottom:10px; background:var(--surface); }
  .kq-card .kq-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .kq-card .kq-title{ font-weight:600; font-size:14.5px; margin-bottom:4px; }
  .kq-card .kq-body{ color:var(--ink-muted); font-size:13.5px; white-space:pre-wrap; }
  .kq-card .kq-kicker{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.05em; text-transform:uppercase; color:var(--accent-strong); margin-bottom:5px; }
  .add-form{ border:1px dashed var(--rule); border-radius:9px; padding:16px; margin-bottom:10px; background:var(--paper); }
  .opt-row{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .opt-row input[type="text"]{ flex:1; padding:8px 10px; border:1px solid var(--rule); border-radius:6px; background:var(--surface); color:var(--ink); }

  .drawer-backdrop{ position:fixed; inset:0; background:rgba(20,24,22,0.35); display:flex; justify-content:flex-end; z-index:20; }
  .drawer{ width:min(520px,92vw); background:var(--surface); height:100%; overflow-y:auto; padding:26px 28px 60px; box-shadow:-8px 0 24px rgba(0,0,0,0.12); }
  .drawer h2{ font-size:19px; margin-bottom:4px; }
  .drawer .sub{ color:var(--ink-muted); font-size:13px; margin-bottom:20px; }
  .drawer-close{ float:right; }
  .review-card{ border:1px solid var(--rule); border-radius:9px; padding:14px 16px; margin-bottom:14px; }
  .review-card .qtxt{ font-size:13.5px; margin-bottom:6px; color:var(--ink-muted); white-space:pre-wrap; }
  .review-card .ans{ font-size:14px; background:var(--paper); border-radius:6px; padding:8px 10px; margin-bottom:10px; white-space:pre-wrap; }
  .review-actions{ display:flex; gap:8px; }

  .modal-backdrop{ position:fixed; inset:0; background:rgba(20,24,22,0.35); display:flex; align-items:center; justify-content:center; z-index:30; padding:20px; }
  .modal{ width:min(400px,92vw); background:var(--surface); border-radius:12px; padding:24px; box-shadow:var(--shadow); max-height:88vh; overflow-y:auto; }
  .modal h3{ font-size:16px; margin-bottom:14px; }

  .toast{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--paper); padding:9px 16px; border-radius:8px; font-size:13px; z-index:40; opacity:0; transition:opacity .3s; pointer-events:none; }
  .toast.show{ opacity:1; }

  @media (max-width:860px){
    .view-wrap{ height:auto; }
    .shell{ grid-template-columns:1fr; overflow:visible; }
    .side{ border-right:none; border-bottom:1px solid var(--rule); overflow-y:visible; }
    .side.right{ border-left:none; }
    .center{ overflow-y:visible; }
    main.center{ padding:22px 18px 80px; }
    .teacher-wrap{ padding:22px 16px 60px; overflow-y:visible; }
  }
</style>

</head>

  var CLOSED_THRESHOLD = 1;
  var WEEKS_SEED = [{"no": 1, "baslik": "1. Hafta — Algoritma, Problem Çözme ve GİÇ Modeli", "baslangicTarihi": "2026-09-14", "konular": [{"id": "p1", "title": "1.1. Problem Analizi ve Bileşenleri", "body": "Programlama sürecinin ilk ve en önemli adımı, karşılaşılan problemin doğru bir şekilde analiz edilmesidir. Bir sorunun çözümüne ulaşmak için önce hangi verilere (girdi) ihtiyaç duyulduğunu belirlememiz, bu veriler üzerinde yapılacak matematiksel veya mantıksal işlemleri tanımlamamız ve elde edilmesi beklenen sonucu (çıktı) netleştirmemiz gerekir. Bu sürece problem analizi denir. Örneğin bir okul kantininde yaşanan sıra bekleme sorununu çözmek için öğrenci sayısı ve alışveriş süreleri girdi olarak belirlenebilir; ardından uygun sıra ve ödeme düzeninin oluşturulmasına yönelik işlemler gerçekleştirilir; bu işlemler sonucunda ortalama bekleme süresinin hesaplanması veya önerilen sıra düzeni çıktı olarak değerlendirilir."}, {"id": "p2", "title": "1.1.1. Algoritma ve Tasarım Kriterleri", "body": "Bilgisayar bilimlerinde, yapılan analizlerin eksiksiz bir şekilde hayata geçirilebilmesi ve çözüm yollarının kurgulanabilmesi için algoritma adı verilen tasarımdan yararlanılır. Algoritma, belirli bir problemi çözmek veya hedeflenen bir amaca ulaşmak için tasarlanan, açık ve sıralı adımlardan oluşan mantıksal bir süreçtir. Bilgisayarlar kendilerine tanımlanan komutlar ve kurallar doğrultusunda işlem yaptığından, algoritmanın her adımı anlaşılır, uygulanabilir ve yoruma kapalı olmalıdır.\n\nBelirli bir problemi çözmek üzere tasarlanan bir sürecin algoritma olarak değerlendirilebilmesi için üç temel ilkeyi karşılaması beklenir:\n\n• Sonluluk: Algoritmanın bir başlangıç noktası bulunmalı ve tanımlanan koşullar altında belirli bir süre sonra tamamlanmalıdır — yani bir yerde mutlaka bitmelidir.\n• Belirlilik (kesinlik): Her işlem adımı tek bir anlama gelecek biçimde açık ve kesin olarak ifade edilmelidir.\n• Etkinlik: Algoritmadaki adımlar, uygulanabilir ve izlenebilir işlemlerden oluşmalıdır.\n\nOKU-YORUM — Bilimsel Mirasın Temel Taşı: El-Harezmi\nBugünkü dünyada akıllı telefonlardan otonom araçlara, yapay zekâ sistemlerinden veri analiz araçlarına kadar kullanılan tüm modern teknolojilerin kalbinde tek bir temel kavram yatmaktadır: algoritma. Bu kavramın kökenleri 9. yüzyıl Bağdat'ına, Doğu İslam dünyasının en büyük bilim merkezlerinden biri olan Beytülhikme'ye (Bilgelik Evi) dayanır.\n\nBilgisayar biliminin temellerini atan büyük İslam bilgini, matematikçisi ve astronomu El-Harezmi (780-850), insanlık tarihinin en büyük mantıksal devrimlerinden birine imza atmıştır. Onun Latinceye Algoritmi de numero Indorum olarak tercüme edilen eseri hem bugün kullanılan sıfır (sıfır) kavramını dünyaya tanıtmış hem de bilim dünyasına adım adım ilerleme yöntemini kazandırmıştır. Batı dillerindeki algorism ve zamanla dönüşen algorithm (algoritma) kelimesi de El-Harezmi'nin adının Avrupalı bilim insanları tarafından telaffuz edilemeyip Latinceye algoritmi şeklinde uyarlanmasıyla literatüre girmiştir.\n\nAlgoritmik düşüncenin tarihsel kökleri, El-Harezmi'nin kurguladığı bu adım adım ilerleme yöntemine dayanır. Bu yöntem; karmaşık ve çözülemez görünen büyük bir problemi mantıklı, sonlu ve birbirini takip eden küçük adımlara bölerek neticeye ulaştırmayı hedefler. Bilgisayarların henüz icat edilmediği bir çağda insan zihninin çalışma prensiplerini ve mantıksal çözüm yollarını formüle eden bu yaklaşım, bugünkü programlama dillerinin doğrudan temelini oluşturur.\n\nEl-Harezmi'nin cebirsel denklemleri çözmek için hiyerarşik bir düzene bağladığı bu kurallar bütünü, bir bilgisayarın verileri işleme ve problem çözme mantığıyla birebir aynıdır. Türk-İslam medeniyetinin ve millî teknoloji tarihinin köklerinde yer alan bu eşsiz miras, bugünün yazılım mimarilerine asırlar öncesinden rehberlik etmeye devam etmektedir."}, {"id": "p3", "title": "1.1.2. Problemi Bileşenlerine Ayırma", "body": "Yazılım dünyasında karşılaşılan bazı problemler, tek adımda çözülemeyecek kadar büyük ve karmaşık olabilir. Bu tür durumlarda Problemi Bileşenlerine Ayırma (Decomposition) yaklaşımı kullanılır. Bu yaklaşım, büyük bir problemi daha küçük, anlamlı ve kolay yönetilebilir alt problemlere veya bileşenlere ayırma sürecidir. Her bileşenin ayrı ayrı analiz edilmesi, hata riskini azaltır; sistemin geliştirilmesini, test edilmesini ve gerektiğinde güncellenmesini kolaylaştırır.\n\nÖrneğin kapsamlı bir dijital oyun tasarlanırken grafiklerin, kullanıcı kontrollerinin, seslerin, puanlama sisteminin ve oyun senaryosunun aynı anda ele alınması karmaşaya ve mantık hatalarına yol açabilir. Bunun yerine problem farklı bileşenlere ayrılabilir: karakter hareketleri bir bileşen, ses ve müzik işlemleri başka bir bileşen, puanlama sistemi ise ayrı bir bileşen olarak tasarlanabilir. Her bileşen kendi görevi doğrultusunda ayrı ayrı test edildikten sonra diğer bileşenlerle bir araya getirilir. Böylece sistemin genel yapısını anlamak, hataları belirlemek ve yazılımı düzenli biçimde geliştirmek daha kolay hâle gelir."}, {"id": "p4", "title": "1.1.3. Girdi-İşlem-Çıktı (GİÇ) Modeli", "body": "Bilgisayar programları, karmaşık problemleri çözmek için verileri belirli bir düzende işler. Bu düzenin temel yapı taşı Girdi-İşlem-Çıktı (GİÇ) modelidir. Algoritmik düşünme becerisinin temeli, bir problemi bu üç bileşene doğru şekilde ayrıştırabilmektir.\n\nSistemin çalışabilmesi için öncelikle dış dünyadan bazı başlangıç verilerinin alınması gerekir. Kullanıcının klavyeden girdiği bir isim, sensörden okunan sıcaklık değeri veya bir dosyanın içeriği gibi sisteme aktarılan her türlü ham veri girdi (input) olarak değerlendirilir. Sisteme alınan bu verilerin hedeflenen sonuca ulaşması için arka planda çeşitli matematiksel veya mantıksal denetimler gerçekleştirildiği aşama işlem (process) sürecini oluşturur. Bu işlemlerin başarıyla tamamlanmasının ardından elde edilen ve ekrandaki mesaj veya yazıcı dökümü gibi kullanıcıya sunulan nihai ürün ise çıktı (output) olarak sisteme yansıtılır.\n\nBu model, günlük hayattaki bankamatikten para çekme senaryosuyla somutlaştırılabilir. Kullanıcının cihaza taktığı kart bilgileri, tuşladığı şifre ve çekmek istediği para miktarı sisteme verilen birer girdidir. Sistem, şifrenin doğruluğunu teyit edip çekilecek tutarı mevcut bakiyeden düşerek işlem aşamasını tamamlar. Para haznesinden verilen banknotlar ve ekrandaki yeni bakiye bilgisi ise sürecin başarılı bir şekilde sonlandığını gösteren çıktılardır.\n\nUYGULAMA — Problemi Parçala\nGünlük hayatta sıkça karşılaşılan yiyecek ve içecek otomatları, arka planda karmaşık bir karar ve kontrol mekanizması işletir: paranın atılması, sahtelik kontrolü, stok sorgulaması, bakiye kıyaslaması, para üstünün hesaplanması gibi birçok adım ardışık olarak gerçekleşir. Bu karmaşık işlem adımlarının tek parça ve plansız biçimde tasarlanması, mantık hatalarının gözden kaçmasına ve sistemin test edilmesinin zorlaşmasına neden olabilir. Bu problemi çözmek için kurgulanan karmaşık yapının işlem basamaklarına göre doğru alt parçalara (Girdi / İşlem / Çıktı) ayrılması gerekir: otomat makinesinin kullanıcıdan veya sensörlerden aldığı veriler ve sinyaller nelerdir (Girdi); sistem girdileri aldıktan sonra hedefe ulaşmak için arka planda hangi matematiksel ve mantıksal kontrolleri sırayla yapar (İşlem); tüm kontrol ve işlem adımları sorunsuz tamamlandığında kullanıcıya veya sisteme sunulan somut sonuçlar nelerdir (Çıktı)."}, {"id": "p5", "title": "Örnek Olay: Akıllı Otopark Sistemi", "body": "Bir alışveriş merkezinin akıllı otopark sistemini düşünelim: araba yaklaşınca kamera plakayı okur, sistem boş yer olup olmadığını kontrol eder ve giriş saatini kaydeder. Araba çıkarken kalış süresi hesaplanır, ücretsiz kullanım hakkı varsa denetlenir, gerekiyorsa ücret belirlenir ve ödeme alınıp bariyer açılır. Bu karmaşık süreci tek parça hâlinde değil; Problemi Bileşenlerine Ayırma ve GİÇ modeli birlikte kullanılarak (girdi: plaka/saat, işlem: süre ve ücret hesabı, çıktı: bariyer açma sinyali) adım adım tasarlamak gerekir.\n\nBilgisayar bilimlerinde karmaşık sistemler tasarlanırken Girdi-İşlem-Çıktı modeli tek bir parça hâlinde uygulanmaz. Devasa ve çok değişkenli problemlerle karşılaşıldığında bu model, Problemi Bileşenlerine Ayırma yaklaşımıyla birleştirilerek kullanılır. Akıllı bina sistemleri, otonom araçlar veya gelişmiş otopark sistemleri gibi yoğun sensör verisi barındıran mimarilerin arka planındaki veri akışını zihinsel olarak küçük parçalara ayırmak, algoritmik düşünme sürecini büyük ölçüde kolaylaştırır. Yazılım geliştiriciler, büyük bir problemi daha küçük GİÇ bloklarına bölerek her bir alt görevi ayrı ayrı analiz eder ve böylece sistemin geliştirilmesini ve test edilmesini kolaylaştırarak hata riskinin azaltılmasına yardımcı olur."}], "sorular": {"q1": {"type": "mc", "closed": true, "text": "Aşağıdakilerden hangisi bir algoritmanın kabul edilebilme kriterlerinden (üç temel özelliğinden) biri DEĞİLDİR?", "opts": ["Sonluluk", "Belirlilik (kesinlik)", "Etkinlik", "Yaratıcılık"], "correct": "Yaratıcılık"}, "q2": {"type": "tf", "closed": true, "text": "GİÇ analizinde 'İşlem' basamağı, girdiler üzerinde yapılan matematiksel veya mantıksal adımları ifade eder.", "correct": "Doğru"}, "q3": {"type": "fill", "closed": true, "text": "Bir algoritmanın hiçbir zaman DUR adımına ulaşamayıp sürekli tekrar etmesi durumuna ______ denir.", "accepted": ["sonsuz döngü", "sonsuz dongu"]}, "q4": {"type": "open", "closed": false, "text": "Bir kütüphanenin otomatik kitap ödünç-verme kioskunu düşünün (öğrenci kartını okutuyor, kitabı okutuyor, sistem ödünç kaydı oluşturuyor). Bu sistem için Girdi / İşlem / Çıktı yazınız."}, "q5": {"type": "open", "closed": false, "text": "Aşağıdaki sözde kodda bir mantık hatası var:\n1. BAŞLA\n2. sayac = 0 belirle\n3. EĞER sayac < 5 İSE sayac'ı 1 artır ve 3. adıma git\n4. Ekrana sayac değerini yazdır\n5. DUR\nBu algoritmanın neden asla 4. adıma ulaşamayacağını kendi cümlelerinizle açıklayınız."}, "q6": {"type": "open", "closed": false, "text": "Bir arkadaşınıza en sevdiği yemeğin tarifini verirken adımların sırasını karıştırmanın veya bir adımı atlamanın (örneğin tencereye sadece makarnayı koyup su eklemeden ocağı yakmanın) ne gibi sonuçları olabilir? Düşüncelerinizi kısaca yazınız."}, "q7": {"type": "open", "closed": false, "text": "El-Harezmi'nin bilim dünyasına katkısını ve bu 'adım adım ilerleme' yönteminin bugünkü yapay zekâ ve akıllı telefon teknolojileriyle nasıl bir bağı olduğunu kendi cümlelerinizle açıklayınız."}, "q8": {"type": "open", "closed": false, "text": "Bir yiyecek-içecek otomatının çalışma mantığını GİÇ (Girdi-İşlem-Çıktı) tablosuna göre analiz ediniz: en az 3 girdi, 2 işlem ve 2 çıktı adımı yazınız."}, "q9": {"type": "open", "closed": false, "text": "Akıllı bir otopark giriş-çıkış sistemini Problemi Bileşenlerine Ayırma yaklaşımıyla analiz ediniz: sistemin çalışabilmesi için en az 3 girdi verisi, 2 işlem adımı ve 2 çıktı sonucu belirleyip yazınız."}, "q10": {"type": "mc", "closed": true, "text": "Bir bankamatikten para çekerken kart bilgisi ve şifrenin girilmesi, GİÇ modelinin hangi bileşenine örnektir?", "opts": ["Girdi", "İşlem", "Çıktı", "Karar"], "correct": "Girdi"}}}, {"no": 2, "baslik": "2. Hafta — Sözde Kod ve Elle Çalıştırma", "baslangicTarihi": "2026-09-21", "konular": [{"id": "p1", "title": "Sözde Kod (Pseudocode) ve Elle Çalıştırma (Dry Run) Nedir?", "body": "Bir problemi çözmek için zihinde kurgulanan algoritmayı doğrudan bilgisayar diline (kodlara) çevirmeye çalışmak, tıpkı bir mimarın elinde hiçbir çizim veya proje olmadan bina inşa etmeye başlamasına benzer. Tasarlanan algoritmaların bilgisayar diline dönüştürülmeden önce insanlar tarafından kolayca anlaşılabilmesi ve test edilebilmesi gerekir. Kodlamaya geçilmeden önce çözüm mantığının belirli standartlarla kâğıt üzerinde modellenmesi, karmaşık projelerdeki mantık hatalarının henüz yolun başındayken fark edilmesini sağlar.\n\nBilgisayar bilimlerinde algoritmaları modellemek için en sık başvurulan yöntemlerden biri sözde koddur. Sözde kod (pseudocode); herhangi bir programlama dilinin (Python, C++, Go vb.) katı yazım kurallarına bağlı kalmadan bir algoritmanın günlük konuşma diline yakın, net ve komut tabanlı ifadelerle kâğıda dökülmüş hâlidir. Sözde kodlar, programcının mantık hatalarına odaklanmasını kolaylaştırır.\n\nDry run; tasarlanan bir algoritmanın veya sözde kodun bilgisayar ortamına aktarılmadan önce sadece kâğıt ve kalem yardımıyla, adım adım işletilmesi sürecidir. Kodlamaya geçmeden önce yapılan elle çalıştırma, değişkenlerin aldığı değerleri ve algoritmanın izlediği yolları adım adım incelemeyi; hesaplama, karar ve döngü yapılarındaki mantık hatalarını erken aşamada fark etmeyi sağlar. Bir dry run çalışmasında öncelikle algoritmada değerleri sürekli değişebilen her bir veri (değişken) için bir takip tablosu oluşturulur. Ardından algoritmanın veya sözde kodun ilk adımından başlanarak her bir işlem adımında değişkenlerin değerlerindeki değişimler satır satır bu tabloya kaydedilir. Son aşamada ise algoritmanın mantıksal akışı son adıma kadar izlenerek beklenen çıktıya ulaşılıp ulaşılmadığı kontrol edilir."}, {"id": "p2", "title": "1. Örnek: İki Sayının Toplamını Bulma", "body": "Bir kullanıcının sisteme ardı ardına girdiği iki sayısal değerin toplanması ve sonucun ekrana yazdırılması istenmektedir. Bu mantıksal akışı gerçekleştirmek için dışarıdan alınacak birinci sayı (S1) ve ikinci sayı (S2) algoritmaya girdi olarak sunulurken bu iki sayının hesaplanan toplamı (Toplam) ise sistemin nihai çıktısı olarak modellenmiştir.\n\nSözde Kod İfadesi:\n1. Adım: BAŞLA.\n2. Adım: Birinci sayıyı (S1) kullanıcıdan al.\n3. Adım: İkinci sayıyı (S2) kullanıcıdan al.\n4. Adım: Toplam = S1 + S2 işlemini yap.\n5. Adım: Toplam sonucunu ekrana yazdır.\n6. Adım: DUR.\n\nElle Çalıştırma Tablosu\nÖrnek Girdiler: S1 = 15, S2 = 25\nBeklenen Çıktı: Toplam = 40\n\nAdım | İşlem | S1 | S2 | Toplam | Açıklama\n1 | BAŞLA. | - | - | - | Algoritma başlar.\n2 | S1 değerini oku. | 15 | - | - | Kullanıcı 15 sayısını girer.\n3 | S2 değerini oku. | 15 | 25 | - | Kullanıcı 25 sayısını girer.\n4 | Toplam = S1 + S2 | 15 | 25 | 40 | 15 + 25 = 40 işlemi gerçekleşir.\n5 | Toplam değerini yazdır. | 15 | 25 | 40 | Ekrana 40 sonucu yazılır.\n6 | DUR. | 15 | 25 | 40 | Algoritma başarıyla sonlanır.\n\nAlgoritmalar; her zaman yukarıdan aşağıya düz bir çizgide ilerlemez, günlük hayatta olduğu gibi belirli koşullara göre farklı yollara sapabilir. Yazılımcılar, programı bu yol ayrımlarında doğru yönlendirebilmek için iki veriyi birbiriyle kıyaslayan ve aralarındaki mantıksal ilişkiyi belirleyen karşılaştırma operatörlerini kullanırlar. Bir karşılaştırma ifadesinin doğrudan sonucu Doğru (True) veya Yanlış (False) mantıksal değeridir."}, {"id": "p3", "title": "Karşılaştırma Operatörleri (Tablo 1.1)", "body": "Algoritma tasarımlarında en sık başvurulan karşılaştırma operatörleri ve bunların çalışma mantıkları şöyle özetlenebilir:\n\nOperatör | Anlamı | Örnek Kullanım | Açıklama\n== | Eşittir | tahmin == 1234 | Girilen tahmin değeri, sistem şifresine (1234) eşitse sonuç Doğru olur.\n!= | Eşit Değildir | sifre != \"123\" | Şifre, \"123\" değerine eşit değilse sonuç Doğru olur.\n> | Büyüktür | yas > 18 | Yaş değeri, 18'den büyükse sonuç Doğru olur.\n< | Küçüktür | sicaklik < 0 | Sıcaklık, 0'dan küçükse sonuç Doğru olur.\n>= | Büyük Eşittir | puan >= 50 | Puan, 50 veya 50'den daha büyükse sonuç Doğru olur.\n<= | Küçük Eşittir | hiz <= 90 | Hız, 90 veya 90'dan daha küçükse sonuç Doğru olur.\n\nBu altı operatör, bir sonraki örnekte görülecek \"Eğer... İse\" yapılarının temelini oluşturur: sistem iki veriyi bu operatörlerden biriyle kıyaslar ve ürettiği Doğru/Yanlış sonucuna göre algoritmanın hangi dala (hangi işlem adımına) devam edeceğine karar verir."}, {"id": "p4", "title": "2. Örnek: Yaş Kontrolü ve Ehliyet Alabilme", "body": "Sürücü belgesi başvuru sisteminde, adayın doğum yılı bilgisinden hareketle mevcut yaşı hesaplanmakta ve yasal sınır olan 18 yaşını doldurup doldurmadığı kontrol edilmektedir. Bu mantıksal akışı gerçekleştirmek için algoritmaya sunulan Sistem Tarihi (ST) ve adayın Doğum Yılı (DY) bilgileri temel girdileri oluşturur. Yaşın uygunluk durumuna göre arka planda üretilen \"Ehliyet alabilirsiniz.\" veya \"Ehliyet almak için henüz küçüksünüz.\" durum mesajları ise sistemin nihai çıktılarını ifade eder.\n\nNot: Sistem tarihi (ST) algoritmalarda dinamik bir değişken olarak ele alınmalıdır. Bu örnekteki 2026 yılı, yalnızca aritmetik gösterim amacıyla verilmiştir. Bu hesaplama yaklaşık yaşı verir; gerçek yaşın yasal olarak belirlenmesi için doğum tarihi ile güncel tarih gün, ay ve yıl olarak birlikte değerlendirilmelidir.\n\nSözde Kod İfadesi:\n1. Adım: BAŞLA.\n2. Adım: Sistem Tarihi (ST) değerini oku.\n3. Adım: Kullanıcının Doğum Yılı (DY) değerini oku.\n4. Adım: Yaş = ST - DY işlemini yap.\n5. Adım: Eğer Yaş >= 18 ise\n        \"Ehliyet alabilirsiniz.\" mesajını yazdır.\n    DEĞİLSE\n        \"Ehliyet almak için henüz küçüksünüz.\" mesajını yazdır.\n6. Adım: DUR.\n\nElle Çalıştırma Tablosu\nÖrnek Girdiler: Sistem Tarihi (ST) = 2026, Doğum Yılı (DY) = 2005\nBeklenen Çıktı: Ehliyet alabilirsiniz.\n\nAdım | İşlem | ST | DY | Yaş | Koşul Denetimi (Yaş>=18) | Çıktı | Açıklama\n1 | BAŞLA. | - | - | - | - | - | Algoritma başlar.\n2 | ST oku. | 2026 | - | - | - | - | Sistem tarihi alınır.\n3 | DY oku. | 2026 | 2005 | - | - | - | Kullanıcı 2005 sayısını girer.\n4 | Yaş = ST - DY | 2026 | 2005 | 21 | - | - | 2026 - 2005 = 21\n5 | Yaş >= 18? | 2026 | 2005 | 21 | Evet | Ehliyet alabilirsiniz. | Koşul doğru → mesaj yazdırılır.\n6 | DUR. | 2026 | 2005 | 21 | - | - | Algoritma başarıyla sonlanır.\n\nÖrnek Girdiler: Sistem Tarihi (ST) = 2026, Doğum Yılı (DY) = 2010\nBeklenen Çıktı: Ehliyet almak için henüz küçüksünüz.\n\nAdım | İşlem | ST | DY | Yaş | Koşul Denetimi (Yaş>=18) | Çıktı | Açıklama\n1 | BAŞLA. | - | - | - | - | - | Algoritma başlar.\n2 | ST oku. | 2026 | - | - | - | - | Sistem tarihi alınır.\n3 | DY oku. | 2026 | 2010 | - | - | - | Kullanıcı 2010 sayısını girer.\n4 | Yaş = ST - DY | 2026 | 2010 | 16 | - | - | 2026 - 2010 = 16\n5 | Yaş >= 18? | 2026 | 2010 | 16 | Hayır | Ehliyet almak için henüz küçüksünüz. | Koşul yanlış → mesaj yazdırılır.\n6 | DUR. | 2026 | 2010 | 16 | - | - | Algoritma başarıyla sonlanır.\n\nYaş kontrolü örneğinde algoritmanın sadece yazılımsal bir mesaj ürettiği görülür. Bununla birlikte karar yapıları sadece ekrana yazı yazdırmakla kalmaz; sensörlerden alınan verilere göre motor, fan, ısıtıcı, vana veya klima gibi aktüatörlerin çalışmasını da kontrol edebilir."}, {"id": "p5", "title": "3. Örnek: Sıcaklık Kontrolü Algoritmasının Sözde Kodu", "body": "Bir akıllı sistemin ortam sıcaklığı 20°C'nin altına düştüğünde ısıtıcıyı otomatik olarak devreye alması, 20°C ve üzerinde ise sistemi beklemede tutarak kullanıcıyı bilgilendirmesi istenmektedir. Bu akışı yöneten sözde kod yapısı şöyledir:\n\nAdım | Sözde Kod İfadesi\n1. | BAŞLA.\n2. | Ortam sıcaklık değerini oku (sicaklik).\n3. | EĞER sicaklik < 20 İSE:\n     Isıtıcıyı çalıştır.\n    DEĞİLSE:\n     Ekrana \"Sıcaklık 20°C'nin altında değildir.\" yazdır.\n4. | DUR.\n\nŞu ana kadar incelenen ilk üç algoritmada sürecin her koşulda DUR adımına ulaşarak doğrusal şekilde sonlandığı görülmüştür. Ancak sıradaki şifre kontrolünde olduğu gibi algoritmalar her zaman tek seferde bitmez. Kullanıcı şifreyi yanlış girmeye devam ettiği sürece sistem DUR adımına ulaşamaz ve sürekli başa döner. Bir algoritmanın kendi içinde geriye dönerek işlemi tekrarlamasına döngüsel akış denir."}, {"id": "p6", "title": "4. Örnek: Hatalı Giriş Kontrolü Algoritması (Döngüsel Akış)", "body": "Bir kullanıcı panelinde sisteme erişmek isteyen kişinin girdiği şifre bilgisi kontrol edilmektedir. Sistem, kullanıcı doğru şifreyi yazana kadar geçişe izin vermemektedir ve her hatalı denemede bir uyarı mesajı üreterek kullanıcıyı tekrar şifre giriş adımına yönlendiren döngüsel akış işletmektedir.\n\nAdım | Açıklama\n1. | BAŞLA.\n2. | Sistem şifresini (sifre = \"1234\") belirle.\n3. | Şifre al (tahmin).\n4. | EĞER tahmin == sifre İSE:\n     Ekrana \"Giriş Başarılı, Hoş Geldiniz!\" yazdır.\n     ADIM 7'ye GİT.\n5. | DEĞİLSE:\n     Ekrana \"Hatalı şifre girdiniz, tekrar deneyiniz.\" yazdır.\n6. | ADIM 3'e GİT.\n7. | DUR.\n\nBu algoritmada 4. adımdaki koşul sağlanana kadar 5. ve 6. adımlar tekrar tekrar çalışır; sistem hiçbir zaman doğrudan sıradaki adıma geçmez, hep 3. adıma geri döner. DUR adımına yalnızca doğru şifre girildiğinde ulaşılabilir."}, {"id": "p7", "title": "Uygulama Köşesi: Hata Avcılığı (Kodu Gözden Geçirme)", "body": "Kod-Asistan projesinin Kullanıcı Giriş Modülü için başka bir yazılım ekibi tarafından aceleyle tasarlanan bir sözde kodda, elle çalıştırma (dry run) sırasında mantıksal bir hata içerdiği ve programın DUR adımına hiçbir koşulda ulaşamayarak sonsuz döngüye girdiği fark edilmiştir. İncelenecek hatalı algoritma şöyledir:\n\n1. Adım: BAŞLA.\n2. Adım: Sistem şifresini (sistem_sifresi = \"1234\") belirle.\n3. Adım: Kullanıcıdan şifre bilgisini al (sifre).\n4. Adım: EĞER sifre == sistem_sifresi İSE ekrana \"Giriş başarılı.\" yazdır.\n5. Adım: Ekrana \"Hatalı şifre girdiniz, tekrar deneyiniz.\" yazdır ve 3. Adım'a git.\n6. Adım: DUR.\n\nBu uygulamada öğrencilerden istenenler: önce algoritmayı kabul edilebilme kriterlerine göre satır satır denetleyip yapısal ve mantıksal kusurları (burada, 4. adımda koşul doğru olsa bile algoritmanın hiçbir zaman DUR adımına yönlendirilmemesi; 5. adımın koşulsuz olarak her durumda 3. adıma dönmesi) bir hata analiz raporunda gerekçeleriyle açıklamak; ardından 4. ve 5. adımları, koşul sağlandığında DUR'a ulaşacak (örneğin 4. adıma \"DEĞİLSE\" ekleyip DUR'a giden bir yol tanımlayarak), koşul sağlanmadığında ise 3. adıma dönecek şekilde yeniden düzenleyip doğru sözde kodu yazmaktır. Bir yazılımcının en büyük bilişsel güçlerinden biri, karşılaştığı karmaşık mantık hatalarını pes etmeden çözüme ulaşana kadar kararlılık göstermesidir."}], "sorular": {"q1": {"type": "mc", "closed": true, "text": "'Yaş değerinin 18 veya 18'den büyük olması' durumunu kontrol eden karşılaştırma operatörü aşağıdakilerden hangisidir?", "opts": ["==", "!=", ">", "<", ">="], "correct": ">="}, "q2": {"type": "fill", "closed": true, "text": "İki sayının toplamını bulan sözde kodda S1=8 ve S2=12 değerleri girilirse, Elle Çalıştırma tablosundaki Toplam değeri kaç olur?", "accepted": ["20"]}, "q3": {"type": "open", "closed": false, "text": "Yaş kontrolü örneğinde Sistem Tarihi (ST) = 2026 ve Doğum Yılı (DY) = 2012 girilirse, algoritma hangi mesajı üretir? Elle Çalıştırma tablosu mantığıyla (Yaş değerini hesaplayarak) açıklayınız."}, "q4": {"type": "open", "closed": false, "text": "Hatalı giriş kontrolü algoritmasında (şifre='1234') eğer 4. ve 5. adımlarda EVET/DEĞİLSE kontrolü hiç yapılmazsa, program her zaman 'Giriş Başarılı' mesajını verirdi. Bu akış hatasını önlemek için 4. ve 5. adımları doğru sözde kod olarak yeniden yazınız."}, "q5": {"type": "tf", "closed": true, "text": "Dry run (elle çalıştırma) sırasında değişkenlerin her adımda aldığı değerler bir tabloya kaydedilerek izlenir.", "correct": "Doğru"}, "q6": {"type": "open", "closed": false, "text": "Modern bir alışveriş merkezinin akıllı otopark giriş-çıkış sistemini düşünün: araç yaklaştığında plaka okunur, boş yer kontrol edilir ve giriş zamanı kaydedilir. Bu sistemin çalışabilmesi için en az 3 girdi verisi belirleyip sözde kod adımları hâlinde yazınız."}, "q7": {"type": "open", "closed": false, "text": "Kendi günlük hayatınızdan bir örnek seçin (örn. sabah okula hazırlanma) ve bunu 4-5 adımlık bir sözde kod olarak yazınız. En az bir EĞER/DEĞİLSE kontrolü içersin."}}}, {"no": 3, "baslik": "3. Hafta — Akış Şeması ve Metinsel Veriler", "baslangicTarihi": "2026-09-28", "konular": [{"id": "p1", "title": "1.2.2. Akış Şeması (Flowchart) Sembolleri ve Görsel Modelleme", "body": "Tasarlanan algoritma adımlarının, tüm dünyada kabul görmüş standart geometrik semboller ve oklarla görsel bir şemaya dönüştürülmesine akış şeması (flowchart) denir. Akış şemaları, bir programın mantıksal akışını bir bakışta anlamayı sağlar ve kodlama aşamasına geçmeden önce olası mantık hatalarının (sonsuz döngüler, eksik koşullar vb.) tespit edilmesini kolaylaştırır.\n\nAlgoritmaları görsel bir haritaya dönüştürürken kullanılan her sembol, günlük hayatta karşılaşılan bir eylemi veya karar anını temsil eder. Algoritmadaki her bir işlem türü için farklı bir sembol kullanılır ve bu semboller sadece şekil olarak değil işlevleri üzerinden tanınmak, mantık kurmayı büyük ölçüde kolaylaştırır. Sürecin sınırlarını çizen oval (terminal) sembolü; sabah uyanmak, gece uyumak gibi bir işin başlangıç ve bitiş anlarını ifade ederek algoritmanın çerçevesini (BAŞLA ve DUR adımlarını) belirler.\n\nProgramın dış dünyayla iletişim kurduğu anlarda ise paralelkenar (giriş/çıkış) devreye girer. Bu sembol, birine adını sormak gibi bir veri alışverişini veya bir soruya cevap vermek gibi ekrana sonuç yazdırma işlemini simgeler. Herhangi bir matematiksel hesaplama yapılması veya bir eylemin gerçekleştirilmesi gerektiğinde çanta hazırlamak, matematik problemi çözmek gibi somut bir hareketi temsil eden dikdörtgen (işlem) sembolü kullanılır.\n\nGerçek dünya problemlerinin çözümü, sürecin belirli aşamalarında mantıksal bir karar verilmesini ve programın farklı alternatif yollara sapmasını gerektirir. Algoritmanın en kritik noktası olan ve günlük hayattaki yol ayrımlarını temsil eden eşkenar dörtgen (karar) sembolü bu amaçla kullanılır. Sistem bu noktada iki veriyi birbiriyle kıyaslayarak büyüklük veya küçüklük denetimi yapar ve sonucunda her zaman Doğru (True) veya Yanlış (False) mantıksal değerini üretir. Örneğin \"Hava yağmurlu mu?\" sorusuna verilen cevaba göre şemsiye alıp almama kararı gibi programın akışı, üretilen bu sonuca göre oklar yardımıyla Evet veya Hayır yönünde ilgili işlem adımlarına yönlendirilir. Doğru bağlanan yön okları akışın izlenmesini kolaylaştırır; algoritmanın sonlanma koşulu doğru tasarlanmışsa süreç bitiş sembolüne ulaşır.\n\nTasarlanan akış şemalarında eşkenar dörtgen karar sembolünün içinin doldurulmasında önemli olan koşulun açık ve iki sonuçlu (Doğru/Yanlış) olmasıdır. Bir koşul ifadesi şemaya aktarılırken günlük konuşma dilindeki \"Eğer\" kelimesinin kullanılması teknik olarak yasak olmasa da genellikle şemayı sadeleştirmek için daha net bir dil tercih edilir. Örneğin sıcaklık değerini kontrol eden bir karar kutusuna uzun uzun \"Eğer sıcaklık 20'den küçükse\" yazmak yerine, akışı daha rahat okuyabilmek için çoğunlukla doğrudan \"sicaklik < 20\" şeklinde mantıksal bir ifade veya \"sicaklik < 20 mi?\" biçiminde kısa bir soru cümlesi yazılır.\n\nProgramlama süreçlerinde sıklıkla karşılaşılan temel sembollerin geometrik isimleri, işlevleri ve bu işlevlerin mantığını kavramayı kolaylaştıracak günlük hayat benzetmeleri şöyle özetlenebilir (Tablo 1.2):\n\nSembol (Adı) | İşlevi | Günlük Hayat Karşılığı\nOval (Terminal) | Algoritmanın başlangıcını ve bitişini temsil eder. İçine BAŞLA veya DUR yazılır. | Bir işe başlama veya sonlandırma anıdır.\nParalelkenar (Giriş/Çıkış) | Kullanıcıdan veri alınacağını veya ekrana bilgi yazdırılacağını belirtir. | Soru sormak veya cevap vermek içindir.\nDikdörtgen (İşlem) | Matematiksel hesaplamalar ve değişken atamaları için kullanılır. | Bir eylemi gerçekleştirmek içindir.\nEşkenar Dörtgen (Karar) | Bir koşulun kontrol edildiği noktadır. Sonuca göre akış Evet veya Hayır yönünde ilerler. | Yol ayrımında karar vermek içindir.\nOklar (Akış Yönü) | Adımlar arasındaki ilerleme yönünü gösterir. | İzlenecek yolu gösteren oklardır."}, {"id": "p2", "title": "5. Örnek: Sıcaklık Kontrolü Algoritmasının Akış Şeması", "body": "Akıllı bir iklimlendirme sisteminin karar mekanizması tasarlanacaktır. Ortam sıcaklığı verisi 20°C'nin altına düştüğünde ekrana \"Isıtıcıyı çalıştır.\" uyarısının yazılması, değil ise ekrana \"Sıcaklık 20°C'nin altında değildir.\" uyarısı yazılması uygun akış şeması modeli (Şema 1.1) şöyledir:\n\nAdım | İşlem\n1 | BAŞLA.\n2 | Ortam sıcaklık değerini al (sicaklik).\n3 | EĞER sicaklik < 20 İSE: Ekrana \"Isıtıcıyı çalıştır.\" uyarısı yazdır.\n4 | DEĞİLSE: Ekrana \"Sıcaklık 20°C'nin altında değildir.\" uyarısı yazdır.\n5 | DUR.\n\nŞemanın akışı: BAŞLA → sicaklik oku → [sicaklik < 20] karar kutusu → Evet ise \"Isıtıcıyı çalıştır.\" → DUR; Hayır ise \"Sıcaklık 20°C'nin altında değildir.\" → DUR.\n\nBu şemada karar yapılarının (eşkenar dörtgen) akış şemalarında nasıl dallandığı ve sistemi nasıl yönlendirdiği görülür. Bununla birlikte bilgisayar programları sadece karar vermekle kalmaz, veriler üzerinde matematiksel işlemler de yürütür."}, {"id": "p3", "title": "6. Örnek: İki Sayının Ortalamasını Bulma Akış Şeması", "body": "Bir veri analiz modülünde sisteme aktarılan iki farklı sayısal değerin aritmetik ortalaması alınarak tek bir ortalama değeri elde edilecektir. Bu matematiksel sürecin ardışık adımlarını ve veri akış yönünü görselleştiren standart akış şeması modeli (Şema 1.2) şöyledir:\n\nAdım | İşlem\n1 | BAŞLA.\n2 | Birinci sayıyı al (sayi1).\n3 | İkinci sayıyı al (sayi2).\n4 | toplam = sayi1 + sayi2\n5 | ortalama = toplam / 2\n6 | ortalama değerini ekrana yazdır.\n7 | DUR.\n\nŞemanın akışı: BAŞLA → sayi1 al → sayi2 al → toplam = sayi1 + sayi2 (dikdörtgen/işlem) → ortalama = toplam / 2 (dikdörtgen/işlem) → ortalama yaz (paralelkenar/çıkış) → DUR.\n\nİncelenen akış şemalarında algoritmalar yukarıdan aşağıya doğru tek yönlü olarak ilerledi ve işlemi bitirdi. Gerçek dünya senaryolarında ise işlemler her zaman tek seferde sonlanmaz. Bazen kullanıcının hatalı bir veri girmesi durumunda akışın sonlanmak yerine geriye (yukarıya) dönerek işlemi tekrar etmesi gerekir."}, {"id": "p4", "title": "7. Örnek: Hatalı Giriş Kontrolü Akış Şeması (Döngüsel Akış)", "body": "Kullanıcı doğrulama ekranında kurgulanan temel döngüsel giriş algoritmasının görsel haritası çıkarılacaktır. Doğru şifre girilene kadar süreci başa döndüren karar yapısını ve veri kontrollerini standart sembollerle gösteren akış şeması tasarımı (Şema 1.3) şöyle modellenmiştir:\n\nAdım | İşlem\n1 | BAŞLA.\n2 | Sistem şifresini (sifre=\"1234\") belirle.\n3 | Şifre al (tahmin).\n4 | EĞER tahmin == sifre İSE: Ekrana \"Giriş Başarılı, Hoş Geldiniz!\" yazdır. ADIM 7'ye GİT.\n5 | DEĞİLSE: Ekrana \"Hatalı şifre girdiniz, tekrar deneyiniz.\" yazdır.\n6 | ADIM 3'e GİT.\n7 | DUR.\n\nŞemanın akışı: BAŞLA → sifre = \"1234\" (işlem) → Şifre al (tahmin) (giriş) → [sifre == tahmin] karar kutusu → EVET ise \"Giriş Başarılı, Hoş Geldiniz!\" → DUR; HAYIR ise \"Hatalı şifre girdiniz, tekrar deneyiniz.\" çıktısı verilip okla geriye, tekrar \"Şifre al (tahmin)\" adımına bağlanır.\n\nBu şemada, karar sembolünden çıkan HAYIR okunun geriye (Şifre al adımına) döndüğü görülür. Kullanıcı doğru şifreyi girene kadar bu üç adım (şifre al → karşılaştır → hatalı mesaj) tekrar tekrar çalışır; DUR adımına yalnızca koşul sağlandığında ulaşılır. Bu tekrarlı yapıya döngüsel akış denir."}, {"id": "p5", "title": "Uygulama Köşesi: Akış Şemasında Görsel Hata Avcılığı", "body": "Sayfa 22'deki \"Problemi Parçala\" uygulamasında bir otomat makinesinin çalışma mantığı GİÇ tablosuyla analiz edilmişti. Bu analizde belirlenen işlem adımları ve karar (koşul) yapıları, standart akış şeması sembolleri kullanılarak kâğıt üzerinde çizilip otomatın çalışma algoritması görselleştirilir.\n\nYazılım tasarımları ilk seferinde kusursuz çalışmayabilir; karar sembolleri yanlış seçilebilir, yön okları hatalı bağlanabilir veya sıfır (0) gibi sınır durumlar gözden kaçabilir. Profesyonel bir yazılımcının temel yetkinliklerinden biri, tasarlanmış şemalardaki bu mantıksal kusurları saptayarak sistemi onarmaktır.\n\nBir yazılımcı, kullanıcının girdiği sayı 0'dan büyükse ekrana \"Pozitif\", küçükse \"Negatif\" yazan bir programın akış şemasını tasarlamıştır. Test sürecinde yön oklarının yanlış bağlandığı, karar yapısının Evet/Hayır kollarının karıştığı ve kullanıcı 0 (sıfır) değerini girdiğinde sistemin bu değeri yanlışlıkla pozitif olarak sınıflandırdığı fark edilmiştir. Bu uygulamada öğrencilerden istenen: verilen hatalı akış şeması taslağını standartlar ve mantıksal akış yönleri açısından detaylıca inceleyip belirledikleri sembol, yön ve sınır durum hatalarını (özellikle sayi1 > 0 koşulunun Evet/Hayır kollarını doğru sırayla Negatif/Pozitif çıktılarına bağlaması ve sayi1 = 0 durumunun hangi kutuya düşeceğinin netleştirilmesi gerektiği) bir Hata Takip Tablosu'na hatanın nedeni ve düzeltme önerisiyle birlikte kaydetmek, ardından algoritmanın tüm durumları (pozitif, negatif, sıfır) kapsayan doğru ve güvenli akış şemasını standartlara uygun şekilde yeniden çizmektir."}, {"id": "p6", "title": "Döngü (Loop) Bileşenleri ve 8. Örnek: Döngüsel Ekran Yazımı", "body": "Yazılım projelerinde bazı işlem adımlarının belirli bir koşul gerçekleşene kadar ardı ardına tekrar etmesi gerekir. Her adımda kodları tek tek elle yeniden yazmak yerine bilgisayar bilimlerinde döngü (loop) adı verilen kontrol yapıları kullanılır. Sayaç kontrollü bir döngünün sağlıklı çalışabilmesi ve sonsuz bir döngüsel tıkanmaya girmemesi için şu üç temel bileşenin bulunması zorunludur:\n\nBaşlangıç Değeri: Döngünün hangi sayısal veya mantıksal değerden başlayacağını belirtir.\n\nDöngü Koşulu: İşlemin devam edip etmeyeceğini denetleyen karar mekanizmasıdır. Koşul Evet ürettiği sürece döngü çalışır, Hayır ürettiğinde döngü güvenli bir şekilde sonlanır.\n\nSayaç (Değişim Miktarı): Her tur sonunda döngünün kontrol değişkenini artıran veya azaltan matematiksel işlemdir.\n\nKod-Asistan yazılımının kullanıcıyı karşılama modülünde ekrana ardı ardına üç kez \"Merhaba Geliştirici!\" mesajının yazdırılması istenmektedir. Bu işlemi doğrusal adımlarla tek tek yazmak yerine bir sayıcı değişkeni yardımıyla döngüsel olarak gerçekleştiren akış şeması tasarımı (Şema 1.5) şöyledir:\n\nAdım | İşlem\n1 | BAŞLA.\n2 | sayici = 1\n3 | EĞER sayici <= 3 İSE: Ekrana \"Merhaba Geliştirici!\" yaz, sonra sayici = sayici + 1 yap ve tekrar 3. adımın koşuluna dön.\n4 | sayici <= 3 koşulu HAYIR ürettiğinde: DUR.\n\nŞemanın akışı: BAŞLA → sayici = 1 (işlem) → [sayici <= 3] karar kutusu → HAYIR ise \"Merhaba Geliştirici!\" yaz (çıkış) → sayici = sayici + 1 (işlem) → tekrar [sayici <= 3] karar kutusuna dön; EVET (sayici artık 3'ten büyük) ise DUR.\n\nÜç temel döngü bileşeninin bir akış şeması üzerinde nasıl bir araya geldiği ve sonsuz döngüye girmeden güvenli bir şekilde nasıl çalıştığı bu örnekte görülür: başlangıç değeri sayici=1 ile atanır, döngü koşulu sayici<=3 her turda denetlenir, sayaç ise her turda 1 artırılarak döngünün nihayetinde sonlanmasını garanti eder."}, {"id": "p7", "title": "Uygulama Köşesi: Ardışık Sayıların Toplamı ve Kritik Eşik", "body": "Kod-Asistan yazılımının optimizasyon modülünde, dışarıdan belirlenen bir sınır değerine (n) kadar olan ardışık tam sayıların toplamına ihtiyaç duyulmaktadır. Bu işlem için arka planda bir sayıcının tutulup her adımda artırılması, değerlerin toplam değişkeninde biriktirilmesi ve koşul sağlandığında döngünün güvenli bir şekilde sonlandırılması kurgulanmıştır. Algoritmanın başlangıcı: BAŞLA → n değerini oku → toplam = 0 → sayac = 1; bu noktadan sonra öğrencilerden döngü mantığı içeren eksik bırakılan adımları (sayac değişkeninin toplama eklenmesi: toplam = toplam + sayac; sayac'ın 1 artırılması: sayac = sayac + 1; ve sayac > n koşulu sağlanana kadar bu iki adımın tekrar edilmesi, koşul sağlandığında toplam değerinin ekrana yazdırılıp DUR'a gidilmesi) mantıksal bir hiyerarşiyle tamamlayıp standart geometrik sembollerle akış şemasına (Şema 1.6) dönüştürmeleri ve n=5 sınır değeriyle kâğıt-kalem yardımıyla elle çalıştırma tablosunda sayaç ile toplam değişkenlerinin her turda aldığı değerleri satır satır takip etmeleri istenir. (n=5 için beklenen doğru çıktı: 1+2+3+4+5=15.)\n\nGerçek dünya senaryolarında ise algoritmalar her zaman sabit sayılara göre sonlanmaz. Otonom sistemler ve akıllı altyapılar, sensör verilerini anlık takip ederek kritik bir eşik aşıldığında döngüyü anında kırmak (sonlandırmak) zorundadır. Akıllı baraj otomasyonunda su seviyesi saatlik sensörlerle izlenmekte; su seviyesi 50 metreyi aşmadığı sürece kapaklar kapalı tutularak saat sayacı artırılmakta, eşik aşıldığında ise döngü kırılarak tahliye saati ve kritik su seviyesi ekrana yazdırılmaktadır. Bu uygulamada öğrencilerden senaryoyu analiz ederek döngünün başlangıç değerini (saat=1) belirlemeleri, katı kodlama kurallarına bağlı kalmadan günlük konuşma diline yakın ve sıralı emirlerden oluşan sözde kod adımlarını sıfırdan yazmaları, su seviyesi 50 metreyi aşınca döngüyü kırıp bitirecek mantıksal koşulu doğru basamağa yerleştirmeleri, sözde kodun kararlılığını test etmek için bir Elle Çalıştırma Takip Tablosu çizmeleri ve tabloyu test etmek üzere sıralı saatlik sensör verilerini (1. saat: 42 m, 2. saat: 48 m ve 3. saat: 55 m) simüle ederek beklenen kritik çıkış saatine (3. saat) mantık hatası yapmadan ulaşıp ulaşmadıklarını denetlemeleri istenir."}, {"id": "p8", "title": "Oku-Yorum: Küçük Gauss'un Pratik Çözümü", "body": "Matematik tarihinin en büyük dehalarından biri kabul edilen Carl Friedrich Gauss, henüz ilkokul yıllarındayken öğretmeni sınıfı oyalamak için öğrencilerden 1'den 100'e kadar olan sayıları toplamalarını ister. Diğer öğrenciler sayıları tek tek toplamakla uğraşırken küçük Gauss sadece birkaç saniye içinde 5050 sonucunu bulur.\n\nGauss, sayı dizisinin başındaki ve sonundaki sayıları topladığında (1+100, 2+99, 3+98...) her zaman 101 sonucuna ulaşıldığını ve bu şekilde 50 tane çift olduğunu (50 x 101 = 5050) fark eder. Bu zekice yaklaşım, bugün bilgisayar biliminde karmaşık döngüler yerine neden matematiksel modellerin (algoritmaların) tercih edildiğine dair en güzel örneklerden biridir.\n\nDüşünelim-Tartışalım: Bilgisayar bilimleri, mevcut çözümlerle yetinmeyip her zaman \"Daha verimli bir yol var mı?\" sorusunun peşinden giden güçlü bir entelektüel merak üzerine inşa edilir. Küçük Gauss'un ardışık sayıları tek tek toplamak yerine örüntüyü fark etmesini sağlayan bu derin merakından hareketle, bir algoritmayı tasarlarken binlerce kez döngü çalıştırmak ile tek bir matematiksel formül işletmek arasındaki fark sorgulanmalıdır. Bu iki yaklaşımın yazılımın verimliliğine ve kararlılığına olan etkisi Zaman Verimliliği, İşlemci Yükü ve Yazılımın Kararlılığı başlıkları altında karşılaştırılabilir: binlerce kez döngü çalıştırmak veri büyüdükçe zamanı ve işlemci yükünü artırırken, matematiksel formül (örüntü) işletmek veri ne kadar büyürse büyüsün sabit ve neredeyse anlık bir sürede sonuca ulaşır."}, {"id": "p9", "title": "1.2.3. Algoritmalarda Metinsel Veriler ve İşlemler", "body": "Bilgisayarlar, sayılar dışında isim veya şifre gibi metinsel verileri de işler. Çift tırnak (\"\") içinde yazılan bu ifadelere string (karakter dizisi) denir. Metinsel veriler doğrudan aritmetik işlemlerde kullanılamaz. Sayıyı temsil eden bir metin, hesaplamada kullanılmadan önce uygun sayısal veri türüne dönüştürülmelidir.\n\nYazılım dünyasında birden fazla metni yan yana getirmek için + sembolüyle metin birleştirme (concatenation) işlemi yapılır (örneğin \"Merhaba \" + \"Öğretmenim\" gibi). Akış şemalarında metin birleştirme ve atama adımları, birer düzenleme eylemi kabul edildiğinden dikdörtgen (işlem) sembolüyle gösterilir."}, {"id": "p10", "title": "9. Örnek: Dinamik Karşılama ve Metin Birleştirme", "body": "Kod-Asistan yazılımına yeni giriş yapan bir kullanıcının ismini dışarıdan girdi olarak alan, ardından bu ismin başına kurumsal bir \"Hoş Geldiniz\" selamlaması ekleyerek birleştiren ve sonucu ekrana yazdıran algoritmanın akış şeması tasarımı (Şema 1.7) şöyle modellenmiştir:\n\nAdım | İşlem\n1 | BAŞLA.\n2 | Kullanıcıdan \"isim\" verisini al.\n3 | mesaj = \"Hoş Geldiniz Sayın \" + isim\n4 | Ekrana \"mesaj\" değişkenini yazdır.\n5 | DUR.\n\nŞemanın akışı: BAŞLA → isim al (giriş/paralelkenar) → mesaj = \"Hoş Geldiniz Sayın \" + isim (işlem/dikdörtgen; string birleştirme burada bir işlem adımı olarak modellenir) → mesaj değişkenini yazdır (çıkış/paralelkenar) → DUR.\n\nBu örnekte + operatörünün sayısal toplama değil, iki metni yan yana ekleyerek tek bir metin oluşturma (concatenation) anlamında kullanıldığına dikkat edilmelidir. \"Hoş Geldiniz Sayın \" ifadesinin sonundaki boşluk karakteri bilinçli olarak eklenmiştir; aksi hâlde isim değişkeniyle birleşen kelime bitişik yazılırdı, çünkü metin birleştirme işlemi otomatik olarak aralara boşluk eklemez."}], "sorular": {"q1": {"type": "mc", "closed": true, "text": "Akış şemalarında bir koşulun kontrol edildiği ve sonucuna göre yolun ikiye ayrıldığı nokta hangi sembolle gösterilir?", "opts": ["Oval", "Paralelkenar", "Dikdörtgen", "Eşkenar Dörtgen"], "correct": "Eşkenar Dörtgen"}, "q2": {"type": "mc", "closed": true, "text": "Aşağıdakilerden hangisi akış şemasında veri girişi ve veri çıkışı işlemleri için kullanılan ortak semboldür?", "opts": ["Daire", "Dikdörtgen", "Elips", "Eşkenar Dörtgen", "Paralelkenar"], "correct": "Paralelkenar"}, "q3": {"type": "open", "closed": false, "text": "Hatalı giriş kontrolü algoritmasının akış şemasında 'sifre == tahmin' karar sembolünün HAYIR dalı nereye, EVET dalı nereye bağlanır? Bu döngüsel akışı sözlü olarak açıklayınız."}, "q4": {"type": "open", "closed": false, "text": "Bir sayının pozitif mi negatif mi olduğunu kontrol eden bir akış şemasında sadece iki dal (Pozitif/Negatif) varsa, kullanıcı sıfır (0) değerini girdiğinde ne olur? Bu mantık hatasını nasıl düzeltirdiniz?"}, "q5": {"type": "fill", "closed": true, "text": "Python'da iki metinsel ifadeyi yapışık şekilde birleştirmek için kullanılan operatör ______ sembolüdür.", "accepted": ["+", "artı", "toplama"]}, "q6": {"type": "tf", "closed": true, "text": "İki metinsel ifade + operatörü ile birleştirildiğinde Python aralarına otomatik olarak bir boşluk karakteri ekler.", "correct": "Yanlış"}, "q7": {"type": "open", "closed": false, "text": "Kendi seçtiğiniz günlük bir işlemi (örn. bir kahve makinesinin çalışması) düşünün ve bunu 4 adımlık, en az bir karar (Eşkenar Dörtgen) sembolü içeren bir akış şeması mantığıyla sözlü olarak tarif ediniz."}}}, {"no": 4, "baslik": "4. Hafta — Dijital Depo ve Ünite 1 Değerlendirme", "baslangicTarihi": "2026-10-05", "konular": [{"id": "p1", "title": "1.2.4. Dijital Depo (Repository) ve Sürüm Kavramı", "body": "Yazılım geliştirme sürecinde algoritmaları sözde kod ve akış şemaları ile modellemek, yazılım geliştiriciyi büyük mantık hatalarından korur. Profesyonel yazılım dünyasında kod yazmaya başlamadan önce projenin tüm tasarım belgelerinin, algoritmalarının, sürümlerinin ve amacının güvenli bir şekilde saklandığı dijital bir alana ihtiyaç duyulur. Bu alana dijital depo (repository) adı verilir.\n\nYazılım projelerinin zamanla büyümesiyle sürüm (versiyon) numaraları büyür. Sürüm numaraları v0.1, v1.0 gibi gelişim sürüm adlarıyla takip edilir. Profesyonel yazılım dünyasında hiçbir proje tek bir adımda hatasız ve mükemmel (v1.0) olarak tamamlanamaz. Süreçler her zaman planlı ve hiyerarşik bir tasarımla (v0.1) başlar; hatalar elendikçe, testler yapıldıkça ve yeni modüller eklendikçe sabırla olgunlaşır. Geliştirilen bir projeyi bulut deposunda adım adım saklamak ve README vitrinini bu gelişime uygun olarak güncel tutmak, profesyonel bir yazılımcının projesine duyduğu özeni ve mesleki disiplinini yansıtan en somut göstergedir."}, {"id": "p2", "title": "README.md ve Markdown İşaretleme Dili", "body": "Bir dijital depodaki en önemli belge, projenin vitrini sayılan README.md dosyasıdır. README dosyası, projeyi inceleyecek diğer yazılımcıların koda bakmadan önce sistemin niteliğini ve geliştiricinin mesleki etiğe olan bağlılığını anlamasını sağlar; bu nedenle dijital deponun teknik ve vizyoner imzası niteliğindedir.\n\nDijital depolarda projeyi anlatan bu vitrin metinlerini biçimlendirmek (başlık yapmak, kalın yazmak veya listeler oluşturmak) için karmaşık kodlar yerine basit sembollerin (örneğin ana başlık için #, alt başlıklar için ## ve ###, maddeler için * veya -, kalın yazı için **kelime**) kullanıldığı pratik işaretleme diline Markdown adı verilir.\n\nYazılım projelerinin dijital vitrini olan README belgeleri sadece metinlerden oluşmaz. Karmaşık algoritmaların, yazılım mimarilerinin ve sistem gereksinimlerinin diğer geliştiriciler tarafından hızlıca kavranabilmesi için dokümantasyonların görsel materyallerle desteklenmesi evrensel bir standarttır. Profesyonel bir yazılım dokümantasyonu; projenin çalışma anını gösteren ekran görüntülerini, Girdi-İşlem-Çıktı ilişkilerini özetleyen akış şemalarını ve sistemin mantıksal haritasını mutlaka içermelidir. Dijital depolarda bu görselleri belgeye entegre etmek için Markdown işaretleme dilinin pratik yapısından faydalanılır. Projenin çalışma mantığını yansıtan bir akış şeması dijital depoya yüklendikten sonra, standart bir Markdown söz dizimi olan ![Şema Açıklaması](dosya_adi.png) yapısıyla README dosyasına kolayca yerleştirilir. Bu görselleştirme pratiği, projenin okunabilirliğini üst düzeye çıkarırken yazılım geliştiricinin küresel sektör standartlarına olan teknik bağlılığını da kanıtlar. Geliştirilen her yeni algoritmanın standart akış şemasını ve örnek çalışma ekranını güncel dokümantasyona görsel olarak eklemek, yüksek nitelikli projeler üretmenin en temel kuralıdır."}, {"id": "p3", "title": "Uygulama Köşesi: Dijital Depo ve Proje Vitrininin Tasarlanması", "body": "Yazılım dünyasında projeler zamanla büyür, güncellenir ve yeni sürümler (v0.1, v1.0 vb.) kazanır. Bir yazılım geliştiricinin en temel sorumluluklarından biri, ürettiği projeyi diğer insanların kolayca anlayabileceği standartlarda, zamanında ve eksiksiz bir şekilde belgelemektir. Bu sorumluluğun bir gereği olarak Kod-Asistan projesinin tasarım belgelerinin, akış şemalarının ve mantıksal sürüm notlarının güvenli bir şekilde saklanacağı, projenin kimliği ve vitrini niteliğinde olan dijital bir alanın oluşturulması beklenmektedir.\n\nBu çalışmada takip edilen aşamalar: Önce küresel yazılım havuzu olan bir platformda (örneğin GitHub) hesap açılıp yeni bir depo (repository) oluşturulur; deponun adı proje adına uygun, küçük harflerle yazılır (örneğin kod_asistanim), görünürlüğü Public olarak belirlenir ve deponun ana belgesi olan README dosyası aktif hâle getirilir. Ardından deponun düzenle (kalem) simgesine tıklanarak Markdown editörü açılır ve README belgesi şu standart başlık yapılarına göre doldurulur: Proje Yazarı (adı soyadı), # Projenin Adı (örneğin Kod-Asistan v0.1), ## Projenin Amacı (kullanıcılara günlük işlerinde yardımcı olacak bir dijital asistan tasarlamak) ve ## Projenin Hedefleri (asistanın ilerleyen zamanlarda kazanacağı özellikler; örneğin v1.0 Akıllı Menü, v2.0 Veri Saklama gibi maddeler). Belgenin kapsam bölümüne, önceden tasarlanan Kritik Eşik sözde kod mantığı metinsel olarak yerleştirilir. Son olarak, Ahilik kültüründeki usta-çırak ilişkisindeki saygı ve doğruluk ilkesinin modern yazılımdaki karşılığı olarak belgenin en altına yararlanılan kaynakların (örneğin ders kitabının) yer aldığı kurumsal bir ## Kaynakça bölümü eklenerek atıflar tamamlanır."}, {"id": "p4", "title": "Uygulama Köşesi: Kod-Asistan Basit Kayıt Akışı", "body": "Kod-Asistan projesinin kullanıcı yönetim modülü tasarlanacaktır. Asistanın kullanıcıya ismiyle hitap edebilmesi ve sistemi kişiselleştirebilmesi için kayıt aşamasında ad ve soyadı verilerinin ayrı ayrı alınması, arka planda birleştirilerek tek bir profil kimliği hâline getirilmesi gerekmektedir.\n\nBu çalışmada senaryoda verilen beş adımlı (Başlama, İsim İsteme, Metin Birleştirme, Selamlama Mesajı Gösterme, Durma) doğrusal algoritma dikkatlice analiz edilir; dijital çizim araçları kullanılarak başlangıç/bitiş için oval, veri giriş/çıkış adımları için paralelkenar ve metin birleştirme işlemi için dikdörtgen sembolleri eksiksiz şekilde yerleştirilir; işlem adımları arasındaki ilerleme hiyerarşisini belirten akış yön okları yukarıdan aşağıya doğru hatasız bir şekilde birbirine bağlanır ve hazırlanan dijital çizim uygun formatta dışa aktarılarak proje deposuna yüklenir. Bu uygulama, bir önceki haftada öğrenilen metin birleştirme (concatenation) işleminin akış şeması sembolleriyle nasıl görselleştirileceğini pekiştirir."}, {"id": "p5", "title": "Ünite Kapanışı: Sıra Sizde - Öz Değerlendirme", "body": "Algoritmik Düşünme ve Tasarım öğrenme birimi boyunca gerçekleştirilen tüm uygulamaların, tasarım süreçlerinin ve Kod-Asistan çalışmalarının gözden geçirilmesi istenir. Bu kapanış etkinliğinde öğrencilerden üç farklı geometrik sembolle (Üçgen, Kare, Çember) tanımlanan alanlarda kendi öğrenme yolculuklarını yansıtan içten ve özgün bir öz değerlendirme yapmaları beklenir: Üçgen alanında artık tam anlamıyla uzmanlaştıklarını düşündükleri ve başkasına hiç zorlanmadan anlatabilecekleri 3 temel algoritmik beceri veya bilgi (örneğin sözde kod yazma, akış şeması çizme, GİÇ modeliyle analiz gibi); Kare alanında algoritma tasarlarken, akış şeması çizerken veya dijital depoda sürüm kontrolü yaparken zihinlerini hâlâ zorlayan ve netleşmesi gereken köşeli/pürüzlü noktalar; Çember alanında ise yazılım dünyasında kod üretirken yapay zekâyı bir eş-geliştirici olarak denetlemenin önemi, Ahilik kültürü, meslek etiği ve emeğe saygı (README dosyasına kaynakça/atıf ekleme) hakkında zihinlerinde yer eden ve hayatları boyunca dikkat edecekleri temel düşünce belirlenir."}], "sorular": {"q1": {"type": "mc", "closed": true, "text": "Aşağıdakilerden hangisi algoritmik düşünme sürecinde karmaşık bir problemin daha küçük ve yönetilebilir parçalara bölünmesini ifade eder?", "opts": ["Çıktı analizi", "Görsel programlama", "Problemi bileşenlerine ayırma", "Sürüm kontrol yönetimi", "Yapay zekâ kod denetimi"], "correct": "Problemi bileşenlerine ayırma"}, "q2": {"type": "mc", "closed": true, "text": "Akış şemalarında kullanılan oval sembolünün temel görevi nedir?", "opts": ["Çıktı mesajı yazdırmak", "Karar hiyerarşisi kurmak", "Matematiksel işlem yapmak", "Süreci başlatmak veya bitirmek", "Veri girişi sağlamak"], "correct": "Süreci başlatmak veya bitirmek"}, "q3": {"type": "mc", "closed": true, "text": "Aşağıdakilerden hangisi bir dijital depodaki README dosyasının profesyonel bir yazılımcı için anlamını ifade eder?", "opts": ["Kodların yedeklendiği gizli bir klösördür.", "Projenin sadece bitiş tarihini gösterir.", "Projenin teknik ve vizyoner imzasıdır.", "Sadece kod hatalarının yazıldığı yerdir.", "Yapay zekânın tüm kodlarını yazdığı alandır."], "correct": "Projenin teknik ve vizyoner imzasıdır."}, "q4": {"type": "mc", "closed": true, "text": "Yazılım projelerinde kullanılan v0.1, v1.0, v2.0 gibi ifadeler aşağıdakilerden hangisini belirtir?", "opts": ["Bilgisayarın işlemci hızını", "Projenin gelişim sürümlerini", "Projenin kapladığı disk alanını", "Toplam kullanıcı sayısını", "Kod yazan kişi sayısını"], "correct": "Projenin gelişim sürümlerini"}, "q5": {"type": "tf", "closed": true, "text": "Bir dijital depodaki README.md dosyası, projenin vitrini ve teknik kişiliği sayılır.", "correct": "Doğru"}, "q6": {"type": "open", "closed": false, "text": "Girdi-İşlem-Çıktı yapısını günlük hayattan bir problem (örneğin bankamatikten para çekme) üzerinden detaylandırarak açıklayınız."}, "q7": {"type": "open", "closed": false, "text": "Ahilik kültüründeki usta-çırak ilişkisi ve mesleki disiplinin, bir yazılım projesindeki sürüm kontrolü ve kod gözden geçirme süreçleriyle benzerliklerini açıklayınız."}, "q8": {"type": "open", "closed": false, "text": "Kendi projeniz için bir README.md dosyası tasarlasanız hangi başlıkları (Proje Adı, Amacı, Hedefleri, Kaynakça vb.) mutlaka eklerdiniz? Kısaca listeleyiniz."}, "q9": {"type": "fill", "closed": true, "text": "Dijital depolarda .md uzantılı belgeleri başlık/kalın yazı/liste gibi biçimlerle düzenlemekte kullanılan pratik işaretleme diline ______ adı verilir.", "accepted": ["markdown"]}}}, {"no": 5, "baslik": "5. Hafta — Programlama Dilleri, Python ve Geliştirme Ortamları", "baslangicTarihi": "2026-10-12", "konular": [{"id": "p1", "title": "Programlama Dili Nedir? Seviyeleri Nelerdir?", "body": "Günlük hayatta “program” ve “yazılım” (software) kelimeleri sık sık birbirinin yerine kullanılsa da aralarında ince bir mühendislik sınırı bulunur. Bilgisayarlara ve diğer dijital sistemlere belirli bir iş yaptırmak için verilen sıralı komutlar dizisine program adı verilirken; bu programların nasıl kullanılacağını anlatan belgeleri, kütüphaneleri ve verileri de kapsayan bütüncül yapıya yazılım denir. Bu karmaşık yazılım sistemlerinin inşa edilebilmesi ve programların anlaşılabilmesi için kurallı bir iletişim yöntemine ihtiyaç duyulur. İnsanların; bilgisayarlara, cep telefonlarına, robotlara veya akıllı cihazlara belirli görevleri nasıl gerçekleştireceklerini iletmek için kullandıkları bu yapılandırılmış sisteme programlama dili adı verilir. Her programlama dilinin, konuşma dillerinde olduğu gibi kendine özgü kesin dil bilgisi (söz dizimi) kuralları bulunur.\n\nBilgisayarlar ve diğer elektronik sistemler; temelde sıfır ve birlerden (0 ve 1) oluşan, donanım mimarisine doğrudan hitap eden makine dili seviyesinde çalışır. Makine dili, işlemci tarafından doğrudan yürütülebilir ancak insanlar tarafından yazılması ve hata ayıklanması oldukça zordur. Bu durumda programcının asıl görevi devreye girer: çözmek istediği problemi önce mantıksal adımlara böler, bir başka deyişle problemi insan aklının kavrayabileceği bir düzene sokar; ardından bu algoritmayı, insanlar tarafından yazılıp okunabilen ve çevirici programlar (derleyici veya yorumlayıcı) aracılığıyla makine diline dönüştürülebilen programlama dili aracılığıyla ifade eder. Bu anlamda programcı, problemi analiz eden ve çözüm üreten bir birey olarak insan düşüncesini ve çözüm mantığını makinenin anlayabileceği talimatlara dönüştüren bir tür çevirmen gibi çalışır.\n\nTüm programlama dilleri aynı yapıda değildir. Bir programlama dilinin makine diline ne kadar yakın veya uzak olduğu onun seviyesini belirler. Programlama dilleri, donanıma yakınlık ve soyutlama düzeylerine göre düşük ve yüksek seviyeli olarak sınıflandırılır; C ve C++ gibi bazı diller ise her iki düzeyin özelliklerini taşıdıkları için kimi kaynaklarda orta seviyeli olarak adlandırılır.\n\n• Düşük seviyeli diller, makine diline çok yakın olan dillerdir. Bu dillerde yazılan komutlar doğrudan donanımı kontrol eder ve makine diline çevrilmesi çok az işlem gerektirir. Bu sayede programlar son derece hızlı ve verimli çalışır ancak yazılması ve anlaşılması oldukça zordur, programcının donanımı çok iyi tanıması gerekir. Assembly dili, bu kategorinin en bilinen örneğidir.\n\n• Orta seviyeli diller hem donanıma yakın esnek bir kontrol imkânı sunan hem de yüksek seviyeli dillerin okunabilirliğine yakın bir söz dizimi kullanan dillerdir. C ve C++ dilleri bu yaklaşıma örnek gösterilebilir.\n\n• Yüksek seviyeli diller ise insan diline çok daha yakın olan dillerdir. Günlük konuşma diline benzer söz dizimi kullandıklarından öğrenmesi ve yazması çok daha kolaydır. Programcı, donanımın teknik ayrıntılarıyla uğraşmak zorunda kalmadan çözüm odaklı düşünebilir. Python, Java, C# ve JavaScript bu kategoriye giren dillerden bazılarıdır. Yüksek seviyeli diller makine diline daha uzak olduğundan aralarındaki uçurumu kapatmak için derleyiciye veya yorumlayıcıya ihtiyaç duyarlar; araya giren bu çeviri ve soyutlama katmanları, yüksek seviyeli dillerin makine dillerine kıyasla nispeten daha yavaş çalışmasına neden olur.\n\nProgramlama dili seviyelerinin anlaşılırlık, hız, donanım kontrolü ve taşınabilirlik gibi kriterlere göre karşılaştırması şu şekilde özetlenebilir:\n\nÖzellik | Düşük Seviyeli (Assembly) | Orta Seviyeli (C/C++) | Yüksek Seviyeli (Python)\nAnlaşılırlık | Çok Zor | Orta | Çok Kolay\nSoyutlama Düzeyi | Çok Düşük | Orta | Çok Yüksek\nDonanım Kontrolü | Tam Kontrol | Yüksek Kontrol | Kısıtlı / Soyut\nTaşınabilirlik | Donanıma Bağlı (Mimariye Özel) | Taşınabilir | Çok Taşınabilir\n\nBugün birçok programlama dili hem derleme hem yorumlama tekniklerini birlikte kullanabilir. Örneğin Java ve C# önce ara bir dile derlenir, ardından bu ara kod bir sanal makine tarafından çalıştırılır."}, {"id": "p2", "title": "Derleyiciler ve Yorumlayıcılar", "body": "Programlama diliyle yazılan talimatların bilgisayara ulaşması için makine diline dönüştürülmesi gerekir. Bu dönüşümü gerçekleştiren derleyiciler ve yorumlayıcılar olarak iki temel yaklaşım vardır.\n\nDerleyici (compiler); programcının yazdığı kodun tamamını önce baştan sona okur, yazım hatalarını kontrol eder ve tüm kodu bir bütün olarak makine diline çevirir. Kodun yazımında (söz diziminde) bir hata varsa derleme işlemi tamamlanamaz; ancak derleyicilerin mantık hatalarını her zaman fark edemeyeceği unutulmamalıdır. Çalışma mantığı olarak bu süreç, bir kitabın tamamının başka bir dile çevrilmesinden sonra okunmasına benzer. C ve C++ bu yaklaşımı kullanan dillere örnek verilebilir.\n\nYorumlayıcı (interpreter) ise kodu bir bütün olarak değil satır satır okuyarak anında çalıştırır. Bir satır çevrilip çalıştırıldıktan sonra sıradaki satıra geçilir. Hata tespiti açısından yorumlayıcı, hatanın bulunduğu satıra gelene kadar programı çalıştırır ve o noktada durur. Bu yaklaşım tıpkı bir tercümanın, konuşmacının cümlelerini anlık olarak çevirmesine benzer. Python ve Ruby, bu yaklaşımı kullanan dillere örnek gösterilebilir.\n\nİki yaklaşım arasındaki temel fark hız ve esnekliktir:\n\nÖzellik | Derleyici | Yorumlayıcı\nÇalışma Mantığı | Kodun tamamını bir kerede makine diline çevirir ve bir dosya (.exe gibi) oluşturur. | Kodu satır satır okur ve o an çalıştırır.\nHız | Program bir kez derlendikten sonra çok hızlı çalışır. | Her seferinde satır satır okunduğu için nispeten daha yavaştır.\nHata Tespiti | Tüm kod hatasız olana kadar programı çalıştırmaz. | Hatanın olduğu satıra gelene kadar programı çalıştırır, hatayı görünce durur.\nÖrnek Diller | C, C++, Rust | Python, Ruby\n\nBugün birçok programlama dili hem derleme hem yorumlama tekniklerini birlikte kullanabilir. Örneğin Java ve C# önce ara bir dile derlenir, ardından bu ara kod sanal makine tarafından çalıştırılır; bu hibrit yaklaşım, hem taşınabilirlik hem de göreli bir hız avantajı sağlar."}, {"id": "p3", "title": "Python Dili: Tarihçesi ve Kullanım Alanları", "body": "Python; yüksek seviyeli, yorumlanabilen, geniş kütüphane desteğine sahip ve nesne yönelimli bir programlama dilidir. 1991 yılında Guido van Rossum tarafından geliştirilen bu dil, ismini geliştiricisinin ilgiyle takip ettiği Monty Python's Flying Circus adlı komedi grubundan almıştır (yılandan değil).\n\nPython dili; sade söz dizimi ve okunabilirlik avantajı sayesinde web geliştirmeden veri analizine, robotik kontrolden yapay zekâ mimarilerine kadar oldukça geniş bir alanda tercih edilir. Bu esnekliği ve güçlü yapısı nedeniyle Python; küresel yazılım ekosisteminde olduğu gibi Türkiye'nin yerli girişimlerinde, akıllı otomasyon sistemlerinde ve çeşitli teknoloji projelerinde etkin olarak kullanılır.\n\nOku-Yorum — Cezeri'nin Çarkından Python'un Kodlarına: Bugün bilgisayarların kalbinde yer alan programlama mantığı, köklü bir matematik ve mekanik mirasa dayanır. 12. yüzyılda Artuklu Sarayı'nda yaşayan Ebû'l İz El-Cezeri, yazdığı Kitâb-ül Hiyel (Olağanüstü Mekanik Araçların Bilgisi Hakkında Kitap) adlı eseriyle kontrol ve otomasyon tarihinin önemli örneklerinden biri olarak değerlendirilir. Düzeneklerdeki ardışık hareketler ve mekanik kontrol noktaları, bugünün algoritmalarındaki sıralı işlem ve koşul yapılarıyla kavramsal benzerlikler taşır. Bilim tarihindeki bu köklü matematiksel miras ve Cezeri ile somutlaşan otomasyon dehası, bugün Python gibi modern diller aracılığıyla dijital bir boyuta taşınmıştır. Millî Teknoloji Hamlesi kapsamında siber güvenlik ve yazılım projelerini hayata geçiren genç geliştiriciler, bu köklü mantıksal mirası devam ettirmektedir; Python öğrenmek ve algoritmik tasarımlar yapmak, Cezeri'nin mekanik çarklarındaki işlem basamaklarını bugünün kod satırlarına aktararak geleceğin teknolojisini inşa etmek anlamına gelir."}, {"id": "p4", "title": "Python Kurulumu ve İlk Programın Çalıştırılması", "body": "Python yorumlayıcısının bir bilgisayarda kod çalıştırabilmesi için önce sisteme güvenli bir şekilde kurulması gerekir. Kurulum sürecinde ilk adım, Python programlama dilinin resmî ve güvenilir dağıtım kaynağı olan https://www.python.org/ adresine erişip ana sayfadaki Downloads sekmesinden işletim sistemi mimarisine uygun güncel Python 3.x.x sürümünü yerel depoya indirmektir. İndirilen çalıştırılabilir kurulum dosyası başlatıldığında kurulum arayüzünün alt kısmında yer alan Add python.exe to PATH (Python'ı PATH'e ekle) onay kutucuğunun işaretlenmesi önemlidir; bu seçenek, Python yorumlayıcısına komut satırından farklı dizinlerde doğrudan erişilebilmesini kolaylaştırdığı için önerilir. Onay kutucuğu işaretlendikten sonra Install Now (Şimdi Kur) butonuna tıklanarak yükleme başlatılır ve Setup was successful (Kurulum başarılı) ifadesi görüldüğünde Python yorumlayıcısının sisteme kararlı bir şekilde entegre edildiği anlaşılır.\n\nKurulumun doğrulanması amacıyla işletim sisteminin komut satırı (Terminal) uygulaması açılıp python --version komutu yazılarak Enter tuşuna basılır. Komut çalıştırıldıktan sonra alt satırda yüklenen güncel sürüm numarası (örneğin Python 3.13.5) ekrana yansıyorsa geliştirme ortamının sorunsuz şekilde hazırlandığı onaylanmış olur.\n\nÖrnek Kod Bloğu\n\nC:\\>python --version\nPython 3.13.5\n\nPython'ın kurulumuyla birlikte gelen etkileşimli kabuk (Interactive Shell) üzerinde de basit denemeler yapılabilir. Örneğin IDLE (Python 3.x.x) uygulaması açılıp etkileşimli kabuk alanına 15+25 gibi temel bir matematiksel ifade yazıldığında Python yorumlayıcısı bu ifadeyi anlık olarak işleyip 40 sonucunu ekrana yansıtır. Bağımsız bir kaynak dosya oluşturmak için IDLE üst menüsünden File > New File seçilir, açılan boş düzenleyiciye print(15+25) gibi bir komut satırı yazılır ve dosya File > Save As menüsüyle örneğin toplama_islemi.py adıyla .py (Python kaynak kodu) uzantısıyla kaydedilir. Düzenleyici penceresinde kayıt altına alınan kod bloğunu çalıştırmak için üst menüde yer alan Run > Run Module seçeneğine tıklanır veya klavyeden doğrudan F5 fonksiyon tuşuna basılır. Editör penceresinden ayrılan akış otomatik olarak IDLE kabuk (shell) ekranına geçiş yapar ve ekrana hesaplama işleminin somut çıktısı olan 40 değerini yansıtır. Böylece kâğıt üzerinde tasarlanan toplama algoritması bilgisayar ortamında başarılı bir şekilde çalıştırılmış olur."}, {"id": "p5", "title": "Python Interactive Shell ve IDLE", "body": "Python yorumlayıcısının bilgisayara başarılı bir şekilde entegre edilmesinin ardından kod satırlarının yazılacağı ve saniyeler içinde test edileceği yazılım ortamının seçilmesi gerekir. Python, kurulumuyla birlikte kullanıcıya iki temel çalışma alanı sunar.\n\nEtkileşimli Kabuk (Interactive Shell): Komut satırı üzerinden doğrudan python yazılarak ulaşılan bu alan, yazılan her bir kod satırını Enter tuşuna basıldığı anda anlık olarak çalıştırır ve sonucu alt satıra yansıtır. Büyük projeler geliştirmek için uygun olmasa da küçük kod parçalarını hızlıca test etmek ve yorumlayıcının davranışını incelemek açısından oldukça işlevseldir.\n\nIDLE [Integrated Development and Learning Environment (Entegre Geliştirme ve Öğrenme Ortamı)]: Python kurulumuyla birlikte yerleşik olarak gelen basit ve hafif bir IDE [Integrated Development Environment (Entegre Geliştirme Ortamı)] yazılımıdır. Sıklıkla birbirine karıştırılan bu iki kavramdan IDE, yazılım geliştirmek için kullanılan tüm araçların (editör, derleyici vb.) genel kategori adıyken, IDLE sadece Python'a özel eğitim amacıyla tasarlanmış spesifik bir programın adıdır. IDLE, programcılara hem etkileşimli kabuk gibi anlık denemeler yapma imkânı sunar hem de .py uzantılı bağımsız kod dosyaları oluşturarak karmaşık algoritmaları kaydetme, düzenleme ve hata ayıklama kolaylığı sağlar."}, {"id": "p6", "title": "Yazılım Geliştirme Ortamları: Kaynak Kod Editörleri ve IDE'ler", "body": "Python'ın yerleşik etkileşimli kabuğu ve IDLE'ı, programlama süreçlerinin temel mantığını kavramak ve küçük kod parçalarını anlık olarak test etmek açısından işlevsel bir yapı sunar. Bununla birlikte geliştirilen projelerin hacmi büyüdükçe çoklu dosyaların yönetilmesi, yazım hatalarının anlık olarak denetlenmesi ve kod bloklarının kararlı bir hiyerarşiyle yapılandırılması adına daha gelişmiş yazılım araçlarına ihtiyaç duyulur. Yazılım dünyasında bu amaçla kullanılan araçlar temelde Kaynak Kod Editörleri ve Entegre Geliştirme Ortamları (IDE) olmak üzere iki kategoride incelenir.\n\nÖzellik | Kaynak Kod Editörleri | Entegre Geliştirme Ortamları (IDE)\nTemel İşlev | Metin düzenleme ve söz dizimi kurallarına göre kod renklendirmedir. | Yazılımın kodlanması, test edilmesi, hata ayıklanması ve derlenmesini içerir.\nYapı ve Hız | Temelde hafif ve çok hızlı çalışan metin editörleridir. | Gerekli tüm araçlar ve kütüphane yöneticileri sisteme yerleşik gelir.\nGenişletilebilirlik | Harici eklentilerle (plugin) desteklenerek güçlendirilir. | Çok sayıda aracı tek çatı altında topladığı için daha kapsamlıdır.\n\nGelişmiş kod editörleri ve IDE'ler, yazılım geliştirme süreçlerini şu özelliklerle destekler:\n\n• Akıllı Kod Tamamlama: Yazım esnasında komutların eksik kalan kısımlarını otomatik şekilde önererek kodlama hızını artırır ve hatalı komut yazılma riskini azaltır.\n\n• Söz Dizimi Denetimi (Syntax Checking): Kodlama esnasında yapılan yazım hatalarını ve eksik bırakılan karakterleri (parantez, tırnak işareti vb.) anında tespit ederek yazılımcıyı uyarır.\n\n• Kod Renklendirme (Syntax Highlighting): Kaynak kod içerisindeki anahtar kelimeleri, değişkenleri, metinsel ifadeleri ve sayısal değerleri farklı renk tonlarıyla yansıtarak kodun okunabilirliğini ve takibini kolaylaştırır.\n\n• Proje ve Dosya Yönetimi: Birden fazla kaynak kod dosyasının, tasarım belgesinin ve sürüm notunun tek bir panel üzerinden düzenli ve hiyerarşik bir şekilde yönetilmesini sağlar.\n\nYazılım projelerinin ihtiyaçlarına, seviyelerine ve uygulama alanlarına göre tercih edilen popüler Python geliştirme ortamları şunlardır:\n\nGeliştirme Ortamı | Türü | Öne Çıkan Özelli
