ılmak yerine merkezî bir fonksiyona dönüştürülmesi ve ihtiyaç anında çağrılması test edilecektir.\n\n# 1. AŞAMA: Fonksiyonun Tanımlanması (Makinenin Kurulumu)\ndef asistan_karsilama():\n    print(\"=== Kod-Asistan v1.0 Sistemine Hoş Geldiniz ===\")\n    print(\"Siber Güvenlik Protokolleri Aktif.\")\n    print(\"-----------------------------------------------\")\n# 2. AŞAMA: Fonksiyonun Çağrılması (Makinenin Çalıştırılması)\n# Fonksiyon tanımlandığında kendi kendine çalışmaz. İsmiyle çağrılması (call) gerekir.\nasistan_karsilama()\nasistan_karsilama()\n\nTerminal Çıktısı\n\n=== Kod-Asistan v1.0 Sistemine Hoş Geldiniz ===\nSiber Güvenlik Protokolleri Aktif.\n-----------------------------------------------\n=== Kod-Asistan v1.0 Sistemine Hoş Geldiniz ===\nSiber Güvenlik Protokolleri Aktif.\n\nKod Analizi:\n• def asistan_karsilama(): satırı ile fonksiyon tanımlanmış ancak henüz çağrılmadığı için gövdesindeki kodlar çalıştırılmamıştır.\n• Girinti bitip ana akışa dönüldüğünde, asistan_karsilama() yazılarak fonksiyon iki kez çağrılmış ve her çağrıda gövdesindeki kodlar çalıştırılmıştır."}, {"id": "p4", "title": "Parametre Yönetimi ve Veri Aktarımı: Girdi", "body": "Fonksiyonlar, kendilerine verilen görevi yerine getirebilmek için genellikle bazı başlangıç bilgilerine ihtiyaç duyar. Örneğin bir toplama fonksiyonunun işlem yapabilmesi için öncelikle hangi sayıları toplayacağını bilmesi gerekir. Fonksiyona işlem yapması için gönderilen bu verilere argüman, ilk kez oluşturulan (tanımlanan) fonksiyonun hangi verilerle çalışacağının belirtildiği şablon değişkenlere ise parametre adı verilir. Parametreler, fonksiyonun sadece kendi içinde geçerli olan yerel değişkenlerdir ve aynı fonksiyonun farklı değerlerle tekrar tekrar kullanılabilmesini sağlar.\n\nProgramlama dünyasında sıkça karıştırılan bu iki kavramın birbirinden ayrılması oldukça kolaydır. Parametre, fonksiyon tanımlanırken parantez içine yazılan ve fonksiyona gönderilecek değeri temsil eden yerel addır (örneğin parametre_1 ve parametre_2). Argüman ise fonksiyon program içinde çalıştırılırken (çağrılırken) parantez içine gönderilen ve parametre şablonunun yerini dolduran somut ve gerçek verilerdir. Örneğin fonksiyon_adi(25, 40) şeklinde bir komut yazıldığında parantez içindeki 25 ve 40 değerleri fonksiyona gönderilen birer argümandır.\n\nÖrnek: Parametre Alan Fonksiyon\n\nSistemdeki kullanıcıyı sadece genel bir mesajla değil doğrudan kendi adıyla ve yetki rolüyle karşılayan parametreli bir selamlama katmanı tasarlanmaktadır.\n\n# 'kullanici_adi' ve 'rol' dışarıdan gelecek verileri tutan parametrelerdir.\ndef kisisellestirilmis_karsilama(kullanici_adi, rol):\n    print(f\"Merhaba {kullanici_adi}. Sisteme '{rol}' yetkisiyle bağlandınız.\")\n\n# Fonksiyon çağrılırken parantez içine gönderilen gerçek verilere \"Argüman\" denir.\nkisisellestirilmis_karsilama(\"Fatih Sultan Mehmet\", \"Yönetici\")\nkisisellestirilmis_karsilama(\"Yahya\", \"Misafir\")\n\nTerminal Çıktısı\n\nMerhaba Fatih Sultan Mehmet. Sisteme 'Yönetici' yetkisiyle bağlandınız.\nMerhaba Yahya. Sisteme 'Misafir' yetkisiyle bağlandınız.\n\nKod Analizi:\n• kisisellestirilmis_karsilama(kullanici_adi, rol) satırındaki kullanici_adi ve rol, fonksiyonun kendi içinde tanımladığı parametrelerdir.\n• Fonksiyon her çağrıldığında parantez içine yazılan \"Fatih Sultan Mehmet\"/\"Yönetici\" ve \"Yahya\"/\"Misafir\" gibi somut veriler argüman olarak parametrelerin yerini doldurur ve bu sayede aynı fonksiyon farklı kullanıcılar için tekrar tekrar çalıştırılabilir."}, {"id": "p5", "title": "Dönüş Değeri İfadesinin Veri Aktarma Rolü: Çıktı", "body": "Bir fonksiyonun ekrana print() ile yazı yazdırması, o verinin programın geri kalanı tarafından kullanılabileceği anlamına gelmez. print() değerin metinsel gösterimini ekrana yazar ve anlamlı bir sonuç yerine None döndürür. Hesaplanan değerin başka işlemlerde kullanılabilmesi için return kullanılmalıdır.\n\nBir fonksiyonun yaptığı hesaplamanın veya işlemin sonucunu, programın ana akışına (çağrıldığı yere) geri göndermesi için return (döndür) anahtar kelimesi kullanılır. return ifadesi, fonksiyonun işini bitirdiğini ve veriyi teslim ettiğini (kahve makinesinin kahveyi bardağa dökmesi gibi) simgeler.\n\nreturn anahtar kelimesi sadece bir veriyi dışarı döndürmekle (yazılım jargonundaki yaygın kullanımıyla veriyi ana akışa fırlatmakla) kalmaz, aynı zamanda return çalıştığında fonksiyonun yürütülmesi sona erer ve varsa döndürülen değer çağrıldığı yere iletilir. Bu nedenle fonksiyon gövdesi içinde yalnızca çalıştırılmış bir return ifadesinden sonra aynı yürütme yolunda kalan satırlara erişilemez. Fonksiyon içinde yazılan ama return yüzünden hiçbir zaman çalıştırılamayacak olan bu işlevsiz satırlara yazılım literatüründe ölü kod adı verilir."}], "sorular": {"q1": {"type": "open", "closed": false, "text": "Karmaşık bir bilgisayar oyunundaki kodları tek bir dosya yerine ses, grafik gibi alt parçalara bölerek (Problemi Bileşenlerine Ayırma) yönetmenin yazılımcıya ne tür kolaylıklar sağladığını tartışınız."}, "q2": {"type": "mc", "closed": true, "text": "sistem_kodu = input(\"Lütfen sistem onay kodunu giriniz: \") satırından sonra kod_uzunlugu = len(sistem_kodu) çalıştırıldığında, kullanıcı 'KOD1453' yazarsa kod_uzunlugu değişkeninin değeri ne olur?", "opts": ["'KOD1453'", "7", "6", "str", "None"], "correct": "7"}, "q3": {"type": "tf", "closed": true, "text": "def asistan_karsilama(): satırıyla bir fonksiyon tanımlandığında, fonksiyon gövdesindeki kodlar tanımlandığı anda otomatik olarak çalışır; ayrıca çağrılmasına (asistan_karsilama()) gerek yoktur.", "correct": "Yanlış"}, "q4": {"type": "open", "closed": false, "text": "def kisisellestirilmis_karsilama(kullanici_adi, rol):\n    print(f\"Merhaba {kullanici_adi}. Sisteme '{rol}' yetkisiyle bağlandınız.\")\nkisisellestirilmis_karsilama(\"Yahya\", \"Misafir\")\nkodu çalıştırıldığında ekrana ne yazdırılır? kullanici_adi ve rol ifadelerinin fonksiyon tanımındaki rolüne (parametre) ne ad verildiğini de belirtiniz."}, "q5": {"type": "fill", "closed": true, "text": "def inc_to_cm(inc_degeri): fonksiyonu, hesapladığı santimetre değerini ekrana yazdırmak yerine çağrıldığı yere ______ anahtar kelimesiyle geri gönderir.", "accepted": ["return", "return ile"]}, "q6": {"type": "open", "closed": false, "text": "Tablo 4.1'deki (Fonksiyonun Bellek Adımlarının Modellenmesi) dry run tablosuna göre inc_to_cm(22.5) çağrısı yapıldığında inc_degeri parametresine hangi değer aktarılır, fonksiyon içinde hangi yerel değişken hesaplanır ve ana akışa hangi değer return edilir?"}, "q7": {"type": "mc", "closed": true, "text": "Python'da özel fonksiyonlar oluşturmak ve tanımlamak için kullanılan yapısal anahtar kelime aşağıdakilerden hangisidir?", "opts": ["import", "return", "def", "as", "while"], "correct": "def"}, "q8": {"type": "open", "closed": false, "text": "print() fonksiyonu ile return ifadesi arasındaki temel mimari farkı, bir fonksiyonun ürettiği sonucun programın geri kalanında kullanılabilmesi açısından açıklayınız."}}}, {"no": 20, "baslik": "20. Hafta — Parametre Yönetimi ve Pozisyonel Argüman Eşleşmesi", "baslangicTarihi": "2027-02-08", "konular": [{"id": "p1", "title": "return ile Veri Aktarımı: Birim Dönüştürücü Modülü", "body": "Bir fonksiyonun hesapladığı değeri return ile ana akışa döndürmesi, o değerin programın sonraki mantıksal karar aşamalarında (örneğin bir sınır kontrolünde) doğrudan kullanılabilmesini sağlar. Bu veri aktarma rolünü somut bir problem üzerinde incelemek, print() ile return() arasındaki mimari farkın kavranmasını kolaylaştırır.\n\nÖrnek Uygulama: Birim Dönüştürücü Modülü (return ile Veri Aktarımı)\n\nProblem Senaryosu: Kod-Asistan projesinin dışarıdan alınan inç (inch) cinsinden bir ölçüyü santimetreye çeviren bir dönüştürücü modülüne ihtiyaç duymaktadır. Bu modülün görevi sadece ekrana yazı yazdırmak değil hesapladığı santimetre değerini çağrıldığı yere döndürerek (return) sonraki mantıksal karar aşamalarında (örneğin 50 cm sınır kontrolü) kullanılabilmesini sağlamaktır.\n\ndef inc_to_cm(inc_degeri):\n    \"\"\"\n    Aldığı inç değerini 2.54 sabiti ile çarparak santimetreye dönüştürür.\n    Elde edilen sonucu ekrana basmaz, çağrıldığı yere döndürür (return).\n    \"\"\"\n    # 1 inç = 2.54 cm'dir.\n    cm_sonuc = inc_degeri * 2.54\n    return cm_sonuc\n# --- FONKSİYONUN ANA AKIŞ İÇERİSİNDE ÇAĞRILMASI (MAIN FLOW) ---\nprint(\"--- KOD-ASİSTAN DONANIM ÖLÇÜM DÖNÜŞTÜRÜCÜ ---\")\n# Kullanıcıdan dönüştürülecek inç verisinin dinamik olarak alınması.\ntasarim_inci = float(input(\"Lütfen dönüştürülecek ölçüyü giriniz (İnç): \"))\n# Fonksiyon çağrılıyor (call) ve return edilen veri 'hesaplanan_cm' değişkenine aktarılıyor.\nhesaplanan_cm = inc_to_cm(tasarim_inci)\n# Ana akışa aktarılan veri, artık sistemin istenen yerinde özgürce kullanılabilir.\nprint(f\"Dönüşüm Tamamlandı: {tasarim_inci} inç = {hesaplanan_cm:.2f} cm'dir.\")\n# Veri aktarımının kanıtı: Döndürülen santimetre değeri başka bir koşulun denetlenmesinde kullanılır.\nif hesaplanan_cm > 50:\n    print(\"Sistem Uyarısı: Bu donanım boyutu standart asistan paneli için büyüktür.\")\n\nTerminal Çıktısı\n\n--- KOD-ASİSTAN DONANIM ÖLÇÜM DÖNÜŞTÜRÜCÜ ---\nLütfen dönüştürülecek ölçüyü giriniz (İnç): 22.5\nDönüşüm Tamamlandı: 22.5 inç = 57.15 cm'dir.\nSistem Uyarısı: Bu donanım boyutu standart asistan paneli için büyüktür.\n\nKod Analizi:\n• Fonksiyon çağrıldığında (inc_to_cm(tasarim_inci)), ana akıştan gönderilen veri fonksiyonun yerel parametresine (inc_degeri) aktarılır.\n• Fonksiyon kendi içinde yerel bir değişken (cm_sonuc) yaratarak aritmetik dönüşümü tamamlar.\n• Hesaplanan sonuç return komutuyla ana akışa döndürülür ve fonksiyonun o turdaki görevi sonlanır.\n\nVeri Akışı Elle Çalıştırma (Dry Run) Tablosu: Terminal çıktısında verilen 22.5 inçlik örnek girdi üzerinden fonksiyonun bellek adımları satır satır modellenmiştir.\n\nAdım 1 (Ana akıştan fonksiyona): inc_to_cm(22.5) çağrıldı, 22.5 argümanı fonksiyonun parametresine aktarıldı → inc_degeri = 22.5, cm_sonuc = -, return edilen değer = -.\nAdım 2 (Fonksiyon içi): 22.5 * 2.54 işlemi Python yorumlayıcısı tarafından çalıştırıldı → inc_degeri = 22.5, cm_sonuc = 57.15, return edilen değer = -.\nAdım 3 (Fonksiyondan ana akışa): return cm_sonuc çalıştı, 57.15 değeri fonksiyondan ana akışa fırlatıldı → inc_degeri = 22.5, cm_sonuc = 57.15, return edilen değer = 57.15 (float).\nAdım 4 (Ana akış): return edilen 57.15 verisi ana programdaki hesaplanan_cm değişkenine atanmıştır → inc_degeri = -, cm_sonuc = -, return edilen değer = -.\n\nBilgi Kutusu — Ölü Kod: return anahtar kelimesi çalıştığı anda fonksiyonun yürütülmesi kesin olarak sona erer. Bir fonksiyon gövdesinde return satırından sonra, aynı yürütme yolunda kalan ama Python yorumlayıcısı tarafından hiçbir zaman çalıştırılamayacak satırlara literatürde ölü kod adı verilir. Kod kalitesi açısından böyle satırların fonksiyon gövdesinde bırakılmaması önerilir."}, {"id": "p2", "title": "Uygulama Özeti: Parametre ve Return Kullanan Selamlama Modülü", "body": "Uygulama Özeti: Selamlama ve Hesaplama Modülü (Parametre ve Return Kullanımı)\n\nKod-Asistan projesinin önceki (v0.3) sürümünde kullanıcıyı selamlama ve kullanıcının yaşını hesaplama işlemleri ana akış içerisine dağınık hâlde yazılmıştır. Bu durum, aynı işlem başka bir menüde tekrar istendiğinde kod tekrarına yol açmaktadır. Projenin yeni sürümünde asistana modüler bir kimlik kazandırmak için bu işlemler parametre alan ve geriye sonuç döndüren bağımsız fonksiyonlara ayrılmıştır.\n\nUygulamada önce kullanıcının adını ve rolünü (Yönetici / Misafir) parametre olarak dışarıdan alan, bu verileri kullanarak f-string ile kişiselleştirilmiş bir selamlama metni üreten ancak bu metni ekrana yazdırmak yerine çağrıldığı yere return ile döndüren karsilama_modulu(ad, rol) fonksiyonu def anahtar kelimesiyle tanımlanmıştır. Ardından kullanıcının doğum yılını ve mevcut yılı parametre olarak alan, yaklaşık yaş hesaplamasını yaparak sonucu return eden yas_hesapla(dogum_yili, mevcut_yil) fonksiyonu 4 boşluklu girinti kuralına uyularak kurgulanmıştır.\n\n# 1. AŞAMA: MODÜLER FONKSİYONLARIN TANIMLANMASI\ndef karsilama_modulu(ad, rol):\n    \"\"\"\n    Kullanıcının ad ve rol bilgilerini parametre olarak alıp,\n    kişiselleştirilmiş selamlama metnini return ile fırlatır.\n    \"\"\"\n    # f-string ile bellekte metin biçimlendirme (Ekrana basılmaz, döndürülür.)\n    selamlama_metni = (f\"Hoş geldiniz {ad}. Sistemdeki rolünüz: [{rol}]. Kod-Asistan sizi selamlıyor!\")\n    return selamlama_metni\n\ndef yas_hesapla(dogum_yili, mevcut_yil):\n    \"\"\"\n    Doğum yılı ve mevcut yıl parametrelerini alarak yaklaşık yaş hesabı yapar ve elde\n    edilen tam sayı sonucu return eder.\n    \"\"\"\n    # 4 boşluklu girinti kuralına uygun hesaplama bloğu\n    hesaplanan_yas = mevcut_yil - dogum_yili\n    return hesaplanan_yas\n# 2. AŞAMA: ANA AKIŞIN (MAIN FLOW) KURULMASI VE FONKSİYONLARIN ÇAĞRILMASI\n# Kullanıcıdan dinamik veri alımı ve veri türü tuzaklarının engellenmesi\nprint(\"--- KOD-ASİSTAN KULLANICI GİRİŞ PANELİ ---\")\ngiris_adi = input(\"Lütfen adınızı giriniz: \")\ngiris_rolu = input(\"Sistem rolünüzü giriniz (Yönetici/Misafir): \")\n# Tür dönüşümü (Type casting) yapılarak input verisi int formatına dökülüyor.\ndogum_tarihi = int(input(\"Lütfen doğum yılınızı giriniz (Örn: 2005): \"))\nguncel_yil = 2026  # Örnek sabit yıl. İstenirse datetime modülüyle dinamik alınabilir.\nprint(\"\\n--- SİSTEM RAPORU VE ÇIKTILAR ---\")\n# karsilama_modulu fonksiyonunun çağrılması (call) ve return edilen verinin yakalanması\nasistan_mesaji = karsilama_modulu(ad=giris_adi, rol=giris_rolu)\nprint(asistan_mesaji)  # Return edilen veri burada ekrana yazdırılıyor.\n# yas_hesapla fonksiyonunun çağrılması ve sonucun yakalanması\nkullanici_yasi = yas_hesapla(dogum_yili=dogum_tarihi, mevcut_yil=guncel_yil)\nprint(f\"Sistem tarafından hesaplanan güncel yaşınız: {kullanici_yasi}\")\n\nKod Analizi:\n• Her iki fonksiyon da içeride print() kullanmadan görevini return ile tamamlamıştır; ekrana yazdırma sorumluluğu tamamen ana akışa bırakılmıştır. Bu ayrım, aynı fonksiyonların ekrana yazdırmadan başka hesaplamalarda (örneğin bir raporlama dosyasında) yeniden kullanılabilmesini sağlar.\n• Fonksiyonlar ad=giris_adi, rol=giris_rolu gibi anahtar sözcüklü (keyword) argümanlarla çağrılmıştır; bu sayede parantez içindeki sıralamadan bağımsız, hangi verinin hangi parametreye gittiği açıkça okunabilir hâle gelmiştir."}, {"id": "p3", "title": "Argüman Aktarım Yöntemleri ve Pozisyonel Eşleşme", "body": "Fonksiyonlar çağrılırken parametrelere gönderilen argümanların hangi kurala göre eşleşeceği, veri akışının kararlılığı açısından kritik bir öneme sahiptir. Python dil mimarisinde en temel argüman aktarım yöntemi pozisyonel argümanlar (positional arguments) kuralıdır.\n\nPozisyonel eşleşmede yorumlayıcı; fonksiyon çağrılırken yazılan argümanları, fonksiyon tanımlanırken belirlenen parametrelerle yazılış sırasına göre (soldan sağa) birebir eşleştirir.\n\nSıralamanın belirleyici olduğu bu yapı, sınavlarda kullanılan optik formların değerlendirilme mantığıyla büyük bir benzerlik gösterir. Bir optik okuyucu makine, kâğıt üzerindeki işaretlemeleri anlamlarına göre değil sadece kodlandıkları konuma (pozisyona) göre okur. Eğer bir öğrenci dalgınlıkla yan yana bulunan T.C. Kimlik Numarası bölümüne okul numarasını, Okul Numarası bölümüne ise T.C. kimlik numarasını doldurursa makine bu durumu sorgulamaz veya insan zekâsıyla mantık yürütüp düzeltmez. Her iki alan da sayısal olduğu için makine bu verileri tam olarak kodlandıkları sıraya göre sisteme kaydeder. Bu donanımsal işlemde olduğu gibi yazılım dünyasında fonksiyon çağrılırken parantez içine yazılan değerler, hiçbir özellik belirtilmediği sürece sadece bulundukları sıraya (pozisyona) bakılarak bellekteki parametrelerle eşleştirilir.\n\nBu katı sıralama kuralının kavranması, yazılımların mantıksal hatalar üretmeden kararlı bir şekilde çalışabilmesi için zorunludur. Eğer T.C. kimlik numarası ve okul numarası bekleyen bir fonksiyona argümanlar ters sırayla gönderilirse argümanlar uyumlu türlerdeyse program hata vermeden çalışabilir ancak değerler yanlış parametrelerle eşleştiği için mantıksal hata oluşabilir. Bu tür sessiz ve gizli hataların önüne geçmek için parametrelerin tanımlanma hiyerarşisine dikkat edilmesi önemlidir. Pozisyonel (sıralı) aktarımda argümanların bu sıraya kusursuz bir şekilde uyması zorunludur. Ancak anahtar sözcüklü (keyword) argümanlar kullanılarak bu sıra bağımlılığı azaltılabilir (Örneğin: karsilama_modulu(rol=\"Misafir\", ad=\"Yahya\")).\n\nÖrnek: Pozisyonel Eşleşme ve Tür Sapması Analizi\n\nKod-Asistan sisteminde, kullanıcının adını ve personel kimlik numarasını yazdıran bir fonksiyon tasarlanacaktır.\n\n# İki parametreli bir fonksiyon tanımı\ndef kullanici_tescil(isim, personel_id):\n    print(f\"Kullanıcı: {isim} | ID: {personel_id}\")\n# DOĞRU ÇAĞRI: Argümanlar parametre sırasına (str, int) tam uyumlu gönderilmiştir.\nkullanici_tescil(\"Fatih\", 1453)\n# HATALI ÇAĞRI (Mantıksal Sapma): Sıra karıştırılmıştır.\nkullanici_tescil(1453, \"Fatih\")\n# Çıktı: Kullanıcı: 1453 | ID: Fatih -> Program çökmez ancak veri akışı bozulur.\n\nKod Analizi:\n• İlk fonksiyon çağrısında argümanlar parametre sırasına (str, int) tam uyumlu gönderilmiştir.\n• İkinci fonksiyon çağrısında sıra karıştırılmıştır.\n• Program çökmemiş ama mantıksal hata meydana gelmiştir."}], "sorular": {"q1": {"type": "open", "closed": false, "text": "1. Uygulama'daki (Kod-Asistan Selamlama ve Hesaplama Modülü) problem senaryosuna göre, projenin önceki v0.3 sürümünde kullanıcıyı selamlama ve yaş hesaplama işlemleri neden ana akış içerisine dağınık hâlde yazılmıştı ve bu durum ne tür bir soruna yol açmaktaydı?"}, "q2": {"type": "open", "closed": false, "text": "def yas_hesapla(dogum_yili, mevcut_yil):\n    hesaplanan_yas = mevcut_yil - dogum_yili\n    return hesaplanan_yas\nkullanici_yasi = yas_hesapla(dogum_yili=2005, mevcut_yil=2026)\nkodu çalıştırıldığında kullanici_yasi değişkenine hangi değer atanır? Yazınız."}, "q3": {"type": "mc", "closed": true, "text": "def kullanici_tescil(isim, personel_id): fonksiyonu tanımlıyken kullanici_tescil(1453, \"Fatih\") şeklinde çağrıldığında ne olur?", "opts": ["Program hata verip çöker", "Argümanlar sıraya göre eşleştiği için isim parametresine 1453, personel_id parametresine 'Fatih' atanır ve mantıksal hata oluşur", "Python otomatik olarak veri türüne bakıp doğru parametreye atar", "personel_id parametresi boş kalır", "SyntaxError oluşur"], "correct": "Argümanlar sıraya göre eşleştiği için isim parametresine 1453, personel_id parametresine 'Fatih' atanır ve mantıksal hata oluşur"}, "q4": {"type": "tf", "closed": true, "text": "Pozisyonel argümanlarda, fonksiyon çağrılırken parantez içine yazılan değerler, hiçbir özellik belirtilmediği sürece sadece bulundukları sıraya (pozisyona) bakılarak bellekteki parametrelerle eşleştirilir.", "correct": "Doğru"}, "q5": {"type": "fill", "closed": true, "text": "Fonksiyon çağrılırken karsilama_modulu(rol=\"Misafir\", ad=\"Yahya\") gibi parametre adı açıkça belirtilerek yapılan argüman gönderimine ______ argüman denir.", "accepted": ["anahtar sözcüklü", "keyword", "anahtar sözcüklü (keyword)"]}, "q6": {"type": "open", "closed": false, "text": "1. Uygulama'nın 2. Aşamasında (Ana Akışın Kurulması ve Fonksiyonların Çağrılması) istenildiği gibi, kullanıcıdan input() ile alınan ad, rol ve doğum yılı verilerini doğru veri türlerine dönüştürüp karsilama_modulu ve yas_hesapla fonksiyonlarını çağıran bir Python kodu yazınız."}, "q7": {"type": "open", "closed": false, "text": "Bir yazılım projesinde argümanları her zaman pozisyonel olarak göndermek yerine bazen anahtar sözcüklü (keyword) argüman kullanmanın, kod okunabilirliği ve hata riski açısından ne gibi avantajları vardır?"}}}, {"no": 21, "baslik": "21. Hafta — Varsayılan Değerli Parametreler ve Veri Akışında Esneklik", "baslangicTarihi": "2027-02-15", "konular": [{"id": "p1", "title": "Varsayılan Değerli Parametreler (Default Parameters)", "body": "Bazı senaryolarda, bir parametreye dışarıdan her seferinde argüman göndermek zorunlu olmayabilir. Fonksiyon çağrılırken belirli bir parametre için değer gönderilmediğinde Python yorumlayıcısının hata vermeden varsayılan bir sabit değeri kabul etmesi istenebilir. Bu duruma varsayılan değerli parametreler (default parameters) adı verilir.\n\nVarsayılan değer ataması, fonksiyon tanımlanırken (def satırında) ilgili parametreye atama operatörü (=) kullanılarak doğrudan verilir. Python dil mimarisinde, varsayılan değerli parametreler tanımlanırken her zaman parantezin en sonuna (sağına) yazılmak zorundadır. Varsayılan değerli bir parametreden sonra varsayılan değeri olmayan normal bir parametre yazılamaz. Bu kuralın ihlal edilmesi durumunda Python SyntaxError üretir ve program çalıştırılamaz."}, {"id": "p2", "title": "Örnek Uygulama: Bulut Depolama Maliyet Hesaplayıcısı", "body": "Örnek Uygulama: Kod-Asistan Modüler Bulut Depolama Maliyet Hesaplayıcısı\n\nKod-Asistan projesinin v0.5 sürümünde, kullanıcıların bulut üzerinde yedekleyeceği veriler için dinamik bir maliyet hesaplama modülü entegre etmesi istenmektedir. Sistem mimarisinde, sunucu ve bant genişliği maliyetleri için standart bir indirim oranı belirlenmiştir ancak bazı kurumsal veya kıdemli kullanıcılara (Yöneticiler vb.) daha yüksek indirimler tanımlanabilmelidir. Eğer fonksiyon çağrılırken özel bir indirim oranı belirtilmezse sistem otomatik olarak varsayılan indirim oranını devreye almalıdır.\n\nBilgi Kutusu: Yazılım projelerinde para hesaplamaları yaparken float veri türü yaklaşık sonuçlar üretebilir. Bu örnek eğitim amaçlı basitleştirilmiştir, gerçek finansal uygulamalarda \"Decimal\" modülü gibi daha hassas yöntemler tercih edilir. Ayrıca gerçek bir faturada, uygulamanın kararlı kalabilmesi için tutar ve indirim_orani verilerinin negatif girilmesini veya indirimin %100'ü aşmasını engelleyecek geçerlilik kontrolleri bulunmalıdır.\n\n# ======================================================================\n# PROJE ADI: KOD-ASİSTAN (Sürüm: v0.5 - Akıllı Maliyet Yönetimi)\n# ÖRNEK: BULUT DEPOLAMA FATURA MODÜLÜ (VARSAYILAN PARAMETRE)\n# ======================================================================\ndef fatura_kes(tutar, indirim_orani=10):\n    \"\"\"\n    Bulut depolama ücretini hesaplar.\n    indirim_orani parametresi boş bırakılırsa varsayılan olarak 10 kabul edilir.\n    \"\"\"\n    # İndirimli net tutarın matematiksel olarak hesaplanması\n    net_tutar = tutar - (tutar * indirim_orani / 100)\n    return net_tutar\n# --- FONKSİYONUN ANA AKIŞ İÇERİSİNDE TEST EDİLMESİ ---\nprint(\"--- KOD-ASİSTAN BULUT MALİYET RAPORU ---\")\n# 1. SENARYO: Kurumsal / Kıdemli Kullanıcı (Özel İndirim Oranı Gönderildi)\n# İkinci argüman olarak 20 gönderildiği için varsayılan değer (10) ezilir.\nkurumsal_fatura = fatura_kes(1000, 20)\nprint(f\"1. Senaryo (Yönetici İndirimi %20) -> Ödenecek Tutar: {kurumsal_fatura:.2f} TL\")\n# 2. SENARYO: Standart / Misafir Kullanıcı (Tek Argüman Gönderildi)\n# İkinci argüman boş bırakıldığı için fonksiyon otomatik olarak indirim_orani = 10 alır.\nstandart_fatura = fatura_kes(1000)\nprint(f\"2. Senaryo (Standart İndirim %10) -> Ödenecek Tutar: {standart_fatura:.2f} TL\")\n\nTerminal Çıktısı\n\n--- KOD-ASİSTAN BULUT MALİYET RAPORU ---\n1. Senaryo (Yönetici İndirimi %20) -> Ödenecek Tutar: 800.00 TL\n2. Senaryo (Standart İndirim %10) -> Ödenecek Tutar: 900.00 TL\n\nKod Analizi:\n• 1. senaryoda fatura_kes(1000, 20) komutu çalıştırıldığında Python yorumlayıcısı sırasıyla parametreleri eşleştirir. tutar hücresine 1000, indirim_orani hücresine ise gönderilen 20 değerini yazar. Bir diğer ifadeyle ikinci argüman gönderildiğinde o çağrı için indirim_orani parametresine gönderilen değer atanır.\n• 2. senaryoda fatura_kes(1000) komutu verildiğinde ise yorumlayıcı ikinci bir argüman bulamaz. Varsayılan değeri bulunan indirim_orani parametresi için argüman gönderilmediğinde varsayılan değer kullanılır. Böylece fonksiyon imzasında bekleyen 10 değeri boş kalan hücreye atanır ve sadece bu parametrenin eksikliğinden kaynaklanabilecek TypeError istisnası önlenmiş olur (Tutar argümanı hiç verilmezse zorunlu bir parametre eksik bırakıldığı için program yine hata fırlatacaktır.)."}, {"id": "p3", "title": "Değerin Ezilmesi (Overriding) ve Veri Akışında Esneklik", "body": "Fonksiyon tasarımlarında varsayılan (default) değer atamak, bilgisayarın eksik veriyle karşılaştığında hata mesajı üretmesini önleyen ve veri akışına esneklik kazandıran temel bir mimaridir. Bir fonksiyona dışarıdan özel bir argüman gönderildiğinde bu yeni değer fonksiyonun tanımında yer alan varsayılan sabitin yerine geçer. Bu işleme yazılım literatüründe değerin ezilmesi (overriding) adı verilir. Dışarıdan herhangi bir veri gönderilmezse bilgisayar işlemi durdurmak yerine doğrudan belleğinde tuttuğu varsayılan değeri işleme alır ve akışa kararlı bir şekilde devam eder. Bu esnek veri akışı, günlük hayatta bir restoranda verilen döner menü siparişlerinin işleyişiyle büyük bir benzerlik gösterir.\n\n• Bir müşteri sadece \"döner menü\" talep ettiğinde, sistem otomatik olarak \"ayran\" ve \"standart boy patates\" seçeneklerini (varsayılan değerleri) devreye sokarak siparişi oluşturur. Müşteri yan ürünlerin detaylarını belirtmediği için restoran sistemi çökmez veya siparişi iptal etmez, doğrudan standart kuralları çalıştırarak hizmeti tamamlar.\n• Müşteri sipariş esnasında \"içecek şalgam olsun\" veya \"patatesler büyük boy olsun\" şeklinde özel bir talep (argüman) sunarsa bu yeni bilgi sistemdeki standart seçeneği ezer ve sipariş fişi üzerine kullanıcının yeni tercihi kaydedilir.\n\nBu otomasyonda olduğu gibi Python dilinde fonksiyon çağrılırken parantez içine yazılan değerler mevcut varsayılan sabiti değiştirir. Parantez içi boş bırakıldığında ise sistem kendi standart atamasıyla yoluna devam eder. Bu mimarinin kavranması, özellikle farklı ihtimallere ve kullanıcı tercihlerine açık algoritmaların kurgulanmasında kritik bir rol oynar. Sistemin hata toleransını artıran bu yapı sayesinde bilgisayar programları yüzlerce farklı ihtimal için ayrı ayrı kod satırları yazılmasına gerek kalmadan tek bir fonksiyon gövdesi üzerinden yönetilebilir. Kurumsal bir indirim oranı hesaplanırken veya bir oyun senaryosunda karakterin aldığı hasar değerlendirilirken varsayılan parametreler, yalnızca bazı argümanların isteğe bağlı olmasını sağlayarak koda kullanım esnekliği kazandırır.\n\nUygulama Özeti: Dijital Oyun Motoru — Karakter Hasar Mekanizması\n\n2. Uygulama'da bir dijital macera oyununun arka plan kodları (oyun motoru) yazılmıştır. Oyundaki kahramanlar, canavarlarla mücadele ettikçe belirli bir hasar almaktadır ancak bazı durumlarda kahramanlarımızın elinde koruyucu bir kalkan bulunabilir. Oyun motorunda karakterin kalan canını hesaplayıp ekrana basacak mevcut_can, darbe_gucu ve kalkan adında üç parametreye sahip hasar_al adında esnek bir fonksiyon tasarlanmıştır. Oyuncunun kalkanı yoksa (bir diğer ifadeyle fonksiyon çağrılırken kalkan belirtilmezse) kalkan varsayılan olarak 0 kabul edilmiş ve darbe gücü doğrudan candan düşülmüştür. Oyuncu kalkan puanı belirtirse kalkan değeri darbe gücünden düşülmüş (bir diğer ifadeyle darbe gücü kalkan kadar hafifletilmiş) ve kalan net hasar candan eksiltilmiştir. Fonksiyon, hasar_al(100, 30) çağrısı yapıldığında \"Kahraman darbe aldı! Kalkan yok. Kalan Can: 70\" çıktısını, hasar_al(100, 30, 10) çağrısı yapıldığında ise kalkan darbeyi 10 puan hafifleterek \"Kahraman darbe aldı! Kalkan darbeyi emdi. Kalan Can: 80\" çıktısını üretmiştir. Bu uygulamada varsayılan değerli parametrelerin, isteğe bağlı bir oyun mekaniğinin (kalkanın) hiç belirtilmediği durumlarda dahi programı çökertmeden kararlı bir şekilde çalışmasını nasıl garanti ettiği somut olarak deneyimlenmiştir."}], "sorular": {"q1": {"type": "mc", "closed": true, "text": "Python dil mimarisinde, varsayılan değerli parametreler tanımlanırken parantezin neresine yazılmak zorundadır?", "opts": ["En başına (soluna)", "En sonuna (sağına)", "Ortasına", "Herhangi bir yere yazılabilir", "İkinci sıraya"], "correct": "En sonuna (sağına)"}, "q2": {"type": "open", "closed": false, "text": "def fatura_kes(tutar, indirim_orani=10):\n    net_tutar = tutar - (tutar * indirim_orani / 100)\n    return net_tutar\nkurumsal_fatura = fatura_kes(1000, 20)\nstandart_fatura = fatura_kes(1000)\nkodu çalıştırıldığında kurumsal_fatura ve standart_fatura değişkenlerinin değerleri kaç TL olur? Neden farklı sonuç ürettiklerini açıklayınız."}, "q3": {"type": "tf", "closed": true, "text": "fatura_kes(1000) çağrısında ikinci argüman gönderilmediği için Python yorumlayıcısı fonksiyon imzasında beklenen indirim_orani parametresi için TypeError fırlatır.", "correct": "Yanlış"}, "q4": {"type": "fill", "closed": true, "text": "Fonksiyona dışarıdan özel bir argüman gönderildiğinde bu değerin, fonksiyonun tanımında yer alan varsayılan sabitin yerine geçmesine yazılım literatüründe ______ adı verilir.", "accepted": ["değerin ezilmesi", "overriding", "değerin ezilmesi (overriding)"]}, "q5": {"type": "open", "closed": false, "text": "2. Uygulama'daki (Dijital Oyun Motoru: Karakter Hasar Mekanizması) problem senaryosuna göre üç parametreli hasar_al(mevcut_can, darbe_gucu, kalkan_puani=0) fonksiyonu tasarlanacaktır. hasar_al(100, 30) çağrısı yapıldığında ve hasar_al(100, 30, 10) çağrısı yapıldığında kalan can miktarları ne olur? İkisi arasındaki farkı kalkan mekanizmasının varsayılan değeriyle ilişkilendirerek açıklayınız."}, "q6": {"type": "open", "closed": false, "text": "Bir restoranda müşterinin özel bir talepte bulunmadığında standart menü seçeneklerinin (varsayılan değerler) otomatik olarak devreye girmesi örneğinden yola çıkarak, varsayılan değerli parametrelerin fonksiyon tasarımında hata toleransını nasıl artırdığını kendi cümlelerinizle açıklayınız."}}}, {"no": 22, "baslik": "22. Hafta — Değişken Etki Alanı ve Modül Oluşturma", "baslangicTarihi": "2027-02-22", "konular": [{"id": "p1", "title": "Modüler Mimari ve Değişkenlerin Etki Alanı (Variable Scope)", "body": "Bilgisayar programlarında tanımlanan değişkenler, Python yorumlayıcısı tarafından yürütülürken geçici bellek hücrelerinde depolanır. Yazılan bir değişkenin programın hangi satırlarından okunabileceğini ve hangi bloklarda geçerli olduğunu belirleyen kurallar hiyerarşisine değişkenlerin etki alanı (variable scope) adı verilir.\n\nPython dil mimarisinde ve modüler programlama tasarımlarında değişkenler, bellekteki konumlarına ve erişim sınırlarına göre iki temel gruba ayrılır.\n\nKüresel Değişkenler (Global Variables): Herhangi bir fonksiyon gövdesinin dışında, programın ana gövdesinde tanımlanan değişkenlerdir. En büyük avantajları, aynı moduldeki tüm fonksiyonların içinden ve dışından hiçbir kısıtlama olmaksızın doğrudan okunabilmeleridir.\n\nYerel Değişkenler (Local Variables): Bir fonksiyonun gövdesi içinde (4 boşluk girintili alanda) tanımlanan değişkenlerdir. Yerel değişkenler, sadece ait oldukları fonksiyon ana program tarafından çağrıldığında (Function Call) RAM üzerinde anlık olarak tahsis edilirler. Bu değişkenlerin ömrü ve görünürlüğü sadece fonksiyonun girintili iç alanıyla sınırlıdır. Fonksiyonun görevi return komutuyla bittiği an bu yerel değişkenler, bilgisayarın bellek temizleme mekanizması tarafından RAM'den tamamen silinir."}, {"id": "p2", "title": "Bellekte İsim Çakışmaları ve Gizleme (Shadowing) Kuralları", "body": "Bir programda küresel değişken ile bir yerel değişken aynı isme sahip olabilir. Bu durumda Python yorumlayıcısı, fonksiyonun içinde işlem yaparken her zaman yerel değişkene öncelik verir. Fonksiyon içindeki yerel değişken, aynı isimdeki küresel değişkenin değerini geçici olarak gölgeler. Buna yazılım literatüründe gizleme (shadowing) adı verilir.\n\nKurumsal bir iş yerinde aynı isme sahip çalışanlar arasında yaşanan iletişim süreçleri, bu gizleme mantığının çalışma hiyerarşisine verilebilecek somut bir örnektir. Bir şirketin genel müdürünün adının \"Murat\" (küresel değişken) ve donanım departmanında çalışan bir uzmanın adının da \"Murat\" (yerel değişken) olduğu varsayıldığında sistemde bir isim çakışması meydana gelir. Donanım departmanının sınırları (fonksiyon gövdesi) içerisinde \"Bu dosyayı Murat'a iletin.\" talimatı verildiğinde çalışanlar doğrudan kendi departmanlarındaki uzmanı hedef alır ve işlemi ona göre tamamlar. Bu kapalı alanın içinde genel müdür olan Murat'ın kimliği geçici olarak arka planda kalır ve gölgelenir. Bu hiyerarşik iletişimde olduğu gibi Python dil mimarisinde bilgisayar belleği, isim çakışmalarını konum önceliğine göre çözer. Bir fonksiyonun içinde küresel değişkenle aynı isme sahip yeni bir yerel değişken tanımlandığında bilgisayar önceki küresel değeri silmez veya bozmaz. O fonksiyonun sınırları dâhilinde geçerli olmak üzere geçici bir yerel alan tahsis eder. Fonksiyonun görevi bittiğinde ise yerel değişken bellekten tamamen temizlenir. Ana programda aynı isim tekrar çağrıldığında, sistem doğrudan bellekte yaşamaya devam eden küresel değere (genel müdüre) ulaşarak veri akışını güvenli bir şekilde sürdürmeye devam eder.\n\nUygulama Özeti: Değişken Etki Alanı ve Bellek Denetimi\n\n3. Uygulama'da Kod-Asistan projesinin çekirdek sürüm ayarları (asistan_adi ve sistem_surumu değişkenleri) küresel alanda tanımlanmış, sadece belirli bir raporlama anında gerekli olan bellek_durumu adlı değişken ise asistan_raporu_bas() fonksiyonunun içinde yerel değişken olarak kurgulanmıştır. Fonksiyon çağrıldığında, kendi gövdesinde tanımlanmadığı hâlde asistan_adi ve sistem_surumu küresel değişkenlerini küresel etki alanı (global scope) kuralları çerçevesinde başarıyla okuyup ekrana basabilmiştir. Ana programın en altında, fonksiyonun içinde yaşayıp ölen bellek_durumu değişkenine dışarıdan (fonksiyon dışından) ulaşılmaya çalışıldığında ise program NameError: name 'bellek_durumu' is not defined hatasıyla çökmüştür; bu durum, yerel değişkenlerin bellek ömrünün fonksiyonun girintili iç alanıyla sınırlı olduğunu ve fonksiyon bittiğinde bu değişkenlerin RAM'den tamamen silindiğini kanıtlamıştır. Son olarak fonksiyonun ilk satırına asistan_adi = \"YENİ_KODİ\" satırı eklendiğinde, fonksiyon içindeki çıktıda ismin değiştiği ancak fonksiyon bittikten sonra ana programın altındaki çıktıda ismin hâlâ \"KODİ\" olarak kaldığı gözlemlenmiştir; bu deney, Python yorumlayıcısının aynı isimdeki değişkenlerde yerel veriye öncelik vererek küresel veriyi geçici olarak gölgelediğini (shadowing) somut biçimde göstermiştir."}, {"id": "p3", "title": "Kodun Fiziksel Parçalanması: Modül Oluşturma ve İçe Aktarma (import)", "body": "Devasa bir kütüphanedeki tüm kitaplar; hiçbir kategoriye ayrılmadan, tek bir salona yığıldığında aranan bir bilgiye ulaşılması oldukça zor ve yorucu hâle gelir. Büyüyen yazılım projelerinde de yüzlerce fonksiyonun tek bir dosyanın içine sığdırılmaya çalışılması, kodların birbirine girmesine ve aranan bir hatanın bulunamamasına yol açar. Bu karmaşanın önlenmesi amacıyla birbiriyle ilişkili görevleri yerine getiren kod parçaları, kütüphanedeki farklı konu rafları (kitaplıklar) gibi fiziksel şekilde ayrı dosyalara bölünerek düzenlenir. Python dünyasında fonksiyonların ve kararlı kod bloklarının kaydedildiği bu bağımsız .py dosyalarına modül adı verilir.\n\nHazırlanan modüller (bir diğer ifadeyle farklı dosyalarda bulunan fonksiyonlar); ana programda kullanılmak istendiğinde import (içe aktarma) komutundan yararlanılır. Bu bağlantı süreci oldukça akıcı bir şekilde gerçekleştirilir. Öncelikle yalnızca belirli bir göreve odaklanmış fonksiyonlar, bağımsız bir dosya (örneğin hesaplama_motoru.py) olarak hazırlanırlar. Ardından bu yeteneklerin kullanılacağı ana program dosyasının en üst satırına import hesaplama_motoru komutu yazılarak iki dosya arasında bağlantı kurulur. Son olarak dışarıdan aktarılan bir fonksiyon çalıştırılırken işlemlerin birbirine karışmasının engellenmesi ve kodun hangi kaynaktan geldiğinin açıkça belirtilmesi amacıyla modül adı ile nokta (.) operatörü birlikte kullanılır [örneğin hesaplama_motoru.indirim_yap()]. Bu fiziksel bölümlendirme sayesinde yazılan bir fonksiyonun yalnızca tek bir dosyaya hapsolmasının önüne geçilir ve fonksiyonun onlarca farklı projede defalarca yeniden kullanılabilen (reusability) bir araca dönüşmesi sağlanır."}, {"id": "p4", "title": "Örnek Uygulama: Çoklu Dosya Yönetimi ve Modüler Altyapı", "body": "Örnek Uygulama: Çoklu Dosya Yönetimi ve Modüler Altyapı\n\nKod-Asistan projeniz geliştikçe tüm kodların tek bir dosyada tutulması; kodların okunmasını, yönetilmesini ve hata ayıklanmasını zorlaştırmaktadır. Bu endüstriyel karmaşayı önlemek için projenin finansal hesaplama görevlerini (örneğin indirim hesaplama) bağımsız bir dosyaya (asistan_finans.py) ayırmak (problemi bileşenlerine ayırma) ve ardından bu yardımcı dosyayı ana programa (kod_asistan_ana.py) import komutuyla bağlayarak çalıştırmak istenmektedir.\n\n1. DOSYA (Yardımcı Modül Katmanı): asistan_finans.py\n\n# KOD-ASİSTAN PROJESİ v1.2 - YARDIMCI FİNANSAL MODÜL\n# Geliştirici: [Öğrenci Adı Soyadı]\n# Standart: PEP 8 / Sadece Matematiksel Fonksiyon Hücrelerini Barındırır.\ndef net_tutar_hesapla(sepet_tutari, indirim_orani):\n    \"\"\"Gelen verileri işleyip net tutarı döndüren modül fonksiyonu\"\"\"\n    indirim_miktari = sepet_tutari * (indirim_orani / 100)\n    return sepet_tutari - indirim_miktari\n\n2. DOSYA (Ana Yürütücü Gövde): kod_asistan_ana.py\n\n# ======================================================================\n# KOD-ASİSTAN PROJESİ v1.2 - MODÜLER ANA PROGRAM MOTORU\n# Geliştirici: [Öğrenci Adı Soyadı]\n# Standart: PEP 8 / import ve Ad Alanı (Namespace) Yönetimi\n# ======================================================================\n# Aynı klasördeki asistan_finans.py dosyası projeye dâhil edilir.\nimport asistan_finans\nprint(\"=== KOD-ASİSTAN: ÇOKLU DOSYA VE MODÜLER ALTYAPI MOTORU ===\\n\")\n# Kullanıcı veri girişleri\ngirdi_sepet = 500.0\ngirdi_indirim = 10.0\nprint(\"[ANAPROGRAM] Harici modüldeki fonksiyon nokta (.) operatörüyle çağrılıyor...\")\n# AD ALANI KONTROLÜ: Fonksiyon çağrılırken hangi modülden geldiği belirtilir.\nodenecek_tutar = asistan_finans.net_tutar_hesapla(girdi_sepet, girdi_indirim)\nprint(\"-----------------------------------------------------\")\nprint(f\"Modüler Hesaplama Sonucu Ödenecek Net Tutar: {odenecek_tutar:.2f} TL\")\nprint(\"=======================================================\")\n\nKod Analizi ve Sınır İhlali Testleri:\n• Deney (Fiziksel Ayrım Analizi): kod_asistan_ana.py dosyası çalıştırılıp çıktısı gözlemlendiğinde, ana dosyanın içinde net_tutar_hesapla isimli bir kod satırı olmadığı hâlde işlemin hatasız yapılabildiği görülür; bu durum, import mekanizmasının donanımsal ve fiziksel rolünü kanıtlar.\n• Deney (Ad Alanı Sınır İhlali): Ana dosyadaki odenecek_tutar = asistan_finans.net_tutar_hesapla(...) satırı, modül ismi silinerek sadece odenecek_tutar = net_tutar_hesapla(...) şeklinde değiştirilip çalıştırılırsa program NameError: name 'net_tutar_hesapla' is not defined hatasıyla çöker. Bu deney, harici bir modülden gelen bir fonksiyonun ad alanına (namespace) nokta (.) operatörü ile modül adı belirtilmeden doğrudan erişilemeyeceğini kanıtlar."}], "sorular": {"q1": {"type": "open", "closed": false, "text": "3. Uygulama'daki (Değişken Etki Alanı ve Bellek Denetimi) senaryoya göre; kod_asistan_bellek.py dosyasının en üstünde küresel alanda tanımlanan asistan_adi ve sistem_surumu değişkenleri ile asistan_raporu_bas() fonksiyonu içinde tanımlanan yerel bellek_durumu değişkeni arasındaki temel fark nedir?"}, "q2": {"type": "mc", "closed": true, "text": "Bir fonksiyonun içinde tanımlanan yerel bir değişkene, fonksiyon dışından doğrudan erişilmeye çalışıldığında Python'da hangi hata oluşur?", "opts": ["TypeError", "SyntaxError", "ValueError", "IndexError", "NameError"], "correct": "NameError"}, "q3": {"type": "tf", "closed": true, "text": "Bir fonksiyonun içinde küresel değişkenle aynı isme sahip yeni bir yerel değişken tanımlandığında, bilgisayar bellekteki küresel değeri kalıcı olarak siler ve bozar.", "correct": "Yanlış"}, "q4": {"type": "fill", "closed": true, "text": "Bir fonksiyon içindeki yerel değişkenin, aynı isimdeki küresel değişkenin değerini geçici olarak perdelemesine yazılım literatüründe ______ adı verilir.", "accepted": ["gizleme", "shadowing", "gizleme (shadowing)"]}, "q5": {"type": "open", "closed": false, "text": "4. Uygulama'daki (Çoklu Dosya Yönetimi ve Modüler Altyapı) senaryosuna göre asistan_finans.py dosyasında tanımlanan net_tutar_hesapla fonksiyonu, kod_asistan_ana.py dosyasında import asistan_finans komutuyla dâhil edildikten sonra hangi söz dizimiyle çağrılır? Nokta (.) operatörünün burada üstlendiği görevi açıklayınız."}, "q6": {"type": "open", "closed": false, "text": "kod_asistan_ana.py dosyasındaki odenecek_tutar = asistan_finans.net_tutar_hesapla(...) satırı modül adı silinerek odenecek_tutar = net_tutar_hesapla(...) şeklinde değiştirilirse Python neden NameError: name 'net_tutar_hesapla' is not defined hatası verir? Ad alanı (namespace) kavramını kullanarak açıklayınız."}, "q7": {"type": "mc", "closed": true, "text": "Yazılım projelerinde birbiriyle ilişkili fonksiyonların kütüphanedeki konu rafları gibi ayrı .py dosyalarına bölünerek düzenlenmesi işlemine ne ad verilir?", "opts": ["Refactoring", "Modül oluşturma", "Debugging", "Aliasing", "Sanitization"], "correct": "Modül oluşturma"}}}, {"no": 23, "baslik": "23. Hafta — Takma İsim Verme (Aliasing) ve Kod Kalitesine Giriş", "baslangicTarihi": "2027-03-01", "konular": [{"id": "p1", "title": "Veri Akışında Esneklik: Modüllere ve Fonksiyonlara Takma İsim Vermek (Aliasing)", "body": "Büyük ölçekli yazılım projelerinde haricî modüllerin veya modül içindeki fonksiyonların isimleri, kurumsal isimlendirme standartları gereği çok uzun olabilir. Bu uzun isimleri kod akışı içerisinde her seferinde nokta (.) operatörüyle birlikte uzun uzun yazmak, kodun okunabilirliğini azaltır ve yazım hataları riskini artırır.\n\nPython dil mimarisinde içe aktarılan modüllere veya modül içindeki fonksiyonlara daha kısa, pratik ve anlamlı geçici isimler atama imkânı tanınır. Bu işleme takma isim verme (aliasing) adı verilir ve as (olarak) anahtar kelimesiyle gerçekleştirilir. Haricî bir modül, projeye dâhil edilirken import modül_adi as yeni_isim söz dizimi kullanılır. Bu işlem yapıldığında orijinal modül ismi o dosya içindeki ad alanında (namespace) askıya alınır ve Python yorumlayıcısı artık o modüle sadece atanan yeni takma isim üzerinden erişebilir. Modüllere takma isim (alias) atanmasına ilişkin temel kullanım şablonu aşağıda gösterilmiştir.\n\n# Standart içe aktarma yerine takma isim (alias) kullanımı\nimport asistan_finans as finans\n# Fonksiyon artık kısa ad alanı üzerinden çağrılır:\nfinans.net_tutar_hesapla(1000, 10)\n\nEğer haricî bir modülün içindeki onlarca fonksiyondan sadece tek bir tanesine ihtiyaç duyuluyorsa modülün tamamını belleğe yüklemek yerine sadece ilgili fonksiyon from ... import ... kalıbıyla çekilebilir. Bu fonksiyon çekilirken de \"as\" anahtar kelimesiyle doğrudan bir takma isim atanabilir. Bu yöntemin en büyük avantajı, çağrı esnasında artık modül adı ve nokta (.) operatörünü kullanma zorunluluğunu ortadan kaldırması, fonksiyonun doğrudan yerel bir veri gibi çağrılabilmesidir.\n\n# Modülün içinden sadece tek bir fonksiyonu takma isimle çekmek\nfrom asistan_finans import net_tutar_hesapla as net_bul\n# Nokta operatörü olmadan, doğrudan takma isimle çağrı:\nsonuc = net_bul(1000, 10)"}, {"id": "p2", "title": "Örnek Uygulama: Modül ve Fonksiyonlarda Alias Kullanımı", "body": "Örnek: Modül ve Fonksiyonlarda Alias Kullanımı\n\nKod-Asistan projesinin v1.2 sürümünde, harici .py modüllerini ve bu modüllerin içerisindeki fonksiyon hücrelerini as anahtar kelimesiyle takma isimler atayarak içe aktarmak, ad alanı yönetimini optimize etmek ve kodun okunabilirliğini artırmak istenmektedir.\n\n1. DOSYA (Yardımcı Modül Katmanı): asistan_finans.py\n\n# ======================================================================\n# KOD-ASİSTAN PROJESİ v1.2 - YARDIMCI FİNANSAL MODÜL\n# Standart: PEP 8 / Sadece Matematiksel Fonksiyon Hücrelerini Barındırır\n# ======================================================================\ndef net_tutar_hesapla(sepet_tutari, indirim_orani):\n    \"\"\"Gelen verileri işleyip net tutarı döndüren modül fonksiyonu\"\"\"\n    indirim_miktari = sepet_tutari * (indirim_orani / 100)\n    return sepet_tutari - indirim_miktari\n\n2. DOSYA (Ana Yürütücü Gövde): kod_asistan_ana.py\n\n# ======================================================================\n# KOD-ASİSTAN PROJESİ v1.2 - MODÜLER ANA PROGRAM MOTORU (ALIAS SÜRÜMÜ)\n# Standart: PEP 8 / Modül ve Fonksiyon Düzeyinde Takma İsim (as) Yönetimi\n# ======================================================================\nprint(\"=== KOD-ASİSTAN: TAKMA İSİM (ALIAS) VE MODÜL TEST PANELİ ===\\n\")\n# -----------------------------------------------------------------\n# SENARYO 1: MODÜLE TAKMA İSİM VERMEK\n# asistan_finans modülü artık bu programda \"fns\" kısa adıyla anılacaktır.\n# -----------------------------------------------------------------\nimport asistan_finans as fns\ngirdi_sepet_1 = 1000.0\ngirdi_indirim_1 = 15.0\n# Çağrı yapılırken uzun modül adı yerine fns takma adı kullanılır.\nsonuc_1 = fns.net_tutar_hesapla(girdi_sepet_1, girdi_indirim_1)\nprint(f\"[SENARYO 1] fns Takma Adıyla Hesaplanan Tutar: {sonuc_1:.2f} TL\")\n# -----------------------------------------------------------------\n# SENARYO 2: FONKSİYONA DOĞRUDAN TAKMA İSİM VERMEK\n# Modülden sadece ilgili fonksiyon çekilir ve \"hesapla\" ismiyle tescil edilir.\n# -----------------------------------------------------------------\nfrom asistan_finans import net_tutar_hesapla as hesapla\ngirdi_sepet_2 = 500.0\ngirdi_indirim_2 = 10.0\n# Nokta (.) operatörüne gerek kalmadan doğrudan çağrılır.\nsonuc_2 = hesapla(girdi_sepet_2, girdi_indirim_2)\nprint(f\"[SENARYO 2] hesapla Fonksiyon İsimlendirmesiyle Tutar: {sonuc_2:.2f} TL\")\nprint(\"===============================================================\")\n\nTerminal Çıktısı\n\n=== KOD-ASİSTAN: TAKMA İSİM (ALIAS) VE MODÜL TEST PANELİ ===\n[SENARYO 1] fns Takma Adıyla Hesaplanan Tutar: 850.00 TL\n[SENARYO 2] hesapla Fonksiyon İsimlendirmesiyle Tutar: 450.00 TL\n\nKod Analizi:\nModül Düzeyinde Optimizasyon (import ... as ...): Birinci senaryoda, asistan_finans gibi uzun bir dosya adını fonksiyonu her çağırdığımızda tekrar yazmak yerine fns şeklinde kısa bir takma isim (alias) belirlenmiştir. Bu durum, kod yazım hızını artırır ve isim uzayını (namespace) daha temiz tutar.\nFonksiyon Düzeyinde Doğrudan İçe Aktarım (from ... import ... as ...): İkinci senaryoda modül yüklenmiş ancak yalnızca net_tutar_hesapla adı mevcut ad alanına aktarılmıştır. Üstelik bu fonksiyona ana programda hesapla gibi daha akılda kalıcı bir takma ad verilerek nokta (.) operatörüne duyulan ihtiyaç tamamen ortadan kaldırılmıştır.\nİsim Çakışmalarını Önleme: as anahtar kelimesi, sadece yazım kolaylığı sağlamak için değil isim çakışmalarını önlemek için de kullanılır. Eğer ana programda zaten net_tutar_hesapla adında başka bir fonksiyon olsaydı dışarıdan gelen bu fonksiyona as hesapla diyerek takma ad vermek, programdaki isimlerin birbirini ezmesini ve olası mantık hatasını engellemiş olurdu.\n\nBilgi Kutusu — Yazılım Dünyasındaki Ünlü Takma İsimler: Profesyonel Python yazılımcıları arasında bazı küresel kütüphaneler için yaygın takma isim (alias) kullanımları bulunur. Örneğin veri bilimi yaparken yazılımcılar yaygın olarak pandas kütüphanesini import pandas as pd, NumPy'ı ise import numpy as np şeklinde kısaltarak projelerine dâhil eder. Bu sayede bir kodun içinde pd. veya np. gördüğünüzde onun hangi modüle ait olduğunu saniyeler içinde anlayabilirsiniz.\n\nUygulama Özeti: Sabit Geçici Parola Döndüren Modüler Fonksiyon\n\n5. Uygulama'da Kod-Asistan projesinin siber güvenlik altyapısı için geçici bir sistem parolası üreten akıllı bir araç, guvenlik_araclari.py isimli bağımsız bir yardımcı modülde parola_uret() fonksiyonu olarak kurgulanmıştır. Fonksiyonun gövdesinde sadece orada tanımlı olan gecici_parola = \"KOD-1234\" şeklinde yerel bir değişken tanımlanmış ve bu değer return komutuyla fırlatılmıştır. Ana dosya (ana_sistem.py), yardımcı modülü as anahtar kelimesiyle kısa bir takma adla projesine bağlamış, bu kısa ad ve nokta operatörünü kullanarak diğer dosyadaki fonksiyonu çağırmış ve dönen parolayı yeni bir değişkende yakalayıp print() ile ekrana yazdırmıştır. Ana programın en alt satırından, diğer dosyada tanımlanıp fonksiyon bitiminde bellekten silinen gecici_parola yerel değişkenine dışarıdan ulaşılmaya çalışıldığında ise ekranda beliren NameError çökme mesajı, yerel değişkenlerin dış dünyadan ne kadar katı biçimde izole olduğunu bir kez daha somut olarak kanıtlamıştır."}, {"id": "p3", "title": "Kod Kalitesi ve Denetimi (Code Quality)", "body": "Bir bilgisayar programının sadece hatasız çalışması, o yazılımın kaliteli ve endüstri standartlarına uygun olduğu anlamına gelmez. Yazılım mühendisliğinde kod kalitesi (code quality); yazılan kodların bilgisayar sistem kaynakları üzerinde ne kadar verimli çalıştırıldığının yanı sıra başka yazılımcılar tarafından ne kadar kolay okunabildiği, anlaşılabildiği ve güncellenebildiğiyle ölçülür. Kaliteli bir kod tabanı şu kurumsal standartlara sahip olmalıdır.\n\nOkunabilirlik (Readability): Kod bloklarının karmaşık formüllerden uzak, temiz ve net bir söz dizimiyle yazılmasıdır.\n\nBakım kolaylığı (Maintainability): Sisteme yeni bir özellik eklenmek istendiğinde eski kodları yıkmadan kolayca entegre edilebilmesidir.\n\nYeniden Kullanılabilirlik (Reusability): Yazılan fonksiyon hücrelerinin, kopyala-yapıştır yapmaya gerek kalmadan projenin farklı alanlarında da doğrudan çalışabilmesidir."}], "sorular": {"q1": {"type": "open", "closed": false, "text": "import asistan_finans as fns komutuyla bir modüle takma isim verildikten sonra, sonuc_1 = fns.net_tutar_hesapla(girdi_sepet_1, girdi_indirim_1) satırında nokta (.) operatörüne hâlâ ihtiyaç duyulmasının sebebi nedir? from asistan_finans import net_tutar_hesapla as hesapla şeklinde tek bir fonksiyon takma adla çekildiğinde bu ihtiyacın neden ortadan kalktığını açıklayınız."}, "q2": {"type": "mc", "closed": true, "text": "İçe aktarılan bir modüle veya fonksiyona daha kısa bir ad vermek için kullanılan anahtar kelime hangisidir?", "opts": ["as", "alias", "import", "def", "name"], "correct": "as"}, "q3": {"type": "tf", "closed": true, "text": "as anahtar kelimesi, sadece yazım kolaylığı sağlamak için değil aynı isimde başka bir fonksiyon varsa isim çakışmalarını önlemek için de kullanılabilir.", "correct": "Doğru"}, "q4": {"type": "open", "closed": false, "text": "5. Uygulama'daki (Sabit Geçici Parola Döndüren Modüler Fonksiyon) problem senaryosuna göre guvenlik_araclari.py dosyasındaki parola_uret() fonksiyonu, ana_sistem.py dosyasına kısa bir takma adla bağlanacaktır. Ana programın en alt satırına parola_uret() fonksiyonu içindeki gecici_parola adlı yerel değişkene doğrudan ulaşmayı deneyen bir print(gecici_parola) satırı eklenirse ekranda hangi tür hata mesajı belirir? Nedenini yerel değişkenlerin bellek ömrüyle ilişkilendirerek açıklayınız."}, "q5": {"type": "fill", "closed": true, "text": "Yazılan kodların bilgisayar sistem kaynakları üzerinde verimli çalışmasının yanı sıra başka yazılımcılar tarafından ne kadar kolay okunabildiği ve güncellenebildiğiyle ölçülen kavrama ______ denir.", "accepted": ["kod kalitesi", "code quality", "kod kalitesi (code quality)"]}, "q6": {"type": "open", "closed": false, "text": "Kaliteli bir kod tabanının sahip olması gereken okunabilirlik, bakım kolaylığı ve yeniden kullanılabilirlik standartlarını kendi cümlelerinizle kısaca açıklayınız."}}}, {"no": 24, "baslik": "24. Hafta — Yazılım Standartları, Docstring ve Kod Yeniden Yapılandırma", "baslangicTarihi": "2027-03-15", "konular": [{"id": "p1", "title": "Yazılım Standartları ve Teknik Dokümantasyon: Docstring", "body": "Geliştirilen modüler projelerde yüzlerce farklı fonksiyon yer alabilir. Bu fonksiyonların ne iş yaptığını, dışarıdan hangi parametreleri beklediğini ve ana akışa hangi veri türünde sonuç döndürdüğünü açıklayan standart bilgi bloklarına Docstring (Belgelendirme Dizgisi) adı verilir.\n\nPython dilinde Docstring'ler, def satırının hemen altına üçlü çift tırnak (\"\"\" ... \"\"\") arasına yazılır. Bu sayede hem projeye yeni dâhil olan yazılımcı tarafından fonksiyonun kullanım kılavuzu görülebilir hem de gelişmiş kod editörleri tarafından kod yazılırken bu açıklamalar akıllı bir ipucu olarak sunulabilir.\n\ndef net_tutar_hesapla(sepet_tutari, indirim_orani=10):\n    \"\"\"Sepet tutarına indirim uygulayarak ödenecek net tutarı hesaplar.\n    Parametreler:\n        sepet_tutari: İndirim uygulanmadan önceki sepet tutarıdır.\n        indirim_orani: Yüzde cinsinden indirim oranıdır. Varsayılan değeri 10'dur.\n    Döndürür:\n        İndirim uygulandıktan sonra ödenecek net tutarı döndürür.\n    \"\"\"\n    indirim_miktari = sepet_tutari * indirim_orani / 100\n    net_tutar = sepet_tutari - indirim_miktari\n    return net_tutar\nsonuc = net_tutar_hesapla(500, 20)\n\nDocstring metni, fonksiyonun ne işe yaradığını (net tutar hesaplama), hangi parametreleri (sepet_tutari, indirim_orani) beklediğini ve döndürdüğü değerin ne anlama geldiğini teknik ve standart bir dille kayıt altına alır. Bu belgelendirme dizgisi, fonksiyonun çalışma mantığını değiştirmez; sadece fonksiyonun dışarıdan nasıl kullanılacağını anlatan resmî bir kullanım kılavuzu görevi görür."}, {"id": "p2", "title": "Kod Yeniden Yapılandırma (Refactoring) ve DRY Prensibi", "body": "Yazılım geliştirme sürecinde programın dışarıdan görünen davranışlarını, girdilerini ve çıktılarını tamamen aynı bırakarak sadece kodun iç yapısını, kalitesini ve okunabilirliğini artırmak amacıyla kaynak kodların optimize edilmesine kod yeniden yapılandırma (refactoring) adı verilir.\n\nProfesyonel yazılım mühendisliğinde en çok saygı duyulan kurallardan biri DRY [Don't Repeat Yourself (Kendini Tekrar Etme)] prensibidir. Bir projede aynı kod bloğunun ikinci kez kopyalanıp yapıştırılması, tasarım hatası yapıldığını gösterebilir. Fonksiyonlar ve modüller, kodları sadece daha okunabilir yapmakla kalmaz; aynı zamanda kod tekrarını azaltır, bakım ve güncelleme süreçlerini kolaylaştırır. Hata çıktığında yüzlerce satırı değil sadece o fonksiyonu düzeltmek yeterlidir.\n\nLiteratürde çalışan ancak gereksiz tekrarlar barındıran, değişken isimleri anlamsızlaşmış ve performansı düşüren mantıksal bozulmalara kötü kokular (code smells) adı verilir. Refactoring süreçlerinde yazılımcılar, kod tabanındaki kötü kokuları temizler. Örneğin yüzlerce satır süren devasa doğrusal kodlar parçalanır, mükerrer kod satırları DRY prensibine uygun bağımsız fonksiyon yapılarına dönüştürülür ve karmaşık if-else merdivenleri daha yalın mantıksal süzgeçlerle sadeleştirilir. Buradaki amaç programın çalışmasını değiştirmek değil onu daha kararlı ve geleceğe hazır hâle getirmektir.\n\nBilgi Kutusu — Kodlarınız Spagetti mi, Lazanya mı? Yazılım dünyasında kötü yazılmış kodların neden yemek isimleriyle anıldığını biliyor musunuz? Hiçbir modüler kurala uymayan, iç içe geçmiş ve bir hatayı ararken ipin ucunun nerede olduğunu asla bulamadığınız karmaşık kodlara küresel yazılım kültüründe Spagetti Kod denir. Öte yandan, katman katman ve düzenli yazılmış modüler projelere ise Lazanya Kod benzetmesi yapılır. Refactoring süreci, aslında o karmaşık spagetti tabağını alıp düzenli ve lezzetli bir lazanyaya çevirme sanatıdır. Siz de projelerinizi tasarlarken kodlarınızın bir spagettiye dönüşmemesine dikkat edin!"}, {"id": "p3", "title": "Uygulama Özeti: Yapay Zekâ Kodlarının Kalite Denetimi ve Issue Yönetimi", "body": "Uygulama Özeti: Yapay Zekâ Kodlarının Kalite Denetimi, Refactoring ve Issue Yönetimi\n\n6. Uygulama'da bir yapay zekâ asistanından sepet indirim modülü talep edilmiş ancak yapay zekânın ürettiği kod görünürde çalışan fakat aynı hesaplama adımlarını her kullanıcı tipi için defalarca kopyaladığı karmaşık (spagetti) bir kod olarak teslim edilmiştir.\n\n1. DOSYA (Yapay Zekânın Ürettiği Kalitesiz Spagetti Kod)\n\nprint(\"=== KOD-ASİSTAN: YAPAY ZEKÂ STANDART DIŞI KOD HAVUZU ===\\n\")\n# YÖNETİCİ GİRİŞİ KATMANI (Tekrar Eden Blok 1)\nprint(\"[SİSTEM] Yönetici erişim katmanı doğrulanıyor...\")\nsepet_1 = 600\nif sepet_1 > 500:\n    net_1 = sepet_1 * 0.90\n    print(f\"Yönetici için indirim uygulandı. Ödenecek: {net_1} TL\")\nelse:\n    print(f\"Yönetici için indirim yok. Ödenecek: {sepet_1} TL\")\n# ÖĞRETMEN GİRİŞİ KATMANI (Tekrar Eden Blok 2)\nprint(\"[SİSTEM] Öğretmen erişim katmanı doğrulanıyor...\")\nsepet_2 = 450\nif sepet_2 > 500:\n    net_2 = sepet_2 * 0.90\n    print(f\"Öğretmen için indirim uygulandı. Ödenecek: {net_2} TL\")\nelse:\n    print(f\"Öğretmen için indirim yok. Ödenecek: {sepet_2} TL\")\n# ÖĞRENCİ GİRİŞİ KATMANI (Tekrar Eden Blok 3)\nprint(\"[SİSTEM] Öğrenci erişim katmanı doğrulanıyor...\")\nsepet_3 = 800\nif sepet_3 > 500:\n    net_3 = sepet_3 * 0.90\n    print(f\"Öğrenci için indirim uygulandı. Ödenecek: {net_3} TL\")\nelse:\n    print(f\"Öğrenci için indirim yok. Ödenecek: {sepet_3} TL\")\n\nProfesyonel bir yazılımcı olarak yapay zekâ yalnızca bir asistan olarak görülmüş, üretilen kod adım adım süzgeçten geçirilerek gereksiz tekrarlar ayıklanmış ve tüm mantık, dışarıdan kullanici_tipi ve sepet_tutari parametrelerini alan indirimli_sistem_kontrolu() isimli tek bir merkezî fonksiyon altında yeniden düzenlenmiştir.\n\n2. DOSYA (Temiz Refactoring Kodu)\n\n# REFACTORING SONRASI KOD-ASİSTAN v1.3\n# Standart: PEP 8 / DRY Prensibi / Fonksiyonel Optimizasyon\nprint(\"=== KOD-ASİSTAN: REFACTORING KALİTE DENETİM MOTORU ===\\n\")\ndef indirimli_sistem_kontrolu(kullanici_tipi, sepet_tutari):\n    \"\"\"Kullanıcı tipini ve sepet tutarını alarak ödenecek tutarı döndürür.\"\"\"\n    print(f\"[SİSTEM] {kullanici_tipi} erişim katmanı doğrulanıyor...\")\n    if sepet_tutari > 500:\n        net_tutar = sepet_tutari * 0.90\n        print(f\"{kullanici_tipi} için indirim uygulandı. Ödenecek: {net_tutar:.2f} TL\")\n    else:\n        net_tutar = sepet_tutari\n        print(f\"{kullanici_tipi} için indirim yok. Ödenecek: {sepet_tutari:.2f} TL\")\n    return net_tutar\n# FONKSİYONUN FARKLI ARGÜMANLARLA TEKRAR KULLANILMASI (DRY UYUMU)\nindirimli_sistem_kontrolu(\"Yönetici\", 600)\nindirimli_sistem_kontrolu(\"Öğretmen\", 450)\nindirimli_sistem_kontrolu(\"Öğrenci\", 800)\n\nKod Analizi ve Değerlendirme:\n• İki kod yapısı da terminalde aynı sayısal sonuçları üretir ancak refactoring uygulanmış ikinci kod yapısı, aynı mantığı tek bir fonksiyon gövdesinde topladığı için çok daha sürdürülebilirdir.\n• Sisteme \"İndirim sınırı 500 TL'den 700 TL'ye çıkarıldı.\" şeklinde yeni bir güncelleme geldiğinde ilk kod yapısında bu değişikliği yapmak için üç ayrı yerde satır düzeltmek gerekirken, refactoring yapılmış ikinci kodda sadece fonksiyon gövdesindeki tek bir satırı değiştirmek yeterlidir; bu durum fonksiyonların bakım kolaylığı üzerindeki gücünü somut olarak kanıtlar.\n\nKodlama tamamlandıktan sonra bu iyileştirme süreci, projenin dijital deposunda kurumsal bir Görev Kartı (Issue) ile raporlanarak belgelenmiştir. Depoda önce \"Yapay Zekâ Spagetti Kod Hatası ve DRY İhlali\" başlığıyla bir Issue açılmış (İnsan Denetimi prensibi çerçevesinde, yapay zekânın ürettiği kodun tek bir merkezî fonksiyon çatısı altında toplanması gerektiği not düşülmüştür), refactoring tamamlanan kararlı kod deponun deposuna yüklenirken sürüm notu (commit message) alanına \"Spagetti AI kodu refactoring süzgecinden geçirilerek DRY prensibine uygun merkezî fonksiyona dönüştürüldü. Closes #1\" yazılmıştır. Dijital depo, sürüm notundaki Closes anahtar kelimesini algılayarak ilgili Issue kartını otomatik şekilde kapatmış (Closed) ve görevin başarıyla tamamlandığını sistemsel olarak kayıt altına almıştır."}], "sorular": {"q1": {"type": "mc", "closed": true, "text": "Bir fonksiyonun ne işe yaradığını, parametrelerini ve döndürdüğü değeri anlatan standart bilgi bloklarına ne ad verilir?", "opts": ["README", "Docstring", "Issue", "Yorum Satırı (#)", "Release"], "correct": "Docstring"}, "q2": {"type": "tf", "closed": true, "text": "Kod tekrarını azaltmayı amaçlayan 'Kendini Tekrar Etme' yazılım geliştirme ilkesine DRY prensibi denir.", "correct": "Doğru"}, "q3": {"type": "open", "closed": false, "text": "6. Uygulama'daki (Yapay Zekâ Kodlarının Kalite Denetimi, Refactoring ve Issue Yönetimi) senaryoya göre yapay zekânın ürettiği kod, Yönetici/Öğretmen/Öğrenci için aynı if-else indirim mantığını üç kez tekrarlamaktadır. Bu tekrarı ortadan kaldırmak için DRY prensibine uygun olarak tasarlanması istenen indirimli_sistem_kontrolu(kullanici_tipi, sepet_tutari) fonksiyonunun görevini açıklayınız."}, "q4": {"type": "fill", "closed": true, "text": "Hiçbir modüler kurala uymayan, iç içe geçmiş ve bir hatayı ararken ipin ucunun bulunamadığı karmaşık kodlara küresel yazılım kültüründe ______ kod denir.", "accepted": ["spagetti", "spagetti kod", "spageti kod"]}, "q5": {"type": "open", "closed": false, "text": "Refactoring sonrasında oluşturulan indirimli_sistem_kontrolu fonksiyonuna \"İndirim sınırı 500 TL'den 700 TL'ye çıkarıldı.\" şeklinde yeni bir güncelleme geldiğini varsayınız. İlk (tekrarlı) kod yapısında bu değişikliği yapmak için kaç satıra müdahale etmek gerektiğini, refactoring yapılmış ikinci kodda ise sadece kaç satırın yeterli olduğunu karşılaştırarak fonksiyonların bakım kolaylığı üzerindeki gücünü açıklayınız."}, "q6": {"type": "mc", "closed": true, "text": "Yapay zekâ tarafından üretilen bir kod bloğunun doğrudan aktif sisteme dâhil edilmeden önce alanında uzman bir yazılımcı tarafından analitik bir süzgeçten geçirilmesi prensibine ne ad verilir?", "opts": ["Yapay Zekâ Halüsinasyonu", "Modülerlik", "Ölü Kod", "İnsan Denetimi", "Issue Takibi"], "correct": "İnsan Denetimi"}, "q7": {"type": "open", "closed": false, "text": "Dijital depoda (GitHub) bir Görev Kartı (Issue) açıp \"Yapay Zekâ Spagetti Kod Hatası ve DRY İhlali\" başlığıyla sorunu raporladıktan sonra, refactoring tamamlandığında sürüm notuna Closes #1 yazmanın görevi ne olur?"}}}, {"no": 25, "baslik": "25. Hafta — Ünite 4 Ölçme ve Değerlendirme", "baslangicTarihi": "2027-03-22", "konular": [{"id": "p1", "title": "Özet: Fonksiyonlar, Parametre ve Return", "body": "Bu ünitede öğrendiklerimiz arasında ilk temel kazanım, tekrar eden kod bloklarının def anahtar kelimesiyle tanımlanan, adlandırılmış ve gerektiğinde çağrılabilen kullanıcı tanımlı fonksiyonlara dönüştürülmesidir; fonksiyon isimleri PEP 8 stiline uygun snake_case ile yazılır ve gövde 4 boşluklu girinti disipliniyle kodlanır. İkinci kazanım, fonksiyona dışarıdan veri aktarma mekanizmasıdır: fonksiyon tanımlanırken parantez içine yazılan şablon isimlere parametre, fonksiyon çağrılırken (call) gönderilen somut değerlere ise argüman denir; argümanlar varsayılan olarak yazılış sırasına göre (pozisyonel eşleşme) parametrelerle eşleştiği için sıra karıştırıldığında program çökmeden mantıksal hataya (veri sapmasına) yol açabilir, bu riski azaltmak için anahtar sözcüklü (keyword) argümanlar kullanılabilir.\n\nÜçüncü kazanım, return (döndür) anahtar kelimesidir: print() bir veriyi yalnızca ekrana yazdırırken return, fonksiyonun hesapladığı sonucu programın ana akışına aktararak sonraki işlemlerde (örneğin bir koşul denetiminde) kullanılabilir hâle getirir; return çalıştığı an fonksiyonun yürütülmesi sona erer ve sonrasında kalan, hiçbir zaman çalıştırılamayan satırlara ölü kod adı verilir. Dördüncü kazanım varsayılan değerli parametrelerdir (default parameters): fonksiyon tanımlanırken parametre_adi=deger biçiminde ve daima parantezin en sonuna yazılan varsayılan değerler, dışarıdan argüman gönderilmediğinde devreye girer; dışarıdan özel bir argüman gönderildiğinde ise bu varsayılan değer geçici olarak ezilir (overriding), böylece fonksiyonlar hem esnek hem de hataya karşı toleranslı hâle gelir."}, {"id": "p2", "title": "Özet: Etki Alanı, Modüller ve Kod Kalitesi", "body": "Beşinci kazanım, değişkenlerin etki alanıdır (variable scope): fonksiyon gövdesinin dışında tanımlanan küresel değişkenlere programın her yerinden erişilebilirken bir fonksiyonun içinde (girintili alanda) tanımlanan yerel değişkenler yalnızca o fonksiyon çalıştığı sürece bellekte var olur ve fonksiyon bittiğinde RAM'den tamamen silinir; küresel değişkenle aynı isimde bir yerel değişken tanımlandığında Python yorumlayıcısı yerel değişkene öncelik vererek küreseli geçici olarak gölgeler (shadowing).\n\nAltıncı kazanım, kodun fiziksel olarak modüllere bölünmesidir: birbiriyle ilişkili fonksiyonlar bağımsız .py dosyalarına (modüllere) ayrılır ve ana programa import modul_adi komutuyla dâhil edilir; harici bir fonksiyona erişmek için modül adı ile nokta (.) operatörü birlikte kullanılır (modul_adi.fonksiyon_adi()), modül adı yazılmadan doğrudan çağrılmaya çalışılması NameError üretir. Uzun modül veya fonksiyon isimlerini kısaltmak ve isim çakışmalarını önlemek için import modul_adi as takma_ad ya da from modul_adi import fonksiyon_adi as takma_ad kalıbıyla takma isim (alias) verilebilir.\n\nSon kazanım ise kod kalitesi ve denetimidir: def satırının hemen altına üçlü tırnak (\"\"\" \"\"\") ile yazılan Docstring, bir fonksiyonun ne iş yaptığını, hangi parametreleri beklediğini ve neyi döndürdüğünü teknik olarak belgelendirir; DRY (Don't Repeat Yourself) prensibi doğrultusunda tekrar eden kod blokları (kötü kokular / spagetti kod) tek bir merkezî fonksiyona dönüştürülerek programın dış davranışı değiştirilmeden iç yapısı iyileştirilir (refactoring). Yapay zekâ tarafından üretilen fonksiyonel kodlar da doğrudan projeye eklenmeden önce İnsan Denetimi prensibiyle satır satır incelenmeli, tespit edilen sorunlar dijital depoda bir Görev Kartı (Issue) ile raporlanmalı ve düzeltme tamamlandığında sürüm notuna yazılan Closes ifadesiyle ilgili görev kapatılmalıdır."}], "sorular": {"q1": {"type": "mc", "closed": true, "text": "Python dil mimarisinde özel fabrikalar (kullanıcı tanımlı fonksiyonlar) oluşturmak ve tanımlamak için kullanılan yapısal anahtar kelime aşağıdakilerden hangisidir?", "opts": ["import", "return", "def", "as", "while"], "correct": "def"}, "q2": {"type": "mc", "closed": true, "text": "Bir fonksiyon içinde tanımlanan yerel değişken adına fonksiyon dışından doğrudan erişilmeye çalışıldığında oluşan hata aşağıdakilerden hangisidir?", "opts": ["TypeError", "SyntaxError", "ValueError", "IndexError", "NameError"], "correct": "NameError"}, "q3": {"type": "mc", "closed": true, "text": "Fonksiyonun ürettiği veya hesapladığı bir veriyi ekrana yazdırmak yerine doğrudan çağrıldığı yere döndürmek ve aktarmak için kullanılan komut aşağıdakilerden hangisidir?", "opts": ["print", "input", "import", "return", "as"], "correct": "return"}, "q4": {"type": "mc", "closed": true, "text": "Bir yazılım projesini fiziksel olarak farklı dosyalara bölüp, ardından bu harici modülleri ana program motoruna entegre etmek için kullanılan komut aşağıdakilerden hangisidir?", "opts": ["def", "as", "from", "return", "import"], "correct": "import"}, "q5": {"type": "mc", "closed": true, "text": "İçe aktarılan modül veya fonksiyona daha kısa bir ad vermek için kullanılan anahtar kelime hangisidir?", "opts": ["as", "alias", "import", "def", "name"], "correct": "as"}, "q6": {"type": "mc", "closed": true, "text": "Çalışan bir programın dış davranışını ve çıktısını kesinlikle değiştirmeden; spagetti kodları temizleyerek kodun iç mimarisini, okunabilirliğini ve modülerliğini optimize etme (iyileştirme) işlemine ne ad verilir?", "opts": ["Hata Ayıklama", "Derleme", "Sürümleme", "Yeniden Yapılandırma", "Gölgelendirme"], "correct": "Yeniden Yapılandırma"}, "q7": {"type": "mc", "closed": true, "text": "Kod tekrarını azaltmayı amaçlayan \"Kendini Tekrar Etme\" yazılım geliştirme ilkesi hangisidir?", "opts": ["PEP 8 Standardı", "İnsan Denetimi", "DRY Prensibi", "Ad Alanı Yönetimi", "Etki Alanı Sınırı"], "correct": "DRY Prensibi"}, "q8": {"type": "mc", "closed": true, "text": "Yapay zekâ tarafından üretilen bir kod bloğunun doğrudan aktif sisteme dâhil edilmeden önce alanında uzman bir yazılımcı tarafından analitik bir süzgeçten geçirilmesi prensibine ne ad verilir?", "opts": ["Yapay Zekâ Halüsinasyonu", "Modülerlik", "Ölü Kod", "İnsan Denetimi", "Issue Takibi"], "correct": "İnsan Denetimi"}, "q9": {"type": "mc", "closed": true, "text": "Fonksiyonların kullanım amacını, dışarıdan aldığı parametreleri ve döndürdüğü veri türlerini standartlar çerçevesinde anlatan teknik dokümantasyon metinlerine ne ad verilir?", "opts": ["README", "Docstring", "Issue", "Yorum Satırı (#)", "Release"], "correct": "Docstring"}, "q10": {"type": "mc", "closed": true, "text": "Aynı isme sahip bir yerel değişken ile bir küresel değişken çakıştığında, Python yorumlayıcısının fonksiyon içindeyken yerel olana öncelik vererek küresel değişkeni geçici olarak kapatması kuralına ne ad verilir?", "opts": ["Sınır İhlali", "Ölü Kod", "Kötü Koku", "İçe Aktarma", "Gizleme"], "correct": "Gizleme"}, "q11": {"type": "open", "closed": false, "text": "Aşağıdaki Python kaynak kod bloğu çalıştırıldığında Python yorumlayıcısının 6. satırda programı aniden durdurduğu ve hata fırlattığı gözlemlenmiştir:\ndef guvenlik_duvari_olustur():\n    sistem_durumu = \"Güvenlik Duvarı Aktif\"\n    print(sistem_durumu)\nprint(\"Sistem başlatılıyor...\")\nguvenlik_duvari_olustur()\nprint(sistem_durumu)\na) Programın 6. satırda vereceği hatanın teknik adını yazınız.\nb) Hatanın nedenini, yerel değişkenin etki alanı ve fonksiyon dışından erişilebilirliği kavramlarını kullanarak açıklayınız."}, "q12": {"type": "open", "closed": false, "text": "Yazılım projenizdeki matematiksel işlemleri asistan_finans.py isimli harici bir dosyaya kaydettiniz. Ana programınızda bu dosyayı içe aktarırken çok uzun olduğu için import asistan_finans as fns komutunu kullandınız.\na) İçe aktarılan bu harici modüle fns adını atamanızı sağlayan as anahtar kelimesinin kullanım işlemine literatürde ne ad verilir?\nb) asistan_finans.py modülünün içinde yer alan kdv_ekle(tutar) isimli fonksiyonu ana programda çağırmak için yazmanız gereken doğru kod satırını, yeni kısa adınızı ve nokta (.) operatörünü kullanarak yazınız."}}}, {"no": 26, "baslik": "26. Hafta — Sözlük Veri Yapısı ve Güvenli Veri Erişimi", "baslangicTarihi": "2027-03-29", "konular": [{"id": "p1", "title": "Sözlük (Dictionary) Veri Yapısı: Anahtar-Değer İlişkisi", "body": "Bir okul kütüphanesindeki binlerce kitabın herhangi bir kayıt veya sınıflandırma sistemi olmadan raflara gelişigüzel yerleştirildiğini düşününüz. Aradığınız belirli bir kitaba ulaşmaya çalışırken yaşayacağınız süreç, düzenli bir etiketleme sisteminin önemini gözler önüne serer. Listeler, verileri belirli bir sıraya göre saklayan ve bu verilere indeks numaraları (0, 1, 2, ...) aracılığıyla erişilmesini sağlayan veri yapılarıdır. Bununla birlikte gerçek yaşam problemlerinde verilere çoğu zaman sıralarına göre değil taşıdıkları anlamlara göre erişmek gerekir. Örneğin bir öğrenciye ait bilgiler saklanırken öğrenci numarası, adı, sınıfı, not ortalaması gibi farklı türde veriler birbiriyle ilişkilidir. Bu verilere ulaşmak için sürekli indeks numaralarını takip etmek hem okunabilirliği azaltır hem de veri miktarı arttıkça yönetimi zorlaştırır.\n\nBir okul kütüphanesinde kitaplar aranırken kitabın raftaki sırasından çok kitap adı, barkod numarası veya yazar bilgisi kullanılır. Benzer şekilde bir telefon rehberinde de kişilere sıra numarasıyla değil isimleriyle ulaşılır. Bu tür durumlarda verileri anlamlı etiketlerle ilişkilendirmek daha kullanışlı bir yaklaşım sunar.\n\nPython programlama dilinde verileri anlamlı etiketler kullanarak saklamayı sağlayan veri yapısına sözlük (dictionary) adı verilir. Sözlükler, verileri anahtar-değer (key-value) ilişkisiyle organize eder ve bir bilgiye doğrudan ilgili anahtar üzerinden erişilmesini sağlar. Sözlük yapısında her bilgi iki bölümden oluşur.\n\n• Anahtar (Key): Veriye erişmek için kullanılan benzersiz etikettir. Sözlük içerisinde aynı anahtar birden fazla kez kullanılamaz.\n\n• Değer (Value): Anahtar ile ilişkilendirilen bilgidir. Metin, sayı, liste veya başka bir sözlük olabilir.\n\nBir kütüphane fihristinde barkod numarasının kitabı temsil etmesi ya da telefon rehberinde kişinin adının telefon numarasıyla ilişkilendirilmesi, anahtar-değer ilişkisine örnek olarak gösterilebilir. Python'da sözlükler, süslü parantezler { } kullanılarak tanımlanır. Her anahtar ile değeri, iki nokta (:) işareti birbirine bağlar.\n\n# Standart bir sözlük tanımlama örneği\nogrenci = {\n    \"numara\": 125,\n    \"ad\": \"Ayşegül\",\n    \"sinif\": \"9-A\",\n    \"ortalama\": 88.5\n}\n\nKod Analizi:\n• \"numara\", \"ad\", \"sinif\" ve \"ortalama\" ifadeleri anahtardır.\n• 125, \"Ayşegül\", \"9-A\" ve 88.5 değerlerdir.\n\nBu yapı sayesinde veriler yalnızca sıralı olarak değil anlamlı ilişkiler kurularak da saklanabilir. Böylece programlar daha okunabilir, daha düzenli ve yönetilebilir hâle gelir."}, {"id": "p2", "title": "Sözlük Elemanlarına Erişim ve Güvenli Veri Sorgulama (.get())", "body": "Sözlüklerde bir değere ulaşmak için ilgili anahtar köşeli parantez ([ ]) içerisinde belirtilir. Listelerde verilere indeks numaralarıyla erişilirken sözlüklerde anlamlı anahtarlar kullanılır. Bu sayede verilerin neyi temsil ettiği daha kolay anlaşılır.\n\nogrenci = {\n    \"numara\": 125,\n    \"ad\": \"Ayşegül\",\n    \"sinif\": \"9-A\",\n    \"ortalama\": 88.5\n}\nprint(\"Öğrencinin Adı:\", ogrenci[\"ad\"])\nprint(\"Öğrencinin Sınıfı:\", ogrenci[\"sinif\"])\n# Sözlükte bulunmayan bir anahtarı çağırmak, bir KeyError hatasına yol açar!\n# print(ogrenci[\"soyad\"])\n\nKod Analizi:\n• 1. Adım (Anlamlı ve Doğrudan Erişim): Sözlük veri yapısında değerlere listelerdeki gibi sayısal indeks numaralarıyla değil \"ad\", \"sinif\" gibi veriyi tanımlayan anlamlı anahtarlarla erişilir. Bu yapı, Python yorumlayıcısının doğrudan hedef veriye ulaşmasını sağlarken kodun okunabilirliğini de büyük ölçüde artırır.\n• 2. Adım [Çalışma Zamanı Hatası (KeyError)]: Sözlükte tanımlanmamış bir anahtara (örneğin \"soyad\") köşeli parantez [ ] kullanılarak doğrudan erişilmeye çalışıldığında Python yorumlayıcısı bu etiketi bulamaz ve KeyError (Anahtar Hatası) vererek programın akışını aniden sonlandırır.\n\nBir sözlükte bulunmayan bir anahtara doğrudan erişilmeye çalışılmasının programın beklenmeyen şekilde sonlanmasına neden olabileceği unutulmamalıdır. Bir anahtarın sözlükte bulunup bulunmadığından emin olunmadığında .get() metodu kullanılabilir. Bu metot, belirtilen anahtar sözlükte varsa ilgili değeri döndürür. Anahtar bulunmuyorsa hata oluşturmak yerine None değerini veya kullanıcı tarafından belirlenen varsayılan bir değeri döndürür. .get() metodu, sözlükte bulunmayan bir anahtara erişilmeye çalışıldığında programın hata vermesini önlemeye yardımcı olur. Bu nedenle sözlüklerdeki veri sorgulama işlemlerinde güvenli kod kullanılır.\n\nkitap_bilgisi = {\n    \"ad\": \"Dîvân-ı Hikmet\",\n    \"yazar\": \"Hoca Ahmed Yesevî\"\n}\nprint(f\"Kitap Adı: {kitap_bilgisi.get('ad', 'Kitap adı bilgisi bulunamadı.')}\")\n# Anahtar bulunmuyorsa varsayılan değer döndürülür.\nyayinevi = kitap_bilgisi.get(\"yayinevi\", \"Yayınevi bilgisi bulunamadı.\")\nprint(f\"Yayınevi: {yayinevi}\")\n# Var olan bir anahtarın değeri alınır.\nyazar = kitap_bilgisi.get(\"yazar\", \"Yazar bilgisi bulunamadı.\")\nprint(f\"Yazar: {yazar}\")\n\nTerminal Çıktısı\n\nKitap Adı: Dîvân-ı Hikmet\nYayınevi: Yayınevi bilgisi bulunamadı.\nYazar: Hoca Ahmed Yesevî\n\nKod Analizi:\n• 1. Adım [Güvenli Veri Sorgulama (KeyError Önleme)]: Sözlükte tanımlanmamış olan \"yayinevi\" anahtarına köşeli parantez [ ] ile doğrudan erişilmeye çalışılsaydı Python yorumlayıcısı KeyError hatası vererek programı aniden sonlandıracaktı ancak .get() metodu kullanılarak bu hata engellenmiş ve yazılımın kararlılığı (stabilitesi) sağlanmıştır.\n• 2. Adım (Dinamik Varsayılan Değer Üretimi): .get() metodu, bulunmayan \"yayinevi\" anahtarı için programın akışını bozmak yerine ikinci parametre olarak tanımlanan \"Yayınevi bilgisi bulunamadı.\" metnini varsayılan değer (fallback) olarak sisteme döndürerek hata yönetimi sürecini hatasız işletmiştir.\n• 3. Adım (Mevcut Verilere Kesintisiz Erişim): Sözlükte zaten varlığından emin olunan \"ad\", \"yazar\" gibi anahtarlar çağrıldığındaysa .get() metodu doğrudan bellekteki orijinal verileri (Dîvân-ı Hikmet ve Hoca Ahmed Yesevî) başarıyla ana akışa aktarmıştır."}, {"id": "p3", "title": "Sözlüklerde Veri Ekleme, Güncelleme ve Silme", "body": "Programlar çalışırken yeni bilgiler eklenebilir veya mevcut bilgiler değiştirilebilir. Sözlük yapıları da bu tür değişikliklerin kolayca gerçekleştirilmesine olanak sağlar. Bir sözlüğe yeni bir anahtar-değer çifti eklemek veya mevcut bir değeri güncellemek için köşeli parantez içerisinde ilgili anahtar belirtilir ve yeni değer atanır. Bir sözlükte bulunmayan bir anahtara değer atanırsa yeni bir kayıt oluşturulur. Anahtar zaten mevcutsa eski değer yeni değer ile değiştirilir.\n\nkitap_bilgisi = {\n    \"ad\": \"Dîvân-ı Hikmet\",\n    \"yazar\": \"Hoca Ahmed Yesevî\"\n}\n# Sözlüğe daha önce bulunmayan 'tür' anahtarı ve değeri eklenir.\nkitap_bilgisi[\"tür\"] = \"Tasavvuf\"\nprint(kitap_bilgisi)\n\nTerminal Çıktısı\n\n{'ad': 'Dîvân-ı Hikmet', 'yazar': 'Hoca Ahmed Yesevî', 'tür': 'Tasavvuf'}\n\nKod Analizi:\n• 1. Adım (Dinamik Bellek Genişlemesi): Python sözlükleri, programın çalışma zamanında boyutları esnek bir şekilde büyüyebilen dinamik veri yapılarıdır. kitap_bilgisi[\"tür\"] = \"Tasavvuf\" komutu çalıştırıldığında Python yorumlayıcısı \"tür\" anahtarının bellekte daha önce tanımlanmadığını saptar, hata vermek yerine yeni anahtar-değer çiftini sözlüğe ekler.\n• 2. Adım (Doğrudan Atama ile Pratik Entegrasyon): Listelere yeni bir veri eklemek için özel yerleşik metotlara (örneğin .append()) ihtiyaç duyulurken sözlük mimarisinde doğrudan köşeli parantez [ ] ve atama operatörü = kullanılarak yeni bir anahtar-değer çifti kod tabanına son derece hızlı, pratik ve düşük maliyetli bir şekilde entegre edilmiştir.\n\nVar olan bir anahtarın değerini değiştirmek için de aynı atama mantığı izlenir; ancak bu kez köşeli parantez içine yeni bir anahtar değil, sözlükte zaten kayıtlı olan bir anahtar yazılır.\n\nkitap_bilgisi[\"yazar\"] = \"Pir-i Türkistan Hoca Ahmed Yesevî\"\nprint(kitap_bilgisi)\n\nTerminal Çıktısı\n\n{'ad': 'Dîvân-ı Hikmet', 'yazar': 'Pir-i Türkistan Hoca Ahmed Yesevî', 'tür': 'Tasavvuf'}\n\nKod Analizi:\n• 1. Adım [Değerin Üzerine Yazma (Overwriting)]: Python sözlüklerinde her bir anahtar benzersiz (unique) olmak zorundadır. Atama operatörü = kullanılarak sözlükte zaten var olan bir anahtara (\"yazar\") yeni bir veri gönderildiğinde Python yorumlayıcısı eski veriyi (Hoca Ahmed Yesevî) yeni veriyle (Pir-i Türkistan Hoca Ahmed Yesevî) değiştirir.\n• 2. Adım [Esnek Veri Manipülasyonu (Mutability)]: Sözlükler çalışma sırasında değiştirilebilir veri yapılarıdır. Bu nedenle sözlüğü tamamen yeniden oluşturmaya gerek kalmadan belirli bir anahtarın değeri doğrudan güncellenebilir.\n\nYazılım projelerinin çalışma sürecinde bazı verilere artık ihtiyaç duyulmayabilir veya bellek yönetimini optimize etmek amacıyla belirli kayıtların sistemden tamamen temizlenmesi gerekebilir. Bir sözlükteki belirli bir anahtarı ve o anahtara bağlı olan değeri kalıcı olarak kaldırmak için del (delete) anahtar kelimesi kullanılır. Bu işlem gerçekleştirilirken silinmek istenen verinin anahtarı köşeli parantez içinde belirtilir.\n\nkitap_bilgisi = {\n    \"ad\": \"Dîvân-ı Hikmet\",\n    \"yazar\": \"Hoca Ahmed Yesevî\",\n    \"tür\": \"Tasavvuf\"\n}\n# İhtiyaç duyulmayan 'tür' anahtarı ve değeri sözlükten silinir.\ndel kitap_bilgisi[\"tür\"]\nprint(kitap_bilgisi)\n\nTerminal Çıktısı\n\n{'ad': 'Dîvân-ı Hikmet', 'yazar': 'Hoca Ahmed Yesevî'}\n\nKod Analizi:\n• 1. Adım (Silme): Bu işlem sonucunda \"tür\" anahtarı ve ona bağlı olan \"Tasavvuf\" değeri sözlükten silinir.\n• 2. Adım (KeyError Riski): Silme işlemi yapılırken, sözlükte o an var olmayan bir anahtarı (örneğin daha önce silinmiş olan \"tür
