r veri girilirse \"Hatalı rol tanımlaması!\" uyarısının üretilmesi gerekmektedir.\n\nUygulama adımlarında kullanıcının girdiği rol bilgisinin küçük harfe dönüştürülmüş hâlinin bir değişkene atanması, ardından if-elif-else merdiveninin bu standart hâle getirilmiş veri üzerinden inşa edilmesi istenmiştir. Kodun farklı harf kombinasyonlarıyla (PeRsOnEl, YONETICI vb.) test edilip kararlı çalıştığı doğrulandıktan sonra dosya \"Akıllı güvenlik kapısı modülü iç içe koşullar ve veri temizleme mimarisiyle tamamlandı.\" notuyla dijital depoya yüklenmiştir."}, {"id": "p4", "title": "Kararlı Veri Kontrolü: Büyük / Küçük Harf Duyarlılığı", "body": "Bilgisayarlar, kullanıcıların girdilerini işlerken karakterlerin biçimsel özelliklerine karşı son derece katıdır. Python programlama dili büyük / küçük harf duyarlılığına (case-sensitivity) sahip bir mimariyle çalışır. Bu durum, bellek düzeyinde \"A\" karakteri ile \"a\" karakterinin tamamen farklı iki veri olarak kabul edilmesi anlamına gelir.\n\nKullanıcılardan metinsel veri alırken harf duyarlılığından kaynaklanan mantıksal hataları engellemek ve programın kararlılığını korumak için string metotlarından yararlanılır. Kullanıcının klavyeden metni nasıl yazdığından (hepsi büyük, hepsi küçük veya karışık) bağımsız olarak veriyi standart bir forma dönüştürmek amacıyla en sık kullanılan iki metot şudur: .lower() metodu uygulandığı metinsel ifadedeki tüm büyük harfleri küçük harfe dönüştürür; .upper() metodu ise uygulandığı metinsel ifadedeki tüm küçük harfleri büyük harfe dönüştürür.\n\n3. Örnek: Harf Duyarlılığı Çözümü\n\nKullanıcı, bir menü seçeneğinde veya onay ekranında \"Evet\" cevabını vermek için farklı biçimler kullanmaktadır.\n\n# Standart dışı girdi senaryosu\ngirdi = \"EvEt\"\n# Yöntem A: Metot kullanılmayan durum (Mantıksal Hata Riski)\nif girdi == \"evet\":\n    print(\"İşlem onaylandı.\") # Bu blok çalışmaz, çünkü \"EvEt\" == \"evet\" sonucu False'tur.\n# Yöntem B: Kararlı Dönüşüm Yapılmış Durum (Önerilen Standart)\ntemiz_girdi = girdi.lower() # \"EvEt\" verisi tamamen küçük harfe dönüştürülerek \"evet\" olur.\nif temiz_girdi == \"evet\":\n    print(\"İşlem başarıyla onaylandı.\") # Bu blok kararlı bir şekilde çalışır.\n\nKod Analizi:\n• Aynı harflerden oluşsa dahi \"EvEt\" ile \"evet\" karakter dizileri bilgisayar belleğinde tamamen farklı verileri temsil eder.\n• Profesyonel yazılım projelerinde son kullanıcıdan gelen girdiler (büyük / küçük harf karışık, boşluklu vb.) her zaman öngörülemez kabul edilir. Yazılımın dayanıklılığını korumak ve if-else karar yapılarının doğru yönlenmesini sağlamak için alınan metinsel verilerin .lower() gibi dönüştürücü metotlarla arka planda standart bir formata getirilmesi yaygın bir veri normalleştirme uygulamasıdır.\n\nBilgi Kutusu — Veri Standardizasyonu ve Kod Okunabilirliği: Yazılım geliştirme süreçlerinde her bir elif basamağında kullanıcının girebileceği harf kombinasyonlarını tek tek tahmin edip or operatörüyle bağlamaya çalışmak (örneğin if cevap == \"E\" or cevap == \"e\":) kod tabanını karmaşıklaştırır ve okunabilirliği düşürür. Sistematik bir programcı, veriyi kontrol yapısına sunmadan hemen önce giriş aşamasında .lower() veya .upper() metotlarıyla standardize eder. Veriyi tek bir kurumsal formata indirgemek hem kodun satır sayısını azaltır hem de mantıksal açıkların oluşmasını erkenden engeller."}], "sorular": {"q1": {"type": "open", "closed": false, "text": "2. Örnek'teki (İç İçe Karar Yapıları ve İki Aşamalı Yetkilendirme) protokolde sistem_parolasi = 'Fatih1453' ve dogrulama_kodu = 5532 olarak tanımlıdır. Kullanıcı doğru parolayı girip yanlış doğrulama kodu girerse ekrana hangi mesaj yazılır? İç içe if-else yapısını açıklayarak yanıtlayınız."}, "q2": {"type": "mc", "closed": true, "text": ".lower() metodu uygulandığı metinsel ifadeye ne yapar?", "opts": ["Büyük harfe çevirir", "Küçük harfe çevirir", "Sayıya çevirir", "Siler", "Uzunluğunu verir"], "correct": "Küçük harfe çevirir"}, "q3": {"type": "tf", "closed": true, "text": "3. Örnek'teki (Harf Duyarlılığı Çözümü) senaryoda girdi = 'EvEt' iken if girdi == 'evet': koşulu doğrudan True sonucu üretir.", "correct": "Yanlış"}, "q4": {"type": "open", "closed": false, "text": "2. Uygulama'daki (Akıllı Güvenlik Kapısı ve Veri Standardizasyonu) sistemde kullanıcının girdiği rol bilgisi (örneğin PeRsOnEl) küçük harfe dönüştürülmeden karşılaştırılırsa ne gibi bir mantık hatası oluşur? .lower() metodunu neden kullanmamız gerektiğini açıklayınız."}, "q5": {"type": "open", "closed": false, "text": "Bilgi Kutusu'na göre her elif basamağında or ile 'E' veya 'e' gibi harf kombinasyonlarını tek tek denemek yerine, veriyi kontrol yapısına sunmadan önce .lower() ile standartlaştırmanın kod okunabilirliğine katkısı nedir?"}, "q6": {"type": "fill", "closed": true, "text": "Bir adayın sürücü belgesi alabilmesi için önce yaş şartı, ardından yazılı sınav, en içeride ise direksiyon sınavı şartının kontrol edilmesi örneğinde kullanılan koşul yapısına ______ koşul yapısı denir.", "accepted": ["iç içe", "nested", "iç içe (nested)"]}}}, {"no": 13, "baslik": "13. Hafta — for Döngüsü, range(), while ve Bileşik Atama Operatörleri", "baslangicTarihi": "2026-12-14", "konular": [{"id": "p1", "title": "Döngü Yapılarına Giriş ve for Döngüsü", "body": "Bilgisayarlar, tanımlanan işlemleri yüksek hızda ve tekrar tekrar gerçekleştirebilir. Ancak sonuçların doğruluğu algoritmanın, kodun ve verilerin doğruluğuna bağlıdır. Gerçek dünya senaryolarında belirli bir işlem kümesinin, bir kurala bağlı olarak ardı ardına yeniden çalıştırılması gerekir. Kod bloklarının belirli şartlar çerçevesinde dinamik olarak tekrarlanmasını sağlayan bu kontrol yapılarına döngü mekanizmaları (iterative structures) adı verilir. Python dil mimarisinde tekrarlı süreçleri optimize etmek amacıyla iki temel döngü yapısı kullanılır.\n\nGünlük hayatta bir kargo dağıtım merkezinde paketlerin araca yüklenme süreci, bu iki farklı döngü mimarisine verilebilecek somut örneklerden biridir. Bir görevliye önceden belirlenmiş 50 adet koli listesi verilirse görevli, tam 50 kez taşıma işlemi yapar ve süreci tamamlar. Bilgisayar bilimlerinde de tıpkı bu örnekteki gibi tekrar sayısının veya işlenecek veri miktarının başlangıçta açıkça bilindiği durumlarda for döngüsü tercih edilir. Diğer taraftan görevliye belirli bir liste verilmediğinde taşıma işlemi, kargo aracının kasası tamamen dolana kadar devam eder. Bu senaryoda yükleme işleminin tam olarak kaç tur süreceği baştan bilinmese de sürecin devamlılığı kasada boş yer bulunması şartına bağlanmıştır. Tekrar sayısının belirsiz olduğu ve sürecin tamamen anlık bir mantıksal koşula bağlı olarak sürdürüldüğü durumlarda ise while döngüsü kullanılır. Bu ayrımın kavranması, algoritmaların problem çözme sürecinde doğru aracın seçilmesi ve sistemin sonsuz döngüye girmeden kararlı bir şekilde kurgulanması açısından önemlidir.\n\nBir kod bloğunun tam olarak kaç kez çalıştırılacağının başlangıçta net olarak öngörüldüğü senaryolarda for döngüsü tercih edilir. for döngüsü; metinsel ifadeler, listeler (list), belirli sayı aralıkları gibi sıralı bir veri yapısının (iterable) her bir elemanını sırayla döngü değişkenine atarak döngü bloğunu otomatik olarak tetikler.\n\n# for Döngüsü Söz Dizimi Şablonu\nfor dongu_degiskeni in sirali_veri_yigini:\n    # Her bir eleman için çalıştırılacak blok (4 boşluk girinti)\n    gorev_satiri_1\n\n4. Örnek: for Döngüsüyle Metinsel İfadeleri Büyük Harfe Dönüştürme\n\nKod-Asistan projesinin metin analizi modülünde analiz edilecek kelimenin dışarıdan kullanıcı tarafından belirlenmesi istenmektedir. Ayrıca sisteme girilen kelimedeki harflerin büyüklük / küçüklük durumlarına bakılmaksızın terminal ekranındaki raporlamanın tamamen büyük harflerle (standartlaştırılarak) ve görsel olarak daha zengin bir biçimde kullanıcıya sunulması hedeflenmektedir.\n\n# Kullanıcıdan dinamik ve kararlı veri girişinin alınması\nkullanici_metni = input(\"Lütfen analiz edilecek metni giriniz: \")\nprint(\"\\n=== GELİŞMİŞ KARAKTER ANALİZ RAPORU ===\")\n# for döngüsü ile girilen metnin her bir karakterinin taranması\nfor harf in kullanici_metni:\n    # .upper() metodu ile taranan karakterin büyük harfe dönüştürülmesi\n    buyuk_harf = harf.upper()\n    # F-String teknolojisi ile daha zengin ve formatlı bir çıktı üretilmesi\n    print(f\"Tespit Edilen Karakter -> [ {buyuk_harf} ]\")\nprint(\"========================================\")\n\nTerminal Çıktısı\n\nLütfen analiz edilecek metni giriniz: Fatih\n=== GELİŞMİŞ KARAKTER ANALİZ RAPORU ===\nTespit Edilen Karakter -> [ F ]\nTespit Edilen Karakter -> [ A ]\nTespit Edilen Karakter -> [ T ]\nTespit Edilen Karakter -> [ I ]\nTespit Edilen Karakter -> [ H ]\n========================================\n\nKod Analizi:\n• input() fonksiyonu ile dışarıdan alınan veri belleğe aktarılmış, ardından for döngüsü metnin uzunluğu (5 karakter) kadar bir diğer ifadeyle tam 5 tur (iteration) dönmüştür.\n• Döngünün her bir turunda alınan karakter, .upper() metodu süzgecinden geçirilerek küçük olan harfler büyük harflere dönüştürülmüştür."}, {"id": "p2", "title": "range() Fonksiyonu", "body": "for döngülerinde ardışık sayısal aralıklar oluşturmak ve döngünün tam olarak istenen miktarda dönmesini sağlamak amacıyla yerleşik range() (aralık) fonksiyonundan yararlanılır. range() fonksiyonu, başlangıç, bitiş ve adım bilgilerine göre bir sayı aralığını temsil eden yinelenebilir bir range nesnesi oluşturur. Üç farklı parametre kombinasyonuyla yapılandırılabilir.\n\nTek Parametreli Kullanım: range(bitis) — Sayaç varsayılan olarak 0'dan başlar ve girilen bitiş değerine kadar birer birer artarak ilerler. En kritik kural, bitiş değerinin aralığa dâhil edilmemesidir. range(3) → 0, 1 ve 2 değerlerini üretir (Döngü 3 kez döner.).\n\nÇift Parametreli Kullanım: range(baslangic, bitis) — Sayacın sıfırdan değil belirlenen özel bir sayıdan başlaması istendiğinde kullanılır. Başlangıç değerinden başlar ve bitiş değerine (bitiş hariç) kadar birer birer artar. range(5, 8) → 5, 6 ve 7 değerlerini üretir (Döngü 3 kez döner.).\n\nÜç Parametreli Kullanım: range(baslangic, bitis, artis_miktari) — Sayacın kaçar kaçar artacağını veya azalacağını belirleyen üçüncü bir parametre (adım) eklenir. Eğer artış miktarı negatif seçilirse döngü geriye doğru sayma işlemi gerçekleştirir. range(2, 9, 2) → 2, 4, 6 ve 8 değerlerini üretir (Döngü 4 kez döner.); range(8, 2, -2) → 8, 6 ve 4 değerlerini üretir (Döngü 3 kez döner.)."}, {"id": "p3", "title": "Koşula Bağlı Tekrar: while Döngüsü", "body": "Döngünün kaç kez çalışacağı başlangıçta bilinmiyorsa tekrar süreci tamamen bir mantıksal koşulun doğruluğuna (True) bağlıysa while döngüsü kullanılır. while kelimesi Türkçe literatürde \"-ken, ... olduğu sürece\" anlamına gelir. Koşul ifadesi True değerini ürettiği sürece döngü bloğu aralıksız olarak çalışmaya devam eder. Koşul False değerine döndüğü anda döngü sona erer ve program döngüden sonraki satırdan devam eder.\n\n# Kurumsal while Döngüsü Söz Dizimi Şablonu\nwhile mantiksal_kosul:\n    # Koşul True olduğu sürece çalışacak blok (4 boşluk girinti)\n    gorev_satiri\n    # Koşulu etkileyen güncelleme adımı\n\n5. Örnek: Sayaç Yönetimli while Uygulaması\n\nKod-Asistan yazılımının sistem loglarını veya belirli bir raporu ekrana ardışık olarak (örneğin 3 kez) basması istenmektedir. Bu işlem, döngünün kaç kez çalışacağının önceden range() gibi bir aralık olarak verilmesiyle değil anlık şekilde güncellenen bir sayacın mantıksal koşula (sayac <= 3) bağlanmasıyla dinamik olarak kontrol edilecektir.\n\n# Belirli bir sınıra kadar sayım yapılması\nsayac = 1\nwhile sayac <= 3:\n    print(f\"Mevcut Sayaç Değeri: {sayac}\")\n    sayac += 1 # Sayaç değeri 1 artırılır (güncelleme adımı).\n\nTerminal Çıktısı\n\nMevcut Sayaç Değeri: 1\nMevcut Sayaç Değeri: 2\nMevcut Sayaç Değeri: 3\n\nKod Analizi:\n• Python yorumlayıcısı ilk olarak sayac = 1 değerini alır ve 1 <= 3 (True) olduğu için döngüye girerek ilk çıktıyı basar.\n• Ardından sayac, sayac += 1 komutuyla 2'ye ve sonraki turda 3'e yükseltilir.\n• sayac 4 değerine ulaştığı anda 4 <= 3 koşulu False ürettiği için döngü kararlı bir şekilde sonlandırılmış ve program ana akışa dönmüştür.\n\nwhile döngülerinin kurgulanmasında en sık karşılaşılan mantıksal hata, döngü koşulunun hiçbir zaman False konumuna gelememesidir. 5. örnekte sayac += 1 güncelleme satırı unutulsaydı sayaç değeri her zaman 1 kalacak, 1 <= 3 koşulu sonsuza kadar True üretecek ve kullanıcı tarafından manuel olarak sonlandırılana kadar program sürekli çalışacaktı. Bu duruma sonsuz döngü (infinite loop) adı verilir."}, {"id": "p4", "title": "Bileşik Atama Operatörleri", "body": "Programlama süreçlerinde özellikle döngü mekanizmalarında bir değişkenin mevcut değerinin üzerine yeni bir sayı eklemek, çıkarmak veya bu değeri katlamak çok sık yapılan bir eylemdir. Değişkenin kendi değerini güncellediği bu durumlarda sayac = sayac + 1 şeklinde uzun bir söz dizimi yazmak yerine Python mimarisinde kod okunabilirliğini artıran bileşik atama operatörleri (+=, -=, *= ve /=) kullanılır (örneğin sayac += 1, hak -= 1 vb.).\n\nBu operatörler, sağ tarafta belirtilen değeri değişkenin mevcut değeriyle aritmetiksel olarak işleyip sonucu tekrar aynı değişkene atayan kısaltılmış bir yazım biçimidir. Örneğin toplam += fiyat ifadesi toplam = toplam + fiyat ifadesiyle tamamen aynı işlevi görür ancak daha az karakterle ve daha yüksek okunabilirlikle yazılır. Benzer şekilde sayac -= 1 sayacın değerini bir azaltır, carpan *= 2 mevcut değeri iki katına çıkarır, bakiye /= 2 ise mevcut değeri ikiye böler. Bileşik atama operatörleri, döngü içinde bir sayaç veya toplayıcı değişkenin güncellenmesi gereken hemen her senaryoda tercih edilen endüstriyel standarttır."}, {"id": "p5", "title": "Döngü Kontrol İfadeleri: break ve continue", "body": "Döngülerin normal çalışma akışını anlık olarak yönlendirmek, belirli istisnai durumlarda döngüyü erken sonlandırmak veya bir turu atlamak için iki özel anahtar kelime kullanılır.\n\n• break (döngüyü kır): Döngü bloğu içerisinde break ifadesiyle karşılaşıldığı an, döngü koşulunun ne olduğuna bakılmaksızın döngü tamamen sonlandırılır ve döngüden sonraki ilk satıra geçilir.\n\n• continue (turu atla): for döngü bloğu içerisinde continue ifadesiyle karşılaşıldığı zaman o turun geri kalan kod satırları çalıştırılmaz, döngü doğrudan bir sonraki turun başına (koşul kontrol adımına) atlar. while döngüsünde ise koşul yeniden değerlendirilir.\n\n6. Örnek: Döngü Kontrol İfadelerinin Mantığı\n\nKod-Asistan yazılımının veri işleme modülünde belirli bir aralıktaki sayıların sırayla işlenip ekrana yazdırılması planlanmıştır. Sistemin belirli bir değere (3 sayısı) denk geldiğinde o adımı atlayıp yoluna devam etmesi, başka bir kritik bir değere (5 sayısına) ulaştığında ise mevcut döngüyü sonlandırması test edilecektir.\n\n# break ve continue Mantığının Gösterimi\nfor sayi in range(1, 10):\n    if sayi == 3:\n        continue # 3 sayısı görüldüğünde ekrana yazdırma turu atlanır.\n    if sayi == 5:\n        break    # 5 sayısı görüldüğünde döngü tamamen sonlandırılır.\n    print(f\"İşlenen Sayı: {sayi}\")\n\nTerminal Çıktısı\n\nİşlenen Sayı: 1\nİşlenen Sayı: 2\nİşlenen Sayı: 4\n\nKod Analizi:\n• 1 ve 2 sayıları koşullarda False ürettiği için terminale yazılır.\n• Python yorumlayıcısı 3 sayısına geldiğinde if sayi == 3: koşulu True olur ve continue komutu tetiklenir. Yorumlayıcı, o turun geri kalan kod satırlarını (print işlemini) görmezden gelerek o turu atlar ve doğrudan bir sonraki turun başına (4 sayısına) döner.\n• 4 sayısı koşullarda False ürettiği için terminale yazılır.\n• Python yorumlayıcısı 5 sayısına ulaştığında if sayi == 5: koşulu True olur ve break komutu çalışır. Bu komut, döngü koşulunun ne olduğuna bakılmaksızın (aralık bitmemiş olsa bile) döngüyü acil durdurma butonu gibi tamamen sonlandırır ve programı döngüden çıkarır."}], "sorular": {"q1": {"type": "mc", "closed": true, "text": "range(2, 9, 2) ifadesi bir for döngüsünü kaç kez döndürür?", "opts": ["2", "3", "4", "5", "9"], "correct": "4"}, "q2": {"type": "open", "closed": false, "text": "4. Örnek'teki (for Döngüsüyle Metinsel İfadeleri Büyük Harfe Dönüştürme) kod, kullanıcı 'Fatih' kelimesini girdiğinde for harf in kullanici_metni: döngüsü kaç kez döner ve her turda ne işlem yapar?"}, "q3": {"type": "open", "closed": false, "text": "5. Örnek'teki (Sayaç Yönetimli while Uygulaması) kodda sayac += 1 satırı unutulsaydı ne olurdu? Bu duruma ne ad verilir?"}, "q4": {"type": "mc", "closed": true, "text": "6. Örnek'teki (Döngü Kontrol İfadelerinin Mantığı) for sayi in range(1, 10): bloğunda sayi==3 için continue, sayi==5 için break kullanılırsa terminale hangi sayılar sırasıyla yazılır?", "opts": ["1-2-4", "1-2-3-4", "1-2-4-5", "1-2-3-4-5", "1-2"], "correct": "1-2-4"}, "q5": {"type": "tf", "closed": true, "text": "break ifadesi karşılaşıldığı anda sadece o turu atlar, döngüyü sonlandırmaz.", "correct": "Yanlış"}, "q6": {"type": "fill", "closed": true, "text": "Bir değişkenin kendi üzerine değer eklemesini kısaltan sayac += 1 gibi operatörlere ______ denir.", "accepted": ["bileşik atama operatörü", "bilesik atama operatoru"]}, "q7": {"type": "open", "closed": false, "text": "range(8, 2, -2) ifadesi hangi sayıları, kaç kez üretir?"}}}, {"no": 14, "baslik": "14. Hafta — Döngü Verimliliği, for/while Karşılaştırması ve Listelere Giriş", "baslangicTarihi": "2026-12-21", "konular": [{"id": "p1", "title": "Sonsuz Döngülerden Kaçınma ve Algoritmik Disiplin", "body": "Tasarlanan bir yazılımın donanım kaynaklarını tüketerek kilitlenmesi, kullanıcı deneyimini doğrudan bozan en kritik kararsızlıklardan biridir. Bir programcı while döngüsü kurgularken, koşulun bir aşamada False olabilmesi veya ulaşılabilir bir break ifadesinin bulunması sağlamalıdır. Kod yazımına başlamadan önce döngü kırılma noktasını kâğıt üzerinde planlamak, kararlı yazılımlar üretmenin sistematik bir kuralıdır.\n\n3. Uygulama: Kullanıcı Etkileşimi ve Döngüsel Menü Tasarımı\n\nwhile döngüsü ve if-elif-else yapısını kullanarak kullanıcı etkileşimli bir menü tasarlanmış, break ifadesiyle çıkış kontrolü sağlanmış ve hatalı girişler yönetilmiştir. Programın çalışma kuralları şöyledir: Program başladığında kullanıcıya sürekli dönecek bir menü sunulacaktır (while True:); kullanıcı 1 tuşuna basarsa sepet ve indirim hesaplama modülü, 2 tuşuna basarsa sistem durum raporu tetiklenecek ve işlem bitince menüye geri dönülecektir; kullanıcı 3 tuşuna basarsa döngü break ifadesiyle kararlı şekilde sonlandırılıp program kapanacaktır; kullanıcı bu rakamlar dışında hatalı bir veri girerse sistem çökmek yerine kullanıcıyı uyaracak ve menüyü yeniden ekrana getirecektir.\n\n# AKTİF DÖNGÜ MOTORU\n# Koşul True olduğu sürece program açıkça çıkış istenene kadar kapanmaz.\nwhile True:\n    print(\"\\n--- ANA MENÜ ---\")\n    print(\"1 - Sepet ve İndirim Hesaplama Katmanı\")\n    print(\"2 - Sistem Durum Raporunu Görüntüle\")\n    print(\"3 - Güvenli Çıkış\")\n    secim = input(\"Lütfen yapmak istediğiniz işlemin numarasını giriniz (1/2/3): \").strip()\n    if secim == \"1\":\n        print(\"[MODÜL TETİKLENDİ: Sepet Hesaplama]\")\n    elif secim == \"2\":\n        print(\"[MODÜL TETİKLENDİ: Örnek Sistem Durumu Raporu]\")\n    elif secim == \"3\":\n        print(\"\\nGüvenli çıkış protokolü devreye girdi.\")\n        # KONTROL İFADESİ: Döngü burada tamamen kırılır ve program sonlanır.\n        break\n    else:\n        # Kararsız veri girişlerinin yönetilmesi (Hata Engelleyici Katman)\n        print(\"\\nHatalı Seçim! Girdiğiniz değer menü standartlarına uymuyor.\")\n        print(\"Lütfen yalnızca 1, 2 veya 3 değerlerinden birini giriniz.\")\nprint(\"\\n=== PROGRAM BAŞARIYLA KAPATILDI ===\")\n\nKod İyileştirme Notu: Hatalı seçimlerin if-elif-else merdiveninin en altındaki else bloğuyla denetlenmesi yerine, en başta filtreleyerek continue ile döngünün başına yönlendirmek de okunabilirliği artıran ve iç içe geçmiş (nested) yapıları engelleyen bir başka yöntemdir:\n\nif secim != \"1\" and secim != \"2\" and secim != \"3\":\n    print(\"\\nHatalı Seçim! Girdiğiniz değer menü standartlarına uymuyor.\")\n    continue"}, {"id": "p2", "title": "Döngülerin Yazılım Verimliliğindeki Rolü", "body": "Yazılım mühendisliğinde algoritmik verimlilik, bir çözümün özellikle yürütme süresi ve bellek kullanımı bakımından kaynak maliyetinin değerlendirilmesidir. Kodun okunabilirliği ve bakım kolaylığı ise ayrıca dikkate alınır. Döngü yapıları, yazılım dünyasında tekrarlı işlemleri yeniden kullanılabilir ve yönetilebilir biçimde ifade etmemizi sağlayan temel kontrol mekanizmalarıdır. Eğer döngüler olmasa binlerce veriyi işlemek veya tekrarlı görevleri yürütmek için aynı kod satırlarını binlerce kez kopyalamak gerekir. Bu durum şu kritik verimsizliklere yol açar:\n\nKod Şişmesi (Code Bloat): Kaynak kod dosyasının boyutunun gereksiz yere büyümesi ve okunabilirliğinin yok olmasıdır.\n\nBakım Zorluğu: Kodun tek bir yerinde yapılacak bir değişikliğin, kopyalanan tüm satırlarda tek tek yapılmak zorunda kalınmasıdır (Mantıksal hata riskini artırır.).\n\nKod Tekrarı ve Yürütme Maliyeti: Python yorumlayıcısının doğrusal satırları okurken harcadığı zamanın ve enerjinin artmasıdır.\n\nDöngüler, bin satırlık bir işi sadece üç dört satıra indirgeyerek hem yazılımcının zamanını korur hem de bilgisayar donanımının algoritmaya ve uygulamaya bağlı olarak daha verimli çalışmasına katkı sağlar. Günlük hayatta bir okulun mezuniyet töreni için bin öğrenciye davetiye hazırlanması süreci, verimlilik ilkesine verilebilecek somut örneklerden biridir. Davetiyelerin her birinin tek tek elle yazılması, gereksiz bir zaman ve kâğıt kaybına (kod şişmesi) yol açar, yazan kişinin enerjisini tüketir (zaman ve iş gücü kaybı) ve tören saatinde bir değişiklik yapıldığında tüm davetiyelerin tek tek silinip baştan yazılmasını (bakım zorluğu) zorunlu kılar. Bunun yerine tek bir şablon tasarlanıp fotokopi makinesine \"Bu şablonu bin kez çoğalt.\" talimatının verilmesi, süreci hatasız ve verimliliğe kavuşturur. Yazılım projelerinde de döngüler bu çoğaltma makinesi gibi çalışarak binlerce satırlık tekrarlı bir işi sadece üç dört satıra indirir. Bu sayede hem yazılımcının zamanı korunur hem de bilgisayar donanımının algoritmaya bağlı olarak daha verimli çalışmasına katkı sağlanır."}, {"id": "p3", "title": "for ve while Döngülerinin Karşılaştırılması", "body": "Python dilinde her iki döngü yapısı da, tekrarlı işlemleri yürütse de çalışma biçimleri açısından birbirlerinden tamamen ayrılırlar. Aşağıdaki tablo for ve while döngülerinin karşılaştırılmasını göstermektedir.\n\nTablo 3.1: for ve while Döngülerinin Karşılaştırılması\n\nÖzellik / Kriter | for Döngüsü | while Döngüsü\nTekrar Sayısı | Bir yinelenebilir yapının elemanları üzerinde dolaşır, eleman sayısının önceden bilinmesi zorunlu değildir. | Bir koşul True olduğu sürece çalışır, tekrar sayısı belirli de belirsiz de olabilir.\nÇalışma Koşulu | Sıralı bir nesnenin (range, str vb.) elemanları bitene kadar döngüyü sürdürür. | Mantıksal koşul ifadesi True olduğu sürece döngüyü sürdürür.\nSayaç Yönetimi | Her turda yinelenebilir yapıdan aldığı sıradaki değeri döngü değişkenine atar. | Döngünün sonlanmasını sağlayacak koşul değişimi veya ulaşılabilir bir break bulunmalıdır.\nEn Sık Kullanım Alanı | Liste taramalarında, veri setlerinde ve sabit sayıda dönmesi gereken sayaçlarda kullanılır. | Aktif menü motorlarında, kullanıcı onay ekranlarında, sonsuz veri akışlarında kullanılır.\n\nÖzetle, tekrar sayısı önceden bilindiğinde (bir listenin tüm elemanlarının taranması, sabit sayıda tekrar yapılması gibi) for döngüsü tercih edilirken; tekrar sayısı bir kullanıcı kararına, sensör verisine veya bir sistemin anlık durumuna bağlı olarak belirsiz kaldığında while döngüsü tercih edilir. Doğru döngü tipinin seçilmesi, hem kodun okunabilirliğini artırır hem de sonsuz döngü riskini en aza indirir."}, {"id": "p4", "title": "Uygulama Özeti: Sayı Tahmin Oyunuyla Döngü Kontrolü", "body": "4. Uygulama'da rastgele sayı üretimi, while döngüsü, break ve continue ifadelerini kullanarak kullanıcı etkileşimli bir tahmin oyunu tasarlanmıştır. Oyunun kuralları şöyledir: Sistem, başlangıçta random (rastgele) modülünü kullanarak 1 ile 50 arasında gizli bir tam sayı üretecektir; kullanıcının gizli sayıyı tahmin etmek için toplam 5 hakkı bulunacak ve bu durum bir sayaçla takip edilecektir; kullanıcı 1-50 aralığının dışında (örneğin 65 veya -5 gibi) geçersiz bir tahmin yaparsa sistem hakkını eksiltmeyecek, kullanıcıyı uyaracak ve continue komutuyla bu adımı atlayarak yeni bir tahmin isteyecektir; kullanıcı sayıyı doğru tahmin ettiğinde oyunun daha fazla uzamaması için break komutuyla kırılacak ve oyun zaferle bitecektir; kullanıcının hakkı bittiğinde döngü kendiliğinden sona erecek ve gizli sayı ekrana basılacaktır.\n\nimport random\ngizli_sayi = random.randint(1, 50)\nkalan_hak = 5\nwhile kalan_hak > 0:\n    girdi = input(f\"Kalan Hakkınız ({kalan_hak}). Tahmininizi giriniz: \").strip()\n    tahmin = int(girdi)\n    # GEÇERSİZ ARALIK GİRİŞİNİN \"CONTINUE\" İLE ATLANMASI\n    if tahmin < 1 or tahmin > 50:\n        print(\"Uyarı: Tahmininiz 1 ile 50 arasında olmalıdır!\")\n        print(\"Sistem kararlılığını korumak için bu adım atlanıyor ve hakkınız eksilmiyor.\\n\")\n        # KONTROL İFADESİ: Aşağıdaki kodları çalıştırmadan doğrudan döngü koşuluna döner.\n        continue\n    kalan_hak -= 1\n    # ÇOK KRİTERLİ DOĞRULAMA VE DÖNGÜ YÖNETİMİ\n    if tahmin == gizli_sayi:\n        print(f\"\\nTebrikler! Gizli sayıyı buldunuz.\")\n        # KONTROL İFADESİ: Koşulun hâlâ hakkı olmasına bakılmaksızın döngüyü anında kırar.\n        break\n    elif tahmin > gizli_sayi:\n        print(\"İpucu: Daha KÜÇÜK bir sayı girmelisiniz.\\n\")\n    else:\n        print(\"İpucu: Daha BÜYÜK bir sayı girmelisiniz.\\n\")\nif kalan_hak == 0 and tahmin != gizli_sayi:\n    print(\"\\nMaalesef tahmin hakkınız bitti ve oyun sonlandı.\")\n    print(f\"Sistemin belirlediği gizli sayı: {gizli_sayi} idi. Bir sonraki sefere başarılar!\")\n\nKod Analizi: Kod, negatif veya 50'nin üzerinde bir tahmin girildiğinde continue ile kullanıcının hakkını korurken, geçerli bir tahmin girildiğinde önce hak sayacı azaltılmakta, ardından tahmin gizli sayıya eşitse break ile döngü anında kırılıp oyun bitirilmektedir; bu ayrım continue ve break arasındaki temel işlev farkını gösterir."}, {"id": "p5", "title": "Liste (list) Yapısına Giriş", "body": "Python'daki temel veri tiplerinde (str, int, float, bool) bir değer, tek bir değişken adıyla temsil edilir. Birbiriyle ilişkili birden fazla değeri topluca yönetmek için liste gibi veri yapılarından yararlanılır. Örneğin sınıftaki 5 öğrencinin adı veya bir sepet uygulamasındaki farklı ürün fiyatları kaydedilmek istendiğinde her biri için ayrı ayrı değişkenler (ogrenci_1, ogrenci_2 vb.) tanımlamak zorunda kalınır. Gerçek dünya problemlerinde ise yan yana duran, birbiriyle ilişkili yüzlerce hatta milyonlarca veriyi tek bir çatı altında düzenli bir şekilde tutma ihtiyacı doğar.\n\nPython programlama dilinde, birden fazla veriyi tek bir değişken ismi altında, belirli bir sıra dâhilinde saklayan dinamik veri yapılarına liste (list) adı verilir. Listeler, birden fazla verinin düzenli biçimde saklanmasını ve döngülerle işlenmesini kolaylaştırır ve yazılım kalitesini doğrudan artırır. Python'da bir liste oluşturulurken veriler köşeli parantez [ ] içerisine alınır ve her bir eleman birbirinden virgül (,) sembolü ile ayrılır. Listelerin en büyük esnekliği, içerilerinde aynı anda farklı veri türlerini (metin, tam sayı, ondalıklı sayı, boolean vb.) barındırabilmeleridir.\n\n# Standart Liste Tanımlama Örnekleri\nbos_liste = [ ] # İçinde eleman olmayan boş bir liste\nasistan_modulleri = [\"Menü\", \"Hesaplama\", \"Raporlama\"] # str türünde elemanlar\nsepet_verileri = [150.50, 45, True, \"Fatih\"] # Farklı türde elemanlar\n\nBir listenin içerisindeki belirli bir elemana doğrudan ulaşmak, onu güncellemek veya silmek için elemanın listedeki konum numarası kullanılır. Yazılım literatüründe bu konum numarasına indeks (index) adı verilir. Python dil mimarisinde indeksleme (indexing) kuralları şu sistematik temellere dayanır:\n\nPozitif İndeksleme: Listenin ilk elemanının indeks numarası her zaman 0 (sıfır) ile başlar ve sağa doğru birer birer artarak ilerler.\n\nNegatif İndeksleme: Listenin son elemanına hızlıca erişmek için sağdan sola doğru -1, -2 şeklinde ilerleyen negatif indeks mimarisi kullanılır.\n\n# İndeks Erişim Modülü\nogrenciler = [\"Ahmet\", \"Zeynep\", \"Can\", \"Elif\"]\n# Pozitif İndeks ile Erişim\nilk_ogrenci = ogrenciler[0]  # \"Ahmet\" verisini döndürür.\nucuncu_ogrenci = ogrenciler[2] # \"Can\" verisini döndürür.\n# Negatif İndeks ile Erişim\nson_ogrenci = ogrenciler[-1]  # \"Elif\" verisini döndürür.\n\nOlmayan bir indeks numarasına erişmeye çalışmak sistem hatalarına yol açar. Dört elemanlı bir listede 4 veya daha büyük bir pozitif indekse erişilmeye çalışılırsa IndexError oluşur. Python IndexError istisnası üretir, hata yakalanmazsa programın yürütülmesi durur. Python yorumlayıcısı bu durumu ekrana \"IndexError: list index out of range\" (liste indeksi aralık dışında) hatasıyla yansıtır. Kararlı bir yazılımcı, sınır değerleri daima bu kuralı gözeterek yönetir."}], "sorular": {"q1": {"type": "open", "closed": false, "text": "3. Uygulama'daki (Kullanıcı Etkileşimi ve Döngüsel Menü Tasarımı) while True: ile başlayan sonsuz döngü motorunda, kullanıcı '3' seçeneğini seçtiğinde döngü nasıl güvenli bir şekilde sonlandırılır?"}, "q2": {"type": "open", "closed": false, "text": "Bir okulun mezuniyet töreni için bin öğrenciye davetiye hazırlanması örneğinde, tek tek elle yazmak yerine bir şablon kullanıp fotokopi makinesiyle çoğaltmanın döngü mantığıyla benzerliğini açıklayınız (kod şişmesi ve bakım zorluğu kavramlarını kullanınız)."}, "q3": {"type": "mc", "closed": true, "text": "Tablo 3.1'e göre tekrar sayısının baştan belirsiz olduğu, sürecin tamamen anlık bir mantıksal koşula bağlı olduğu senaryolarda hangi döngü tercih edilir?", "opts": ["for", "while", "if", "elif", "range"], "correct": "while"}, "q4": {"type": "mc", "closed": true, "text": "4. Uygulama'daki (Sayı Tahmin Oyunuyla Döngü Kontrolü) senaryoda kullanıcı 1-50 aralığı dışında bir sayı (örn. 65) girdiğinde sistem ne yapar?", "opts": ["Hakkını eksiltir", "Programı çökertir", "Hakkını eksiltmeden uyarır ve devam eder", "Oyunu bitirir", "Otomatik doğru cevabı söyler"], "correct": "Hakkını eksiltmeden uyarır ve devam eder"}, "q5": {"type": "fill", "closed": true, "text": "Python'da bir listenin ilk elemanının indeks numarası her zaman ______ dır.", "accepted": ["0", "sıfır"]}, "q6": {"type": "open", "closed": false, "text": "asistan_modulleri = ['Menü', 'Hesaplama', 'Raporlama'] listesi için len(asistan_modulleri) kaç değerini döndürür ve bu fonksiyon Python'ın bellek mimarisinde neden verimlidir?"}, "q7": {"type": "tf", "closed": true, "text": "for döngüsü, kaç kez çalışacağı baştan net olarak bilinmeyen, tamamen bir mantıksal koşula bağlı senaryolarda tercih edilir.", "correct": "Yanlış"}}}, {"no": 15, "baslik": "15. Hafta — Liste-Döngü İlişkisi, Liste Metotları ve Yapay Zekâ Denetimi", "baslangicTarihi": "2026-12-28", "konular": [{"id": "p1", "title": "Dinamik Döngü-Liste İlişkisi (Iterating Through a List)", "body": "Listelerin gerçek verimliliği, for döngüsüyle sarmal bir şekilde bağlandıklarında ortaya çıkar. for döngüsü, listenin ilk elemanından başlayarak son elemanına kadar tüm değerleri sırayla döngü değişkeninin içine aktarır. Böylece tek tek indeks numarası yazmaya gerek kalmadan listenin boyutu ne olursa olsun tüm elemanlar sırayla, her turda bir eleman olacak şekilde işlenir.\n\n7. Örnek: Dinamik Döngü-Liste İlişkisi ve Veri Analizi\n\nKod-Asistan projesinin sepet hesaplama modülünde bir kullanıcının seçtiği farklı ürün fiyatları tek bir liste içerisinde tanımlanmıştır. Sistemden, bu listedeki tüm fiyatları döngü yardımıyla sırayla ekrana basması ve ardından her bir fiyatı biriktirerek toplam sepet tutarını kullanıcıya sunması istenmektedir.\n\n# Listeyi Döngü Yardımıyla Ekrana Basma\nfiyatlar = [120, 250, 480, 90]\ntoplam = 0\nprint(\"=== Sepetteki Ürünlerin Fiyat Listesi ===\")\nfor fiyat in fiyatlar:\n    print(f\"Ürün Tutarı: {fiyat:.2f} TL\")\n    toplam += fiyat # Her turda gelen fiyat toplam değişkenine eklenir.\nprint(f\"Toplam Sepet Tutarı: {toplam:.2f} TL\")\n\n=== Sepetteki Ürünlerin Fiyat Listesi ===\nÜrün Tutarı: 120.00 TL\nÜrün Tutarı: 250.00 TL\nÜrün Tutarı: 480.00 TL\nÜrün Tutarı: 90.00 TL\nToplam Sepet Tutarı: 940.00 TL\n\nKod Analizi:\n• fiyatlar listesinde 4 eleman olduğu için for döngüsü otomatik olarak 4 tur dönmüştür.\n• Python yorumlayıcısı her turda fiyat değişkenine sıradaki ürün tutarını atamış, ardından bu değeri toplam += fiyat komutuyla genel toplama (havuza) dâhil etmiştir.\n• Herhangi bir sınır değeri belirtmeye gerek kalmadan tüm liste verileri verimli bir şekilde taranmış ve işlenmiştir.\n\nBilgi Kutusu — Sıfır Tabanlı İndeksleme Tasarımı: Günlük hayatta saymaya 1'den başlarken bilgisayar mimarisinde listelerin 0'dan başladığını unutmak, mantıksal sapmaların en temel kaynağıdır. 10 elemanlı bir veri kümesinin son elemanı 10. indekste değil 9. indekstedir. Programlama yaparken bellek şemalarını zihinde canlandırmak, indeks sınırlarını sistematik olarak kontrol etmek ve veri kaymalarının önüne geçmek kararlı kod üretiminin vazgeçilmez bir parçasıdır."}, {"id": "p2", "title": "Uygulama Özeti: Dinamik Liste Yönetimi ve Sepet Güncelleme Modülü", "body": "5. Uygulama'da liste, while, for, break ve continue yapılarını kullanarak dinamik veri girişi yapılmış, geçerli veriler listeye eklenip bu veriler üzerinde aritmetiksel analizler gerçekleştirilmiştir. Kod-Asistan projesinin finansal katmanını daha esnek ve gerçekçi hâle getirmek için kullanıcıların istedikleri adette ürün fiyatını sisteme dinamik olarak ekleyebilecekleri bir sepet mimarisi tasarlanmıştır. Algoritmanın çalışma kuralları şöyledir: Başlangıçta içi tamamen boş olan bir sepet_listesi bellekte tahsis edilir; kullanıcı klavyeden sayısal bir fiyat girdiğinde bu veri listeye eklenir ve program yeni bir fiyat istemek üzere döngüyü sürdürür; kullanıcı negatif veya sıfır değerli bir fiyat girerse (fiyat <= 0) sistem kullanıcıyı uyarır, veriyi listeye eklemeden continue komutuyla doğrudan bir sonraki veri isteme adımına atlar; kullanıcı fiyat yerine büyük / küçük harf duyarsız olacak şekilde \"HESAPLA\" komutunu girdiğinde veri giriş döngüsü break ile kırılır; döngü kırıldıktan sonra listenin içinde toplanan tüm fiyatlar bir for döngüsüyle baştan sona taranarak sepetin toplam tutarı hesaplanır ve f-string standardıyla ekrana basılır.\n\nsepet_listesi = [ ]\nwhile True:\n    girdi = input(\"Ürün Fiyatı veya Komut: \").strip()\n    if girdi.upper() == \"HESAPLA\":\n        print(\"Veri girişi sonlandırıldı. Hesaplama katmanına geçiliyor...\")\n        break\n    else:\n        urun_fiyati = float(girdi)\n        if urun_fiyati <= 0:\n            print(\"Hata: Ürün fiyatı sıfır veya negatif olamaz!\")\n            print(\"Bu kararsız veri listeye eklenmeden atlanıyor...\\n\")\n            continue\n        sepet_listesi.append(urun_fiyati)\n        print(f\"{urun_fiyati:.2f} TL sepete eklendi. (Güncel Ürün Adedi: {len(sepet_listesi)})\\n\")\nprint(\"\\n=== FATURA DETAY RAPORU ===\")\ntoplam_tutar = 0\nurun_sayaci = 1\nfor fiyat in sepet_listesi:\n    print(f\"{urun_sayaci}. Ürün Bedeli: {fiyat:.2f} TL\")\n    toplam_tutar += fiyat\n    urun_sayaci += 1\nprint(f\"Sepetteki Toplam Ürün: {len(sepet_listesi)} Adet\")\nprint(f\"Net Ödenecek Tutar: {toplam_tutar:.2f} TL\")\n\nUygulama, ürünlerin sıra numaralarının len() ile listenin gerçek indekslerinden bağımsız ayrı bir sayaçla (urun_sayaci, 1'den başlayarak) yönetilmesinin kullanıcı deneyimi açısından neden daha okunabilir olduğunun sorgulanmasıyla tamamlanır."}, {"id": "p3", "title": "Liste Metotları ve Bellek Davranışları: len(), .append(), .insert(), .remove()", "body": "Python programlama dilinde listeler, dinamik genişleme ve daralma yeteneğine sahip esnek veri yapılarıdır. Python listeleri, eleman eklenip çıkarılabilen değiştirilebilir veri yapılarıdır. Programın akışı esnasında bu veri kümesine liste elemanlarını eklemek, silmek veya listenin uzunluğunu belirlemek için yerleşik fonksiyon ve liste metotlarından yararlanılır. Bu metotların doğru kullanımı, yazılımın kararlılığını ve donanım kaynaklarının verimli tüketilmesini doğrudan etkiler.\n\nBir veri kümesi üzerinde işlem yapmadan önce o kümenin içinde anlık olarak kaç adet eleman bulunduğunun belirlenmesi gerekir. Python'da bir listenin toplam eleman sayısını (boyutunu) döndüren yerleşik fonksiyon, len() (length kısaltması) fonksiyonudur.\n\nmoduller = [\"Menü\", \"Hesaplama\"]\neleman_sayisi = len(moduller)\nprint(eleman_sayisi) # Ekrana 2 çıktısını basar.\n\nBu kod çalıştırıldığında Python'un bellek davranışı oldukça verimlidir. len() fonksiyonu listenin içindeki elemanları tek tek sayarak sisteme ekstra işlem yükü bindirmez. Python bellek mimarisinde listenin boyutu arka planda bir sayaç olarak sürekli güncel tutulur. len() çağrıldığında doğrudan bu hazır sayaç verisi okunur. Bu durum, algoritmanın çalışma hızını (zaman karmaşıklığını) optimize eden verimli bir reflekstir.\n\nListenin mevcut yapısını bozmadan, var olan elemanların en sonuna (kuyruğuna) yeni bir veri dâhil etmek amacıyla .append() (ekleme) metodu kullanılır.\n\nsepet = [150.0, 45.5]\nsepet.append(90.0)\nprint(sepet) # [150.0, 45.5, 90.0] çıktısını üretir.\n\n.append() elemanı listenin sonuna ekler. Bu işlem genellikle verimli çalışır ancak listenin kapasitesi yetersiz olduğunda iç yapının yeniden düzenlenmesi gerekebilir.\n\nBir verinin listenin sonuna değil de yazılımcının belirleyeceği özel bir indeks konumuna (araya) yerleştirilmesi istendiğinde .insert() (yerleştirme) metodu devreye girer. Bu metot, .insert(hedef_indeks, eklenecek_veri) şeklinde iki parametreyle çalışır.\n\nisler = [\"Raporlama\", \"Çıkış\"]\n# 1. indekse \"Hesaplama\" verisini araya ekle\nisler.insert(1, \"Hesaplama\")\nprint(isler) # ['Raporlama', 'Hesaplama', 'Çıkış'] çıktısını verir.\n\nBu kod çalıştırıldığında gerçekleşen bellek davranışı, .insert() metodunun .append() metoduna göre çok daha yüksek bir donanım maliyetine sahip olduğunu gösterir. Araya bir eleman eklendiğinde hedef konumdan sonraki elemanların indeksleri bir sağa kayar. Python yorumlayıcısı, araya yer açabilmek için sağdaki tüm verileri birer indeks sağa kaydırmak (shifting) zorunda kalır. Büyük veri kümelerinde bu metodun sıkça kullanılması yazılımın çalışma performansını düşürebilir.\n\nBir listenin içerisinden indeks numarasına bakmadan sadece taşımış olduğu değere göre eşleşen ilk değeri listeden kaldırmak amacıyla .remove() (silme) metodu kullanılır.\n\nprogramlar = [\"Python\", \"C++\", \"Go\"]\nprogramlar.remove(\"C++\")\nprint(programlar) # [\"Python\", \"Go\"] çıktısını üretir.\n\n.remove() metodu çağrıldığında Python yorumlayıcısı listeyi sıfırıncı indeksten başlayarak sağa doğru tarar (linear search). Belirtilen değere sahip ilk elemanı bulduğu an bellek hücresini boşaltır. Boşalan hücrenin yaratacağı mantıksal kopukluğu engellemek adına silinen elemanın sağ tarafında kalan tüm veriler, birer indeks sola kaydırılarak bellek bloğu yeniden sıkıştırılır. Değer listede bulunmazsa ValueError oluşur.\n\nBilgi Kutusu — Dinamik Bellek Yönetimi ve Performans Bilinci: Programlama yaparken sadece kodun çalışması yeterli değildir. Kodun bilgisayar donanımına bindirdiği yükün de sistematik olarak hesaplanması gerekir. Listenin sonuna eleman ekleme işlemi genellikle verimlidir, listenin başına .insert(0, ...) ile ekleme yapmak ise mevcut elemanların indekslerinin kaydırılmasını gerektirir. Geliştirdiğiniz algoritmalarda doğru metodu doğru ihtiyaç için seçmek, sistem kaynaklarını koruyan vizyoner ve sistematik bir yazılımcı eğilimidir."}, {"id": "p4", "title": "Döngü ve Liste İşlemlerinde Yapay Zekâ Denetimi", "body": "Büyük dil modellerine (LLM) dayalı yapay zekâ asistanları; karmaşık döngüleri, koşul bloklarını ve liste metotlarını saniyeler içinde yazarak yazılımcılara büyük bir hız kazandırabilir. Bu asistanların çalışma mantığı, kodun doğruluğunu analitik olarak anlamaya değil geçmiş verilerden öğrendikleri kalıplara göre en olası bir sonraki kelimeyi / karakteri tahmin etmeye dayanır. Yapay zekâ modellerinin koşul, döngü ve liste kurgularında en sık yaptığı üç kronik hata türü şunlardır:\n\nBirinci kronik hata, gizli girinti hatalarıdır. Python dil mimarisinde kod bloklarının sınırları, süslü parantezlerle değil sadece boşluk düzeyleriyle (girintilerle) belirlenir. Yapay zekâ modelleri, özellikle iç içe koşul yapısı veya döngü içeren uzun kod bloklarını üretirken girinti hizalamasını kaybedebilir. Bu noktada yapay zekânın en sık düştüğü hata; gözle bakıldığında aynı hizada duran bazı satırlarda 4 adet boşluk karakteri, bazı satırlarda ise 1 adet Tab karakteri kullanmasıdır. Bu durum program çalıştırıldığında IndentationError veya TabError fırlatılmasına yol açar. Bu gizli kusura karşı uygulanacak en güvenli insan denetimi çözümü; yapay zekâdan alınan kodları doğrudan kopyalamak yerine editörün Render Whitespace (Görünmez Boşlukları Göster) özelliğini açarak noktaları ve okları sistematik olarak kontrol etmektir.\n\nİkinci kronik hata, sonsuz döngü tuzağıdır. Yapay zekâ modelleri, koşula bağlı olarak dönen while döngülerini kurarken döngüyü sonlandıracak mantıksal anahtarı (break ifadesini veya sayaç güncellemesini) döngü bloğunun içine yerleştirmeyi unutabilir veya yanlış koşul basamağına yazabilir. Bu hata gözden kaçtığında ve kod çalıştırıldığında sayaç değeri döngü içinde hep 1 kalacağı için uygulamanın yanıt vermemesine veya gereksiz işlemci kullanmasına yol açabilir. Analitik bir programcının bu tuzağa karşı uygulayacağı insan denetimi çözümü; döngü koşulunu etkileyen değişkenin, döngünün içinde doğru girinti seviyesinde güncellendiğini manuel olarak doğrulamaktır.\n\nÜçüncü kronik hata ise indeks sınır taşması ve metot sapmalarıdır. Yapay zekâ araçları, listeler üzerinde for döngüsü kurarken veya listeden .remove() metoduyla eleman silerken sınır değerlerini sıklıkla karıştırır. Yapay zekânın buradaki en yaygın hatası, Python listelerinin 0 (sıfır) tabanlı indeksleme mimarisine sahip olduğunu unutarak listelerin boyutuyla indeks numaralarını eşitlemesidir. Örneğin 5 elemanlı bir listenin son elemanına ulaşmak için liste[5] kodunu üretebilir. Bu durum doğrudan IndexError: list index out of range hatasına yol açar. Bilişim uzmanlarının bu sapmalara karşı alacağı insan denetimi çözümü ise listenin sınırlarını ve metot çağırma işlemlerini yürütmeden önce len() fonksiyonu ile listenin anlık boyutunu denetlemek ve program akışına sınır değer kontrolü (if eleman in liste:) yerleştirmektir.\n\nBilişim dünyasında yapay zekâ modelleri; çok hızlı yazabilen, her şeye anında onay veren ama son derece aceleci, dikkatsiz bir stajyer gibi konumlandırılabilir. Hazır bir kod satırının bilgisayarlarda çalıştırılmadan önce girdilerinin, döngü kırılma noktalarının ve indeks sınırlarının zihinsel süzgeçten geçirilmesi mesleki bir sorumluluktur. Yapay zekânın ürettiği bir koddaki mantık hatasının çalıştırılmadan önce tahmin edilebilmesi, yazılımcılara \"Yapay Zekâ Denetçisi\" unvanını kazandırır."}, {"id": "p5", "title": "Uygulama Özeti: Hata Avcılığı ve Yapay Zekâ Kod Denetimi", "body": "6. Uygulama'da yapay zekâ tarafından üretilmiş hatalı kodlar, çalıştırmadan önce analiz edilerek girinti, döngü ve indeks hatalarının belirlenmesi ve düzeltilmesi hedeflenmiştir. Bir yapay zekâ asistanına \"Kullanıcının sepetindeki fiyatları listeye ekleyen, ÇIKIŞ yazana kadar dönen ve sonunda sepeti listeleyen bir menü yaz.\" komutu verilmiş, yapay zekânın ürettiği kodlar çalıştırılmadan önce insan denetiminden geçirilmesi istenmiştir. Yapay zekâ, bu kodu üretirken (olasılıksal doğası gereği) kodun içine 3 adet kronik hata yapmıştır:\n\n# YAPAY ZEKÂ TARAFINDAN ÜRETİLEN KARARSIZ KOD TASLAĞI\nsepet_listesi = [100.0, 250.0, 75.0]\nprint(\"--- Yapay Zekâ Sepet Yönetim Sistemi ---\")\nwhile True:\n    girdi = input(\"Ürün fiyatı giriniz veya çıkmak için 'ÇIKIŞ' yazınız: \")\n    if girdi.upper() == \"ÇIKIŞ\":\n        print(\"Hesaplama yapılıyor...\")\n        break\n    else:\n    fiyat = float(girdi)\n    sepet_listesi.append(fiyat)\n    print(f\"Ürün eklendi. Sepetteki Ürün Sayısı: {len(sepet_listesi)}\")\nsayac = 0\nwhile sayac < 3:\n    print(f\"Doğrulanıyor... İşlem Sırası: {sayac}\")\nsayac += 1\nson_indeks = len(sepet_listesi)\nprint(f\"En son eklenen ürünün fiyatı: {sepet_listesi[son_indeks]} TL\")\n\nÖğrencilerden, kodu bilgisayarda çalıştırmadan önce satır satır incelemeleri ve tespit ettikleri hataların yerini, türünü ve programın kararlılığını nasıl etkileyeceğini bir Hata Tespit Masası tablosuna kaydetmeleri istenmiştir. Kod incelendiğinde şu üç kronik hata tespit edilir: else: satırının altındaki fiyat = float(girdi) ve sepet_listesi.append(fiyat) satırları girintisiz bırakıldığı için IndentationError oluşur; ikinci while sayac < 3: döngüsünde sayac += 1 satırı girintisiz (döngü dışında) yazıldığı için sayac değeri hep 0 kalır ve döngü sonsuza kadar \"Doğrulanıyor... İşlem Sırası: 0\" satırını basar; son satırda son_indeks = len(sepet_listesi) ifadesi listenin boyutunu (3) doğrudan indeks olarak kullandığı için sepet_listesi[son_indeks] ifadesi IndexError: list index out of range hatasına yol açar, doğru kullanımın sepet_listesi[son_indeks - 1] veya sepet_listesi[-1] olması gerekir. Uygulama, tespit edilen bu hataların düzeltilerek programın hatasız, kararlı ve PEP 8 stil önerilerine uygun temiz bir sürümünün yeniden yapılandırılmasıyla tamamlanır."}], "sorular": {"q1": {"type": "mc", "closed": true, "text": "4 elemanlı bir listenin son elemanına negatif indeksleme ile erişmek için hangi indeks kullanılır?", "opts": ["0", "3", "4", "-1", "-4"], "correct": "-1"}, "q2": {"type": "open", "closed": false, "text": "7. Örnek'teki (Dinamik Döngü-Liste İlişkisi ve Veri Analizi) fiyatlar = [120, 250, 480, 90] listesi bir for döngüsüyle toplanırsa toplam sepet tutarı kaç TL olur?"}, "q3": {"type": "tf", "closed": true, "text": ".insert() metodu, .append() metoduna göre bilgisayara daha az bellek maliyeti getirir.", "correct": "Yanlış"}, "q4": {"type": "open", "closed": false, "text": "5. Uygulama'daki (Dinamik Liste Yönetimi ve Sepet Güncelleme Modülü) senaryoda kullanıcı sıfır veya negatif bir fiyat (örn. -40) girerse sistem ne yapar? continue ifadesinin bu senaryodaki rolünü açıklayınız."}, "q5": {"type": "fill", "closed": true, "text": "Bir listenin toplam eleman sayısını (boyutunu) döndüren yerleşik fonksiyon ______ dur.", "accepted": ["len()", "len"]}, "q6": {"type": "open", "closed": false, "text": "6. Uygulama'daki (Hata Avcılığı ve Yapay Zekâ Kod Denetimi) senaryoda yapay zekânın ürettiği kodda son_indeks = len(sepet_listesi) satırı kullanılıp sepet_listesi[son_indeks] ile son elemana erişilmeye çalışılırsa neden IndexError oluşur? Doğru satır nasıl yazılmalıdır?"}, "q7": {"type": "open", "closed": false, "text": "Bilgi Kutusu'na göre yapay zekâ modellerinin döngü ve liste kurgularında sıkça yaptığı üç kronik hata (kararsız girinti, sonsuz döngü, indeks sınır taşması) nelerdir? Kısaca açıklayınız."}}}, {"no": 16, "baslik": "16. Hafta — Turtle ile Çizim ve Geometrik Desenler (1. Dönem 2. Sınav Haftası)", "baslangicTarihi": "2027-01-04", "konular": [{"id": "p1", "title": "Grafiksel Görselleştirme ve Koordinat Tabanlı Çizim Aracı: Turtle", "body": "Programlama dillerinde verileri işlemeyi, koşulları yönetmeyi ve döngüler kurmayı öğrenmek, algoritmik düşünme becerisinin temelini oluşturur. Yazılan kodların sadece terminal ekranında metinsel çıktılar (sayılar, yazılar vb.) üretmesi, programın arka planda yürüttüğü geometrik ve mantıksal dönüşümlerin görsel olarak algılanmasını zorlaştırabilir. Bir mimarın hesaplamalarla dolu kâğıt üzerindeki projesinin, üç boyutlu bir maket veya gerçek bir binaya dönüşmeden zihinde tam olarak canlandırılamaması gibi bilgisayarın belleğindeki sayısal veriler de görselleştirilmeden tam olarak kavranamayabilir. Yazılım dünyasında soyut algoritmaları çizgilere, renklere ve piksellere dönüştürerek somutlaştırma işlemine grafiksel görselleştirme (graphical visualization) adı verilir. Python dil mimarisi, kodların ekranda görsel birer sanat eserine veya grafik arayüzüne dönüşmesini sağlayan güçlü kütüphaneler barındırır.\n\nPython yerleşik kütüphanesinde bulunan turtle (kaplumbağa), kodlarla iki boyutlu düzlemde çizim yapmayı sağlayan eğitsel bir grafik aracıdır. Bu modülde ekranda görünmez bir kartezyen koordinat düzlemi (X ve Y eksenleri) ve bu düzlem üzerinde hareket eden, elinde bir boyama kalemi tutan sanal bir imleç bulunur. Günlük hayatta gözleri kapalı birine elinde bir fırçayla geniş ve boş bir tuval üzerinde yürüyerek resim çizdirilmek istendiğinde ona \"on adım ileri git, doksan derece sağa dön, fırçanın rengini kırmızı yap\" gibi çok net ve sıralı yönlendirmeler verilmesi gerekir. Turtle modülü de bu yönlendirme mantığıyla çalışır. Sanal imlecin baktığı yön, dönüş açısı, kalem rengi gibi parametreler döngülerle birleştirildiğinde bilgisayar ekranında karmaşık geometrik desenler saniyeler içinde oluşturulabilir. Bu süreç, öğrencilerin algoritmik talimatları piksellere dönüştürerek sonuçlarını somut bir şekilde değerlendirmesini ve soyut matematiksel açıları görsel birer çıktıya dönüştürmesini sağlar.\n\nTablo 3.2: Temel Turtle Komutları ve İşlevleri Referans Rehberi\n\nKomut | Kısa Yazım | İşlevi ve Davranışı\nforward(mesafe) | fd(mesafe) | İmleci baktığı yöne doğru belirtilen piksel kadar ileri taşır.\nright(açı) | rt(açı) | İmlecin yönünü saat yönünde belirtilen derece kadar döndürür.\nleft(açı) | lt(açı) | İmlecin yönünü saat yönünün tersine belirtilen derece kadar döndürür.\npencolor(renk) | - | Çizgi rengini belirler (örneğin \"blue\", \"red\")."}, {"id": "p2", "title": "for Döngüsüyle Geometrik Şekil Modelleme (Kare/Çokgen Çizimi)", "body": "8. Örnek: Döngüyle Geometrik Şekil Modelleme (Kare Çizimi)\n\nYazılımın görselleştirme modülünde ekranda bir kare çizilmesi hedeflenmektedir. Bir kare çizmek için program akışının ardışık olarak \"100 piksel ileri git ve 90 derece sağa dön.\" komutunu tam 4 kez tekrarlaması gerekir. Bu eylemin alt alta 4 kez (toplam 8 satır) kopyalanması yerine for döngüsü kullanılarak sürecin nasıl kısaltılacağı ve soyut mantığın piksellere nasıl modelleneceği test edilecektir.\n\nimport turtle\n# Grafik penceresini ve çizim kalemini hazırla.\nkalem = turtle.Turtle()\n# VERİMLİ DÖNGÜSEL MODELLEME: Aynı 2 satırı kopyalamak yerine 4 kez döndür.\nfor sayac in range(4):\n    kalem.forward(100) # 100 piksel ileri git.\n    kalem.right(90)    # 90 derece sağa dön (kare köşesi).\nturtle.done() # Çizim bittiğinde pencereyi açık tut.\n\nKod Analizi:\n1. Döngü Başlatma: Python yorumlayıcısı range(4) fonksiyonunu gördüğünde 0, 1, 2 ve 3 değerlerini sırayla sağlayan bir range nesnesi oluşturur.\n2. Görsel İşleme: Döngünün her bir turunda imleç (kaplumbağa) 100 piksel boyunca düz bir çizgi çizer ve bulunduğu yöne göre saat yönünde 90 derece döner.\n3. Karenin Tamamlanması: Bu eylem tam 4 kez kusursuzca tekrarlandığında imleç başlangıç noktasına geri döner ve ekranda kapalı bir kare şekli oluşur. turtle.done() komutu sayesinde grafik penceresi kapanmadan ekranda kararlı bir şekilde tutulur.\n\n7. Uygulama: Döngüsel Geometri ve Grafiksel Tasarım\n\nfor döngüsü, range() fonksiyonu ve turtle kütüphanesini kullanarak çokgen desenleri oluşturulmuş, açı değişimlerinin görsel çıktıya etkisi analiz edilmiştir. Kullanıcıdan bir döngü sınırı belirlemek üzere kaçgen çizmek istediği (kenar_sayisi) dinamik girdi olarak alınmıştır. Geometrik kural gereği bir düzgün çokgenin dış açılar toplamı 360 derecedir; bu nedenle döngü içinde kullanılacak dönme açısı donme_acisi = 360 / kenar_sayisi formülüyle hesaplanmış ve for döngüsüne bağlanarak dinamik çokgen çizimi kaydedilmiştir.\n\nkenar_sayisi = int(input(\"Çizilmesini istediğiniz çokgenin kenar sayısını giriniz (Örn: 3, 5, 6, 8): \"))\nif kenar_sayisi < 3:\n    print(\"Hata: Bir çokgen oluşturulabilmek için en az 3 kenara ihtiyaç vardır!\")\nelse:\n    donme_acisi = 360 / kenar_sayisi\n    print(f\"\\nHesaplanan Dış Açı: {donme_acisi:.1f} Derece.\")\n    asistan_kalem = turtle.Turtle()\n    asistan_kalem.pencolor(\"purple\")\n    asistan_kalem.pensize(3)\n    for sira in range(kenar_sayisi):\n        asistan_kalem.forward(80)          # Her bir kenarın uzunluğu 80 piksel\n        asistan_kalem.right(donme_acisi)   # Hesaplanan dinamik açı kadar dönüş\n    turtle.done()\n\nDeney sonuçları kenar sayısına göre şu geometrik çıktıları üretir: kenar sayısına 3 girildiğinde 120 derece dönerek bir eşkenar üçgen, kenar sayısına 15 girildiğinde giderek bir çembere benzeyen bir çokgen ve asistan_kalem.forward(80) satırı asistan_kalem.forward(sira * 2) şeklinde döngü değişkenine bağlı olarak güncellenip kenar sayısına 20 girildiğinde ekranda bir spiral desen oluşur. Bu deneyler, kenar sayısı arttıkça piksellerin mantıksal dağılımının nasıl bir çembere yaklaştığını somut olarak gösterir."}, {"id": "p3", "title": "İç İçe Döngülerin Çalışma Mekanizması", "body": "İç içe döngülerin çalışma mekanizması, dışarıdaki döngü ve iç döngü hiyerarşisine dayanır. Dışarıdaki döngü sadece 1 tur döndüğünde içerideki döngü başlangıçtan bitişe kadar olan tüm turlarını tamamlamak zorundadır. İç döngü tamamen bitmeden dış döngü bir sonraki adıma geçemez.\n\nGünlük hayatta bir analog saatin çalışma mekanizması, iç içe döngülerin bu hiyerarşik yapısına verilebilecek somut örneklerden biridir. Bir saatte yer alan akrep dış döngüyü, yelkovan ise iç döngüyü temsil eder. Akrebin yalnızca bir sayılık ilerleme kaydedebilmesi (dış döngünün bir tur atması) için yelkovanın 60 dakikalık tam bir turu eksiksiz bir şekilde bitirmesi şarttır. Yelkovan kendi turlarını tamamlamadan akrep kesinlikle bir sonraki saate ilerlemez. Bu mekanizmada olduğu gibi programlama dillerinde de iç döngünün tüm tekrarları bütünüyle sonlanmadan dış döngünün bir sonraki adıma geçmesine izin verilmez. Bu mutlak bağımlılık, bilgisayarın karmaşık işlemleri sırayla, düzenli ve hatasız bir şekilde yapılandırmasını mümkün kılar. Bu mekanizma; turtle grafik kütüphanesinin yön, piksel ve açı parametreleriyle birleştiğinde iç döngünün temel bir geometrik şekli (örneğin bir üçgen veya kareyi) çizdiği, dış döngünün ise bu şekli her seferinde belirli bir açıyla döndürerek ekranda muazzam simetrik geometrik desenler ve geometrik spiraller oluşturduğu akıllı bir tasarım sistemine dönüşür.\n\nGeleneksel mimaride ve çini sanatında ustaların karmaşık eserlerini üretme süreci, bu ardışık çizim mimarisinin ekrandaki yansımasına verilebilecek en estetik örneklerden biridir. Bir usta, önce merkezdeki tek bir geometrik motifi tüm detaylarıyla çizer. Ardından elde edilen bu temel motif, belirli bir açıyla kaydırılarak zemin etrafında defalarca kopyalanır. Bu aşama ise dış döngünün kontrolündedir. Sadece basit bir çizimin iç içe döngüler aracılığıyla aynı eksen etrafında döndürülerek çoğaltılması, matematiksel hesaplamaların görsel bir derinlik kazanmasını sağlar. Yüzlerce satır tekrarlı komut dizisi yazmak yerine sadece birkaç satırlık iç içe yapı kurgulamak, sistemin doğadaki kusursuz simetriye benzeyen fraktalları hızlı ve hatasız şekilde inşa etmesini sağlar."}, {"id": "p4", "title": "Bu Hafta Sınav Haftası", "body": "Bu hafta 1. Dönem 2. Sınavımız var. Sınav; koşul yapıları (if, if-else, if-elif-else), iç içe koşullar, büyük/küçük harf duyarlılığı, for ve while döngüleri, range() fonksiyonu, bileşik atama operatörleri, break/continue ifadeleri, liste (list) yapısı ve turtle ile temel çizim konularını kapsayacaktır. Tekrar yapmak için önceki haftaların Egzersizler bölümüne göz atabilir, özellikle döngü kontrol ifadeleri ve liste indeksleme sorularını tekrar çözebilirsiniz."}], "sorular": {"q1": {"type": "mc", "closed": true, "text": "Tablo 3.2'ye göre kaplumbağayı (imleci) belirtilen derece kadar saat yönünde döndüren komut aşağıdakilerden hangisidir?", "opts": ["forward(mesafe)", "left(açı)", "right(açı)", "pencolor(renk)", "done()"], "correct": "right(açı)"}, "q2": {"type": "open", "closed": false, "text": "8. Örnek'teki (Döngüyle Geometrik Şekil Modelleme - Kare Çizimi) kod bloğunda for sayac in range(4): içinde kalem.forward(100) ve kalem.right(90) komutları neden tam 4 kez tekrarlanır? Bu döngü ekranda hangi şekli çizer?"}, "q3": {"type": "fill", "closed": true, "text": "Bir çokgenin dış açıları toplamı 360 derecedir. kenar_sayisi = 6 olan bir çokgen için dönme açısı (donme_acisi) kaç derece olmalıdır?", "accepted": ["60", "60 derece"]}, "q4": {"type": "open", "closed": false, "text": "7. Uygulama'daki (Döngüsel Geometri ve Grafiksel Tasarım) kodda kenar_sayisi = 15 girildiğinde ekranda oluşan şeklin neden bir çembere benzediğini kenar sayısı ve piksel dağılımı açısından açıklayınız."}, "q5": {"type": "open", "closed": false, "text": "8. Uygulama'daki (İç İçe Döngülerle Döndürülmüş Üçgen Deseni) kodda dış döngü 36 kez, iç döngü 3 kez dönmektedir. İç döngüdeki asistan_kalem.forward(120) satırı toplamda kaç kez çalışır? İç içe döngü mantığını (dış döngünün bir sonraki adıma geçebilmesi için iç döngünün tamamen bitmesi gerektiğini) açıklayınız."}, "q6": {"type": "tf", "closed": true, "text": "İç içe döngülerde, iç döngü tüm turlarını tamamlamadan dış döngü bir sonraki adımına geçemez.", "correct": "Doğru"}}}, {"no": 17, "baslik": "17. Hafta — Fraktal Desenler ve Sürüm Yönetiminde Release Kavramı", "baslangicTarihi": "2027-01-11", "konular": [{"id": "p1", "title": "Uygulama Özeti: İç İçe Döngülerle Döndürülmüş Üçgen Deseni", "body": "8. Uygulama'da iç içe for döngülerini kullanarak turtle ile geometrik şekiller üretilmiş, iç ve dış döngülerin birlikte nasıl karmaşık desenler oluşturduğu kavranmıştır. Uygulama adımlarında import turtle satırıyla grafik kütüphanesi projeye dâhil edilmiş, ekrana 36 adet üçgen çizebilmek için dış döngü 36 kez çalışacak şekilde (for dis_sira in range(36):) kurgulanmış, dış döngünün içine bir eşkenar üçgenin çizim adımlarını yönetecek 3 turluk bir iç döngü (for ic_sira in range(3):) yerleştirilmiş ve iç döngünün her üçgen çizimini bitirmesinin ardından şekillerin üst üste binmemesi için dış döngüye asistan_kalem.right(10) komutu eklenerek imlecin her adımda 10 derece döndürülmesi sağlanmıştır.\n\nimport turtle\nasistan_kalem = turtle.Turtle()\nasistan_kalem.speed(0)     # Çizimi hızlandırmak için en yüksek hız (0) modu\nasistan_kalem.pencolor(\"blue\") # Mavi tasarım rengi\nasistan_kalem.pensize(2)\n# ==========================================================\n# MANTIKSAL HİYERARŞİ: İÇ İÇE DÖNGÜ MOTORU\n# ==========================================================\n# 1. DIŞ DÖNGÜ: Toplam şekil adedini ve dönüş eksenini yönetir.\nfor dis_sira in range(36):\n    # 2. İÇ DÖNGÜ: Temel geometrik şekli (Eşkenar Üçgen) çizer.\n    # Dış döngünün HER BİR TURUNDA bu iç döngü 3 turunu tamamen bitirir.\n    for ic_sira in range(3):\n        asistan_kalem.forward(120)  # 120 piksel ileri git\n        asistan_kalem.left(120)     # Eşkenar üçgen dış açısı (120 derece) sola dön\n    # İÇ DÖNGÜNÜN BİTİŞ ALANI\n    # Bir adet üçgen çizimi bitti! Şimdi dış döngünün kontrolündeyiz.\n    # Bir sonraki üçgenin öncekinin üstüne binmemesi için ekseni 10 derece kaydırıyoruz.\n    asistan_kalem.right(10)\nprint(\"Algoritma Tamamlandı: 36 adet üçgen, iç içe döngü mimarisiyle işlendi.\")\nturtle.done()\n\nKod Analizi: Program tamamen durduğunda iç döngünün en içindeki asistan_kalem.forward(120) satırı, dış döngünün 36 turu boyunca her turda iç döngünün 3 kez çalışması nedeniyle program akışı boyunca toplam 36 * 3 = 108 kez çalıştırılmış olur. İç döngüdeki range(3) ifadesinin range(4) yapılıp içindeki açının asistan_kalem.left(90) olarak güncellenmesi, temel şekli kareye dönüştürerek tasarımın kökenini değiştirir. Döngü değişkenlerinin dinamik yapısını görsel olarak yorumlamak için dış döngünün hemen dışına, iç döngünün ise içine şu iki satır eklenip her turda renk geçişi simüle edilebilir:\n\nif dis_sira % 2 == 0:\n    asistan_kalem.pencolor(\"purple\")\nelse:\n    asistan_kalem.pencolor(\"blue\")\n\nBu deneyler, iç içe döngü mimarisinin (nested loops) 36 kez döndürülmüş üçgen deseni üretme sürecinde her bir bileşenin (dış döngünün açı yönetimi, iç döngünün şekil çizimi) rolünü somut olarak ortaya koyar."}, {"id": "p2", "title": "Dijital Depolarda Sürüm Yönetimi ve Release Kavramı", "body": "Bir yazılım projesi geliştirilirken kodlar sürekli olarak güncellenir, yeni özellikler eklenir ve hatalar ayıklanır. Yazılımın belirli aşamalarda ulaştığı güvenli, test edilmiş ve kararlı (stabil) aşamaları dondurarak kayıt altına almak gerekir. Yazılım sektöründe projenin kullanıcıya sunulmaya hazır, kararlı her bir ana basamağına sürüm (version) adı verilir.\n\nSürüm numaralandırmaları genellikle v1.0, v2.0 şeklinde standart bir mimariyle yapılır. Burada yer alan v1.0, projenin ilk tamamlanmış, tüm temel fonksiyonları kararlı çalışan resmî final sürümü anlamına gelir.\n\nDijital depolama ve sürüm kontrol platformu üzerinde projenin belirli bir andaki hatasız kopyasını etiketleyerek indirilebilir bir paket hâlinde dünyaya ilan etme işlemine Release (Yayın / Sürüm Oluşturma) denir. Release oluşturulduğunda sistem, kaynak kodları otomatik şekilde .zip formatında sıkıştırarak arşivler ve projenin o anki sürümünü koruma altına alır."}, {"id": "p3", "title": "Uygulama Özeti: İlk Resmî Sürüm (v1.0) ve Release Yönetimi", "body": "9. Uygulama'da koşullar, döngüler, liste metotları ve görselleştirme modüllerini birleştirerek projenin ilk kararlı sürümünü dijital depoda yayımlama becerisi kazanılmıştır. Kod-Asistan projesini dijital depoya yayımlamak amacıyla şu işlem basamakları sırasıyla takip edilmiştir: İnternet tarayıcısından dijital depo hesabına giriş yapılıp kod-asistan isimli proje deposu açılmış; deponun ana sayfasının sağ tarafında yer alan Releases (Yayınlar) başlığı altındaki Create a new release (Yeni bir yayın oluştur) düğmesine tıklanmış; Choose a tag (Bir etiket seçin) açılır menüsünden projenin ilk resmî sürüm numarası olan v1.0 ifadesi yazılıp Create new tag seçeneğine basılmış; Release title (Yayın başlığı) alanına kurumsal standartlara uygun olarak \"Kod-Asistan v1.0 - İlk Kararlı Sürüm (Final)\" başlığı atılmış; Describe this release (Bu yayını açıkla) alanına projenin neleri başardığını gösteren sürüm notları markdown biçiminde eklenmiştir:\n\n## Kod-Asistan v1.0 Sürüm Notları\nBu sürüm, projenin ilk tamamlanmış resmî final sürümüdür.\n\n### Eklenen Modüller ve Özellikler:\n* **Koşul Yapısı:** Kullanıcı taleplerini süzebilen dinamik karar blokları eklendi.\n* **Döngü Kararlılığı:** `while` ve `for` motorlarıyla hata avcılığı denetimleri yapıldı.\n* **Görselleştirme:** `turtle` entegrasyonuyla iç içe döngülü grafik katmanı eklendi.\n\nSayfanın en altında yer alan yeşil renkli Publish release (Yayınla) düğmesine tıklanarak süreç tamamlanmıştır. Projenin v1.0 sürümünü yayımladıktan sonra şu analitik adımlar takip edilmiştir: Release işlemi bittikten sonra ekrana gelen sayfadaki Source code (zip) bağlantısına tıklanarak proje bilgisayara indirilmiş, sıkıştırılmış dosya içindeki kaynak kodların bilgisayardaki kodlarla uyumlu olduğu doğrulanmış ve sürüm kontrolünün projeyi bilgisayar çökmelerine karşı nasıl koruduğu yorumlanmıştır. Ardından sınıf arkadaşlarıyla eşleşilerek arkadaşının GitHub deposuna gidilip onun oluşturduğu v1.0 sürüm notları okunmuş, projenin README dosyasına ve kaynak kod kalitesine (değişken isimlendirmeleri, yorum satırları vb.) bakarak birbirine yapıcı geri bildirimler verilmiştir."}], "sorular": {"q1": {"type": "open", "closed": false, "text": "9. Uygulama'daki (İç İçe Döngülerle Döndürülmüş Üçgen Deseni) kodun sonunda dış döngüye eklenen asistan_kalem.right(10) komutunun görevi nedir? Bu komut olmasaydı ekranda ne olurdu?"}, "q2": {"type": "tf", "closed": true, "text": "10. Uygulama'daki (Sonsuz Döngü Kapanı ve Geometrik Fraktal Sanatı) senaryoda while True: ile başlayan çizim döngüsü, cizgi_boyu değişkeni 300 piksele ulaştığında break komutuyla güvenli bir şekilde sonlandırılır.", "correct": "Doğru"}, "q3": {"type": "mc", "closed": true, "text": "Bir yazılım projesinin belirli, güvenli ve kararlı bir aşamasını dondurarak kayıt altına alma işlemine ne ad verilir?", "opts": ["Commit", "Push", "Shifting", "Release", "Installation"], "correct": "Release"}, "q4": {"type": "fill", "closed": true, "text": "v1.0 gibi bir sürüm etiketi, projenin ilk tamamlanmış, kararlı ve resmî ______ sürümü olduğunu gösterir.", "accepted": ["final", "final sürüm"]}, "q5": {"type": "open", "closed": false, "text": "9. Uygulama'daki (İlk Resmî Sürüm (v1.0) ve Release Yönetimi) adımlarına göre Release oluşturulduğunda dijital depo sistemi, projenin o anki kaynak kodlarını otomatik olarak hangi dosya formatında arşivler? Bu arşivlemenin projenin kararlılığını korumaya nasıl katkı sağladığını açıklayınız."}, "q6": {"type": "open", "closed": false, "text": "Kendi Kod-Asistan projeniz için bir v1.0 sürüm notu (Release açıklaması) yazsanız, hangi modülleri (koşul yapıları, döngüler, liste metotları, turtle görselleştirme) eklediğinizi kısaca listeler miydiniz? Örnek bir sürüm notu yazınız."}}}, {"no": 18, "baslik": "18. Hafta — Ünite 3 Ölçme ve Değerlendirme", "baslangicTarihi": "2027-01-18", "konular": [{"id": "p1", "title": "Uygulama Özeti: Sonsuz Döngü Kapanı ve Geometrik Fraktal Sanatı", "body": "10. Uygulama'da Kod-Asistan projesinin görsel vitrini için bir dijital sanat motoru tasarlanmıştır. Sistem, kullanıcıdan kaç eksenli bir fraktal çizmek istediğini interaktif olarak alacak ve turtle grafik ekranında çizime başlayacaktır. Çizim algoritması teorik olarak sonsuz bir döngüye (while True) sahip olacaktır. Programın sonsuz döngüde kalmasını engellemek için; çizgi uzunluğu 300 piksele ulaştığı an sistemi break komutuyla kırmalı ve çizimi güvenli bir şekilde sonlandırmalıdır.\n\nUygulama adımlarında programın en üstüne Python'ın standart grafik motoru olan turtle kütüphanesi dâhil edilmiş, kullanıcıdan döngüsel dönüş açısını belirlemek üzere dinamik bir sayısal veri talep edilmiş (matematiksel ipucu: iç içe tam döngü için 360 / eksen_sayisi formülü kullanılmış), çizgilerin her adımda büyümesini sağlayacak bir cizgi_boyu = 0 sayacı tanımlanmış, bir while True: ile döngü bloğu başlatılmış, döngünün içinde turtle.forward(cizgi_boyu) ve turtle.left(aci) komutlarıyla kaplumbağa hareket ettirilmiş ve her turun sonunda cizgi_boyu değişkeni 2 piksel artırılarak spiral etki yakalanmıştır. Döngünün tam ortasına bir if koşulu yerleştirilmiş; eğer cizgi_boyu >= 300 olduysa ekrana f-string ile \"Program Güvenliği Sağlandı: 300 piksel sınırında sonsuz döngü kırıldı.\" yazdırılıp break komutuyla döngü kapanmasından çıkılmış, turtle.done() komutuyla çizim bittiğinde ekranın açık kalması sağlanmıştır.\n\nBu uygulamada tekrar sayısı belirsiz bir çizim sürecinin (while True), somut ve ölçülebilir bir geometrik büyüklüğe (cizgi_boyu >= 300) bağlı bir break koşuluyla nasıl güvenli bir şekilde sonlandırılabileceği pratik olarak deneyimlenmiştir; bu yaklaşım, sonsuz döngü riskini taşıyan her sanatsal veya dinamik algoritmada uygulanabilecek genel bir güvenlik disiplinidir."}, {"id": "p2", "title": "Ünite Özeti: Koşul Yapıları ve Karar Mekanizmaları", "body": "Bu ünitede öğrendiklerimiz arasında ilk temel kazanım karar yapılarıdır: Python'da if (eğer) yapısı, belirlenen bir koşulun mantıksal sonucuna göre girintilenmiş bir kod bloğunun çalıştırılıp çalıştırılmayacağını belirler. Python'da kod bloklarının sınırları, süslü parantezlerle değil 4 boşluk veya 1 Tab tuşuyla sağlanan girinti (indentation) mimarisiyle belirlenir; bu kuralın ihlali IndentationError'a yol açar. Koşulun sağlanmadığı durumlar için else, birden fazla kriterin sırayla denetlenmesi gereken durumlar için ise elif kullanılır ve if-elif-else merdiveninde yorumlayıcı ilk True bulduğu bloğu çalıştırıp yapıdan çıkar.\n\nİkinci kazanım, karşılaştırma operatörlerinin (==, !=, >, <, >=, <=) ve mantıksal operatörlerin (and, or, not) birleşik kullanımıdır; Python bu ifadeleri değerlendirirken önce aritmetik işlemleri, sonra ilişkisel karşılaştırmaları, en son da mantıksal operatörleri (not, and, or sırasıyla) işler ve parantez bu önceliği güvenle değiştirmenin tek yoludur. Üçüncü kazanım iç içe (nested) koşul yapılarıdır: bir kontrol yapısının içine yeni bir kontrol yapısı yerleştirilerek ardışık, birbirine bağımlı doğrulama aşamaları (örneğin iki aşamalı kimlik doğrulama) kurgulanabilir. Dördüncü kazanım ise büyük / küçük harf duyarlılığıdır (case-sensitivity): Python \"A\" ile \"a\" karakterlerini farklı veri olarak kabul eder; bu nedenle kullanıcıdan alınan metinsel veriler, if-else karar yapılarına sunulmadan önce .lower() veya .upper() metotlarıyla standart bir forma dönüştürülmelidir."}, {"id": "p3", "title": "Ünite Özeti: Döngüler, Listeler ve Grafiksel Görselleştirme", "body": "Beşinci kazanım döngü yapılarıdır: tekrar sayısı önceden bilindiğinde for döngüsü ve range() fonksiyonu (range(bitis), range(baslangic, bitis) ve range(baslangic, bitis, artis) biçimlerinde) tercih edilirken, tekrar sayısı bir mantıksal koşula bağlı ve belirsiz olduğunda while döngüsü kullanılır; sayaç güncellemelerinde ise +=, -=, *=, /= gibi bileşik atama operatörleriyle kod okunabilirliği artırılır. Döngü akışını yönlendirmek için break (döngüyü tamamen kırar) ve continue (sadece o turu atlayıp döngüye devam eder) ifadeleri kullanılır; while döngülerinde koşulu sonlandıracak bir güncelleme veya break bulunmazsa program sonsuz döngüye (infinite loop) girer.\n\nAltıncı kazanım liste (list) yapısıdır: birden fazla veri, köşeli parantez [ ] içinde tek bir değişken adı altında saklanır; elemanlara 0'dan başlayan pozitif indeks veya -1'den başlayan negatif indeksle erişilir, sınır dışı bir indekse erişim IndexError üretir. len() fonksiyonu listenin eleman sayısını verimli biçimde döndürür, .append() listenin sonuna eleman ekler, .insert() araya eleman yerleştirirken sağdaki elemanların indekslerini kaydırır, .remove() ise değere göre ilk eşleşen elemanı silip geri kalan verileri sola kaydırır; for döngüsüyle listenin tüm elemanları sırayla işlenebilir. Yedinci kazanım, yapay zekânın döngü ve liste kodlarında yapabileceği girinti hatası, sonsuz döngü tuzağı ve indeks sınır taşması gibi kronik hatalara karşı İnsan Denetimi prensibinin uygulanması gerektiğidir.\n\nSon kazanım ise grafiksel görselleştirmedir: turtle kütüphanesi ile forward(), right(), left() ve pencolor() komutları kullanılarak kartezyen düzlemde çizim yapılır; for döngüsüyle bir düzgün çokgenin kenarları (360 / kenar_sayisi formülüyle hesaplanan dış açıyla) çizilirken, iç içe döngülerle bu temel şekiller farklı açılarla döndürülüp çoğaltılarak karmaşık geometrik desenler ve fraktallar üretilir. Ünite, bir yazılım projesinin kararlı hâle gelen sürümlerinin dijital depoda Release (Yayın) olarak etiketlenip .zip formatında arşivlenmesi ve sürüm notlarının şeffaf biçimde yazılmasıyla tamamlanır."}], "sorular": {"q1": {"type": "open", "closed": false, "text": "'Python'da kod bloklarının sınırları 4 boşluk girinti mimarisiyle belirlenir' ifadesi Doğru, 'if-elif-else merdiveninde yorumlayıcı ilk True bloğu çalıştırıp yapıdan çıkar' ifadesi de Doğru kabul edildiğinde: 'Geniş kapsamlı koşulların üste yazılması ölü kod oluşmasını engeller' ifadesinin Doğru mu Yanlış mı olduğunu gerekçesiyle açıklayınız."}, "q2": {"type": "mc", "closed": true, "text": "yas = 17; toplam_sepet = 600; kupon_aktif = True; indirim_onay = kupon_aktif and (yas >= 18 or toplam_sepet > 500); print(indirim_onay) kodu çalıştırıldığında ekrana basılacak çıktı aşağıdakilerden hangisidir?", "opts": ["False", "True", "None", "TypeError", "ValueError"], "correct": "True"}, "q3": {"type": "mc", "closed": true, "text": "Bir listenin eleman sayısını döndüren yerleşik Python fonksiyonu hangisidir?", "opts": ["append()", "insert()", "len()", "remove()", "range()"], "correct": "len()"}, "q4": {"type": "open", "closed": false, "text": "for sayi in range(1, 6):\n    if sayi == 3:\n        continue\n    if sayi == 5:\n        break\n    print(sayi, end='-')\nkodu çalıştırıldığında terminale basılacak çıktı nedir?"}, "q5": {"type": "mc", "closed": true, "text": "Bir yazılım projesinin belirli bir sürümünü etiketleyerek indirilebilir paket hâlinde yayımlama işlemine ne ad verilir?", "opts": ["Commit", "Push", "Shifting", "Release", "Installation"], "correct": "Release"}, "q6": {"type": "open", "closed": false, "text": "sayac = 1\nwhile sayac <= 3:\n    girilen_parola = input('Sistem parolasını giriniz: ')\n    if girilen_parola == 'Malazgirt1071':\n        print('Giriş Başarılı.')\nkod bloğu bu hâliyle çalıştırıldığında neden bir sonsuz döngü riski taşır? Kodun kararlı çalışması ve kullanıcıya tam 3 hak tanıması için hangi satır/satırların eklenmesi gerektiğini yazınız."}, "q7": {"type": "open", "closed": false, "text": "kullanicilar = ['Musa', 'Zeynep', 'Harun', 'Yusuf', 'Ömer'] listesinin elemanlarına for döngüsü ile erişip, her bir ismin başına 'Merhaba' ekleyerek (örneğin Merhaba Musa) ekrana yazdıran Python kodu nedir? Yazınız."}, "q8": {"type": "open", "closed": false, "text": "1'den 15'e kadar olan sayıları ekrana basan, 3'e tam bölünen sayıları '3'e tam bölünür.' mesajıyla veren Python kodu nedir? Yazınız."}, "q9": {"type": "tf", "closed": true, "text": "Bir düzgün çokgen çiziminde dönme açısı, 360'ın çokgenin kenar sayısına bölünmesiyle hesaplanır.", "correct": "Doğru"}}}, {"no": 19, "baslik": "19. Hafta — Modüler Programlamaya Giriş: Fonksiyon Tanımlama", "baslangicTarihi": "2027-02-01", "konular": [{"id": "p1", "title": "Fonksiyonlara Giriş: Yerleşik (Built-in) Fonksiyonlarla Veri Akışı", "body": "Fonksiyonlar; programlama dillerinde belirli bir görevi yerine getirmek üzere yapılandırılmış, tekrar kullanılabilir kod bloklarıdır. Bir fonksiyonun tanımlanması, karmaşık kod yapılarını daha modüler hâle getirirken girdi ve çıktı mekanizmaları sayesinde verinin yazılım içinde düzenli bir şekilde akmasını sağlar. Yazılım mimarisinde işlevselliği artıran bu yapılar, geliştiriciye hem esneklik sunar hem de kodun okunabilirliğini optimize eder.\n\nModüler programlamada sıfırdan yazılan kullanıcı tanımlı fonksiyonların (user-defined functions) yanı sıra Python dil mimarisinin çekirdeğinde hazır olarak bulunan yerleşik fonksiyonlar (built-in functions) da mevcuttur. Bu fonksiyonlar, arka planda Python yorumlayıcısı ve işletim sistemi aracılığıyla çok karmaşık veri akışlarını yürütmelerine rağmen yazılımcıya sadece basit bir isim ve parantez () yapısıyla sunulurlar. print(), input() gibi fonksiyonlar Python dilinin yerleşik fonksiyonlarından bazılarıdır.\n\nÖrnek: Yerleşik (Built-in) Fonksiyonlarla Veri Akışı\n\nKod-Asistan projesinin güvenlik denetimi aşamasında, kullanıcının sisteme girdiği bir onay kodunun kaç karakterden oluştuğunun analiz edilip bellekte hangi türde saklandığının ekrana yansıtılması gerekmektedir. Bir yazılımcının bu işlemi yapabilmesi için klavye donanımıyla veya RAM adresleriyle sıfırdan haberleşecek kodları yazması devasa bir zaman ve kodlama maliyeti yaratır. Bu donanımsal yükü aşmak ve veriyi saniyeler içinde işlemek için Python dil mimarisinde hazır olarak bekleyen input(), len(), type() ve print() yerleşik fonksiyonları birbiriyle haberleştirilerek bu sorun çözülecektir.\n\nprint(\"--- KOD-ASİSTAN SİSTEM DENETİMİ ---\")\n# input() yerleşik fonksiyonu, akışı durdurur ve dinamik veri alır.\nsistem_kodu = input(\"Lütfen sistem onay kodunu giriniz: \")\n# len() yerleşik fonksiyonu, verinin boyutunu (karakter sayısını) ölçer.\nkod_uzunlugu = len(sistem_kodu)\n# type() bellek türünü analiz ederken, print() sonucu ekrana yansıtır.\nprint(f\"Girdiğiniz kod {kod_uzunlugu} karakterden oluşmaktadır.\")\nprint(\"Bellekteki veri türü:\", type(sistem_kodu))\n\nTerminal Çıktısı\n\n--- KOD-ASİSTAN SİSTEM DENETİMİ ---\nLütfen sistem onay kodunu giriniz: KOD1453\nGirdiğiniz kod 7 karakterden oluşmaktadır.\nBellekteki veri türü: <class 'str'>\n\nKod Analizi:\n• input() fonksiyonu, standart girişten kullanıcının yazdığı satırı alır ve str türünde döndürür.\n• len() fonksiyonu, ilgili nesnenin uzunluk bilgisini döndürür. Liste ve metin gibi temel yapılarda bu bilgi verimli biçimde elde edilir.\n• type() fonksiyonu, kendisine verilen değerin hangi sınıfa ait olduğunu gösterir.\n• print() fonksiyonu sonucu standart çıktı ortamında görüntüler.\n\nPython'un yerleşik (built-in) fonksiyonları, arka planda çalışan karmaşık kod bloklarını basit bir isim ve parantez () arkasına gizleyerek programlama sürecini büyük ölçüde kolaylaştırır. Bazen Python'un içinde, karşılaşılan özel bir ihtiyacı giderecek hazır bir fonksiyon bulunmayabilir. Örneğin kullanıcının sepet tutarına KDV ekleyip net faturayı bulan ya da iki farklı dosyayı birleştirip şifreleyen bir yerleşik komut bulunmaz. Bu durumda Python geliştiricilerinin yaptığı gibi sisteme özel bağımsız fabrikaların (kullanıcı tanımlı fonksiyonlar) inşa edilmesini öğrenme aşamasına geçilir."}, {"id": "p2", "title": "Kullanıcı Tanımlı Fonksiyonlar", "body": "Yazılım projeleri büyüdükçe aynı kod bloklarını (örneğin kullanıcıyı selamlama, yaş hesaplama veya menü gösterme) programın farklı yerlerinde defalarca kullanma ihtiyacı doğar. Bu kodları her defasında kopyalayıp yapıştırmak; kodun boyutunu (şişmesini) artırır, okunabilirliğini düşürür ve bir mantık hatası yapıldığında tüm kopyaların tek tek düzeltilmesini gerektirir. Python programlama dilinde tekrar eden kodları modüler ve sürdürülebilir yapılara dönüştürmek için fonksiyonlar (functions) kullanılır.\n\nFonksiyonlar, belirli bir görevi yerine getirmek üzere adlandırılmış ve gerektiğinde çağrılabilen kod bloklarıdır. Fonksiyonlar, belirli bir görevi yerine getirmek üzere adlandırılmış ve gerektiğinde çağrılabilen kod blokları tıpkı modern bir kahve makinesi gibi çalışır. Düğmesine basılmadığı sürece çalışmaz (çağırma / tetikleme), içine kahve ve su konulduğunda bunları işler (parametre), bir fincan kahve sunar (return). Bazı fonksiyonlar hesaplanan bir değeri return ile döndürürken bazıları yalnızca belirli bir işlemi gerçekleştirir."}, {"id": "p3", "title": "Fonksiyon Tanımlama Standartları: def Anahtar Kelimesi", "body": "Python dünyasında özel fonksiyonlar oluşturulurken def [define (tanımla)] anahtar kelimesi kullanılır. Bu tanımlama yapılırken yazılan programın sorunsuz çalışması ve diğer yazılımcılar tarafından kolayca okunabilmesi için bazı altın kurallara dikkat edilmelidir.\n\nDeğişkenlerde olduğu gibi fonksiyon isimleri de Python topluluğunda yaygın kabul gören PEP 8 stil kılavuzuna uygun olarak snake_case notasyonuyla yazılmalıdır. Yani isimler tamamen küçük harflerden oluşmalı ve kelimeler birbirine alt çizgi (_) ile bağlanmalıdır. Ayrıca fonksiyon adlarının yaptığı işi açıkça anlatan, kısa ve anlamlı ifadelerden seçilmesi önerilir.\n\nİsimlendirme yapıldıktan hemen sonra, fonksiyonun çalışabilmesi için herhangi bir başlangıç bilgisine (veriye) ihtiyaç duyup duymadığını gösteren parantezler () eklenir. Ardından, fonksiyonun yapacağı görevlerin başladığını bilgisayara bildiren iki nokta (:) sembolü konulur.\n\nFonksiyonun içine yazılacak tüm görev satırlarının aynı hizada ve içeriden yazılması gerekir. Python'da bu içeri kaydırma işlemi için standart olarak 4 boşluk kullanılır. Burada dikkat edilmesi gereken en önemli PEP 8 stil önerisi, boşluk tuşu ile Tab tuşunun kesinlikle birbirine karıştırılmamasıdır. Aksi takdirde Python yorumlayıcısı girinti hatası (IndentationError) verir ve kod çalışmaz. PEP 8 stil önerilerine ve girinti kurallarına uygun temel bir fonksiyon tanımlama şablonu aşağıda gösterilmiştir.\n\n# Fonksiyon Tanımlama Şablonu\ndef fonksiyon_adi(parametre_1, parametre_2):\n    # Fonksiyon Gövdesi (4 boşluk girinti disiplini)\n    islem_sonucu = parametre_1 + parametre_2\n    return islem_sonucu\n\nÖrnek: Parametresiz Temel Fonksiyon ve Çağırma (Call)\n\nKod-Asistan projesinin başlangıcında kullanıcıyı karşılayan standart selamlama mesajının, kodun içinde defalarca yaz
