\" anahtarını ikinci kez) silmeye çalışmanın KeyError üreterek hata vereceği unutulmamalıdır. Yazılımın kararlılığını korumak için silme işleminden önce anahtarın varlığı denetlenebilir.\n\nSözlükten veri silerken del komutunun yanı sıra silinen veriyi kaybetmeden önce yedeklemek veya sözlüğün iskeletini bozmadan içini tek seferde tamamen boşaltmak için Python'un yerleşik metotlarından yararlanılabilir.\n\nkitap_bilgisi = {\n    \"ad\": \"Dîvân-ı Hikmet\",\n    \"yazar\": \"Hoca Ahmed Yesevî\",\n    \"tür\": \"Tasavvuf\",\n    \"sayfa\": 144\n}\n# .pop() metodu ile anahtarı silme ve değerini yedekleyerek yakalama\nsilinen_veri = kitap_bilgisi.pop(\"tür\")\nprint(f\"[BİLGİ] '{silinen_veri}' bilgisi bellekten silindi.\")\n# .clear() metodu ile sözlüğün içindeki tüm kayıtları sıfırlama\nkitap_bilgisi.clear()\nprint(f\"Sözlüğün Son Durumu: {kitap_bilgisi}\")\n\nTerminal Çıktısı\n\n[BİLGİ] 'Tasavvuf' bilgisi bellekten silindi.\nSözlüğün Son Durumu: {}\n\nKod Analizi:\n• 1. Adım [Değer Döndürerek Güvenli Silme (.pop())]: del komutu veriyi sözlükten kaldırır ancak .pop() metodu, silinen anahtara ait değeri sözlükten silmeden hemen önce programa geri döndürür (return). Bu sayede veri sözlükten silinirken aynı zamanda silinen_veri adlı değişkende tutularak işlem geçmişine (log) yazılabilmiş veya son bir kez değerlendirilebilmiştir.\n• 2. Adım [Tamamen Sıfırlama (.clear())]: del kitap_bilgisi komutu değişken adı ile sözlük bağlantısını kesip NameError oluşmasına yol açarken .clear() metodu sözlüğün ismini korur. Sadece içerisindeki tüm verileri temizleyerek geriye yeniden veri eklenmeye hazır boş bir sözlük {} bırakır."}], "sorular": {"q1": {"type": "open", "closed": false, "text": "Bir okul kütüphanesinde kitapların raftaki sırasından çok kitap adı, barkod numarası veya yazar bilgisi kullanılarak arandığını düşününüz. Bu durum, Python'da listeler yerine sözlük (dictionary) veri yapısının tercih edilmesini nasıl gerekçelendirir? Açıklayınız."}, "q2": {"type": "mc", "closed": true, "text": "ogrenci = {\"numara\": 125, \"ad\": \"Ayşegül\", \"sinif\": \"9-A\", \"ortalama\": 88.5} sözlüğünde print(ogrenci[\"sinif\"]) kodu çalıştırıldığında ekrana ne yazdırılır?", "opts": ["125", "\"sinif\"", "9-A", "88.5", "KeyError"], "correct": "9-A"}, "q3": {"type": "tf", "closed": true, "text": "kitap_bilgisi sözlüğünde tanımlanmamış bir anahtar (örneğin \"soyad\") köşeli parantez [] ile doğrudan çağrılmaya çalışıldığında Python KeyError vererek programın akışını aniden sonlandırır.", "correct": "Doğru"}, "q4": {"type": "open", "closed": false, "text": "kitap_bilgisi = {\"ad\": \"Dîvân-ı Hikmet\", \"yazar\": \"Hoca Ahmed Yesevî\"}\nyayinevi = kitap_bilgisi.get(\"yayinevi\", \"Yayınevi bilgisi bulunamadı.\")\nprint(yayinevi)\nkodu çalıştırıldığında ekrana ne yazdırılır? .get() metodunun burada KeyError hatasını nasıl önlediğini açıklayınız."}, "q5": {"type": "fill", "closed": true, "text": "Bir sözlükte zaten var olan bir anahtara yeni bir değer atandığında, eski değerin yeni değerle değiştirilmesine yazılım literatüründe değerin üzerine yazma yani ______ adı verilir.", "accepted": ["overwriting", "üzerine yazma"]}, "q6": {"type": "open", "closed": false, "text": "kitap_bilgisi = {\"ad\": \"Dîvân-ı Hikmet\", \"yazar\": \"Hoca Ahmed Yesevî\", \"tür\": \"Tasavvuf\"}\ndel kitap_bilgisi[\"tür\"]\nprint(kitap_bilgisi)\nkodu çalıştırıldığında sözlüğün son hâli ekrana nasıl yazdırılır? del ile ikinci kez aynı anahtarı silmeye çalışmanın neden KeyError üreteceğini açıklayınız."}, "q7": {"type": "mc", "closed": true, "text": "Bir sözlükteki belirli bir anahtarı, değerini döndürerek yakalamamıza olanak tanıyan ve aynı zamanda o kaydı sözlükten silen metot aşağıdakilerden hangisidir?", "opts": [".get()", ".clear()", ".pop()", ".keys()", ".items()"], "correct": ".pop()"}, "q8": {"type": "tf", "closed": true, "text": ".clear() metodu çağrıldığında sözlüğün ismi ile değişken arasındaki bağlantı kesilir ve değişken NameError vermeye başlar.", "correct": "Yanlış"}}}, {"no": 27, "baslik": "27. Hafta — Sözlük Analiz Metotları ve İç İçe Veri Yapıları", "baslangicTarihi": "2027-04-05", "konular": [{"id": "p1", "title": "Sözlük İçeriğini Toplu Görüntüleme ve Analiz Metotları", "body": "Karmaşık veri kümeleriyle çalışırken sözlüğün içindeki tüm anahtarları, tüm değerleri veya her ikisini birden toplu görmek ve özellikle for döngüleriyle işlemek için Python'un yerleşik sözlük metotlarından yararlanılır.\n\nkitap_bilgisi = {\n    \"ad\": \"Dîvân-ı Hikmet\",\n    \"yazar\": \"Hoca Ahmed Yesevî\"\n}\nprint(\"Anahtarlar:\", kitap_bilgisi.keys())\nprint(\"Değerler:\", kitap_bilgisi.values())\nprint(\"Anahtar-Değer Çiftleri:\", kitap_bilgisi.items())\n\nÖrnek Çıktı\n\nAnahtarlar: dict_keys(['ad', 'yazar'])\nDeğerler: dict_values(['Dîvân-ı Hikmet', 'Hoca Ahmed Yesevî'])\nAnahtar-Değer Çiftleri: dict_items([('ad', 'Dîvân-ı Hikmet'), ('yazar', 'Hoca Ahmed Yesevî')])\n\nKod Analizi:\n• 1. Adım (keys() Metodu): Sözlükte bulunan anahtarları liste benzeri bir görünüm nesnesi olarak döndürür. Sözlükte hangi anahtarların bulunduğunu görüntülemek veya bu anahtarlar üzerinde işlem yapmak için kullanılır.\n• 2. Adım (values() Metodu): Sözlükteki değerleri liste benzeri bir görünüm nesnesi olarak döndürür. Örneğin sözlükte kayıtlı eser adlarının veya yazar bilgilerinin yalnızca değerlerini görüntülemek ve işlemek için kullanılabilir.\n• 3. Adım (items() Metodu): Sözlükteki her bir anahtar-değer çiftini ikili yapılar (tuple) hâlinde içeren bir görünüm nesnesi döndürür. Sözlükteki anahtar ve değerlerin birlikte incelenmesi ve özellikle bir for döngüsüyle her bir veri çiftinin sırayla işlenmesi için kullanılır.\n\nAnahtar-Değer Mantığı ve Envanter Yönetimi\n\nBir e-ticaret sisteminde ürünlerin stok bilgileri takip edilmektedir. Ürün isimleri ile stok miktarlarının ilişkilendirilerek saklanması, verilere daha düzenli ve anlaşılır biçimde erişilmesini sağlar. Bu kapsamlı senaryoda sözlük oluşturma, anahtar kullanarak değere ulaşma, yeni veri ekleme, mevcut veriyi değiştirme (güncelleme), gereksiz veriyi silme (del) işlemleri ile sözlük içeriğini analiz eden gelişmiş metotların (keys, values, items) bir for döngüsüyle harmanlanması test edilecektir.\n\nprint(\"--- DİJİTAL ENVANTER YÖNETİM SİSTEMİ ---\")\n# 1. Aşama: Sözlük oluşturma\nstok_envanteri = {\n    \"Laptop\": 45,\n    \"Telefon\": 120,\n    \"Kulaklık\": 300\n}\n# 2. Aşama: Anahtar kullanarak değere erişim\ntelefon_stogu = stok_envanteri[\"Telefon\"]\nprint(f\"Güncel Telefon Stoğu: {telefon_stogu} adet\")\n\n# 3. Aşama: Yeni veri ekleme\nstok_envanteri[\"Tablet\"] = 50\nprint(\"[BİLGİ] Tablet ürünü envantere eklendi.\")\n# 4. Aşama: Mevcut değeri değiştirme (Güncelleme)\nstok_envanteri[\"Laptop\"] = 40\nprint(\"[BİLGİ] Laptop stoğu 40 olarak güncellendi.\")\n# 5. Aşama: Sözlükten veri silme (del)\ndel stok_envanteri[\"Kulaklık\"]\nprint(\"[BİLGİ] Kulaklık ürünü envanterden tamamen silindi.\")\n# 6. Aşama: Sözlük metotları ile içeriği görüntüleme (keys, values, items)\nprint(\"--- ENVANTER METOT ANALİZİ ---\")\nprint(\"Anahtarlar (Kayıtlı Ürünler):\", stok_envanteri.keys())\nprint(\"Değerler (Stok Miktarları):\", stok_envanteri.values())\nprint(\"Çiftler (Tüm Kayıtlar):\", stok_envanteri.items())\n# 7. Aşama: for döngüsü kullanımı ile listeleme\nprint(\"--- GÜNCEL ENVANTER DURUMU (FOR DÖNGÜSÜ İLE) ---\")\nfor urun, adet in stok_envanteri.items():\n    print(f\"-> {urun} : {adet} adet stokta mevcuttur.\")\n\nTerminal Çıktısı\n\n--- DİJİTAL ENVANTER YÖNETİM SİSTEMİ ---\nGüncel Telefon Stoğu: 120 adet\n[BİLGİ] Tablet ürünü envantere eklendi.\n[BİLGİ] Laptop stoğu 40 olarak güncellendi.\n[BİLGİ] Kulaklık ürünü envanterden tamamen silindi.\n--- ENVANTER METOT ANALİZİ ---\nAnahtarlar (Kayıtlı Ürünler): dict_keys(['Laptop', 'Telefon', 'Tablet'])\nDeğerler (Stok Miktarları): dict_values([40, 120, 50])\nÇiftler (Tüm Kayıtlar): dict_items([('Laptop', 40), ('Telefon', 120), ('Tablet', 50)])\n--- GÜNCEL ENVANTER DURUMU (FOR DÖNGÜSÜ İLE) ---\n-> Laptop : 40 adet stokta mevcuttur.\n-> Telefon : 120 adet stokta mevcuttur.\n-> Tablet : 50 adet stokta mevcuttur.\n\nKod Analizi:\n• 1. Adım (Oluşturma ve Değer Atama): Sözlük yapısında veriler, anahtar-değer ilişkisiyle bir çatı altında toplanmış ve saklanmıştır. Belirli bir veriye ulaşmak için indeksler yerine anlamlı anahtarlar (\"Telefon\") kullanılarak doğrudan erişim hızı sağlanmıştır.\n• 2. Adım [Dinamik Ekleme ve Değiştirme (Mutability)]: Sözlükler çalışma anında güncellenebilen yapılardır. stok_envanteri[\"Tablet\"] = 50 komutuyla bellekte olmayan yeni bir ürün sözlüğe eklenirken, aynı işlem mevcut olan \"Laptop\" için yapıldığında, eski değerin üzerine yazılarak veri anlık olarak değiştirilmiştir.\n• 3. Adım [Tamamen Silme (del)]: Sistemde artık ihtiyaç duyulmayan \"Kulaklık\" kaydı del komutu kullanılarak sözlükten kalıcı olarak temizlenmiştir.\n• 4. Adım [Toplu Analiz (keys, values, items)]: Sözlüğe ait yerleşik metotlar kullanılarak sistemde kayıtlı ürün adları ve stok değerleri ayrı ayrı listelenmiş ve incelenmiştir.\n• 5. Adım (for Döngüsü Entegrasyonu): Kurumsal bir yazılımın en çok ihtiyaç duyduğu işlemlerden biri olan veri raporlama, sözlüğün items() metoduyla bir for döngüsüne sokulmasıyla gerçekleştirilmiştir. Bu sayede sözlükteki tüm kayıtlar tek tek işlenerek son kullanıcıya temiz ve okunabilir bir formatta sunulmuştur."}, {"id": "p2", "title": "İç İçe Yapılarla Veri Modelleme: Listeler ve Sözlükler", "body": "Gerçek yaşam verileri çoğu zaman tek bir liste veya tek bir sözlük içerisinde tutulamayacak kadar ayrıntılıdır. Bir eserin adı, yazarı, türü gibi bilgiler birbiriyle ilişkilidir. Benzer şekilde bir yazarın birden fazla eseri veya bir eserin birden fazla türü olabilir. Bu tür durumlarda listeler ve sözlükler birlikte kullanılarak daha düzenli veri modelleri oluşturulur.\n\nBir listenin içerisinde sözlükler, bir sözlüğün içerisinde ise listeler veya başka sözlükler bulunabilir. Bu yapılara iç içe veri yapıları (nested structures) adı verilir.\n\n• Bir kütüphanede yüzlerce eser bulunabilir ve her eserin adı, yazarı, türü gibi bilgileri vardır. Bu bilgileri düzenli şekilde saklamak için liste içinde sözlük kullanımı tercih edilebilir; yani her eser bir sözlük olarak tanımlanabilir ve tüm eserler bir liste içerisinde tutulabilir. Verilen örnekte kütüphanedeki eserler bir liste içerisinde saklanmaktadır ve listenin her elemanı bir sözlüktür.\n\neserler = [\n    {\n        \"eser\": \"Dîvân-ı Hikmet\",\n        \"yazar\": \"Hoca Ahmed Yesevî\",\n        \"tur\": \"Tasavvuf\"\n    },\n    {\n        \"eser\": \"Mesnevî\",\n        \"yazar\": \"Mevlânâ\",\n        \"tur\": \"Tasavvuf\"\n    },\n    {\n        \"eser\": \"Risaletü'n Nushiyye\",\n        \"yazar\": \"Yunus Emre\",\n        \"tur\": \"Öğüt\"\n    }\n]\nprint(eserler[1][\"eser\"])\n\nTerminal Çıktısı\n\nMesnevî\n\nKod Analizi:\n• 1. Adım [Veri Hiyerarşisi (Liste İçinde Sözlük)]: Bu mimaride eserler köşeli parantez [ ] ile tanımlanmış bir listedir. Listenin içerisindeki her bir eleman ise süslü parantez { } ile kurgulanmış bağımsız birer sözlüktür. Bu sayede her bir sözlük, tek bir esere ait bilgileri (eser adı, yazar ve tür) anahtar-değer ilişkisiyle kendi içinde bütünlük sağlayarak saklamaktadır.\n• 2. Adım (Zincirleme Erişim): Karmaşık verilerde hedef değere ulaşmak için zincirleme bir adresleme yöntemi kullanılmıştır. Önce eserler komutuyla listenin ikinci elemanına (Mevlânâ'nın eseri) gidilmiş, ardından bu indeksin içindeki sözlüğe ait olan \"eser\" anahtarı [\"eser\"] şeklinde yanına eklenerek Mesnevî çıktısı elde edilmiştir.\n\nBir sözlüğün içindeki değerin de bir liste olması mümkündür. Örneğin bir yazara ait birden fazla eser tek bir anahtarın karşılığına doğrusal bir liste yerleştirilerek gruplandırılabilir.\n\nyazar = {\n    \"ad\": \"Yunus Emre\",\n    \"eserler\": [\n        \"Risaletü'n Nushiyye\",\n        \"Divan\"\n    ]\n}\n# \"eserler\" anahtarına bağlı olan listeyi ekrana yazdırma\nprint(yazar[\"eserler\"])\n\nTerminal Çıktısı\n\n['Risaletü'n Nushiyye', 'Divan']\n\nKod Analizi:\n• 1. Adım (Çoklu Veri Gruplama): Bu mimaride \"eserler\" anahtarının karşılığına doğrusal bir liste yerleştirilmiştir. Böylece bir yazara ait birden fazla eser, yeni anahtarlar oluşturmadan tek bir etiket altında gruplandırılmıştır.\n\nİç içe yapılarda ve büyük veri setlerinde, aranan bazı alt anahtarlar her kayıtta her zaman bulunmayabilir. Bu belirsizlik durumlarında programın hata vermesini engellemek ve veriye güvenli erişim sağlamak için .get() metodu kullanılır. Bu yaklaşım bir sözlüğün içindeki alt sözlüklere inildiğinde de geçerlidir.\n\nyazar = {\n    \"ad\": \"Hoca Ahmed Yesevî\",\n    \"kisisel_bilgiler\": {\n        \"unvan\": \"Pir-i Türkistan\"\n        # 'dogum_yeri' anahtarı bu alt sözlükte tanımlanmamıştır.\n    }\n}\n# İç içe yapıdaki alt sözlüğe girerek bulunmayan bir anahtarı güvenli şekilde sorgulama\ndogum_yeri = yazar[\"kisisel_bilgiler\"].get(\"dogum_yeri\", \"Bilgi bulunamadı.\")\nprint(dogum_yeri)\n\nTerminal Çıktısı\n\nBilgi bulunamadı.\n\nKod Analizi:\n• 1. Adım (Hiyerarşik ve Güvenli Sorgulama): İlk adımda yazar sözlüğünün içindeki \"kisisel_bilgiler\" alt sözlüğüne köşeli parantez [ ] ile inilmiş ancak bu alt sözlüğün içinde \"dogum_yeri\" anahtarının varlığından emin olunamadığı için ikinci adımda .get() metodu devreye sokulmuştur.\n• 2. Adım [Çalışma Zamanı (Runtime) Koruması]: Hedeflenen \"dogum_yeri\" anahtarı alt sözlükte tanımlı olmadığı için zincirleme olarak yazar[\"kisisel_bilgiler\"][\"dogum_yeri\"] şeklinde doğrudan çağrılsaydı program KeyError (Anahtar Hatası) verecekti. Alt sözlüğe eklenen .get() metodu sayesinde sistemin çökmesi engellenmiş ve eksik veri durumunda akışı bozmayacak varsayılan bir bilgi mesajı üretilmiştir."}], "sorular": {"q1": {"type": "open", "closed": false, "text": "stok_envanteri = {\"Laptop\": 45, \"Telefon\": 120, \"Kulaklık\": 300}\nfor urun, adet in stok_envanteri.items():\n    print(f\"-> {urun} : {adet} adet stokta mevcuttur.\")\nkodu çalıştırıldığında items() metodu ve for döngüsü birlikte hangi çıktıyı üretir? Yazınız."}, "q2": {"type": "mc", "closed": true, "text": "Bir sözlüğün içerisindeki tüm verileri \"anahtar\" ve \"değer\" ikilisi olarak gruplandırıp özellikle bir for döngüsünde raporlama yapmak için kullanılan en etkili metot aşağıdakilerden hangisidir?", "opts": [".items()", ".keys()", ".values()", ".pop()", ".clear()"], "correct": ".items()"}, "q3": {"type": "open", "closed": false, "text": "eserler = [\n  {\"eser\": \"Dîvân-ı Hikmet\", \"yazar\": \"Hoca Ahmed Yesevî\", \"tur\": \"Tasavvuf\"},\n  {\"eser\": \"Mesnevî\", \"yazar\": \"Mevlânâ\", \"tur\": \"Tasavvuf\"},\n  {\"eser\": \"Risaletü'n Nushiyye\", \"yazar\": \"Yunus Emre\", \"tur\": \"Öğüt\"}\n]\nprint(eserler[1][\"eser\"])\nkodu çalıştırıldığında ekrana ne yazdırılır? Bu yapının 'liste içinde sözlük' mimarisini nasıl temsil ettiğini açıklayınız."}, "q4": {"type": "tf", "closed": true, "text": "eserler listesinin her bir elemanı süslü parantez {} ile kurgulanmış bağımsız birer sözlüktür ve her bir sözlük, tek bir esere ait bilgileri anahtar-değer ilişkisiyle bütünlük içinde saklar.", "correct": "Doğru"}, "q5": {"type": "open", "closed": false, "text": "yazar = {\"ad\": \"Hoca Ahmed Yesevî\", \"kisisel_bilgiler\": {\"unvan\": \"Pir-i Türkistan\"}}\ndogum_yeri = yazar[\"kisisel_bilgiler\"].get(\"dogum_yeri\", \"Bilgi bulunamadı.\")\nprint(dogum_yeri)\nkodu çalıştırıldığında ekrana ne yazdırılır? Alt sözlük (kisisel_bilgiler) üzerinde .get() kullanmanın neden gerekli olduğunu açıklayınız."}, "q6": {"type": "fill", "closed": true, "text": "Bir listenin içerisinde sözlükler, bir sözlüğün içerisinde ise listeler veya başka sözlükler bulunabilen veri modellerine ______ veri yapıları adı verilir.", "accepted": ["iç içe", "iç içe veri yapıları", "nested"]}, "q7": {"type": "open", "closed": false, "text": "Bu hafta 2. Dönem 1. Sınavımız var. Sınava hazırlık için bu haftanın ve önceki haftaların Egzersizler bölümüne göz atmanızı, özellikle sözlük (dictionary) işlemleri ve iç içe veri yapıları üzerine tekrar yapmanızı öneririz."}}}, {"no": 28, "baslik": "28. Hafta — Dosya İşlemleri (I/O) ve Veri Kalıcılığı", "baslangicTarihi": "2027-04-12", "konular": [{"id": "p1", "title": "Dosya İşlemlerinde Temel Mantık ve open() Fonksiyonu", "body": "Program çalışırken değişkenlerde tutulan veriler genellikle geçici bellekte bulunur. Dosyaya veya başka bir kalıcı depolama ortamına yazılmayan bu veriler, program sona erdiğinde kaybolur. Gerçek dünya projelerinde kullanıcı ayarları, uygulama geçmişi, müşteri bilgileri gibi verilerin kalıcı olması gerekir. Bir defterin sayfalarına not almanın o bilginin yıllarca saklanmasını sağlaması gibi dosya giriş / çıkış [Input/output (I/O)] işlemleri de verilerin kalıcı depolama birimlerinde (Hard Disk veya SSD) saklanmasına olanak tanır.\n\nPython'da bir dosyaya veri yazmak veya dosyadan veri okumak için temel yerleşik open() fonksiyonu kullanılır. Dosyalarla çalışırken izlenmesi gereken işlem süreci; dosyayı açmak, gerekli okuma / yazma işlemini gerçekleştirmek ve ardından dosyayı güvenli bir şekilde kapatmak [close()] şeklinde üç aşamadan oluşur.\n\n# Bir dosyayı yazma modunda ('w') açma\n# Eğer dosya yoksa sıfırdan oluşturulur, varsa eski içeriği tamamen silinir.\ndosya = open(\"kod_asistan_gunluk.txt\", \"w\", encoding=\"utf-8\")\ndosya.write(\"Kod-Asistan hafıza kayıtları başlatıldı.\\n\")\ndosya.close() # İşlem bitince dosya mutlaka kapatılmalıdır.\n\nKod Analizi:\n• Yazma Modu ('w'): Dosyayı \"write\" (yazma) modunda açar. Bu modun en kritik özelliği, dosya zaten mevcutsa içindeki eski verileri silmesidir (Üzerine yazmasıdır.).\n• Karakter Kodlaması (encoding=\"utf-8\"): Türkçe karakterlerin (ç, ş, ğ, ö, ı, ü) sabit diskte bozulmadan saklanabilmesi ve okunabilmesi için evrensel UTF-8 standardı tanımlanmıştır."}, {"id": "p2", "title": "Dosya Yolu (Path) Yönetimi: Mutlak ve Göreceli Yollar", "body": "Bir dosyayı okumak veya diske kaydetmek için işletim sistemine o dosyanın tam olarak nerede bulunduğunun bildirilmesi gerekir. Dosyanın sistem içindeki adresine dosya yolu (path) denir. Yazılım projelerinde dosya yolları temelde iki farklı mimariyle tarif edilir.\n\nBunlardan ilki olan mutlak yol (absolute path), dosyanın bilgisayarın kök sürücüsünden (örneğin C:\\ veya /Users/) başlayarak bulunduğu tam adresi ifade eder (örneğin C:\\Kullanicilar\\Belgeler\\Kod-Asistan\\veriler\\profil.json) ancak bu yöntemin kullanılması programın taşınabilirliğini bozar. Kodlar farklı bir bilgisayarda çalıştırıldığında o bilgisayarda birebir aynı klasör yapısı bulunmayacağı için program hata verebilir.\n\nBu tür hataları engellemek için ikinci mimari olan göreceli yol (relative path) kullanılır. Göreceli yol, genellikle dosyanın geçerli çalışma dizinine göre tarif edilen adrestir. Örneğin çalışan kod dosyasının yanında veriler adında bir alt klasör varsa buraya dosya kaydetmek için uzun bir mutlak yol yazmak yerine sadece veriler/profil.json yazmak yeterli olur. Bu fiziksel adresleme sayesinde proje dosyası harici bir bellekle veya dijital bir depoyla (GitHub vb.) başka bir bilgisayara taşınmasına olanak tanır.\n\nKod Analizi:\n• Mutlak Yol Riski: Bir bilgisayara özgü sabit bir klasör hiyerarşisine dayandığı için proje başka bir bilgisayara veya dijital depoya (GitHub) aktarıldığında dosya bulunamaz ve program FileNotFoundError vererek çöker.\n• Göreceli Yol Avantajı: Yalnızca kod dosyasının bulunduğu çalışma dizinine göre tarif edildiği için proje hangi bilgisayara veya klasöre kopyalanırsa kopyalansın klasör iç yapısı korunduğu sürece kesintisiz çalışır."}, {"id": "p3", "title": "with open() Bağlam Yöneticisi ve Güvenli Dosya Yönetimi", "body": "Dosyaları manuel olarak open() ve close() ile yönetmek, programın çalışma zamanında bir hatayla çökmesi durumunda dosyanın açık kalmasına neden olabilir. Dosyanın açık kalması, dosya tanıtıcısı gibi sistem kaynaklarının gereksiz yere kullanılmasına veya dosyanın kilitli kalmasına yol açabilir. Kurumsal yazılım mimarilerinde with open() yapısı, dosyanın çalışma zamanında bir hata oluştuğunda veya blok sona erdiğinde otomatik olarak kapatılmasını sağlar. Ancak bu yapının bütün dosya hatalarını engellemediği de unutulmamalıdır.\n\n# 'with' yapısı ile güvenli ve otomatik dosya yönetimi\nwith open(\"kullanici_ayarlari.txt\", \"w\", encoding=\"utf-8\") as ayar_dosyasi:\n    ayar_dosyasi.write(\"Tema: Koyu\\n\")\n    ayar_dosyasi.write(\"Dil: Türkçe\")\n\nKod Analizi:\n• with open() Bağlam Yöneticisi: Blok, girintili alan (as ayar_dosyasi ile başlayan satırlar) bittiğinde dosyayı manuel olarak close() çağırmaya gerek kalmadan kendiliğinden kapatır. Blok içinde bir çalışma zamanı hatası oluşsa bile dosya yine güvenli bir şekilde kapatılır.\n\nBilgi Kutusu — Dijital Dünyanın Karakutuları (Log Kayıtları)\n\nUçaklardaki karakutuların kaza anında son saniyeye kadar her şeyi kaydettiğini biliyor musunuz? Benzer şekilde devasa yazılım projelerinde, bankacılık uygulamalarında ve siber güvenlik sistemlerinde de Log (İşlem Geçmişi) adı verilen dijital karakutular bulunur. Bir sunucuya kimin, ne zaman giriş yaptığı veya hangi sistem hatalarının oluştuğu saniye saniye bu dosyalara yazılır. Sistem yöneticileri bu kayıtları tutarak eski verilerin silinmesine asla izin veremezler. Bu yüzden yazılımcılar; geçmişin üzerine yazıp onu yok eden ('w' write) yöntemler yerine, ekleme (append - 'a') standartlarını kullanırlar. 'a' modu, dosya açılırken mevcut içeriği silmeden yeni veriyi dosyanın sonuna ekler. Siber suçların aydınlatılmasında en büyük ipuçları işte bu silinmeyen dijital karakutulardan elde edilir!\n\nKod Analizi:\n• 'w' Modu Riski: Her çalıştırıldığında dosyanın tüm geçmişini sıfırlayıp üzerine yazdığı için log (kayıt) tutulan bir dosyada kullanılırsa geçmiş veriler kalıcı olarak kaybolur.\n• 'a' Modu Güvencesi: Dosya varsa mevcut içeriği korur ve yeni veriyi en sona (kuyruğa) ekler; dosya yoksa sıfırdan oluşturur. Bu nedenle geçmişi bozulmadan büyüyen kayıt (log) dosyaları için standart tercih 'a' modudur."}, {"id": "p4", "title": "Dosyadan Veri Okuma Yöntemleri: read(), readline(), readlines()", "body": "Dosyaya yazılan bilgileri kalıcı bellekten tekrar geçici belleğe almak için okuma modu ('r') kullanılır. Okuma işlemi gerçekleştirilirken bilgisayarın bellek kapasitesine ve okunacak verinin yapısına göre farklı metotlar tercih edilir.\n\nDosya içerisindeki bilginin tamamını tek seferde okumak için read() metodu kullanılır. Bu metot, dosyanın içindeki tüm verileri tek bir karakter dizisi olarak belleğe aktarır. Ancak çok büyük boyutlu dosyalarda tüm veriyi tek seferde belleğe yüklemek, sistem kaynaklarını zorlayabilir ve bellek yetersizliğine yol açabilir. Bu tür büyük hacimli dosyalarda geçici belleği aşırı yüklememek amacıyla readline() metodu devreye girer. Bu metot, dosyanın tamamını otomatik olarak satır satır okumaz; her çağrıda bir satır döndürür ve sadece o anki satırı belleğe taşıyarak güvenli bir veri akışı sağlar.\n\nDosya içerisindeki verilerin bir döngü yardımıyla sırayla işlenmesi veya gruplandırılması isteniyorsa readlines() metodu kullanılabilir. Bu metot, dosyadaki metni okuyarak her bir satırı bir listenin bağımsız elemanı hâline getirir. Ancak readlines() bütün satırları liste hâlinde belleğe yüklediği için büyük dosyalar için readlines() önerisi uygun değildir.\n\n# Dosyayı okuma modunda ('r') güvenli bir şekilde açma\nwith open(\"kullanici_ayarlari.txt\", \"r\", encoding=\"utf-8\") as ayar_dosyasi:\n    okunan_veriler = ayar_dosyasi.read()\n    print(\"--- KAYITLI SİSTEM AYARLARI ---\")\n    print(okunan_veriler)\n\nTerminal Çıktısı\n\n--- KAYITLI SİSTEM AYARLARI ---\nTema: Koyu\nDil: Türkçe\n\nKod Analizi:\n• 1. Adım [Güvenli Okuma ('r')]: Dosya read modunda açılmıştır. Bu modda dosya içeriği değiştirilemez, sadece okuma işlemi gerçekleştirilir.\n• 2. Adım (Bütüncül Aktarım): read() metodu sayesinde dosyadaki tüm metin tek seferde kalıcı diskten okunarak geçici bellekteki okunan_veriler değişkenine aktarılmış ve başarıyla terminal ekranına yazdırılmıştır.\n\nHenüz bilgisayarda var olmayan bir dosya okuma modunda ('r') açılmaya çalışılırsa Python yorumlayıcısı FileNotFoundError hatası vererek programı aniden sonlandırır. Kurumsal yazılım mimarilerinde bu riski ortadan kaldırmak için okuma işlemleri, try-except FileNotFoundError kalıbıyla korunur; böylece dosya henüz oluşturulmamışsa program çökmek yerine kullanıcıya \"Dosya bulunamadı.\" gibi kontrollü bir uyarı gösterir."}], "sorular": {"q1": {"type": "open", "closed": false, "text": "dosya = open(\"kod_asistan_gunluk.txt\", \"w\", encoding=\"utf-8\")\ndosya.write(\"Kod-Asistan hafıza kayıtları başlatıldı.\\n\")\ndosya.close()\nkodunda 'w' (yazma) modunun en kritik özelliği nedir? Dosya zaten mevcutsa ne olur?"}, "q2": {"type": "mc", "closed": true, "text": "with open(\"rapor.txt\", \"w\", encoding=\"utf-8\") as dosya: satırıyla ilgili aşağıda verilen teknik bilgilerden hangisi yanlıştır?", "opts": ["Dosya işlemleri bitince with yapısı sayesinde dosya otomatik olarak kapatılır.", "'w' modu eski verileri koruyarak yeni verileri sona ekler ve utf-8 parametresi Türkçe karakterlerin bozulmasını önler.", "Eğer işletim sisteminde rapor.txt adında bir dosya yoksa sıfırdan yeni bir dosya oluşturulur.", "Dosyanın içine veri yazmak için dosya.write() metodu kullanılır.", "Kod blokundaki with open() yapısı, dosya bağlantısını kurumsal standartlarda yöneterek olası program çökmelerini ve bellek sızıntılarını önler."], "correct": "'w' modu eski verileri koruyarak yeni verileri sona ekler ve utf-8 parametresi Türkçe karakterlerin bozulmasını önler."}, "q3": {"type": "tf", "closed": true, "text": "'a' (append) modu, dosya yoksa oluşturur, varsa içeriğini silmeden yeni veriyi dosyanın en sonuna (kuyruğuna) ekler.", "correct": "Doğru"}, "q4": {"type": "fill", "closed": true, "text": "Kurumsal bir bilgisayar projesinde 'C:\\Kullanicilar\\Belgeler\\veri.json' gibi mutlak bir dosya yolu yerine 'veriler/veri.json' gibi ______ bir dosya yolunun kullanılması, projenin farklı bilgisayarlarda hatasız çalışabilmesini (taşınabilirliğini) sağlar.", "accepted": ["göreceli", "relative", "göreceli (relative)"]}, "q5": {"type": "open", "closed": false, "text": "3. Uygulama'daki (Kod-Asistan Hafıza Dosyası - Log - Yönetimi) senaryoya göre, asistan_hafiza.txt dosyası henüz hiç oluşturulmamışken program bu dosyayı 'r' modunda okumaya çalışırsa hangi hata oluşur? Bu hatayı engellemek için okuma bloğunun hangi yapı içine (try-except) alınması gerektiğini açıklayınız."}, "q6": {"type": "mc", "closed": true, "text": "Dosya içerisindeki verilerin bir döngü yardımıyla sırayla işlenmesi veya gruplandırılması isteniyorsa aşağıdaki metotlardan hangisi kullanılır?", "opts": [".read()", ".write()", ".readlines()", ".close()", ".get()"], "correct": ".readlines()"}, "q7": {"type": "open", "closed": false, "text": "4. Uygulama'daki (Kullanıcı Geri Bildirim Feedback Arşivi) senaryoya göre geri_bildirimler.txt dosyasındaki kayıtlar readlines() metoduyla okunup her biri numaralandırılarak (1. Yorum, 2. Yorum) terminale yazdırılacaktır. Dosya henüz hiçbir yorum içermiyorsa bu durumu try-except ile nasıl güvenli hâle getirirsiniz?"}}}, {"no": 29, "baslik": "29. Hafta — JSON Formatı, Git/GitHub Entegrasyonu ve .gitignore", "baslangicTarihi": "2027-04-19", "konular": [{"id": "p1", "title": "Veri Formatları ve JSON'a Giriş: Neden Yapılandırılmış Veri?", "body": "Metin (txt) dosyaları, verileri sadece düz bir karakter dizisi (string) olarak saklar. Karmaşık bir sözlük yapısındaki veriler (örneğin alt sözlükler veya listeler) doğrudan txt dosyasına yazdırılırsa okunurken tekrar programlanabilir nesnelere dönüştürülmesi oldukça zorlaşır. Endüstriyel yazılım projelerinde, API entegrasyonlarında ve veri depolama işlemlerinde verinin anahtar-değer hiyerarşisini kaybetmeden kalıcı hâle getirilmesi için yapılandırılmış veri formatları kullanılır. JSON (JavaScript Object Notation), yapılandırılmış verilerin saklanması ve sistemler arasında aktarılması için yaygın olarak kullanılan metin tabanlı veri formatlarından biridir.\n\nJSON formatı, Python'daki sözlük ve liste yapılarına benzese de önemli farklar barındırır. JSON anahtarları çift tırnaklı metin olmalıdır, tek tırnak geçerli değildir. Ayrıca Python'daki True, False, None yerine true, false, null kullanılır ve tuple gibi bazı Python türlerinin JSON formatında doğrudan karşılığı bulunmaz. Bu nedenle Python projelerinde karmaşık verileri diskte saklamak ve daha sonra belleğe geri almak için JSON tercih edilir.\n\nKod Analizi:\n• JSON – Python Sözlüğü Farkı: JSON'da anahtarlar mutlaka çift tırnak (\") ile yazılır; Python'daki True/False/None karşılığında JSON'da küçük harfli true/false/null kullanılır; tuple gibi bazı Python veri türlerinin JSON formatında birebir karşılığı yoktur, bu tür veriler JSON'a yazılırken listeye dönüştürülür."}, {"id": "p2", "title": "Sözlük Yapılarını JSON Formatında Saklama ve Okuma", "body": "Python'da JSON dosyalarıyla çalışmak için Python standart kütüphanesinde bulunan json modülü projeye dâhil edilir. Verileri dosyaya yazmak için json.dump(), dosyadan okumak için ise json.load() metotları kullanılır. json.load() ile alınan verinin her zaman orijinal Python yapısıyla aynı olacağı düşünülmemelidir, yalnızca JSON tarafından desteklenen veri türleri uygun Python türlerine dönüştürülür. Verilerin JSON formatında saklanmasının avantajları, bir hava durumu simülasyonu sensör verileri üzerinden şu örnekte modellenmiştir:\n\nimport json\n# Hava durumu simülasyonu için anlık sensör verilerini tutan sözlük\nhava_durumu_verisi = {\n    \"sehir\": \"Ankara\",\n    \"sicaklik_c\": 15.5,\n    \"durum\": \"Parçalı Bulutlu\",\n    \"sensorler_aktif\": True\n}\n# 1. Aşama: Veriyi JSON formatında dosyaya kaydetme\nwith open(\"hava_durumu.json\", \"w\", encoding=\"utf-8\") as dosya:\n    json.dump(hava_durumu_verisi, dosya, ensure_ascii=False, indent=4)\n    print(\"[BİLGİ] Hava durumu simülasyon verileri JSON formatında kalıcı olarak diske yazıldı.\")\n# 2. Aşama: JSON dosyasından veriyi orijinal sözlük yapısıyla belleğe geri alma\nwith open(\"hava_durumu.json\", \"r\", encoding=\"utf-8\") as dosya:\n    simulasyon_kaydi = json.load(dosya)\n    print(\"--- KAYITLI SİMÜLASYON VERİLERİ ---\")\n    print(f\"Şehir: {simulasyon_kaydi['sehir']} | Sıcaklık: {simulasyon_kaydi['sicaklik_c']}°C\")\n\nTerminal Çıktısı\n\n[BİLGİ] Hava durumu simülasyon verileri JSON formatında kalıcı olarak diske yazıldı.\n--- KAYITLI SİMÜLASYON VERİLERİ ---\nŞehir: Ankara | Sıcaklık: 15.5°C\n\nKod Analizi:\n• 1. Adım [json.dump() ile Yapılandırılmış Kayıt]: Bu metot, hava_durumu_verisi adlı sözlüğü diske yazarken veri tiplerini (float, bool) korur. encoding=\"utf-8\" parametresi dosyanın UTF-8 kodlamasıyla yazılmasını, ensure_ascii=False parametresi ise Türkçe karakterlerin (ç, ş, ğ) JSON dosyasında okunabilir biçimde görünmesini sağlar. indent=4 parametresi ise verilerin 4 boşluklu hiyerarşik bir girintiyle insanlar tarafından kolay okunabilir bir formata bürünmesini sağlamıştır.\n• 2. Adım [json.load() ile Veriyi Geri Yükleme]: Dosyadan okunan veriler, RAM'e rastgele metinler olarak değil JSON verisinden yeni bir Python sözlüğü oluşturularak geri döner. JSON tarafından desteklenen sayı, metin, liste, sözlük, Boolean ve null türleri uygun Python türlerine dönüştürülebilir ancak her Python nesnesi kayıpsız saklanamaz.\n\nİç İçe Veri Yapılarının JSON Formatında Yönetimi\n\nKod-Asistan projesinde birden fazla kullanıcıya ait profil ayarlarının (tema, dil, bildirim onayları) program kapatıldığında kaybolmaması için tek bir merkezî dosyada kalıcı olarak saklanması gerekmektedir. Bu karmaşık ve iç içe geçmiş sözlük yapısının, anahtar-değer hiyerarşisi bozulmadan diske yazılması ve okunması test edilecektir.\n\nimport json\n# İç içe sözlük yapısındaki kullanıcı veri tabanı\nkullanici_veritabani = {\n    \"Kullanici_1\": {\"ad\": \"Bilge\", \"tema\": \"Koyu\", \"dil\": \"Türkçe\"},\n    \"Kullanici_2\": {\"ad\": \"Kağan\", \"tema\": \"Açık\", \"dil\": \"İngilizce\"}\n}\n# 1. Aşama: Veriyi hiyerarşik JSON formatında dosyaya kaydetme\nwith open(\"kullanici_veritabani.json\", \"w\", encoding=\"utf-8\") as dosya:\n    json.dump(kullanici_veritabani, dosya, ensure_ascii=False, indent=4)\n    print(\"[BİLGİ] Kullanıcı veritabanı JSON formatında diske yazıldı.\")\n# 2. Aşama: JSON dosyasından veriyi orijinal sözlük objesi olarak geri alma\nwith open(\"kullanici_veritabani.json\", \"r\", encoding=\"utf-8\") as dosya:\n    yuklenen_veriler = json.load(dosya)\n    print(\"--- YÜKLENEN VERİ TABANI ---\")\n    print(f\"Kullanıcı 1 Adı: {yuklenen_veriler['Kullanici_1']['ad']}\")\n    print(f\"Kullanıcı 2 Tema: {yuklenen_veriler['Kullanici_2']['tema']}\")\n\nTerminal Çıktısı\n\n[BİLGİ] Kullanıcı veritabanı JSON formatında diske yazıldı.\n--- YÜKLENEN VERİ TABANI ---\nKullanıcı 1 Adı: Bilge\nKullanıcı 2 Tema: Açık\n\nKod Analizi:\n• 1. Adım [json.dump() ile Yapılandırılmış Kayıt]: Kayıt esnasında kullanılan encoding=\"utf-8\" parametresi dosyanın UTF-8 kodlamasıyla yazılmasını, ensure_ascii=False parametresi ise Türkçe karakterlerin (ç, ş, ğ) JSON dosyasında okunabilir biçimde görünmesini sağlar. indent=4 parametresi ise verilerin 4 boşluklu hiyerarşik bir girintiyle insanlar tarafından kolay okunabilir bir formata bürünmesini sağlamıştır.\n• 2. Adım [json.load() ile Veriyi Geri Yükleme]: JSON tarafından desteklenen sayı, metin, liste, sözlük, Boolean ve null türleri uygun Python türlerine dönüştürülebilir. Bu dönüştürme sayesinde iç içe adresleme ([\"Kullanici_1\"][\"ad\"]) mantığı hatasız şekilde işletilebilmiştir."}, {"id": "p3", "title": "Kod Editörü ile Yerel Sürüm Kontrolü (Git) ve GitHub Entegrasyonu", "body": "Geliştirilen Kod-Asistan projeleri, internet tarayıcısı üzerinden sürükle-bırak yöntemiyle depoya yüklenebilmektedir ancak Git kullanımının temel avantajı; değişiklik geçmişini, dalları, commitleri ve eşitleme işlemlerini daha sistemli yönetmesidir.\n\nBilişim dünyasında kodlar, geliştirme ortamının kendi içerisindeki Kaynak Denetimi (Source Control) paneli üzerinden yönetilir. Bu sayede kodlar önce bilgisayarda (yerel Git deposunda) kayıt altına alınır, ardından güvenli bir tünel üzerinden doğrudan bulut deposuna eşitlenir (Push edilir).\n\nBu profesyonel yaklaşım, önemli belgeleri büyük bir kütüphane arşivine elden gelişigüzel teslim etmek yerine evrakları önce kendi çalışma masanızda (yerel depo) tasnif etmeye ve yalnızca onaylanmış olanları güvenli bir taşıma hattıyla doğrudan ana arşive (bulut deposu) eşitlemeye benzetilebilir. Yazılım dünyasında da sürükle-bırak yönteminin yarattığı denetimsizlikten kurtulmak ve ekip çalışmasını standartlara bağlamak için kaynak kodlar doğrudan kod editörü üzerinden yönetilir. Bu yapısal hiyerarşi sayesinde projeye ait hassas ayarlar veya kişisel veriler küresel depoya sızmadan, henüz bilgisayar aşamasındayken filtrelenerek dijital güvenlik güvence altına alınır.\n\nKod editöründeki Kaynak Denetimi panelinin aktif çalışabilmesi için bilgisayarda Git yazılımının kurulu olması, ardından editörün GitHub hesabıyla iletişim kurabilmesi için resmî GitHub eklentisinin (GitHub Pull Requests and Issues) yüklenmesi gerekir. Proje klasörü kod editöründe açıldıktan sonra Kaynak Denetimi panelindeki Initialize Repository (Depoyu Başlat) komutu ile klasör, gizli bir .git dosyasıyla yerel bir Git sürüm kontrol merkezine dönüştürülür. Ardından panel üzerinden Remote > Add Remote komutuyla GitHub'da oluşturulan bulut deposunun adresi (URL) yerel depoya bağlanır.\n\nDosyalarda yapılan her değişiklik, önce Changes (Değişiklikler) başlığının yanındaki + [Stage Changes] simgesiyle hazırlama alanına eklenir (Stage edilir), ardından Message kutusuna kısa ve açıklayıcı bir sürüm notu yazılarak Commit (İşle) butonuyla bu değişiklikler yerel depoda kalıcı olarak kayıt altına alınır. Yerel depodaki commitlerin GitHub'daki bulut deposuna aktarılması için ise Publish Branch veya Sync Changes (Değişiklikleri Senkronize Et) butonu kullanılır; bu işlem gerçekleştirilirken kod editörü kullanıcıdan GitHub hesabına giriş yapmasını (Sign in to GitHub) isteyerek yetkilendirmeyi tamamlar. Bu profesyonel iş akışı sayesinde kodlar, tarayıcıya ihtiyaç duymadan doğrudan kod editörü üzerinden bulut deposuna aktarılabilir.\n\nKod Analizi:\n• Initialize Repository: Proje klasörünü, gizli bir .git dosyasıyla değişiklik geçmişini takip edebilen yerel bir Git deposuna dönüştürür.\n• Stage – Commit – Sync Zinciri: Değişiklikler önce hazırlama alanına eklenir (stage), ardından bir sürüm notuyla yerel depoya kaydedilir (commit), son olarak bulut deposuyla eşitlenir (sync/push); bu üç adım sıralı işletilmeden değişiklikler GitHub'a ulaşmaz."}, {"id": "p4", "title": "Veri Bütünlüğü ve Sürüm Kontrolü: .gitignore Yapılandırması", "body": "Yazılım projeleri dijital depolarda açık kaynaklı veya ekip içi kullanıma sunulurken kodların bulunduğu klasördeki her dosyanın buluta yüklenmesi güvenlik zafiyetlerine yol açar. Örneğin kişisel veri, parola, erişim anahtarı veya paylaşılmaması gereken sistem bilgileri içeren dosyalar herkese açık depolara aktarılmamalıdır.\n\nBir projedeki hangi dosyaların veya klasörlerin sürüm kontrol sistemine dâhil edilmeyeceğini ve dijital depoya aktarılmayacağını belirleyen yapılandırma dosyasına .gitignore adı verilir. .gitignore, doğrudan veri bütünlüğü sağlayan veya dosyaları koruyan bir güvenlik sistemi değildir. Git'e hangi izlenmeyen dosya ve klasörleri commit kapsamı dışında tutacağını bildirir.\n\nUygulama aşamasında, projenin ana dizininde (kodların bulunduğu klasörde) .gitignore (önünde nokta olacak şekilde) adında uzantısız bir metin dosyası oluşturulur. Dijital depoya aktarılması istenmeyen dosyaların isimleri veya uzantıları bu belgeye satır satır yazılır. Burada dikkat edilmesi gereken en önemli sektörel kural, daha önce dijital depoya yüklenmiş olan dosyaların sonradan .gitignore listesine eklense bile geçmiş sürüm kayıtlarından otomatik olarak silinmemesidir. Daha önce Git tarafından izlenmeye başlanmış bir dosya yalnızca .gitignore dosyasına eklenerek izleme kapsamından çıkarılmaz. Önce Git indeksinden kaldırılması gerekir. Bu veri sızıntısı riskini önlemek için yapılandırma işlemlerinin projeye ait kodlar buluta yüklenmeden önce en başından itibaren kurgulanması gerekir.\n\nÖrnek .gitignore Dosyası İçeriği\n\n# 1. Hassas veri ve log dosyalarını gizleme\nasistan_hafiza.txt\ngeri_bildirimler.txt\n# 2. 'veriler' adlı klasörü ve içindeki kişisel JSON dosyalarını gizleme\nveriler/\n*.json\n# 3. Geliştirme ortamı (IDE) ve Python önbellek klasörlerini gizleme\n.vscode/\n__pycache__/\n*.pyc\n\nKod Analizi:\n• 1. Adım [Görünmezlik (VS Code Tepkisi)]: .gitignore dosyası kaydedildikten sonra, yalnızca daha önce izlenmemiş dosyalar Kaynak Denetimi panelindeki değişiklikler listesinden kaybolur. Editör, bu dosyaları Commit işlemine dâhil etmez. İzlenen dosyalar .gitignore dosyasına eklendikten sonra Kaynak Denetimi panelinden otomatik olarak kaybolmaz.\n• 2. Adım [Klasör Dışlama (/ İşareti)]: Sonuna / (eğik çizgi) konulan isimler (örneğin veriler/), sistem tarafından klasör olarak algılanır. İçinde yüzlerce dosya olsa bile bu klasör bulut yüklemesinden tamamen hariç tutulur.\n• 3. Adım [Joker Karakter (* İşareti)]: Başına yıldız konulan uzantılar (örneğin *.json), dosya adı ne olursa olsun belirtilen izlenmeyen dosyaların yanlışlıkla commit edilmesi riskini azaltır; .gitignore tek başına dosya güvenliği veya gizlilik sağlamaz."}], "sorular": {"q1": {"type": "open", "closed": false, "text": "import json\nhava_durumu_verisi = {\"sehir\": \"Ankara\", \"sicaklik_c\": 15.5, \"durum\": \"Parçalı Bulutlu\", \"sensorler_aktif\": True}\nwith open(\"hava_durumu.json\", \"w\", encoding=\"utf-8\") as dosya:\n    json.dump(hava_durumu_verisi, dosya, ensure_ascii=False, indent=4)\nkodunda ensure_ascii=False ve indent=4 parametrelerinin görevlerini açıklayınız."}, "q2": {"type": "mc", "closed": true, "text": "Aşağıdakilerden hangisi json.load() metodunun programlama süreçlerindeki temel işlevidir?", "opts": ["Sözlüklerdeki gereksiz verileri hafızadan temizler.", "Diskteki bir metin dosyasının adını ve dosya yolunu değiştirir.", "İnternet üzerinden Python yorumlayıcısına yeni kütüphaneler indirir.", "Dosyayı salt okunur metin (.txt) olarak açıp satır satır terminale yazar.", "JSON formatında yapılandırılmış bir veriyi bir sözlük objesi olarak yükler."], "correct": "JSON formatında yapılandırılmış bir veriyi bir sözlük objesi olarak yükler."}, "q3": {"type": "open", "closed": false, "text": "kullanici_veritabani = {\"Kullanici_1\": {\"ad\": \"Bilge\", \"tema\": \"Koyu\", \"dil\": \"Türkçe\"}, \"Kullanici_2\": {\"ad\": \"Kağan\", \"tema\": \"Açık\", \"dil\": \"İngilizce\"}}\njson.dump ile kullanici_veritabani.json dosyasına yazılan bu iç içe sözlük yapısı, json.load() ile geri okunduğunda yuklenen_veriler['Kullanici_1']['ad'] ifadesi hangi değeri verir? Yazınız."}, "q4": {"type": "tf", "closed": true, "text": "VS Code'da bir projeyi ilk kez Git sürüm kontrolüne dâhil etmek için Kaynak Denetimi panelindeki Initialize Repository (Depoyu Başlat) butonuna tıklanır; bu işlem klasörün içine gizli bir .git dosyası ekler.", "correct": "Doğru"}, "q5": {"type": "fill", "closed": true, "text": "Bir projedeki hangi dosyaların veya klasörlerin sürüm kontrol sistemine (Git'e) dâhil edilmeyeceğini belirleyen yapılandırma dosyasına ______ adı verilir.", "accepted": [".gitignore", "gitignore"]}, "q6": {"type": "open", "closed": false, "text": "Bir geliştirici, sistem ayarlarını barındıran ayarlar.json dosyasını with open() mimarisi ve json.dump() metoduyla diske başarılı bir şekilde kaydetmiştir. Bu projenin bulut deposuna yüklenmesi aşamasında, bu ayar dosyasının dış dünyadan gizlenmesi için dosya adının aşağıdaki yapılandırma dosyalarından hangisinin içine yazılması gerekir? Nedenini açıklayınız."}, "q7": {"type": "mc", "closed": true, "text": "Kurumsal bir yazılım projesi kodlanırken \"C:\\Kullanicilar\\Belgeler\\veri.json\" gibi mutlak bir dosya yolu yerine doğrudan \"veriler/veri.json\" gibi göreceli bir dosya yolunun tercih edilmesinin asıl sebebi aşağıdakilerden hangisidir?", "opts": ["Diskte daha az depolama alanı kaplaması", "Dosyanın yapay zekâ tarafından okunmasını engellemesi", "JSON formatının mutlak dosya yollarını desteklememesi", "Proje başka bilgisayara taşındığında programın çökmeden çalışması", "Göreceli yolların sadece Python diline özgü olması"], "correct": "Proje başka bilgisayara taşındığında programın çökmeden çalışması"}}}, {"no": 30, "baslik": "30. Hafta — Yapay Zekâ ile Veri Format Denetimi", "baslangicTarihi": "2027-04-26", "konular": [{"id": "p1", "title": "Yapay Zekâ Danışmanlığı ile Veri Formatı Dönüşümü", "body": "Yapay zekâ asistanları (LLM), karmaşık veri setlerinin JSON formatına dönüştürülmesinde ve .gitignore dosyalarının yapılandırılmasında bir danışman olarak kullanılabilir. Örneğin sisteme entegre edilecek yeni bir veri modelini (XML veya CSV) JSON yapısına çevirmekte zorlanıldığında, yapay zekâya örnek veri seti sunularak kurallara uygun (eksik virgüller veya tırnak işaretlerinden arındırılmış) bir JSON şablonu oluşturması talep edilebilir. İnsan Denetimi prensibi gereği, üretilen şablonun projeye uygunluğu her zaman geliştirici tarafından test edilmelidir.\n\nYapay Zekâ Danışmanlığı ile CSV'den JSON Formatına Dönüştürme\n\nKod-Asistan projesine eski bir yazılımdan alınan kullanıcı iletişim bilgileri aktarılacaktır. Bu veriler, günümüzde de yaygın kullanılan basit, tablo tabanlı bir veri formatı olan CSV (Virgülle Ayrılmış Değerler) formatındadır. Bu karmaşık veri setinin, sistemin anlayabileceği yapılandırılmış JSON formatına dönüştürülmesinde bir Yapay Zekâ (LLM) modeli danışman olarak kullanılacak ve üretilen şablon İnsan Denetimi süzgecinden geçirilecektir. Yapay zekâ aracına gerçek kullanıcı iletişim bilgileri, kişisel veriler veya gizli proje verileri gönderilmemesi gerektiği unutulmamalıdır.\n\nYapay Zekâya Verilen Komut (Prompt): \"Elimde eski sistemden alınmış şu CSV verisi bulunuyor: id, isim, rol 101, Bilge, Yönetici 102, Kağan, Misafir. Lütfen bu veri setini Python'da kullanabileceğim, eksik virgüllerden ve tırnak işaretlerinden arındırılmış kurallara uygun bir JSON şablonu hâline dönüştürür müsün?\"\n\n{\n    \"kullanicilar\": [\n        {\n            \"id\": 101,\n            \"isim\": \"Bilge\",\n            \"rol\": \"Yönetici\"\n        },\n        {\n            \"id\": 102,\n            \"isim\": \"Kağan\",\n            \"rol\": \"Misafir\"\n        }\n    ]\n}\n\nYapay Zekâ Çıktısı (JSON Şablonu)\n\nKod Analizi:\n• 1. Adım (Yapay Zekâ Danışmanlığı): Yapay zekâ asistanları (LLM), karmaşık veri setlerinin JSON formatına dönüştürülmesinde son derece hızlı ve verimli bir danışman olarak görev yapmaktadır. CSV formatındaki düz metin, saniyeler içinde Python projelerinde kullanılabilecek hiyerarşik bir sözlük ve liste kombinasyonuna çevrilmiştir."}, {"id": "p2", "title": "Yapay Zekâ Çıktılarının İnsan Denetimi ile Doğrulanması", "body": "İnsan Denetimi prensibi gereği yapay zekânın ürettiği bu şablonun projeye uygunluğu her zaman geliştirici tarafından test edilmelidir. JSON denetimi yalnızca bir uzmanın gözle incelemesine bırakılmamalıdır. Söz diziminin gerçekten geçerli olup olmadığı ayrıştırıcısıyla (parser, örneğin Python'daki json.load() metoduyla) test edilmelidir. Yapay zekâ görüşü yardımcı değerlendirme olarak kullanılmalı, asıl doğrulama program içinde json.load() metoduyla yapılmalıdır.\n\nBu denetim disiplini, özellikle bir üretim (production) ortamına aktarılacak verilerde büyük önem taşır. Yapay zekâdan alınan doğrulama raporu (varsa eksiklikleriyle) incelenerek uygulama test edilmeli, sözlük anahtarlarının çift tırnaklı olup olmadığı, sondaki fazladan virgüllerin (trailing comma) temizlenip temizlenmediği ve Türkçe karakterlerin bozulmadan korunup korunmadığı özellikle kontrol edilmelidir. Yapay zekâ aracına gönderilecek görev verilerinde kişisel veya gizli bilgi bulunmaması gerektiği de unutulmamalıdır; gerçek kullanıcı adları, iletişim bilgileri veya kimlik numaraları yerine örnek (mock) veriler kullanılmalıdır.\n\nKod Analizi:\n• Yapay Zekâ = Danışman, Program = Hakem: Yapay zekânın \"bu JSON doğru görünüyor\" demesi yeterli bir kanıt değildir; üretilen şablon mutlaka json.load() ile programın kendisi tarafından ayrıştırılarak (parse edilerek) test edilmeli, hata verirse (örneğin JSONDecodeError) tırnak veya virgül hatası düzeltilmelidir.\n• Veri Gizliliği İlkesi: Yapay zekâ asistanlarına gönderilen istemlerde (prompt) gerçek ad, telefon, adres, şifre gibi kişisel veya gizli bilgiler yer almamalı, bunların yerine örnek (mock) veriler kullanılmalıdır."}, {"id": "p3", "title": "Hassas Verilerin Dizin Hiyerarşisi ile Korunması", "body": "JSON formatıyla kaydedilen yapılandırılmış verilerin tek bir ana dizinde yığılması, devasa bir kütüphanedeki tüm kitapların konu raflarına ayrılmadan aynı salona doldurulmasına benzetilebilir. Büyük yazılım projelerinde veri dosyalarının birbirine karışmasını engellemek ve sürdürülebilirliği sağlamak için dosyalar, hiyerarşik alt klasörler içerisinde organize edilir. Bu sistematik yapı, programın farklı bilgisayarlara taşındığında veya bulut üzerinden paylaşıldığında dizin hatası vermeden çalışabilmesi için göreceli dosya yollarıyla kurgulanır.\n\nKütüphanelerde okuyuculara açık olan genel salonların yanı sıra sadece yetkililerin erişebildiği ve hassas kurumsal belgelerin tutulduğu kapalı arşiv odaları bulunur. Yazılım projeleri genel bulut depolarına aktarılırken veri mahremiyetini sağlamak adına doğrudan bu kapalı arşiv mantığına ihtiyaç duyulur. Kullanıcıların kişisel profil ayarlarını veya sistem günlüklerini barındıran hassas dosyaların herkesin erişimine açık küresel depolara sızması, dijital güvenlik açısından son derece tehlikeli bir zafiyet oluşturur. Bu tür veri sızıntılarını engellemek ve kişisel verilerin gizliliğini korumak amacıyla proje klasörlerinde özel yapılandırma belgeleri (.gitignore) kullanılır. Hangi alt klasörlerin veya veri uzantılarının küresel takipten çıkarılacağı kurallara bağlanarak bir koruma kalkanı inşa edilir. Kurulan bu mimari, veriyi sadece başarılı bir şekilde diske yazmayı değil aynı zamanda verinin dijital dünyadaki güvenliğini savunma bilincini yazılım geliştirme sürecinin merkezine yerleştirir.\n\nKod Analizi:\n• Genel Salon – Kapalı Arşiv Benzetmesi: Bir projedeki genel kaynak kodlar (main.py gibi) herkese açık \"genel salon\" niteliğindeyken; kullanıcı profili, hafıza kaydı veya sistem günlüğü gibi hassas veri dosyaları \"kapalı arşiv odası\" gibi ele alınmalı, .gitignore ile küresel depoya sızmaları engellenmelidir.\n• Hiyerarşik Klasörleme: Veri dosyalarının veriler/ gibi ayrı bir alt klasörde toplanması, hem projenin düzenini hem de .gitignore içinde tek bir kural (veriler/) ile tüm hassas dosyaların birlikte gizlenebilmesini kolaylaştırır."}], "sorular": {"q1": {"type": "open", "closed": false, "text": "Yapay Zekâya Verilen Komut (Prompt): \"Elimde eski sistemden alınmış şu CSV verisi bulunuyor: id, isim, rol 101, Bilge, Yönetici 102, Kağan, Misafir. Lütfen bu veri setini Python'da kullanabileceğim, eksik virgüllerden ve tırnak işaretlerinden arındırılmış kurallara uygun bir JSON şablonu hâline dönüştürür müsün?\" örneğinde olduğu gibi, yapay zekâya gerçek kullanıcı iletişim bilgileri yerine örnek/anonim veri göndermenin veri güvenliği açısından önemini açıklayınız."}, "q2": {"type": "tf", "closed": true, "text": "Yapay zekâ tarafından üretilen bir JSON şablonunun projeye uygunluğu yalnızca gözle incelenerek yeterli sayılabilir; program içinde json.load() ile ayrıca test edilmesine gerek yoktur.", "correct": "Yanlış"}, "q3": {"type": "open", "closed": false, "text": "6. Uygulama'daki (Kod-Asistan JSON Tabanlı Görev Yöneticisi) senaryoya göre gorevler.json dosyasına json.dump() ile kaydedilen görev adı, öncelik durumu ve tamamlanma bilgisini içeren iç içe geçmiş sözlük yapısı, json.load() ile RAM'e geri yüklendiğinde yapısal özelliklerini (anahtar-değer hiyerarşisini) neden korur?"}, "q4": {"type": "mc", "closed": true, "text": "Bir geliştirici, kullanıcı profil ayarlarını (isim, tema, dil) JSON formatında veriler adlı bir alt klasörün içine göreceli dosya yoluyla (\"veriler/profil.json\") kaydetmiştir. Bu 'veriler' adlı alt klasörün tamamını ve içindeki tüm .json dosyalarını Git takibinden çıkarmak için .gitignore dosyasına hangi kural yazılmalıdır?", "opts": ["veriler.json", "veriler/", "*.py", "README.md", ".git"], "correct": "veriler/"}, "q5": {"type": "open", "closed": false, "text": "7. Uygulama'daki (Profil Verilerinin JSON ile Saklanması ve Dosya Yolu Yönetimi) senaryosunda kullanılan yapay zekâ danışmanlığı sürecinde, yapay zekâdan alınan .gitignore kuralı yanıtının neden doğrudan projeye uygulanmayıp önce İnsan Denetimi süzgecinden geçirilmesi gerektiğini açıklayınız."}}}, {"no": 31, "baslik": "31. Hafta — Ünite 5 Ölçme ve Değerlendirme", "baslangicTarihi": "2027-05-03", "konular": [{"id": "p1", "title": "Özet: Sözlük Veri Yapısı ve Güvenli Veri Erişimi", "body": "Bu ünitede öğrendiklerimiz arasında ilk temel kazanım, verileri sayısal indeks numaraları yerine anlamlı anahtar-değer (key-value) ilişkisiyle organize eden sözlük (dictionary) veri yapısıdır; süslü parantez { } ile tanımlanan bu yapıda her anahtar benzersizdir ve iki nokta (:) işaretiyle karşılığındaki değere bağlanır. İkinci kazanım, sözlükteki bir değere köşeli parantez [ ] ile anahtar üzerinden doğrudan erişilebileceği ancak sözlükte tanımlı olmayan bir anahtara bu şekilde erişilmeye çalışılmasının programı KeyError hatasıyla aniden çökerteceğidir; bu riski ortadan kaldırmak için bulunmayan bir anahtar sorgulandığında hata vermek yerine varsayılan bir değer döndüren .get() metodu kullanılır ve böylece veriye güvenli erişim sağlanır.\n\nÜçüncü kazanım, sözlüklerin çalışma zamanında değiştirilebilir (mutable) yapılar olmasıdır: köşeli parantez içine yeni bir anahtar yazılıp değer atanırsa sözlüğe yeni bir kayıt eklenir, var olan bir anahtara değer atanırsa eski değer yenisiyle değiştirilir (güncellenir); bir anahtarı ve değerini kalıcı olarak kaldırmak için del anahtar kelimesi, değeri geri döndürerek silmek için .pop() metodu, sözlüğün tamamını boşaltmak için ise .clear() metodu kullanılır. Dördüncü kazanım, sözlüğün tüm anahtarlarını keys(), tüm değerlerini values(), anahtar-değer çiftlerinin tamamını ise items() metoduyla toplu görüntüleyip özellikle bir for döngüsüyle sırayla işleyebilmektir."}, {"id": "p2", "title": "Özet: İç İçe Veri Yapıları ve Dosya İşlemleri (I/O)", "body": "Beşinci kazanım, gerçek yaşam verilerinin tek bir liste veya tek bir sözlükle ifade edilemeyecek kadar karmaşık olabileceği ve bu durumda liste içinde sözlük, sözlük içinde liste veya sözlük içinde sözlük şeklinde iç içe veri yapıları (nested structures) kurulabileceğidir; bu yapılarda hedef veriye zincirleme adresleme (örneğin eserler[1][\"eser\"]) ile ulaşılır ve alt sözlüklerdeki belirsiz anahtarlara yine .get() metoduyla güvenli erişim sağlanır.\n\nAltıncı kazanım, dosya giriş / çıkış (I/O) işlemleridir: değişkenlerde tutulan veriler program kapandığında kaybolduğu için kalıcı hâle getirilmek istenen veriler open() fonksiyonuyla diske yazılır; 'w' (write) modu dosyayı sıfırlar ve üzerine yazar, 'a' (append) modu ise mevcut içeriği korur ve yeni veriyi sonuna ekler, 'r' (read) modu ise sadece okuma amaçlıdır. Türkçe karakterlerin bozulmadan saklanması için encoding=\"utf-8\" parametresi kullanılır. Yedinci kazanım, dosyanın program çökse bile açık kalmasını önlemek için with open() ... as bağlam yöneticisinin kullanılması ve blok sona erdiğinde dosyanın otomatik olarak kapatılmasıdır; ayrıca dosya yolları, programın farklı bilgisayarlara taşınabilirliğini korumak için mutlak yol yerine göreceli yol (relative path) ile yazılır. Sekizinci kazanım, dosya içeriğinin tamamının tek seferde read() ile, satır satır readline() ile veya bir liste hâlinde readlines() ile okunabileceği ve henüz var olmayan bir dosya okunmaya çalışıldığında oluşan FileNotFoundError istisnasının try-except bloğuyla güvenli hâle getirilmesi gerektiğidir."}, {"id": "p3", "title": "Özet: JSON Formatı, Sürüm Kontrolü ve Yapay Zekâ Denetimi", "body": "Dokuzuncu kazanım, karmaşık ve iç içe geçmiş sözlük yapılarının anahtar-değer hiyerarşisini kaybetmeden kalıcı olarak saklanması için düz metin (txt) yerine JSON (JavaScript Object Notation) formatının tercih edilmesidir; Python'da json modülüyle veriler json.dump() metoduyla diske yazılır (indent parametresiyle okunabilir girintili, ensure_ascii=False parametresiyle Türkçe karakter destekli), json.load() metoduyla ise diskten okunarak orijinal sözlük ve liste yapısına geri dönüştürülür. Onuncu kazanım, kod editörünün Kaynak Denetimi (Source Control) paneli üzerinden Git sürüm kontrol sistemiyle yerel bir depo başlatılabileceği, değişikliklerin Commit ile kayıt altına alınıp Publish / Sync ile doğrudan editör içinden GitHub'daki bulut deposuna eşitlenebileceğidir.\n\nOn birinci kazanım, projenin ana dizininde oluşturulan .gitignore adlı yapılandırma dosyasının, kişisel veri veya log içeren hassas dosyaların (asistan_hafiza.txt gibi) ya da veriler/ gibi klasörlerin dijital depoya sızmasını önleyecek şekilde Git takibinden hariç tutulmasını sağladığı ve daha önce izlenmeye başlanmış bir dosyanın sadece .gitignore'a eklenmesiyle geçmiş kayıtlardan silinmeyeceğidir. Son kazanım ise yapay zekâ (LLM) asistanlarının CSV gibi düz veri formatlarını JSON şablonuna dönüştürmede bir danışman olarak kullanılabileceği ancak İnsan Denetimi prensibi gereği üretilen her JSON çıktısının programın kendi json.load() metoduyla mutlaka test edilmesi ve yapay zekâya gerçek kullanıcı verisi veya gizli bilgi gönderilmemesi gerektiğidir."}], "sorular": {"q1": {"type": "mc", "closed": true, "text": "Python dilindeki sözlük (dictionary) veri yapısının listelerden (list) ayrılan en temel mimari farkı aşağıdakilerden hangisidir?", "opts": ["Verileri yalnızca tam sayı türünde saklayabilmesi", "İçerisinde sadece tek bir eleman barındırabilmesi", "Verilere benzersiz anahtar-değer ilişkisiyle erişilmesi", "Çalışma zamanında boyutunun değiştirilememesi", "Sadece for döngüleri içerisinde kullanılabilmesi"], "correct": "Verilere benzersiz anahtar-değer ilişkisiyle erişilmesi"}, "q2": {"type": "mc", "closed": true, "text": "Bir sözlüğün içerisindeki tüm verileri \"anahtar\" ve \"değer\" ikilisi olarak gruplandırıp özellikle bir for döngüsünde raporlama yapmak için kullanılan en etkili metot aşağıdakilerden hangisidir?", "opts": [".items()", ".keys()", ".values()", ".pop()", ".clear()"], "correct": ".items()"}, "q3": {"type": "open", "closed": false, "text": "kitap_bilgisi = {\"ad\": \"Mesnevî\", \"yazar\": \"Mevlânâ\"}\nkitap_bilgisi[\"yazar\"] = \"Celâleddîn Rûmî\"\nprint(kitap_bilgisi)\nVerilen Python kodu çalıştırıldığında terminalde oluşan çıktı ne olur? Yazınız."}, "q4": {"type": "mc", "closed": true, "text": "Yazılım projelerinde oluşturulan asistan_hafiza.txt dosyası okunmak istenmektedir. Eğer bu dosya bilgisayarda henüz yoksa programın çökmesini engellemek için kod blokları hangi koruma mekanizmasının içine alınmalıdır?", "opts": ["if-elif-else karar yapısı", "while True: sonsuz döngüsü", "try-except FileNotFoundError kalkanı", "def fonksiyon mimarisi", "json.dump() metodu"], "correct": "try-except FileNotFoundError kalkanı"}, "q5": {"type": "mc", "closed": true, "text": "with open(\"rapor.txt\", \"w\", encoding=\"utf-8\") as dosya: satırıyla ilgili aşağıda verilen teknik bilgilerden hangisi yanlıştır?", "opts": ["Dosya işlemleri bitince with yapısı sayesinde dosya otomatik olarak kapatılır.", "'w' modu eski verileri koruyarak yeni verileri sona ekler ve utf-8 parametresi Türkçe karakterlerin bozulmasını önler.", "Eğer işletim sisteminde rapor.txt adında bir dosya yoksa sıfırdan yeni bir dosya oluşturulur.", "Dosyanın içine veri yazmak için dosya.write() metodu kullanılır.", "Kod blokundaki with open() yapısı, dosya bağlantısını kurumsal standartlarda yöneterek olası program çökmelerini ve bellek sızıntılarını önler."], "correct": "'w' modu eski verileri koruyarak yeni verileri sona ekler ve utf-8 parametresi Türkçe karakterlerin bozulmasını önler."}, "q6": {"type": "mc", "closed": true, "text": "Aşağıdakilerden hangisi json.load() metodunun programlama süreçlerindeki temel işlevidir?", "opts": ["Sözlüklerdeki gereksiz verileri hafızadan temizler.", "Diskteki bir metin dosyasının adını ve dosya yolunu değiştirir.", "İnternet üzerinden Python yorumlayıcısına yeni kütüphaneler indirir.", "Dosyayı salt okunur metin (.txt) olarak açıp satır satır terminale yazar.", "JSON formatında yapılandırılmış bir veriyi bir sözlük objesi olarak yükler."], "correct": "JSON formatında yapılandırılmış bir veriyi bir sözlük objesi olarak yükler."}, "q7": {"type": "mc", "closed": true, "text": "Kurumsal bir yazılım projesi kodlanırken \"C:\\Kullanicilar\\Belgeler\\veri.json\" gibi mutlak bir dosya yolu yerine doğrudan \"veriler/veri.json\" gibi göreceli bir dosya yolunun tercih edilmesinin asıl sebebi aşağıdakilerden hangisidir?", "opts": ["Diskte daha az depolama alanı kaplaması", "Dosyanın yapay zekâ tarafından okunmasını engellemesi", "JSON formatının mutlak dosya yollarını desteklememesi", "Proje başka bilgisayara taşındığında programın çökmeden çalışması", "Göreceli yolların sadece Python diline özgü olması"], "correct": "Proje başka bilgisayara taşındığında programın çökmeden çalışması"}, "q8": {"type": "mc", "closed": true, "text": "Bir geliştirici, sistem ayarlarını barındıran ayarlar.json dosyasını with open() mimarisi ve json.dump() metoduyla diske başarılı bir şekilde kaydetmiştir. Bu projenin bulut deposuna yüklenmesi aşamasında, bu ayar dosyasının dış dünyadan gizlenmesi için dosya adının aşağıdaki yapılandırma dosyalarından hangisinin içine yazılması gerekir?", "opts": ["README.md", ".gitignore", "main.py", "requirements.txt", "config.json"], "correct": ".gitignore"}, "q9": {"type": "open", "closed": false, "text": "Bir yazılımcı, Kod-Asistan projesinde kullanıcıların her komutunu kalıcı olarak diske kaydetmek amacıyla aşağıdaki kod blokunu kurgulamıştır ancak kod her çalıştığında eski geçmişin tamamen silindiği fark edilmiştir. Bu mantıksal zafiyetin nedenini açıklayarak kod satırındaki hatayı düzeltiniz.\nwith open(\"asistan_gecmisi.txt\", \"w\", encoding=\"utf-8\") as dosya:\n    dosya.write(\"Yeni komut işlendi.\\n\")"}}}, {"no": 32, "baslik": "32. Hafta — İstisna Yönetimi: try-except Yapısına Giriş", "baslangicTarihi": "2027-05-10", "konular": [{"id": "p1", "title": "Yazılım Hatalarının Sınıflandırılması: Söz Dizimi (Syntax) ve Çalışma Zamanı (Runtime) Hataları", "body": "Yazılım geliştirme sürecinde programların her zaman beklenen koşullarda çalışması mümkün değildir. Kullanıcının hatalı veri girmesi, bir dosyanın bulunamaması veya beklenmeyen bir durumun ortaya çıkması programın normal akışını bozabilir. Bilgisayar bilimlerinde karşılaşılan bu hatalar genel olarak iki grupta incelenir.\n\nKodlama kurallarına uyulmaması (eksik parantez, yanlış yazılmış komut veya hatalı girintileme vb.) sonucu oluşan ve genellikle program çalıştırılmadan önce fark edilen sorunlara söz dizimi hataları (syntax errors) denir. Öte yandan, kodun yazımı tamamen doğru olmasına rağmen program çalışırken aniden ortaya çıkan sorunlar ise çalışma zamanı hataları (runtime errors) adı verilir. Sayı beklenen yere metin girilmesi veya işletim sisteminde bulunmayan bir dosyanın açılmaya çalışılması çalışma zamanı hatalarına birer örnektir."}, {"id": "p2", "title": "Dayanıklılık (Robustness) Kavramı ve İstisna Yönetimi İhtiyacı", "body": "Bir yazılımın kalitesi yalnızca doğru sonuç üretmesiyle ölçülemez; gerçek yaşamda kullanıcılar yanlış veri girebilir, dosyalar silinebilir veya sistemler beklenmedik hatalarla karşılaşabilir. Yazılımların işte bu tür kriz durumlarında aniden çökmek yerine kullanıcıya açıklayıcı bilgiler sunarak çalışmaya güvenli bir şekilde devam edebilme özelliğine dayanıklılık (robustness) adı verilir. Bu dayanıklılığı sağlamak amacıyla Python programlama dilinde istisna yönetimi (exception handling) mekanizması kullanılır."}, {"id": "p3", "title": "Oku-Yorum: Yazılım Dünyasının İlk Gerçek Böceği", "body": "Bilgisayar programlarındaki hatalara neden bug (böcek) ve bu hataları tespit edip temizleme işlemine neden debugging (böcek ayıklama) dendiğini hiç merak ettiniz mi? Bu terimlerin bilgisayar dünyasında yaygın olmasının kökeni, bilgisayar bilimleri tarihinin en ilginç olaylarından birine dayanır.\n\n1947 yılında Harvard Üniversitesinde çalışan bilgisayar bilimciler, devasa boyuttaki Mark II bilgisayarının sık sık kilitlendiğini ve hatalı sonuçlar ürettiğini fark ederler. Donanımı detaylıca incelediklerinde bilgisayarın elektromekanik röleleri arasına sıkışmış ve kısa devreye yol açan gerçek bir güve bulurlar. Ekip, bu güveyi cımbızla dikkatlice çıkarıp proje çalışma günlüğüne bantlar ve altına şu tarihi notu düşer: \"Bulunan ilk gerçek böcek vakası.\" O günden beri yazılım dünyasında sistemin beklenmedik şekilde çökmesine, kilitlenmesine veya hatalı çalışmasına yol açan tüm kusurlara bug, kodların arasına girerek bu hataları tespit edip temizleme sürecine ise debugging adı verilir.\n\nBugünkü yazılım mühendisleri sistemlerin içinde gerçek böcekler aramasalar da kaynak kodların arasına gizlenmiş söz dizimi ve mantık hatalarını ayıklamak için aynı araştırmacı ruhla hata avcılığı yapmaya devam etmektedir.\n\nBir yazılım projesinde kod yazmak ile koddaki hataları arayıp bulma sürecini karşılaştırdığımızda, metinde geçen araştırmacı ruh ve hata avcılığı geliştiriciye sistematik gözlem, sabır ve neden-sonuç ilişkisi kurma gibi problem çözme becerileri kazandırır. Bilgisayarın kilitlenmesine yol açan yazılımsal bir mantık hatasını bulmak ile donanımdaki fiziksel bir hatayı (örneğin bir böceği) bulma süreci; ilkinde sorunun gözle görülemeyen soyut bir kod satırında saklanması, ikincisinde ise fiziksel olarak elle tespit edilebilmesi açısından birbirinden ayrılır."}, {"id": "p4", "title": "6.1.1. Try-Except Yapısı: Temel Şablon ve Kullanım Mantığı", "body": "Hata oluşturma ihtimali bulunan kodlar try bloğu içerisine yazılır. Eğer bir hata oluşursa program durmaz, kontrol except bloğuna aktarılır ve hata yönetilir. Bazı işlemlerin hata oluşsa da oluşmasa da try blokundan çıkılırken gerçekleştirilmesi gerekir. Bu tür durumlarda finally bloğu kullanılır. Bu üçlü koruma mekanizmasına ait temel kullanım şablonu aşağıda gösterilmiştir.\n\n# try-except-finally Şablonu\ntry:\n    # Hata üretme riski taşıyan (örneğin tip dönüşümü yapılan veya dosya açılan) şüpheli kodlar\n    # (4 boşluk girinti kuralına uyulur.)\n    riskli_gorev_satiri_1\n    riskli_gorev_satiri_2\nexcept BeklenenHataTuru as e:\n    # Belirtilen hata türüyle (Örn: ValueError) karşılaşıldığında program çökmek yerine bu bloka geçer.\n    # Hata nesnesi 'as e' ile yakalanarak Python yorumlayıcısı hata detayı loglanabilir.\n    hata_uyarisi_ve_kurtarma_satiri\nfinally:\n    # Hata çıksa da çıkmasa da programın en sonunda mutlaka çalıştırılacak temizlik bloku\n    # (Opsiyoneldir.)\n    temizlik_ve_kapanis_satiri"}, {"id": "p5", "title": "Try-Except Yapısının Mimarisi: Sigorta Benzetmesi ve Profesyonel Kodlama Standardı", "body": "İstisna yönetiminin amacı hataları gizlemek değildir. Amaç, oluşan hataları kontrol altına alarak programın beklenmedik şekilde sonlanmasını önlemektir.\n\nİstisna yönetimi mimarisi, büyük bir binanın elektrik tesisatında aşırı yüklenme meydana geldiğinde, tüm sistemin zarar görmesini engellemek amacıyla sigortaların devreye girerek akımı kontrollü bir şekilde kesmesi mantığına benzetilebilir. Yazılım dünyasında da öngörülemeyen kullanıcı girişleri, dosya arızaları vb. karşısında programın hata vererek aniden sonlanmasını engellemek için try-except koruma kalkanlarından faydalanılır. Bu yapısal kalkan sayesinde kriz anlarında uygulamanın bütünü kilitlenmez ve kullanıcıya sorunun kaynağını açıklayan anlaşılır uyarılar sunularak sistemin kararlılığı korunur.\n\nGeliştirilen bir projede sadece kusursuz veri girişlerinin gerçekleşeceğini varsayarak kod yazmak profesyonel standartlar için yeterli değildir. Herhangi bir verinin hatalı girilmesi veya işletim sistemindeki bir dosyanın silinmesi gibi uç durumların eleştirel bir süzgeçten geçirilerek önceden tahmin edilmesi ve bu risklerin try-except bloklarıyla güvence altına alınması gerekmektedir."}, {"id": "p6", "title": "1. Sıra Sizde: Kütüphane Sistemi Senaryosu Üzerinden Tasarım Sorumluluğunun Değerlendirilmesi", "body": "Bir okul kütüphanesi uygulamasında sistem, kitap ödünç alabilmesi için öğrencilerden sisteme kayıtlı öğrenci numaralarını girmelerini talep etmektedir. Bir öğrenci, numara (sayı) yerine klavyeden yanlışlıkla isim bilgisini (harf) girdiğinde, program aniden hata vererek tamamen kapanmaktadır. Sistemin kilitlenmesi nedeniyle kütüphanedeki diğer öğrenciler de uygulamayı kullanamaz hâle gelmiştir.\n\nBu senaryoda arka planda sayı beklenen bir alana harf girilmesi ValueError türünde bir çalışma zamanı hatasını tetikler. Bu kilitlenme durumu, yalnızca yanlış veri giren kullanıcının bir hatası olarak görülmemelidir; sistemi tasarlayan yazılımcının, kullanıcıların dalgınlıkla hatalı veri girebileceğini öngörüp bu riski try-except yapısıyla güvence altına almaması da tasarımsal bir eksikliktir. Bir yazılımcı olarak bu kütüphane sistemi tasarlanırken programın aniden kapanmasını önlemek için riskli girdi alma satırı try bloğu içine alınmalı, olası ValueError except bloğuyla yakalanmalı ve kullanıcıya \"Lütfen öğrenci numaranızı sayısal olarak giriniz.\" gibi anlaşılır bir uyarı mesajı gösterilmelidir.\n\nBir kütüphanedeki otomatik ödünç alma cihazlarına yanlış bir barkod okutulduğunda tüm kütüphanenin hizmet dışı kalması nasıl kabul edilemez bir senaryoysa yazılım dünyasında da hatalı bir veri girişinin tüm programı sonlandırması aynı derecede istenmeyen bir durumdur. Profesyonel bilgi sistemleri, kullanıcıların dalgınlıkla veya bilgisizlikten kaynaklanan hatalı işlemlerini kilitlenmeye terk etmek yerine onları doğru yönlendirecek şekilde tasarlanır.\n\nBir yazılım geliştirici sadece standart akışlara göre kod yazmakla kalmaz, aynı zamanda olası kriz anlarında neden-sonuç ilişkilerini kurarak hataları güvenle yönetir. Dijital araçları her koşulda ayakta tutmak, bilgi kaybını önlemek ve hizmetlerin kesintisiz çalışmasını sağlamak, üstlenilmesi gereken temel mesleki sorumluluklar arasında yer alır."}], "sorular": {"q1": {"type": "open", "closed": false, "text": "Bir yazılım projesinde kod yazmak ile koddaki hataları arayıp bulma sürecini karşılaştırdığınızda, 1947'de Mark II bilgisayarındaki güveyi bulan araştırmacı ruh ve hata avcılığı geliştiriciye hangi problem çözme becerilerini kazandırır? Düşüncelerinizi değerlendiriniz."}, "q2": {"type": "open", "closed": false, "text": "Bir okul kütüphanesi uygulamasında sistem, kitap ödünç alabilmesi için öğrencilerden sisteme kayıtlı öğrenci numaralarını girmelerini talep etmektedir. Bir öğrenci, numara (sayı) yerine klavyeden yanlışlıkla isim bilgisini (harf) girdiğinde program aniden hata vererek tamamen kapanmaktadır.\na) Arka planda sayı beklenen bir alana harf girilmesi, sistemde hangi çalışma zamanı hatasını tetiklemiş olabilir?\nb) Bir yazılımcı olarak bu kütüphane sistemini tasarlamış olsaydınız programın aniden kapanmasını önlemek için try-except yapısını bu senaryoda nasıl kurgulardınız?"}, "q3": {"type": "mc", "closed": true, "text": "print(\"--- GÜVENLİ BÖLME İŞLEMİ MODÜLÜ ---\")\ntry:\n    bolunen = int(input(\"Bölünecek sayıyı giriniz: \"))\n    bolen = int(input(\"Bölen sayıyı giriniz: \"))\n    sonuc = bolunen / bolen\n    print(f\"İşlem Başarılı! Sonuç: {sonuc:.2f}\")\nexcept ValueError as e:\n    print(f\"[SİSTEM UYARISI] Lütfen geçerli bir tam sayı giriniz! Detay: {e}\")\nexcept ZeroDivisionError as e:\n    print(f\"[SİSTEM UYARISI] Bir sayı sıfıra bölünemez! Detay: {e}\")\nfinally:\n    print(\"Bölme işlemi denemesi sonlandı.\")\nkodunda kullanıcı 'Bölünecek sayıyı giriniz' istemine 'on beş' yazarsa hangi except bloğu devreye girer?", "opts": ["ValueError bloğu", "ZeroDivisionError bloğu", "finally bloğu tek başına çalışır, hiçbir except devreye girmez", "TypeError bloğu", "Program hiçbir uyarı vermeden çöker"], "correct": "ValueError bloğu"}, "q4": {"type": "tf", "closed": true, "text": "finally bloğu, yalnızca try bloğunda bir hata oluştuğunda çalışır; hata oluşmadığında finally bloğu atlanır.", "correct": "Yanlış"}, "q5": {"type": "fill", "closed": true, "text": "Yazılımların beklenmedik hata durumlarında aniden çökmek yerine kullanıcıya açıklayıcı bilgiler sunarak çalışmaya güvenli bir şekilde devam edebilme özelliğine ______ adı verilir.", "accepted": ["dayanıklılık", "robustness", "dayanıklılık (robustness)"]}, "q6": {"type": "open", "closed": false, "text": "Ariane 5 Uçuş 501 yazılım hatası örneğinde, roketin navigasyon sisteminde kullanılan 64 bitlik bir kayan noktalı sayının 16 bitlik tam sayıya dönüştürülmeye çalışılması hangi tür çalışma zamanı hatasına örnektir? Bu kritik modülde istisna yönetimi mekanizması aktif edilmediği için sistemde ne olmuştur?"}}}, {"no": 33, "baslik": "33. Hafta — Çoklu İstisna Yönetimi, Traceback ve Hata Ayıklama", "baslangicTarihi": "2027-05-17", "konular": [{"id": "p1", "title": "1. Örnek: Çoklu İstisna Yönetimi ve Traceback Analizi — Güvenli Bölme İşlemi Modülü", "body": "Bir matematik modülünde kullanıcının girdiği iki sayının birbirine bölünmesi istenmektedir. Kullanıcının sayı yerine harf girmesi (ValueError) ya da bir sayıyı sıfıra bölmeye çalışması (ZeroDivisionError) durumlarında programın çökmesini engelleyen güvenli bir yapı kurgulanmıştır.\n\nÖrnek Kod Bloğu\n\nprint(\"--- GÜVENLİ BÖLME İŞLEMİ MODÜLÜ ---\")\ntry:\n    # Hata riski taşıyan veri alma ve matematiksel işlem blokları\n    bolunen = int(input(\"Bölünecek sayıyı giriniz: \"))\n    bolen = int(input(\"Bölen sayıyı giriniz: \"))\n    sonuc = bolunen / bolen\n    print(f\"İşlem Başarılı! Sonuç: {sonuc:.2f}\")\n# 1. Kalkan: Kullanıcı sayı yerine metin girerse devreye girer.\nexcept ValueError as e:\n    print(f\"[SİSTEM UYARISI] Lütfen geçerli bir tam sayı giriniz! Detay: {e}\")\n# 2. Kalkan: Kullanıcı bölen olarak 0 (sıfır) girerse devreye girer.\nexcept ZeroDivisionError as e:\n    print(f\"[SİSTEM UYARISI] Bir sayı sıfıra bölünemez! Detay: {e}\")\n# Ne olursa olsun en son çalışacak temizlik bloku\nfinally:\n    print(\"Bölme işlemi denemesi sonlandı.\")\n\nTerminal Çıktısı (Kullanıcı Sayı Yerine Harf Girdiğinde)\n\n--- GÜVENLİ BÖLME İŞLEMİ MODÜLÜ ---\nBölünecek sayıyı giriniz: on beş\n[SİSTEM UYARISI] Lütfen sadece rakam kullanınız! Detay: invalid literal for int() with base 10: 'on beş'\nBölme işlemi denemesi sonlandı.\n\nTerminal Çıktısı (Kullanıcı Bölen Sayı Olarak 0 Girdiğinde)\n\n--- GÜVENLİ BÖLME İŞLEMİ MODÜLÜ ---\nBölünecek sayıyı giriniz: 12\nBölen sayıyı giriniz: 0\n[SİSTEM UYARISI] Bir sayı sıfıra bölünemez! Detay: division by zero\nBölme işlemi denemesi sonlandı."}, {"id": "p2", "title": "Kod Analizi: Çoklu Kalkan (Multiple Exceptions) ve as e ile Detaylı Hata Ayıklama", "body": "1. Adım [Çoklu Kalkan (Multiple Exceptions)]: Programda oluşabilecek hatalar tek bir torbaya atılmamış, ValueError ve ZeroDivisionError olarak ayrı ayrı süzgeçlenerek kullanıcıya hatanın kök nedenine uygun nokta atışı uyarılar sunulmuştur.\n\n2. Adım [Detaylı Hata Ayıklama (as e)]: İşletim sisteminin fırlattığı karmaşık Traceback hata detayı, as e kalıbıyla teknik bir değişkene yakalanarak log kaydına eklenmiş ve hata ayıklama standartları sağlanmıştır."}, {"id": "p3", "title": "Oku-Yorum: Ariane 5 Uçuş 501 Yazılım Hatası", "body": "Yazılım geliştirme süreçlerinde hata yönetimi, yalnızca kodun çalışmasını sağlamakla kalmaz aynı zamanda sistemin bütününe yönelik bir sigorta görevi görür. 1996 yılında fırlatılan Ariane 5 roketinin kalkışından sadece 30 saniye sonra infilak etmesi, bu alandaki ihmallerin büyük maliyetlere ve prestij kayıplarına yol açabileceğine dair önemli bir tarihsel derstir.\n\nKazanın temelinde, roketin navigasyon sisteminde kullanılan 64 bitlik bir kayan noktalı sayının (floating-point), 16 bitlik tam sayıya (integer) dönüştürülmeye çalışılması yatmaktadır. Bilgisayar sistemlerinde her veri tipinin temsil edebileceği bir sayı aralığı mevcuttur. 16 bitlik bir değişken yalnızca belirli bir büyüklüğe kadar olan değerleri barındırabilir. Roketin ivmelenmesiyle birlikte ortaya çıkan sayısal değer, bu kapasiteyi aştığında sistem bir çalışma zamanı istisnası fırlatmıştır. Sistemin bu kritik modülünde istisna yönetimi mekanizması aktif edilmediği için oluşan hata, sistemin tamamen durmasına ve roketin yönlendirme verilerini kaybetmesine neden olmuştur.\n\nAriane 5 örneği; bir yazılımın yalnızca doğru çalışmasının yeterli olmadığını, beklenmedik durumlara karşı da dirençli olması gerektiğini kanıtlar. Programlama dillerindeki try-except bloklarının kullanımı, sadece basit bir ValueError yakalamakla sınırlı değildir. Bu yapılar, sistemin kritik bir düğümünde meydana gelen veri kayması, tip dönüşüm hataları gibi öngörülemeyen durumlarda uygulamanın çökmesini engellemek ve güvenli moda geçmesini sağlamak için kurgulanan nihai savunma hattıdır. Eğer Ariane 5'in kod tabanında, bu dönüşüm işlemi bir istisna yönetim bloku içerisinde ele alınmış olsaydı sistem hatayı algılayıp güvenli bir yedekleme moduna geçebilirdi.\n\nAriane 5 kazasını göz önünde bulundurarak bir yazılım projesinde programın doğru çalışması ile programın dayanıklı olması arasındaki yapısal fark değerlendirilecek olursa: doğru çalışma, yalnızca beklenen ve test edilen senaryolarda beklenen sonucu üretmeyi ifade ederken; dayanıklılık, hiç öngörülmemiş, uç ve beklenmedik senaryolarda bile sistemin çökmeden güvenli bir şekilde tepki verebilmesini ifade eder. Geliştirilen bir projede try-except yapıları kullanmamanın, uygulamanın kararlılığı açısından yarattığı en büyük risk; ufak, öngörülebilir ve normalde kolayca yönetilebilecek bir hatanın bile tüm sistemin aniden ve kontrolsüzce çökmesine, olası veri kayıplarına yol açabilmesidir."}, {"id": "p4", "title": "Uygulama Özeti: Kod-Asistan Dayanıklılık Testi ve Hata Yönetimi", "body": "Kod-Asistan Dayanıklılık Testi ve Hata Yönetimi uygulamasında, sarmal projenin v1.0 sürümündeki Vücut Kitle İndeksi (VKİ) hesaplayıcı modülünün test ekibi (QA) tarafından kontrol edilmesi senaryosu ele alınır. Test ekibi; kullanıcının boy veya kilo bilgisi girerken yanlışlıkla harf tuşladığında (örneğin 75 yerine yetmiş beş yazdığında) programın ValueError fırlattığını, istenen bilgiyi 0 (sıfır) girdiğinde ise programın ZeroDivisionError hatası vererek çalışmayı durdurduğunu tespit etmiştir. Profesyonel bir yazılımcı olarak görev, \"Kullanıcı zaten buraya sayı gireceğini biliyordu.\" varsayımıyla hareket etmek yerine, kullanıcının dalgınlıkla yanlış bir tuşa basabileceğini öngörerek tüm uç senaryolara karşı sorumluluk almaktır.\n\nBu görev bilinciyle asistanın kullanıcı hataları karşısında aniden kapanmasını engellemek için programın etrafına try-except yapıları kurulmuş ve proje dayanıklılık testinden geçirilmiştir. while True: döngüsüyle sürekli çalışan programda, kullanıcı 'q' tuşuna basarak çıkış yapabilmekte, girdi alma ve hesaplama satırları try bloğu içine alınarak riskli işlemler güvence altına alınmıştır.\n\n# ============================================================\n# KOD-ASİSTAN PROJESİ v2.0 - İSTİSNA YÖNETİMİ VE DAYANIKLILIK\n# Standart: PEP 8 / try-except-finally ve Hata Ayıklama (Debugging)\n# ============================================================\nprint(\"=== KOD-ASİSTAN: DAYANIKLI VKİ HESAPLAMA MODÜLÜ ===\\n\")\nwhile True:\n    print(\"--------------------------------------------------\")\n    # 1. AŞAMA: Hata Riski Taşıyan Kodların try Blokuna Alınması\n    try:\n        girdi = input(\"Kilonuzu giriniz (Çıkmak için 'q' tuşlayınız): \")\n        # Güvenli çıkış protokolü\n        if girdi.lower() == 'q':\n            print(\"Sağlıklı günler dileriz! Sistem kapatılıyor...\")\n            break\n        kilo = float(girdi)\n        boy = float(input(\"Boyunuzu metre cinsinden giriniz (Örn: 1.75): \"))\n        vki = kilo / (boy ** 2)\n        print(f\"-> Başarılı! Vücut Kitle İndeksiniz: {vki:.2f}\")\n    # 2. AŞAMA: Kullanıcı Sayı Yerine Harf Girerse Çalışacak except Bloku\n    except ValueError as e:\n        print(\"\\n[HATA AĞI] Kritik bir hata yakalandı. Sistem çökmesi engellendi!\")\n        print(f\"Kullanıcı Hatası: Sayısal veri beklenen alana geçersiz karakter girildi.\")\n        print(f\"Log Detayı: {e}\\n\")\n        print(\"Lütfen verileri doğru formatta yeniden giriniz.\")\n    except ZeroDivisionError as e:\n        print(\"\\n[HATA AĞI] Kritik bir hata yakalandı. Sistem çökmesi engellendi!\")\n        print(f\"Kullanıcı Hatası: Bölen alanına 0 girildi.\")\n        print(f\"Log Detayı: {e}\\n\")\n        print(\"Lütfen verileri doğru formatta yeniden giriniz.\")\n    # 3. AŞAMA: Her Koşulda Çalışacak Temizlik Bloku\n    finally:\n        print(\"[SİSTEM] VKİ deneme turu tamamlandı.\")\n\nProjenin bu aşamasında kod_asistan_dayaniklilik.py adında yeni bir kaynak kod dosyası oluşturularak temel VKİ hesaplama kodları bu dosyaya kopyalanır, riskli satırlar try bloğu içine alınır, her iki çökme türü de except ValueError as e: ve except ZeroDivisionError as e: blokları ile engellenir ve hesabın başarılı ya da başarısız olmasına bakılmaksızın her deneme sonunda çalışması gereken temizlik adımları bir finally: bloğu ile eklenir. Test edilen dosya, \"VKİ modülüne çoklu istisna yönetimi (ValueError ve ZeroDivisionError) eklendi.\" sürüm notuyla birlikte kod editörünün Kaynak Denetimi panelinden Commit edilip Sync Changes ile dijital depoya push edilir."}, {"id": "p5", "title": "Uygulama Özeti: Liste İndeksi ve Girdi Hatalarının Yönetimi (IndexError)", "body": "Kod-Asistan projesine Günün Hikmeti adında yeni ve kültürel bir modül eklenmesi hedeflenir. Asistanın belleğinde Hoca Ahmed Yesevî, Yunus Emre ve Mevlânâ'ya ait birer tane olmak üzere toplamda üç farklı beyit barındıran ve
