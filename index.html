kleri ve Kullanım Alanları\nVisual Studio Code | Kaynak Kod Editörü | Hafif ve esnek yapısıyla öne çıkar. Resmî Python eklentileri vasıtasıyla IDE özelliklerini kazanarak kararlı bir çalışma alanı sunar.\nPyCharm (Community) | IDE | Python dili için özel tasarlanmıştır. Proje yönetimi, gelişmiş hata ayıklama ve kod analiz araçları bakımından yapılandırılmış bir mimariye sahiptir.\nJupyter Notebook | Web Tabanlı Ortam | Kodların bağımsız hücreler hâlinde adım adım çalıştırılmasına ve sonuçların anlık görselleştirilmesine imkân tanır. Özellikle veri analizinde tercih edilir.\nSpyder | IDE | Bilimsel hesaplama araçlarını tek bir arayüzde toplar. Matematiksel modellemeler ve akademik araştırmalar için optimize edilmiştir.\nGoogle Colab | Bulut Tabanlı Ortam | Yerel kurulum gerektirmeyen tarayıcı tabanlı bir ortamdır. Uzak sunucular üzerinden Python kodları yazılmasına ve çalıştırılmasına olanak tanır.\n\nBilgi Kutusu — Bulut Tabanlı Kodlama Alternatifi: Hiçbir program kurmadan, sadece bir internet tarayıcısıyla güçlü sunuculara bağlanıp kod yazabileceğinizi biliyor muydunuz? Programlama dünyasına adım atarken bilgisayara program kurmakta zorluk yaşanması veya laboratuvar bilgisayarlarında yetki kısıtlaması bulunması artık bir engel değildir. Bu öğrenme birimindeki tüm Python kodları; hiçbir kurulum yapılmadan, bulut tabanlı platformlar kullanılarak doğrudan internet tarayıcısı üzerinden çalıştırılabilmektedir.\n\nProjelerin hacmi büyüdükçe genel amaçlı bir metin editörünün Python kaynak kodlarını algılayabilmesi, söz dizimi hatalarını anlık olarak denetleyebilmesi ve akıllı kod tamamlama mekanizmalarını devreye sokabilmesi için resmî Python eklentisiyle yapılandırılması gerekir. Bu doğrultuda hazırlanan projeler; dönem boyu geliştirilecek Kod-Asistan projesine ait tüm belgelerin tek bir merkezden sistematik olarak yönetilebilmesi için proje klasörü editöre dâhil edilir, ardından editörün Python kaynak kodlarını profesyonel standartlarda işleyebilmesi için resmî Python eklentisi kurulur. Son olarak, kararlı çalışan her yeni kaynak kod dosyası dijital depoya (GitHub) yüklenerek kodların küresel bir bulut deposunda yedeklenmesi, güvenliği ve dürüst sürüm kontrolü sağlanmış olur."}], "sorular": {"q1": {"type": "mc", "closed": true, "text": "Tablo 2.1'e göre düşük seviyeli bir dilin (Assembly) en belirgin özelliği aşağıdakilerden hangisidir?", "opts": ["Çok kolay anlaşılırlık", "Donanım üzerinde tam kontrol", "Çok yüksek soyutlama düzeyi", "Platformlar arası yüksek taşınabilirlik", "Yorumlayıcıya ihtiyaç duymaması"], "correct": "Donanım üzerinde tam kontrol"}, "q2": {"type": "mc", "closed": true, "text": "Kodun tamamını çalıştırmadan önce baştan sona okuyup bir bütün olarak makine diline çeviren yaklaşım aşağıdakilerden hangisidir?", "opts": ["Yorumlayıcı", "Derleyici", "Etkileşimli kabuk", "IDLE", "Söz dizimi denetimi"], "correct": "Derleyici"}, "q3": {"type": "fill", "closed": true, "text": "Python programlama dili 1991 yılında ______ tarafından geliştirilmiştir.", "accepted": ["Guido van Rossum", "guido van rossum"]}, "q4": {"type": "open", "closed": false, "text": "Oku-Yorum metnindeki (Cezeri'nin Çarkından Python'un Kodlarına) Düşünelim-Tartışalım tablosunu tamamlayınız: (a) Belirli bir düzende sürekli ve ardışık olarak dönen dişli çarklar, (b) Suyun akış yönünü veya miktarını şarta bağlayan mekanik kontrol noktaları, (c) Mekanizmanın baştan sona adım adım nasıl çalışacağını gösteren mühendislik planı. Bu üç tasarımın Python programlamasındaki karşılıklarını (döngü, koşul yapısı, algoritma/sözde kod gibi) yazınız."}, "q5": {"type": "tf", "closed": true, "text": "1. Uygulama'da (Python Kurulumu) Windows kurulum ekranında 'Add python.exe to PATH' kutucuğunun işaretlenmesi, Python'ın komut satırından farklı dizinlerden çalıştırılabilmesini kolaylaştırır.", "correct": "Doğru"}, "q6": {"type": "open", "closed": false, "text": "2. Uygulama'da (Python IDLE ile Basit Toplama İşlemi) IDLE etkileşimli kabuğuna 15+25 yazıldığında ekrana hangi değer yansır? Aynı işlemi editör modunda bir .py dosyasına yazıp Run > Run Module ile çalıştırmak, etkileşimli kabukta yazmaktan hangi açıdan farklıdır?"}, "q7": {"type": "mc", "closed": true, "text": "3. Uygulama'da (Gelişmiş Kaynak Kod Editörünün Kurulumu ve Yapılandırılması) kurulan Visual Studio Code, Python eklentisi yüklenmeden önce hangi genel kategoriye girer?", "opts": ["IDE", "Genel amaçlı metin editörü", "Yorumlayıcı", "Derleyici", "Etkileşimli kabuk"], "correct": "Genel amaçlı metin editörü"}, "q8": {"type": "mc", "closed": true, "text": "Tablo 2.4'e göre kodların bağımsız hücreler hâlinde adım adım çalıştırılmasına ve sonuçların anlık olarak görülmesine imkân tanıyan, veri analizinde tercih edilen web tabanlı ortam aşağıdakilerden hangisidir?", "opts": ["PyCharm", "Visual Studio Code", "Jupyter Notebook", "Spyder", "Google Colab"], "correct": "Jupyter Notebook"}, "q9": {"type": "open", "closed": false, "text": "Kendi bilgisayarınızda Python kodu yazmak istediğinizde IDLE yerine neden Visual Studio Code gibi gelişmiş bir kod editörü tercih edilebileceğini, akıllı kod tamamlama ve söz dizimi denetimi kavramlarını kullanarak açıklayınız."}}}, {"no": 6, "baslik": "6. Hafta — Veri Türleri, Değişken Tanımlama ve Sabitler", "baslangicTarihi": "2026-10-19", "konular": [{"id": "p1", "title": "Temel Veri Türleri (int, float, str, bool)", "body": "Dikkat: input() fonksiyonu ile kullanıcıdan alınan veri, girilen karakterler sayı görünümünde olsa bile metinsel (str) türünde döndürülür. Sayısal işlemlerde kullanılabilmesi için int() veya float() gibi dönüşüm fonksiyonları uygulanmalıdır.\n\nBilgisayar belleğine kaydedilecek verilerin nitelikleri, boyutları ve üzerlerinde hangi matematiksel veya mantıksal işlemlerin yapılabileceği veri türü (data type) kavramı ile belirlenir. Python dilinde değişkenlerin veri türleri, türetildikleri anda dinamik olarak yorumlayıcı tarafından atanır.\n\nPython, dinamik tipli (dynamically typed) bir programlama dilidir. Bu mimari gereği bir değişken tanımlanırken onun hangi veri türünde olacağını önceden belirtmek zorunlu değildir. Değişkenin veri türü, içine aktarılan değere göre otomatik olarak belirlenir. Daha da önemlisi, aynı değişken akış içerisinde farklı bir değer aldığında son atanan yeni değere göre veri türü de anlık ve dinamik şekilde değişir. Sektörel standartlara uygun olarak kullanılan dört temel veri türü şöyle yapılandırılmıştır:\n\n• Tam Sayı [Integer (int)]: Kesirli kısmı bulunmayan; pozitif, negatif veya sıfır değerini alabilen sayısal veri türüdür (örneğin ogrenci_sayisi = 34, hava_sicakligi = -5).\n\n• Ondalıklı Sayı [Floating Point (float)]: Kesirli veya ondalıklı kısımları bulunan, bilimsel hesaplamalarda ve hassas ölçümlerde kullanılan sayısal veri türüdür. Python dilinde ondalık kısımlar virgül (,) değil uluslararası standart gereği nokta (.) karakteriyle ayrılır (örneğin urun_fiyati = 89.90, pi_sayisi = 3.14159).\n\n• Metinsel Veri [String (str)]: Tek tırnak '...' veya çift tırnak \"...\" işaretleri arasında tanımlanan; alfabetik karakterler, rakamlar ve özel sembollerden oluşan karakter dizileridir. Rakamlardan oluşsalar dahi string türündeki verilerle doğrudan aritmetik işlem (örneğin kullanici_adi = \"gokturk_9\", okul_numarasi = \"1071\") yapılamaz.\n\n• Mantıksal Veri [Boolean (bool)]: Sadece iki farklı durumun kontrolünde kullanılan, mantıksal karar süreçlerinin temelini oluşturan veri türüdür. Alabileceği değerler yalnızca Doğru veya Yanlış (örneğin sistem_acik_mi = True, bakiye_yeterli_mi = False) ifadeleridir.\n\nDüşünelim-Tartışalım: Bir telefon numarasını aklınızda tutmaya çalışıyorsunuz ancak biri size başka bir şey söylediğinde veya dikkatiniz dağıldığında o numarayı hemen unutabiliyorsunuz. Bilgisayarların geçici belleği olan RAM (Rastgele Erişimli Bellek) de tıpkı insan zihninin bu kısa süreli hafızası gibi çalışır. Sistemin enerjisi kesildiğinde veya program kapatıldığında içindeki tüm geçici veriler (değişkenler) silinir. Sizce bilgisayarlar, işlem yaparken değişkenleri neden doğrudan kalıcı diske değil de RAM'e alırlar? Bu geçici varlığın çalışma hızına olan etkisi nedir? Düşüncelerinizi arkadaşlarınızla tartışınız."}, {"id": "p2", "title": "type() Fonksiyonuyla Veri Türü Analizi", "body": "Yazılım geliştirme sürecinde bir değişkenin veya değerin veri türünü belirlemek için Python'un yerleşik type() fonksiyonu kullanılır. Bu fonksiyon, parametre olarak verilen değişkenin ya da değerin hangi veri türüne (sınıfa) ait olduğunu döndürerek programcının veri tipini doğrulamasını sağlar.\n\n1. Örnek: Dinamik Veri Türü Değişimi ve Denetimi\n\nProblem Senaryosu: Kod-Asistan projesinin merkezî veri yönetim katmanında asistan_verisi adında tek bir değişken tanımlanmıştır. Bu değişkenin program akışı boyunca aldığı yeni değerlere bağlı olarak bilgisayarın geçici belleğindeki yapısının nasıl dönüştüğü test edilecektir.\n\nÖrnek Kod Bloğu\n\n# 1. Aşama: Değişkene metinsel bir değer atanıyor.\nasistan_verisi = \"Kod-Asistan v0.2\"\nprint(type(asistan_verisi))\n# 2. Aşama: Aynı değişkene tam sayı türünde bir değer atanıyor (Veri türü değişir.).\nasistan_verisi = 100\nprint(type(asistan_verisi))\n# 3. Aşama: Aynı değişkene ondalıklı sayı türünde bir değer atanıyor (Veri türü değişir.).\nasistan_verisi = 99.9\nprint(type(asistan_verisi))\n# 4. Aşama: Aynı değişkene mantıksal bir değer atanıyor (Veri türü değişir.).\nasistan_verisi = True\nprint(type(asistan_verisi))\n\nTerminal Çıktı Analizi: Yazılan kod bloğu çalıştırıldığında Python yorumlayıcısı asistan_verisi değişkenine her atamada yeni değeri atar. Bu nedenle type() fonksiyonu, değişkenin her adımda sahip olduğu güncel veri türünü IDLE ekranında aşağıdaki gibi gösterir:\n\n<class 'str'>\n<class 'int'>\n<class 'float'>\n<class 'bool'>\n\nKod Gözden Geçirme (Code Review) Çıkarımı: Python'un veri türünü anlık olarak değiştirmesi, büyük bir esneklik sağlasa da aynı değişkeni (örneğin asistan_verisi) akış boyunca farklı amaçlarla kullanmak veri tutarsızlığına yol açabilir. Bunun yerine her veri için amacına uygun yeni isimler (asistan_adi, asistan_puani vb.) kullanılmalıdır."}, {"id": "p3", "title": "Değişken Tanımlama Kuralları", "body": "Programlama dillerinde değişkenler, bellekte tutulan verilere program içerisinden erişmek için kullanılan mantıksal isimlerdir. Python gibi yüksek seviyeli programlama dillerinde programcılar bellek adresleriyle doğrudan ilgilenmek yerine verilere anlamlı değişken adları vererek kodlarını daha okunabilir ve yönetilebilir hâle getirir. Yazılan kaynak kodların Python yorumlayıcısı tarafından doğru şekilde işlenebilmesi için değişken adları belirlenirken Python'un söz dizimi (syntax) kurallarına uyulması zorunludur. Ayrıca, okunabilir ve sürdürülebilir kod geliştirmek amacıyla Python'un resmî stil kılavuzu olan PEP 8'de yer alan isimlendirme önerilerine uyulması sektörde yaygın olarak tavsiye edilir. Temel değişken tanımlama kuralları şunlardır:\n\n• Karakter Kısıtlaması: Değişken isimleri sadece alfabetik karakterler (A-Z, a-z), rakamlar (0-9) ve alt çizgi (_) karakterini barındırabilir. Bunların dışında hiçbir özel sembol (nokta, virgül, soru işareti, tire, boşluk vb.) değişken isminde yer alamaz.\n\n• Başlangıç Kriteri: Bir değişken ismi kesinlikle bir rakam ile başlayamaz. İsimler ya alfabetik bir karakterle ya da alt çizgi (_) işaretiyle başlamak zorundadır (örneğin 3etap_skor hatalı bir söz dizimi iken, etap_skor_3 veya _etap3 kurallara uygundur).\n\n• Büyük-Küçük Harf Duyarlılığı (Case-Sensitivity): Python dili, büyük ve küçük harfleri farklı karakterler olarak değerlendirir. Bu nedenle aynı harflerden oluşsa bile yazımında büyük-küçük harf farkı bulunan kelimeler, bellekte tutulan verilere erişmek için kullanılan farklı değişken adları olarak kabul edilir. Örneğin asistan_adi, Asistan_Adi ve ASISTAN_ADI ifadeleri Python yorumlayıcısı tarafından birbirinden bağımsız üç farklı değişken adı olarak değerlendirilir.\n\n• Resmî Dil Anahtarları (Reserved Words): Python dilinin kendi iç mekanizmasını yönetmek ve komutları işletmek adına kendine ayırdığı bazı özel kelimeler (keywords) değişken adı olarak kullanılamaz (örneğin if, else, True, False, while, for gibi kelimeler Python için özel bir anlam ifade ettiğinden doğrudan değişken ismi yapılamaz).\n\n• Türkçe Karakter Standardı: Python yorumlayıcısı Unicode karakter setini desteklediği için Türkçe karakterleri (ç, ğ, ı, ö, ş, ü) teknik olarak kabul etse de küresel yazılım standartlarına ve kodun farklı işletim sistemlerinde kararlı çalışabilmesi adına değişken isimlerinde sadece İngiliz alfabesindeki karakterlerin kullanılması önerilir."}, {"id": "p4", "title": "Değişken Adlandırma Standartları (Notasyonlar)", "body": "Yazılım projelerinde birden fazla kelimeden oluşan değişken isimlerinin okunabilirliğini artırmak amacıyla tüm dünyada kabul görmüş iki temel adlandırma standardı kullanılır.\n\nYılan Gösterimi (snake_case): Tüm harflerin küçük yazıldığı ve kelimelerin birbirine alt çizgi (_) karakteriyle bağlandığı yöntemdir. Python literatüründe değişken ve fonksiyon isimleri için bu standardın (örneğin kullanici_giris_tarihi, asistan_bellek_kapasitesi vb.) kurumsal olarak kullanılması tavsiye edilir.\n\nDeve Gösterimi (camelCase): İlk kelimenin tüm harflerinin küçük, sonraki her kelimenin ise ilk harfinin büyük yazıldığı ve kelimelerin bitişik (örneğin kullaniciGirisTarihi, asistanBellekKapasitesi) kurgulandığı yöntemdir.\n\nDeğişken adlandırma standartlarına ilişkin doğru ve hatalı kullanım senaryoları aşağıdaki gibi özetlenebilir:\n\nDeğişken Tanımlaması | Durum | Karşılaşılan Söz Dizimi Hatası / Gerekçe\nasistan_sürümü = 0.2 | Geçerli ancak önerilmez | Teknik olarak çalışsa da küresel standartlar gereği 'ü' harfi yerine 'u' kullanılmalıdır (asistan_surumu).\n1.kullanici_adi = \"Ali\" | Hatalı | SyntaxError: Değişken isimleri rakamla başlayamaz.\nkullanici adi = \"Veli\" | Hatalı | SyntaxError: Kelimeler arasında boşluk karakteri kullanılamaz.\nif = \"Kod-Asistan\" | Hatalı | if ayrılmış anahtar kelime (reserved word) olduğundan veri atanamaz.\nkod_asistan_v02 = True | Doğru | Karakter kısıtlamalarına, başlangıç kriterine ve standart notasyona tamamen uygundur.\n\nBir kod dosyası başka bir yazılım ekibinden ham bir taslak olarak alındığında; büyük-küçük harf duyarlılığı, rakamla başlama, ayrılmış anahtar kelime kullanımı veya değişken isimlerinde boşluk/özel karakter bulunması gibi söz dizimi kusurları satır satır incelenerek tespit edilmeli ve snake_case standardına uygun, güvenli ve tutarlı bir biçimde yeniden yazılmalıdır."}, {"id": "p5", "title": "Sabitler", "body": "Yazılım geliştirme sürecinde bazı verilerin değerleri programın başlangıcından son adımına kadar sürekli olarak değişebilir; bu tür veriler için değişkenler kullanılır. Bir yazılım mimarisinde programın çalışma süresince değiştirilmemesi amaçlanan ve aynı değeri koruması beklenen verilere sabit (constant) adı verilir. Python'da sabitler teknik olarak değiştirilebilir ancak adlandırma kuralları ve geliştirici uzlaşısı gereği değiştirilmemeleri beklenir. Sabitler, yazılımın kararlılığını ve yönetilebilirliğini şu iki temel mekanizma ile güçlendirir:\n\n• Mantıksal Hataların Önlenmesi: Büyük harfle yazılan sabit adları, bu değerlerin program akışı içinde değiştirilmemesi gerektiğini geliştiricilere bildirir ve kritik parametrelerin yanlışlıkla değiştirilmesi riskini azaltır.\n\n• Kod Okunabilirliği ve Kolay Bakım (Maintainability): Kod bloğu içerisinde birden fazla yerde kullanılan ham bir verinin (örneğin bir sunucu adresinin) tek bir merkezden yönetilmesini sağlar. İlgili veri değiştiğinde binlerce satırı düzenlemek yerine sadece en baştaki sabiti güncellemek yeterlidir.\n\nBirçok geleneksel programlama dilinde (C++, Java, C# vb.) bir veriyi sabit yapmak için const veya final gibi katı söz dizimi anahtarları kullanılır ve bu verinin değeri sonradan değiştirilmek istendiğinde derleyici doğrudan hata verir. Python, yapısı gereği katı bir const mekanizmasına sahip değildir. Python yorumlayıcısı, teknik olarak tüm isimlendirmeleri birer değişken gibi işler. Bu durum, Python dünyasında okunabilirliği ve tutarlılığı sağlamak amacıyla Python topluluğunda benimsenen adlandırma geleneğinin (PEP 8 isimlendirme kuralının) doğmasını zorunlu kılmıştır. Python'da sabit olarak kullanılması amaçlanan isimler, PEP 8 adlandırma önerisine göre genellikle tüm harfleri büyük olacak ve kelimeler alt çizgiyle (_) ayrılacak biçimde yazılır.\n\n# Doğru Sabit Kullanım Standardı (BÜYÜK HARF)\nPI_SAYISI = 3.14159\nMAKSIMUM_DENEME_SAYISI = 3\nSISTEM_PORT_NUMARASI = 443\nVARSAYILAN_DIL = \"TR\"\nKARSILAMA_MESAJI = \" Sisteme Hoş Geldiniz!\"\nGELISTIRICI_MODU_ACIK = True\n\n2. Örnek: Sektörel Sabit Standardı ve Mantıksal Denetim\n\nKod-Asistan projesinin kullanıcı giriş panelinde, siber güvenlik önlemi olarak bir kullanıcının en fazla 3 kez hatalı şifre girme hakkı bulunmaktadır. Projenin kararlılığını korumak adına bu üst sınır değeri bir sabit olarak kurgulanmıştır.\n\n# Geliştirici Sözleşmesine Uygun Doğru Yapılandırma\nMAKSIMUM_DENEME = 3\nhatali_giris_sayici = 0  # Bu bir değişkendir, her hatalı girişle değeri artar.\nMAKSIMUM_DENEME = 99\n\nKod Analizi\n\n• Söz Dizimi Durumu: Başarılı. Python yorumlayıcısı, MAKSIMUM_DENEME = 99 satırında teknik olarak bir çökme veya SyntaxError üretmez, kodu okumaya devam eder.\n\n• Mantıksal Durum: Hatalı. Python yorumlayıcısı büyük harfle yazılan bu adı teknik olarak normal bir değişken gibi işler. Ancak PEP 8'e göre bu isim sabit olarak kullanılmak üzere tanımlandığından, değerinin program akışı içinde değiştirilmesi kod incelemesinde mantıksal ve stil açısından sorun olarak değerlendirilir.\n\n• İnsan Denetimi Kararı: Kod incelemesinde bu yeniden atama düzeltilmeden kodun ana sürüme alınmaması önerilir.\n\nBilgi Kutusu — Kodların Sessiz Rehberi: Yazılım projelerinde, bilgisayarın görmezden geldiği ancak yazılımcıların birbiriyle iletişim kurmak için bıraktığı \"sessiz notlar\" bulunur. Python'da # (diyez) işareti ile başlayan bu satırlar, makineye değil doğrudan insana hitap eder. Profesyonel yazılımcılar; kodun ne işe yaradığını takım arkadaşlarına anlatmak veya daha sonra hatırlamak için bu yöntemi kullanır. Örnek Kullanım:\n\n# Aşağıdaki değişken kullanıcının hatalı giriş sayısını tutar.\nhatali_giris_sayici = 0  # Bu değer her yanlış şifrede 1 artırılmalıdır.\nMAKSIMUM_DENEME_SAYISI = 3  # Sabit değer: Sistemin izin verdiği sınır aşılmamalıdır.\n# TODO: Gelecek sürümde (v2.0) buraya yeni bir şifre sıfırlama modülü eklenecek."}], "sorular": {"q1": {"type": "mc", "closed": true, "text": "Düşünelim-Tartışalım kutusundaki RAM örneğine göre, program kapatıldığında veya bilgisayarın enerjisi kesildiğinde bellekteki değişkenlere ne olur?", "opts": ["Kalıcı diske otomatik yedeklenir", "Tamamen silinir", "Değişmeden kalır", "Sabit hâle gelir", "Sıkıştırılarak saklanır"], "correct": "Tamamen silinir"}, "q2": {"type": "fill", "closed": true, "text": "input() fonksiyonu ile kullanıcıdan alınan veri, girilen karakterler sayı görünümünde olsa bile her zaman ______ türünde döner.", "accepted": ["metinsel", "str", "string"]}, "q3": {"type": "open", "closed": false, "text": "1. Örnek'teki (Dinamik Veri Türü Değişimi ve Denetimi) kod bloğunda asistan_verisi değişkenine sırasıyla 'Kod-Asistan v0.2', 100, 99.9 ve True değerleri atanmaktadır. print(type(asistan_verisi)) her adımda terminale sırasıyla hangi sınıfları yazdırır?"}, "q4": {"type": "mc", "closed": true, "text": "Tablo 2.5'e göre 1.kullanici_adi = 'Ali' şeklindeki değişken tanımlaması neden hatalıdır?", "opts": ["Anahtar kelime kullanıldığı için", "Rakamla başladığı için", "Boşluk içerdiği için", "Türkçe karakter içerdiği için", "Çok uzun olduğu için"], "correct": "Rakamla başladığı için"}, "q5": {"type": "tf", "closed": true, "text": "Python dilinde değişken isimlerinde büyük/küçük harf farkı gözetilmez; kullanici_adi ile KULLANICI_ADI aynı değişkendir.", "correct": "Yanlış"}, "q6": {"type": "open", "closed": false, "text": "4. Uygulama'daki (Kod Gözden Geçirme ve Söz Dizimi Denetimi) şu hatalı kod taslağını inceleyiniz:\n1_asistan_ismi = \"KODİ\"\nasistan-bellek-kapasitesi = \"16 GB\"\nwhile = 2026\nKullanici Adı = \"Ebru\"\nsistem_durumu$ = True\nBu satırlardaki her bir hatayı tespit edip snake_case standardına uygun, hatasız hâlini yeniden yazınız."}, "q7": {"type": "fill", "closed": true, "text": "Yazılım geliştirme sürecinde programın çalışma süresince değiştirilmemesi beklenen, genellikle tüm harfleri büyük ve kelimeleri alt çizgiyle ayrılan verilere ______ adı verilir.", "accepted": ["sabit", "sabitler", "constant"]}, "q8": {"type": "mc", "closed": true, "text": "2. Örnek'te (Sektörel Sabit Standardı ve Mantıksal Denetim) MAKSIMUM_DENEME = 3 olarak tanımlanan sabit, kod içinde MAKSIMUM_DENEME = 99 şeklinde yeniden atandığında Python yorumlayıcısı teknik olarak ne yapar?", "opts": ["SyntaxError verir", "Programı çökertir", "Sessizce yeni değeri atar (yalnızca mantıksal/stil hatası oluşur)", "Eski değeri korur", "ValueError verir"], "correct": "Sessizce yeni değeri atar (yalnızca mantıksal/stil hatası oluşur)"}, "q9": {"type": "open", "closed": false, "text": "2. Sıra Sizde etkinliğindeki kutucuklarda verilen int, float, str, bool, snake_case, BÜYÜK_HARF, PEP 8 kavramlarını kullanarak: Değişkenler nasıl, sabitler nasıl adlandırılır ve bu adlandırma kurallarının evrensel standardına ne ad verilir? Kısaca yazınız."}}}, {"no": 7, "baslik": "7. Hafta — Kullanıcı Etkileşimi ve Tür Dönüşümü", "baslangicTarihi": "2026-10-26", "konular": [{"id": "p1", "title": "Kullanıcı Etkileşimi ve input() Fonksiyonu", "body": "Algoritma tasarımlarında ve başlangıç seviyesindeki kaynak kod yapılandırmalarında değişkenlerin veya sabitlerin değerleri genellikle doğrudan kaynak kod içinde atanır. Profesyonel yazılım projelerinde ve son kullanıcıya hitap eden sistemlerde ise veriler programın her çalıştırılma döngüsünde dış dünyadan (kullanıcı klavyesinden, sensörlerden, veri tabanlarından, günlük dosyasından vb.) dinamik olarak sisteme dâhil edilir.\n\nPython dilinde program akışı esnasında kullanıcıdan veri almak ve bu veriyi geçici belleğe aktarmak amacıyla input() fonksiyonu kullanılır. Bu yerleşik fonksiyonun arka planda yürüttüğü çalışma mantığı sırasıyla şu üç aşamada gerçekleşir:\n\n• Akışın Durdurulması: Python yorumlayıcısı input() komutunun bulunduğu satıra geldiğinde, programın yukarıdan aşağıya doğru işleyen akışını geçici olarak beklemeye alır.\n\n• Girdi Beklentisi: Kullanıcı klavyeden bir veri yazıp Enter tuşuna basana kadar sistem beklemeye devam eder.\n\n• Atama Süreci: Enter tuşuna basıldığı anda klavyeden girilen tüm karakterler standart girdiden bir metin dizisi olarak döndürülür ve eşitliğin sol tarafındaki değişkene bir veri olarak atanır ve program alt satırdan akmaya devam eder.\n\nÖrnek Kod Bloğu\n\n# Kullanıcıdan veri alma ve bir değişkene atama şeması\nkullanici_tahmini = input(\"Lütfen şifre tahmininizi giriniz: \")"}, {"id": "p2", "title": "print() Fonksiyonu ve Çıktı Üretme Yöntemleri", "body": "Bir programın girdileri alıp işlemesi kadar oluşan sonuçları kullanıcıya anlaşılır, düzenli ve standartlara uygun bir biçimde sunması da etkileşim döngüsünün temel bir parçasıdır. Python programlama dilinde bilgisayar belleğindeki verileri, değişkenleri veya doğrudan metinsel ifadeleri terminal ekranına birer çıktı olarak yazdırmak amacıyla yerleşik print() fonksiyonu kullanılır.\n\nÖrnek Kod Bloğu\n\n# En temel çıktı üretme biçimi\nprint(\"Kod-Asistan sistemine hoş geldiniz!\")\n\nYazılım geliştirme süreçlerinde çoğunlukla sadece sabit metinler verilmemelidir, değişken veriler ile metinlerin bir arada sunulması gerekir. Python, bu birleştirme ve ekran çıktısını biçimlendirme işlemi için yazılımcılara kurumsal standartlarda farklı esneklikler sunar:\n\n• Virgül (,) ile Bağımsız Argümanları Ayırarak Çıktı Üretme: Farklı veri türündeki değişkenleri ve metinleri yan yana yazdırmak için en güvenli yöntem aralarına virgül koymaktır. Virgül, print() fonksiyonuna verilen bağımsız argümanları ayırır, ekrana yazdırma esnasında verilerin arasına varsayılan olarak bir adet boşluk karakteri yerleştirir ve değişkenin türünü değiştirmeden değerin metinsel gösterimini ekrana yazdığı için güvenlidir.\n\n• Artı (+) Operatörü ile String Birleştirme (Concatenation): Sadece metinsel ifadeleri birbirine yapışık şekilde bağlamak için kullanılır. Bu operatör, virgülün aksine araya otomatik boşluk bırakmaz. En kritik kararsızlık tuzağı, bir string ile sayısal bir verinin + operatörü ile birleştirilmeye çalışılmasıdır. Bu durum, programın TypeError istisnası üretmesine ve hata yakalanmamışsa yürütmenin durmasına yol açar.\n\n• f-String (Formatlı String) Teknolojisi: Modern Python mimarisinde metinlerin içerisine değişkenleri biçimlendirme kolaylığı ve en yüksek okunabilirlikle yerleştirme yöntemidir. String ifadesinin hemen başına f veya F harfi konur, metin içerisindeki değişkenler ise süslü parantez ({ }) içinde doğrudan çağrılır.\n\n3. Örnek: Dinamik Çıktı Üretme ve Formatlama (print Fonksiyonu)\n\nKod-Asistan projesinde asistanın adı, versiyon numarası, sistemin durumu ve kullanıcı logları (kayıtları) terminal ekranına yazdırılmak istenmektedir. Bu süreçte farklı veri tiplerinin birleştirilmesi, metinlerin arasına özel karakterler konulması, bazı çıktıların alt satıra geçmeden aynı satırda devam etmesi gibi çeşitli formatlama ihtiyaçları test edilecektir.\n\nÖrnek Kod Bloğu\n\n# Senaryo A: Virgül (,) ve Artı (+) Operatörlerinin Karşılaştırması\nasistan_adi = \"Kod Asistanı\"\nversiyon = 2\n# Virgül: Otomatik tür dönüşümü ve otomatik boşluk bırakır.\nprint(\"Benim adım\", asistan_adi, \"Sistem versiyonum:\", versiyon)\n# Artı (+): Sadece stringleri yapışık bağlar.\nkarsilama = \"Merhaba \" + \"Yazılımcı\"\nprint(karsilama)\n# print(\"Yaşınız: \" + 18) -> TypeError fırlatacağı için bilerek yoruma alındı.\n# Senaryo B: f-String (Formatlı String) Teknolojisi\nkullanici = \"Mustafa\"\nislem_adedi = 5\nprint(f\"Hoş geldiniz {kullanici}. Bugün yapay zekâ ile {islem_adedi} kod denetlediniz.\")\n\nKod Analizi\n\n• Python'da çıktı üretirken + operatörü tür uyuşmazlığı riski taşıdığı için tehlikelidir.\n\n• Çok sayıda değişkeni metin içine yerleştirirken en az bellek maliyeti ve en yüksek okunabilirlik sağlayan f-String mimarisi endüstri standardı olarak benimsenmelidir."}, {"id": "p3", "title": "print() Fonksiyonunun Gizli Parametreleri: sep ve end", "body": "print() fonksiyonu, kaynak kodda açıkça yazılmasa bile arka planda varsayılan değerlerle çalışan, isteğe bağlı iki kritik parametreye sahiptir. Kod yapısının çıktı standartlarını özelleştirmek için bu parametreler manuel olarak manipüle edilebilir.\n\nsep [Separator (Ayırıcı)]: Virgülle ayrılmış ifadelerin arasına hangi karakterin geleceğini belirler. Varsayılan değeri boşluktur (sep=\" \").\n\nend [End (Bitiriş)]: Çıktı ekrana basıldıktan sonra satırın nasıl sonlanacağını belirler. Varsayılan değeri bir alt satıra geçme komutu olan yeni satır karakteridir (end=\"\\n\").\n\nÖrnek Kod Bloğu\n\n# Senaryo C: print() Fonksiyonunun Gizli Parametreleri (sep ve end)\n# sep (Separator): Kelimeler arasına varsayılan boşluk yerine \"-\" koyar.\nprint(\"Siber\", \"Güvenlik\", \"Mühendisliği\", sep=\"-\")\n# end (End): Varsayılan alt satıra geçme (\\n) komutunu ezer, aynı satırda tutar.\nprint(\"Kod denetimi başladı...\", end=\" [BAŞARILI] \")\nprint(\"Sistem kararlı.\")\n\nÖzel sistem kayıtları üretirken print() fonksiyonunun sep ve end parametrelerine müdahale etmek, geliştiriciye sistem üzerinde tam bir formatlama kontrolü sağlar.\n\nBilgi Kutusu — Geliştirici Sözleşmesi ve Düzenin Gücü: Python dili, değişken isimlerinin arasına tire (-) koymanıza izin vermez veya sabitlerin küçük harfle yazılmasını teknik olarak engellemez. Küresel yazılım dünyasında milyonlarca yazılımcı, kurallara uymak zorunda olmadıkları hâlde PEP 8 standartlarına ve yılan gösterimi kurallarına harfiyen uyar. Kodları dijital depoya yüklerken her sürüme dürüst ve anlaşılır notlar eklerler. Sizce yazılımcıların kendi aralarında kurdukları bu Yazılı Olmayan Geliştirici Sözleşmesi ve iş süreçlerindeki titizlik, dijital dünyadaki karmaşayı nasıl engelliyor olabilir?"}, {"id": "p4", "title": "Temel Tür Dönüşüm Fonksiyonları", "body": "Yazılım geliştirme süreçlerinde dinamik veri girişi sağlayan input() fonksiyonunun girdileri, her zaman metinsel veri türünde belleğe kaydedilir. Girdilerin sayısal algoritmalara dâhil edilebilmesi için kullanılan, Python dilinde her temel veri türünün kendi adıyla anılan, yerleşik bir tip dönüşüm fonksiyonu bulunur.\n\nVerilerin bir türden diğerine dönüştürülmesi; bilgisayar belleğindeki orijinal verinin değiştirilmesi değil, o veriden istenen yeni türde tamamen yeni bir değer üretilmesi ve veri üzerinde yürütülebilecek mantıksal veya aritmetik işlem yeteneklerinin yeniden tanımlanması anlamına gelir.\n\n• int() Fonksiyonu: Kendisine parametre olarak verilen sayısal içerikli metinleri veya ondalıklı sayıları tam sayı türüne dönüştürür.\n\n• float() Fonksiyonu: Kendisine parametre olarak verilen tam sayıları veya sayısal içerikli metinleri ondalıklı sayı türüne dönüştürür. Sayısal değeri kayan noktalı sayı türünde temsil eder.\n\n• str() Fonksiyonu: Sayısal veya mantıksal değerleri, metinsel karakter dizilerine dönüştürür. Bu dönüşümden sonra veriler üzerinde matematiksel hesaplamalar yapılamaz hâle gelir.\n\n• bool() Fonksiyonu: Verilen değerlerin mantıksal birer doğruluk değeri (True / False) üretmesini sağlar. Python bellek mimarisinde sıfır (0 ve 0.0), \"\" (boş metin), boş koleksiyonlar, None gibi değerler False kabul edilirken, bunların dışındaki çoğu değer True olarak anlamlandırılır.\n\nFarklı kaynak verilerin ilgili dönüşüm fonksiyonlarına tabi tutulduklarında ürettikleri sonuçları ve bellek çıktı analizi durumlarını gösteren örnekler şöyledir:\n\nKaynak Veri | Kullanılan Fonksiyon | Üretilen Nihai Çıktı | Elde Edilen Veri Türü | Sistem Kararlılık Durumu\nyas = \"18\" | int(yas) | 18 | int | Kararlı: Matematiksel hesaplamalara uygundur.\nskor = \"A5\" | int(skor) | HATA | — | ValueError: Metin içinde rakam dışı karakter vardır.\nfiyat = 89 | float(fiyat) | 89.0 | float | Kararlı: Değer float türüne dönüştürüldü.\nkod = \"3.14\" | int(kod) | HATA | — | ValueError: Ondalıklı metin doğrudan int olamaz.\nveri = 100 | str(veri) | \"100\" | str | Kararlı: Karakter dizisi oldu, aritmetiğe kapatıldı.\ndurum = 0 | bool(durum) | False | bool | Kararlı: Sıfır, Python'da yanlış kabul edilen değerlerden biridir.\nmetin = \"\" | bool(metin) | False | bool | Kararlı: Boş karakter dizisi yokluk ifade eder.\nbosluk = \" \" | bool(bosluk) | True | bool | Kararlı: Hücrede boşluk karakteri barındığı için doludur.\n\nDüşünelim-Tartışalım: Bir e-ticaret sisteminin fatura modülü tasarlanırken kullanıcının klavyeden girdiği fatura_tutari = \"250.75\" değeri önce float() ile dönüştürülüp ardından int() fonksiyonuna verilirse hangi veri kaybı yaşanır? Verinin bellek davranışı boyutunu dikkate alarak açıklayınız."}, {"id": "p5", "title": "Sınır Durum Analizi: ValueError ve Veri Tipi Tuzakları", "body": "Yazılımcının kontrolü dışında dönüştürülmesi teknik olarak imkânsız olan veriler dönüşüm fonksiyonlarına parametre olarak gönderildiğinde dönüşüm hatası oluşur ve bu hata yakalanmazsa program durur. Bu sınır durumlar ve hata dinamikleri şu şekildedir:\n\n• Metinden Sayıya Dönüşüm Sınırı: İçerisinde alfabetik karakter veya özel sembol barındıran bir metin, int() veya float() fonksiyonu ile sayıya dönüştürülemez (örneğin int(\"Kod Asistan\") ifadesi doğrudan ValueError hatasını geri gönderir).\n\n• Ondalıklı Metin Tuzağı: Doğrudan tam sayı çevrilemeyen ondalıklı bir metin ifadesi önce float() fonksiyonuyla sayıya dönüştürülmeli, ardından int() katmanına alınmalıdır (örneğin int(\"99.9\") satırı hata verirken int(float(\"99.9\")) satırı kararlı çalışarak 99 çıktısını üretir). Burada int() fonksiyonunun matematiksel bir yuvarlama yapmadığına, sadece sayının ondalık kısmını kesip attığına dikkat edilmelidir.\n\n• bool() Fonksiyonunda Yokluk Denetimi: Sayısal olarak 0 ve 0.0 değerleri ve metinsel olarak tamamen boş bırakılmış \"\" ifadeleri bool() süzgecinden geçirildiğinde False sonucunu üretir. İçinde tek bir boşluk karakteri dahi olan \" \" ifadesi ise bellek hücresi dolu kabul edildiği için True çıktısını basar.\n\n5. Uygulama: İnteraktif Veri Girişi ve Tür Dönüşümü\n\nKod-Asistan projesinin kullanıcı profil modülüne dinamik bir hesaplama fonksiyonu eklenmesi planlanmaktadır. Bu fonksiyon kapsamında, asistanın kullanıcıya doğum yılını sorması ve aldığı bu girdi verisini kullanarak kullanıcının yaşını hesaplayıp ekrana yansıtması istenmektedir. Kodların test aşamasında, kullanıcının girdiği sayısal değerlerin matematiksel işlem sürecine dâhil edilemediği ve sistemin hata vererek durduğu gözlemlenmiştir:\n\ndogum_yili = input(\"Lütfen doğum yılınızı giriniz: \")\nmevcut_yil = 2026\nkullanici_yasi = mevcut_yil - dogum_yili\nprint(f\"Doğum Yılınız: {dogum_yili} | Hesaplanan Yaşınız: {kullanici_yasi}\")\n\nBu kod çalıştırıldığında Python yorumlayıcısı, klavyeden girilen 2008 değerini sayısal bir veri olarak değil metinsel bir karakter dizisi olarak belleğe kaydetmiştir. Matematiksel olarak tam sayı türündeki bir veriden (2026), metinsel türdeki bir verinin (2008) çıkarılması imkânsız olduğundan Python yorumlayıcısı, uyumsuz veri türleri nedeniyle TypeError: unsupported operand type(s) for -: 'int' and 'str' hatası üretmiş ve programın yürütülmesini durdurmuştur. Hatayı gidermek için input() fonksiyonundan gelen metinsel veriyi matematiksel işlemlere uygun bir tam sayıya dönüştürmek amacıyla kod bloğu şu şekilde yeniden düzenlenmelidir:\n\n# Veri girişi anında int() fonksiyonu ile tip dönüşümü yapılandırılıyor.\ndogum_yili = int(input(\"Lütfen doğum yılınızı giriniz: \"))\nmevcut_yil = 2026\nkullanici_yasi = mevcut_yil - dogum_yili\nprint(f\"Doğum Yılınız: {dogum_yili} | Hesaplanan Yaşınız: {kullanici_yasi}\")\n\n6. Uygulama: Dinamik Döviz ve Akıllı Kumbara Asistanı\n\nKod-Asistan yazılımına, kullanıcıların birikimlerini takip eden akıllı bir finansal modül eklenmesi istenmektedir. Kullanıcı, her işlemde kumbarasına eklediği Türk Lirası (TL) miktarını ve o günkü güncel döviz kurunu klavyeden sisteme girecektir. Kullanıcı döviz kurunu ondalıklı bir değer (örneğin 34.55) olarak girebileceğinden, giriş verilerinin uygun veri tipine dönüştürülmesi ve hesaplamalarda doğru veri türleriyle kullanılması gerekmektedir; kur ve TL verileri float() fonksiyonuyla sayısal veri türüne dönüştürülüp döviz karşılığını hesaplayan matematiksel formül kurulur ve oluşan sonuç f-string mimarisiyle ekrana yazdırılır.\n\nYazılım projelerinde sadece tam sayılarla (int) çalışmak, finansal işlemler veya hassas ölçümler gerektiren durumlarda yetersiz kalır. Döviz kurları, ürün fiyatları, ağırlık gibi ondalıklı değer barındıran kullanıcı girdilerinin matematiksel hesaplamalara dâhil edilebilmesi için metinsel (str) verilerin float() fonksiyonu kullanılarak ondalıklı sayı türüne dönüştürülmesi gereklidir."}], "sorular": {"q1": {"type": "mc", "closed": true, "text": "input() fonksiyonuyla ilgili aşağıdakilerden hangisi yanlıştır?", "opts": ["Kullanıcıdan veri alır", "Aldığı veriyi her zaman str türünde döndürür", "Enter tuşuna basılana kadar programın akışını bekletir", "Girilen sayısal bir değeri otomatik olarak int türüne çevirir", "Girdi beklerken programın akışı durur"], "correct": "Girilen sayısal bir değeri otomatik olarak int türüne çevirir"}, "q2": {"type": "fill", "closed": true, "text": "print(\"Siber\", \"Güvenlik\", \"Mühendisliği\", sep=\"-\") satırının terminale bastığı çıktı ______ şeklindedir.", "accepted": ["Siber-Güvenlik-Mühendisliği"]}, "q3": {"type": "open", "closed": false, "text": "5. Uygulama'da (İnteraktif Veri Girişi ve Tür Dönüşümü) kullanıcıdan doğum yılı alınıp doğrudan mevcut_yil - dogum_yili işlemine sokulursa terminalde TypeError: unsupported operand type(s) for -: 'int' and 'str' hatası oluşur. Bu hatayı gidermek için kod satırı nasıl düzeltilmelidir?"}, "q4": {"type": "mc", "closed": true, "text": "Bilgi Kutusu'na (2.2.2. Sınır Durum Analizi) göre bool(0) ve bool(\"\") ifadelerinin ikisi de hangi sonucu üretir?", "opts": ["İkisi de True", "İkisi de False", "Biri True biri False", "Hata verir", "None döner"], "correct": "İkisi de False"}, "q5": {"type": "tf", "closed": true, "text": "int('99.9') ifadesi Python'da hatasız çalışarak 99 sonucunu üretir.", "correct": "Yanlış"}, "q6": {"type": "open", "closed": false, "text": "Tablo 2.6'ya göre kod = '3.14' değişkenine int(kod) uygulandığında neden ValueError alınır? Bu ondalıklı metni sayıya dönüştürmek için hangi iki fonksiyon hangi sırayla kullanılmalıdır?"}, "q7": {"type": "open", "closed": false, "text": "6. Uygulama'daki (Dinamik Döviz ve Akıllı Kumbara Asistanı) senaryoda kullanıcıdan kumbaraya eklenen TL miktarını ve o günkü döviz kurunu (örneğin 34.55 gibi ondalıklı bir değer) input() ile alıp float()'a dönüştüren, ardından döviz karşılığını f-string ile ekrana yazdıran Python kodunu snake_case standardına uygun olarak yazınız."}, "q8": {"type": "fill", "closed": true, "text": "Metinlerin içine değişkenleri süslü parantez {} ile en okunaklı biçimde yerleştirmeyi sağlayan Python teknolojisine ______ denir.", "accepted": ["f-string", "fstring"]}}}, {"no": 8, "baslik": "8. Hafta — Operatörler ve İşlem Önceliği", "baslangicTarihi": "2026-11-02", "konular": [{"id": "p1", "title": "Operatörler ve Aritmetik Operatörler", "body": "Yazılım geliştirme süreçlerinde verilerin sadece belleğe kaydedilmesi veya türlerinin dönüştürülmesi tek başına bir anlam ifade etmez. Programların işlevsel birer ürüne dönüşebilmesi için bu verilerin belirli kurallar çerçevesinde işlenmesi, birbiriyle kıyaslanması ve mantıksal karar mekanizmalarına dâhil edilmesi gerekir.\n\nBilgisayarlarda veriler üzerinde matematiksel, karşılaştırmalı veya mantıksal yönlendirmeler yapmasını sağlayan özel sembollere ve karakter dizilerine operatör adı verilir. Operatörlerin işleme aldığı değişken ya da sabit değerlere ise operand denir.\n\nAritmetik operatörler; matematiksel hesaplamaların, formüllerin ve sayısal veri analizlerinin kaynak kod içerisinde çalıştırılmasını sağlayan sembollerdir. Python dilinde kullanılan standart aritmetik operatörlerin işlevleri ve bellek çıktı davranışları şöyle yapılandırılmıştır:\n\n• Toplama (+): İki sayısal veriyi toplar. Metinsel veriler arasında kullanıldığında ise birleştirme (concatenation) işlevi görür.\n\n• Çıkarma (-): Soldaki sayısal değerden sağdaki sayısal değeri çıkarır.\n\n• Çarpma (*): İki sayısal değeri çarpar. Metinsel bir veri ile bir tam sayı arasında kullanıldığında metni belirtilen sayı kadar ardışık olarak çoğaltır.\n\n• Bölme (/): Soldaki değeri sağdaki değere böler. Python bellek mimarisinde bu operatörün ürettiği sonuç, bölünen sayılar tam sayı olsa dahi her zaman ondalıklı sayı (float) türünde tahsis edilir.\n\n• Taban Bölme / Tam Bölme (//): Bölme sonucunun taban değerini, yani kendisinden büyük olmayan en yakın tam sayıyı üretir.\n\n• Mod Alma (%): Bölme işlemi sonucunda kalan sayısal değeri sisteme döndürür. Özellikle bir sayının tek mi çift mi olduğunun denetlenmesinde (2'ye göre mod alma) sıklıkla kullanılır.\n\n• Üs Alma (**): Soldaki sayının, sağdaki sayı kadar kuvvetini (üssünü) hesaplar (örneğin 2**3 ifadesi karşılığı olarak 8 çıktısını üretir).\n\nPython programlama dilinde sık kullanılan bu aritmetik operatörlerin işlevleri, örnek çıktı sonuçları ve bellek durumları şu şekilde özetlenmiştir:\n\nİşlem Kelimesi / İfadesi | Kullanılan Operatör | Çıktı Sonucu | Elde Edilen Veri Türü | Teknik Açıklama\nsonuc = 10 / 4 | / | 2.5 | float | Bölme işleminin sonucu her zaman ondalıklı (float) veri türünde üretilir.\nsonuc = 10 // 4 | // | 2 | int | Tam bölme işlemi, sonucun ondalıklı kısmını kaldırarak tam sayı değerini döndürür.\nsonuc = 13 % 5 | % | 3 | int | Mod alma işlemi, bölme sonucunda kalan değeri üretir.\nsonuc = 5 ** 2 | ** | 25 | int | Üs alma işlemi, sayının belirtilen kuvvetini hesaplayarak sonucu üretir.\n\n7. Uygulama: Aritmetiksel ve Mantıksal Analiz\n\nKod-Asistan projesinin merkezî karar ve matematiksel işlem modülünün v0.2 sürüm taslağı hazırlanmaktadır. Bölme (/) ile taban bölme (//) operatörleri arasındaki bellek ve veri türü farkını gözlemlemek amacıyla:\n\n# 1. Aşama: Aritmetik Operatörlerin İncelenmesi\nnormal_bolme = 10 / 4\ntaban_bolme = 10 // 4\nkalan_bulma = 10 % 4\nprint(\"Normal Bölme Sonucu:\", normal_bolme)\nprint(\"Taban Bölme Sonucu:\", taban_bolme)\nprint(\"Bölme İşleminden Kalan:\", kalan_bulma)\n\nBu kod çalıştırıldığında terminal ekranına sırasıyla Normal Bölme Sonucu: 2.5, Taban Bölme Sonucu: 2 ve Bölme İşleminden Kalan: 2 çıktıları yansır."}, {"id": "p2", "title": "Karşılaştırma ve Mantıksal Operatörler", "body": "Karşılaştırma operatörleri; iki verinin birbiriyle olan büyüklük, küçüklük veya eşitlik durumlarını analiz etmek amacıyla kullanılan matematiksel denetim araçlarıdır. Karşılaştırma (ilişkisel) operatörleri, uyumlu veri türleri arasında kullanıldığında sisteme her zaman mantıksal veri türünde sadece True veya False çıktısı üretir.\n\n• Eşittir (==): İki tarafın değerlerinin birbirine eşit olup olmadığını denetler. Eşit ise True, değil ise False üretir. (Tek eşittir = sembolü bellekte veri atama eylemidir, çift eşittir == ise mantıksal kıyaslama operatörüdür.)\n\n• Eşit Değildir (!=): İki tarafın değerlerinin birbirinden farklı olup olmadığını denetler. Değerler birbirinden farklı ise True, aynı ise False sonucunu verir.\n\n• Büyüktür (>) ve Küçüktür (<): Soldaki değerin sağdakinden büyüklük veya küçüklük durumunu denetler.\n\n• Büyük Eşittir (>=) ve Küçük Eşittir (<=): Değerlerin hem büyüklük/küçüklük hem de eşitlik sınır durumlarını aynı anda kontrol eder.\n\nMantıksal operatörler; birden fazla karşılaştırma ifadesinin veya mantıksal durumun birleştirilerek tek bir nihai karar mekanizmasına dönüştürülmesini sağlayan operatörlerdir. Özellikle program akışındaki çoklu şart senaryolarının denetlenmesinde kritik rol oynarlar.\n\n• ve (and) Operatörü: Bağladığı tüm karşılaştırma ifadelerinin veya mantıksal durumların tamamının True olması durumunda True sonucunu üretir. Koşullardan tek bir tanesi bile False olursa nihai çıktı doğrudan False olur.\n\n• veya (or) Operatörü: Bağladığı koşullardan en az bir tanesinin True olması durumunda True çıktısını basar. Sistemin False üretmesi için tüm koşulların aynı anda False olması gerekir.\n\n• değil (not) Operatörü: Önüne geldiği mantıksal değerin veya karşılaştırma sonucunun tersini alır. Bu operatör; True olan bir durumu False hâline getirir, False olan bir durumu ise True olarak tersine çevirir.\n\nPython programlama dilinde sık kullanılan operatörlerin işlevleri, örnek çıktı sonuçları şu şekilde özetlenmiştir:\n\nİşlem Kelimesi / İfadesi | Kullanılan Operatör | Çıktı Sonucu | Elde Edilen Veri Türü | Teknik Açıklama\nkontrol = (5 == 5) | == | True | bool | İki değer birbirine eşit olduğu için koşul sağlanır ve True sonucu üretilir.\nkontrol = (10 != 10) | != | False | bool | Değerler birbirine eşit olduğu için \"eşit değildir\" koşulu sağlanmaz ve False sonucu üretilir.\nonay = (5 > 2) and (3 < 1) | and | False | bool | Koşullardan biri yanlış (False) olduğu için and (ve) kuralı gereği sonuç False olur.\nonay = (5 > 2) or (3 < 1) | or | True | bool | İlk koşul doğru (True) olduğu için or (veya) kuralı gereği tek bir şartın sağlanması yeterlidir ve sonuç True olur.\nonay = not (10 > 20) | not | True | bool | Parantez içi False sonucunu verir; not (değil) operatörü bu değeri tersine çevirerek True yapar.\n\nDüşünelim-Tartışalım: Bir bilgisayar yazılımı tasarlanırken sisteme girilen bir kullanıcı şifresinin hem en az 8 karakterden oluşması hem de içinde en az bir adet özel sembol barındırması kurallarının aynı anda kontrol edilmesi istenmektedir. Bu iki şartın kontrolü için ilişkisel operatörlerin ardından hangi mantıksal operatör kullanılmalıdır? Nedenini gerekçeleriyle açıklayınız.\n\n7. Uygulama (devamı): İlişkisel ve Mantıksal Karar Yapılarının Entegrasyonu\n\n# 2. Aşama: İlişkisel ve Mantıksal Operatörlerin İncelenmesi\nsayi1 = 15\nsayi2 = 20\n# Çoklu koşul denetimi (and ve or operatörlerinin davranışı)\nkosul_ve = (sayi1 > 10) and (sayi2 < 15)\nkosul_veya = (sayi1 > 10) or (sayi2 < 15)\nkosul_degil = not (sayi1 == sayi2)\nprint(\"ve (and) Koşul Çıktısı:\", kosul_ve)\nprint(\"veya (or) Koşul Çıktısı:\", kosul_veya)\nprint(\"değil (not) Koşul Çıktısı:\", kosul_degil)\n\nTerminal Çıktısı Analizi: Kaynak kodlar hatasız şekilde çalıştırıldığında Python yorumlayıcısının operatör sembollerini işleyerek ürettiği kararlı çıktılar terminal paneline şu şekilde yansıtılır: ve (and) Koşul Çıktısı: False, veya (or) Koşul Çıktısı: True, değil (not) Koşul Çıktısı: True."}, {"id": "p3", "title": "İşlem Önceliği Kuralları", "body": "Kaynak kodlar içerisinde birden fazla operatörün aynı satırda ardışık olarak kullanılması durumunda, bilgisayarın hangi işlemi daha önce yürüteceğini belirleyen kurallar bütününe işlem önceliği (precedence) denir. Tıpkı geleneksel matematikteki çarpma işleminin toplama işlemine göre öncelikli olması gibi programlama dillerinde de her operatör grubunun hiyerarşik bir baskınlık sırası mevcuttur.\n\nBu kuralların yazılımcı tarafından dikkate alınmaması, programın çalışma zamanında çökmesine yol açmasa da üretilen sonuçların yanlış hesaplanmasına, bir diğer ifadeyle mantıksal hatalara (logic errors) neden olur.\n\nVerilen liste, Python yorumlayıcısının karmaşık kod satırlarını anlamlandırırken yukarıdan aşağıya doğru takip ettiği işlem önceliği sırasını gösterir:\n\n1. Parantezler ( ): En yüksek önceliğe sahiptir. Karmaşık aritmetik veya mantıksal ifadelerin öncelik sırasını manuel olarak değiştirmek ve kodu daha okunabilir kılmak amacıyla kullanılır.\n\n2. Üs Alma **: Sayısal kuvvet hesaplamaları, tüm aritmetik işlemlerden önce çalıştırılır.\n\n3. Çarpma, Bölme, Taban Bölme, Mod %, /, //, *: Bu operatörler kendi aralarında aynı öncelik düzeyine sahiptir.\n\n4. Toplama ve Çıkarma +, -: Aritmetik operatörler arasında en son çalıştırılan gruptur.\n\n5. Karşılaştırma Operatörleri ==, !=, >, <, >=, <=: Aritmetik hesaplamaların tamamlanmasının ardından ilişkisel denetimler devreye girer.\n\n6. Mantıksal Operatörler not, and, or: Karar mekanizmalarında en son işlenen gruptur. Kendi içindeki hiyerarşi sırasıyla önce not, sonra and, en son or şeklindedir.\n\nEğer aynı kod satırında, öncelik derecesi birbiriyle tamamen eşit olan operatörler (örneğin yan yana hem çarpma hem de bölme) yer alıyorsa Python yorumlayıcısı işlemi standart olarak soldan sağa doğru ardışık bir hiyerarşiyle yürütür ancak üs alma (**) operatörü bu kuralın istisnasıdır ve aynı satırda ardışık kullanıldığında sağdan sola doğru değerlendirilir.\n\n4. Örnek: İşlem Önceliği Etkisi\n\nKod-Asistan projesinde kullanıcının kilo ve boy verileri alınarak Vücut Kitle İndeksi (VKİ) hesaplanacaktır. VKİ formülü Kilo / (Boy x Boy) şeklindedir. Bilgisayar işlemcisinin karmaşık durumlarda hangi işlemi daha önce yürüteceğini belirleyen hiyerarşik yerleşimlerin ve parantez kullanımının, bilgisayar belleğindeki hesaplama sonuçlarını nasıl doğrudan değiştirdiği bu senaryo üzerinden test edilecektir.\n\nÖrnek Kod Bloğu\n\n# Senaryo A: Parantez Kullanılmayan Hatalı Durum (Mantık Hatası)\nkilo = 70.0\nboy = 1.75\n# Python, aynı öncelikteki çarpma ve bölme işlemlerini soldan sağa değerlendirir. Önce\n# kiloyu boya böler (70/1.75=40), sonra boyla çarpar (40*1.75=70).\nhatali_vki = kilo / boy * boy\nprint(\"Hatalı Hesaplama:\", hatali_vki)\n# Terminal Çıktısı: 70.0 (Mantıksız Sonuç)\n# Senaryo B: Parantez ile İşlem Önceliğinin Yönetilmesi (Güvenli Çözüm)\n# Parantez içi en yüksek önceliğe sahip olduğundan önce boy karesi (boy*boy) hesaplanır,\n# sonra bölme yapılır.\ndogru_vki = kilo / (boy * boy)\nprint(f\"Doğru Hesaplama: {dogru_vki:.2f}\")\n# Terminal Çıktısı: 22.85 (Doğru Sonuç)\n\nKod Analizi\n\n• Karmaşık hesaplama satırlarında Python yorumlayıcısının varsayılan hiyerarşisi dikkate alınmalıdır.\n\n• Hem kodun diğer yazılımcılar tarafından daha rahat okunabilmesi hem de olası mantık hatalarının engellenmesi adına öncelikli çalışması istenen bloklar mutlaka parantez ( ) içerisine alınarak güvence altına alınmalıdır.\n\nDüşünelim-Tartışalım: Bir öğrencinin üç farklı sınav notunun ortalamasını hesaplamak amacıyla kaynak koda ortalama = not1 + not2 + not3 / 3 satırı yazılmıştır. Bu kod satırı çalıştırıldığında Python yorumlayıcısı matematiksel olarak nasıl bir öncelik hatası yapar? Doğru ortalama sonucuna ulaşmak için kod satırı nasıl revize edilmelidir? Gerekçeleriyle açıklayınız."}], "sorular": {"q1": {"type": "mc", "closed": true, "text": "Tablo 2.7'ye göre sonuc = 10 // 4 işleminin elde edilen veri türü ve çıktı sonucu aşağıdakilerden hangisidir?", "opts": ["2.5, float", "2, int", "2.0, float", "2.5, int", "10, int"], "correct": "2, int"}, "q2": {"type": "fill", "closed": true, "text": "13 % 5 işleminin sonucu ______ dır.", "accepted": ["3"]}, "q3": {"type": "mc", "closed": true, "text": "Bağladığı koşullardan tamamının True olması durumunda True üreten mantıksal operatör aşağıdakilerden hangisidir?", "opts": ["or", "not", "and", "==", "!="], "correct": "and"}, "q4": {"type": "open", "closed": false, "text": "7. Uygulama'da (Aritmetiksel ve Mantıksal Analiz) sayi1 = 15, sayi2 = 20 için kosul_ve = (sayi1 > 10) and (sayi2 < 15) ve kosul_veya = (sayi1 > 10) or (sayi2 < 15) satırları çalıştırıldığında terminale yansıyan çıktılar nelerdir? Nedenleriyle yazınız."}, "q5": {"type": "open", "closed": false, "text": "4. Örnek'teki (İşlem Önceliği Etkisi) VKİ (Vücut Kitle İndeksi) senaryosunda hatali_vki = kilo / boy * boy satırı kilo=70.0, boy=1.75 için neden 70.0 (mantıksız) sonucu üretir? İşlem önceliğini parantezle düzelten doğru satırı yazınız."}, "q6": {"type": "tf", "closed": true, "text": "İşlem Önceliği Kuralları'na göre üs alma (**) operatörü aynı satırda ardışık kullanıldığında istisna olarak sağdan sola değerlendirilir.", "correct": "Doğru"}, "q7": {"type": "open", "closed": false, "text": "Düşünelim-Tartışalım'daki 'ortalama = not1 + not2 + not3 / 3' satırında Python hangi işlemi önce yapar (matematiksel olarak nasıl yanlış yorumlar) ve doğru ortalama sonucuna ulaşmak için satır nasıl düzeltilmelidir?"}, "q8": {"type": "mc", "closed": true, "text": "onay = (5 > 2) and (3 < 1) ifadesinin sonucu nedir?", "opts": ["True", "False", "5", "Hata verir", "None"], "correct": "False"}}}, {"no": 9, "baslik": "9. Hafta — Yapay Zekâ Kod Denetimi (1. Dönem 1. Sınav Haftası)", "baslangicTarihi": "2026-11-09", "konular": [{"id": "p1", "title": "Yapay Zekâ Halüsinasyonu ve İnsan Denetimi (Human-in-the-Loop) İlkesi", "body": "Yazılım dünyasında büyük dil modelleri ve yapay zekâ teknolojileri; kaynak kod alternatifleri üretme, algoritma tasarlama ve yazım hatalarını saptama süreçlerinde yazılımcılara rehberlik eden güçlü birer yardımcı hâline gelmiştir. Yapay zekâ modellerinin kod üretebiliyor olması, üretilen bu kodların her zaman kararlı, verimli ve hatasız olduğu anlamına gelmez.\n\nYapay zekâ araçları, insan düşüncesinin mimari ve mantıksal derinliğine sahip değildir. Büyük dil modelleri, eğitim verileri ve verilen bağlama dayanarak olası kod dizilerini üretir ancak kodun doğruluğunu veya güvenliğini garanti etmez. Bu teknik doğalarından ötürü, bazen gerçekte var olmayan komutları varmış gibi üretebilir ya da ilk bakışta doğru görünen fakat arka planda ciddi mantık hataları barındıran kod blokları ortaya çıkarabilir. Yazılım literatüründe bu duruma yapay zekâ halüsinasyonu (AI hallucination) adı verilir.\n\nYapay zekânın üretilen kaynak kodların barındırabileceği mantıksal, aritmetiksel kusurların veya söz dizimi kusurlarının yazılımı kararsızlaştırmasını önlemek adına endüstriyel standartlarda İnsan Denetimi (Human-in-the-Loop) prensibi uygulanır. İnsan Denetimi prensibi; yapay zekâyı karar verici mutlak bir otorite olarak değil yalnızca bir üretim asistanı olarak konumlandırır. Bu yaklaşıma göre yapay zekâ tarafından üretilen her bir kod satırı, algoritma mimarı olan insan tarafından satır satır denetlenmeli ve kod, üretim sistemine alınmadan önce insan tarafından incelenmeli ve güvenli bir test ortamında çalıştırılarak doğrulanmalıdır.\n\n8. Uygulama: Yapay Zekâ Kod Doğrulama ve Tür Hatası Denetimi\n\nKod-Asistan projesinin mini matematik modülü için bir yapay zekâ asistanından ham kod taslağı talep edilmiştir. Yapay zekâ, kullanıcıdan iki sayı alıp ortalamasını ekrana döndüren bir program hazırlamıştır. Bu kod bloğu, insan süzgecinden geçirilmeden doğrudan sisteme dâhil edilirse programın veri türü uyuşmazlığı nedeniyle hata üreteceği saptanmıştır. Araştırmacı bir kimlikle bu kod blokundaki tür hatasının sorgulanması, eksik bırakılan işlem önceliği parantezlerinin koda yerleştirilerek programın kararlı hâle getirilmesi beklenir.\n\nYapay Zekâ Tarafından Üretilen Ham Taslak (Hatalı Kod)\n\n# Kod-Asistan v0.2 - Yapay Zekânın Ürettiği Hatalı Taslak\nsayi1 = input(\"Birinci sayıyı giriniz: \")\nsayi2 = input(\"İkinci sayıyı giriniz: \")\nortalama = sayi1 + sayi2 / 2\nprint(\"Girdiğiniz sayıların ortalaması:\", ortalama)\n\nBu kod bloğunda iki temel kusur birlikte yer alır: input() ile alınan sayi1 ve sayi2 değerleri metinsel (str) türünde kaldığından sayi1 + sayi2 satırı önce string birleştirme yapacak ardından sonucu 2'ye bölmeye çalışacak, bu da TypeError üretecektir; ayrıca işlem önceliği kuralları gereği bölme (/) toplamadan önce çalıştığı için parantez kullanılmadan yazılan ortalama = sayi1 + sayi2 / 2 satırı, sayi1 + (sayi2 / 2) şeklinde yorumlanacak ve matematiksel olarak yanlış bir ortalama üretecektir. Kararlı ve doğru hâli şu şekilde yeniden yapılandırılmalıdır:\n\nsayi1 = float(input(\"Birinci sayıyı giriniz: \"))\nsayi2 = float(input(\"İkinci sayıyı giriniz: \"))\nortalama = (sayi1 + sayi2) / 2\nprint(\"Girdiğiniz sayıların ortalaması:\", ortalama)"}, {"id": "p2", "title": "Yapay Zekâ Destekli Yazılım Geliştirmede Sorumluluk Sınırı", "body": "Bir yazılım projesinde yapay zekâ yardımı alınsa dahi kodun kararlı çalışmasından, veri türlerinin doğru seçilmesinden ve işlem önceliği kurallarının hatasız işletilmesinden doğrudan algoritmayı tasarlayan yazılımcı sorumludur. Yapay zekânın sunduğu önerileri körü körüne koda dâhil etmek, projenin çökmesine veya bellek kayıplarına yol açabilir. Profesyonel bir bilişim uzmanı, asistanın ürettiği ham kodları birer taslak kabul ederek kendi teknik bilgisi ve insan zekâsıyla kodlara nihai şeklini verir.\n\nBu sorumluluk sınırı, yapay zekânın kod denetiminde sadece bir üretim asistanı olarak kalması ve nihai kararın her zaman insan mühendisliğinde bulunması gerektiği ilkesine dayanır; kodun ürettiği her çıktının bir işlem önceliği hatası, bir veri türü uyuşmazlığı ya da gerçekte var olmayan bir fonksiyon çağrısı (halüsinasyon) barındırıp barındırmadığı, sisteme dâhil edilmeden önce satır satır sorgulanmalıdır.\n\nDüşünelim-Tartışalım: Bir web sitesinin üyelik modülü için yapay zekâya kod ürettirildiğinde yapay zekânın değişken isimlerini kurallara aykırı olarak boşluklu veya rakamla başlayacak şekilde tasarladığını varsayınız. İnsan Denetimi prensibi doğrultusunda bu kod blokunu doğrudan sisteme aktarmak yerine nasıl bir süreç işletilmelidir? Gerekçeleriyle açıklayınız."}, {"id": "p3", "title": "Bu Hafta Sınav Haftası", "body": "Bu hafta 1. Dönem 1. Sınavımız var. Sınav; programlama dilleri ve geliştirme ortamları, veri türleri, değişken/sabit tanımlama kuralları, tür dönüşüm fonksiyonları, operatörler ve işlem önceliği konularını kapsayacaktır. Tekrar yapmak için önceki haftaların Egzersizler bölümüne göz atabilir, özellikle işlem önceliği ve tür dönüşüm sorularını tekrar çözebilirsiniz."}], "sorular": {"q1": {"type": "mc", "closed": true, "text": "Yapay zekâ tarafından üretilen kodların çalıştırılmadan önce bir uzman tarafından denetlenmesinin temel nedeni aşağıdakilerden hangisidir?", "opts": ["Kodun daha kısa sürede yazılmasını sağlamak", "Mantıksal ve söz dizimi kaynaklı hataları saptamak", "İşlemci hızını artırmak", "Dosyaların depolama alanını küçültmek", "Grafik tasarımı otomatikleştirmek"], "correct": "Mantıksal ve söz dizimi kaynaklı hataları saptamak"}, "q2": {"type": "tf", "closed": true, "text": "Yapay zekâ modelleri, insan düşüncesinin mimari ve mantıksal derinliğine tam olarak sahiptir ve ürettiği kod her zaman güvenlidir.", "correct": "Yanlış"}, "q3": {"type": "fill", "closed": true, "text": "Yapay zekâ modellerinin gerçekte var olmayan bir komutu veya işlevi varmış gibi üretmesine ______ adı verilir.", "accepted": ["halüsinasyon", "hallucination", "yapay zekâ halüsinasyonu", "yapay zeka halusinasyonu"]}, "q4": {"type": "open", "closed": false, "text": "8. Uygulama'daki (Yapay Zekâ Kod Doğrulama ve Tür Hatası Denetimi) senaryoda yapay zekâ asistanı şu kodu üretmiştir:\nsayi1 = input(\"Birinci sayıyı giriniz: \")\nsayi2 = input(\"İkinci sayıyı giriniz: \")\nortalama = sayi1 + sayi2 / 2\nprint(\"Girdiğiniz sayıların ortalaması:\", ortalama)\nBu kodda hem veri türü hem işlem önceliği hatası vardır. Hataları bulup düzeltilmiş kodu yazınız."}, "q5": {"type": "open", "closed": false, "text": "İnsan Denetimi (Human-in-the-Loop) ilkesine göre yapay zekâ, karar verici bir otorite midir yoksa bir üretim asistanı mıdır? Bir yazılım projesinde nihai sorumluluğun kime ait olduğunu gerekçeleriyle açıklayınız."}, "q6": {"type": "open", "closed": false, "text": "1. Dönem 1. Sınavına hazırlanırken en çok zorlandığınızı düşündüğünüz konuyu (örneğin işlem önceliği, tür dönüşümü veya değişken adlandırma kuralları) yazınız ve bu konuyu pekiştirmek için nasıl bir çalışma planı yapacağınızı belirtiniz."}}}, {"no": 10, "baslik": "10. Hafta — Ünite 2 Ölçme ve Değerlendirme", "baslangicTarihi": "2026-11-23", "konular": [{"id": "p1", "title": "Ünite Özeti: Veri Türleri, Değişkenler ve Sabitler", "body": "Ünite 2 boyunca öğrenilen kavramların başında Python'un neden bir programlama dili olarak tercih edildiği gelir: yüksek seviyeli, insan diline yakın söz dizimine sahip ve yorumlayıcı (interpreter) tabanlı çalışan bir dildir; bu nedenle yazılan her satır anında çalıştırılır ve hata bulunduğu satırda yorumlayıcı durur. Python'ın kurulumu, komut satırından python --version ile doğrulanması, Interactive Shell ve IDLE'ın farkı, projeler büyüdükçe Visual Studio Code veya PyCharm gibi kaynak kod editörü/IDE seçeneklerine geçilmesi bu ünitenin ilk temel kazanımıdır.\n\nİkinci temel kazanım, Python'un dinamik tipli bir dil olduğu ve değişkenlerin veri türünün atanan değere göre otomatik belirlendiğidir; type() fonksiyonu bu türü her an sorgulamamıza imkân verir. Dört temel veri türü olan tam sayı (int), ondalıklı sayı (float), metinsel veri (str) ve mantıksal veri (bool) birbirinden bu şekilde ayrılır. Değişken tanımlarken karakter kısıtlaması, rakamla başlamama, büyük-küçük harf duyarlılığı ve ayrılmış anahtar kelime yasağı gibi söz dizimi kurallarına uyulması zorunludur; okunabilirlik için ise değişkenler snake_case, sabitler ise BÜYÜK_HARF notasyonuyla (PEP 8 stil kılavuzu) yazılır. Python'da teknik bir sabit mekanizması olmasa da bu adlandırma geleneği, kodun kararlılığını ve bakımını kolaylaştıran bir geliştirici sözleşmesi işlevi görür."}, {"id": "p2", "title": "Ünite Özeti: Kullanıcı Etkileşimi, Operatörler ve Yapay Zekâ Denetimi", "body": "Üçüncü kazanım kullanıcı etkileşimi ile ilgilidir: input() fonksiyonuyla alınan her veri, sayı görünse dahi başlangıçta metinsel (str) türündedir ve int()/float()/str()/bool() fonksiyonlarıyla güvenli biçimde dönüştürülmelidir; aksi hâlde ValueError veya TypeError gibi çalışma zamanı hataları programın durmasına yol açar. print() fonksiyonu ise virgül, + operatörü ve en okunaklı yöntem olan f-string ile; sep ve end gizli parametreleriyle esnek biçimde çıktı üretir.\n\nDördüncü kazanım operatörler ve işlem önceliğidir: aritmetik (+, -, *, /, //, %, **), karşılaştırma (==, !=, >, <, >=, <=) ve mantıksal (and, or, not) operatörlerin her birinin kendi hiyerarşisi vardır; parantez ( ) bu sırayı güvenle değiştirmenin ve mantık hatalarını önlemenin tek güvenilir yoludur. Son olarak, yapay zekânın ürettiği kodların da bu kurallara uyup uymadığı mutlaka İnsan Denetimi (Human-in-the-Loop) ilkesiyle satır satır sorgulanmalı; yapay zekâ halüsinasyonu riskine karşı nihai sorumluluğun her zaman algoritmayı tasarlayan insanda kaldığı unutulmamalıdır."}], "sorular": {"q1": {"type": "mc", "closed": true, "text": "Kaynak kodu çalıştırılmadan önce makine koduna veya ara koda dönüştüren yazılım aşağıdakilerden hangisidir?", "opts": ["Yorumlayıcı sistemi", "Derleyici sistemi", "Etkileşimli kabuk", "Eklenti mağazası", "Dosya gezgini"], "correct": "Derleyici sistemi"}, "q2": {"type": "mc", "closed": true, "text": "Bellekte 'veri' ve 'VERİ' adlarının iki farklı değişken adı olarak değerlendirilmesine yol açan dil özelliği aşağıdakilerden hangisidir?", "opts": ["Büyük-küçük harf duyarlılığı", "Türkçe karakter standardı", "Geliştirici sözleşmesi", "Akıllı kod tamamlama", "Sürüm kontrol sistemi"], "correct": "Büyük-küçük harf duyarlılığı"}, "q3": {"type": "mc", "closed": true, "text": "Bölme sonucunun taban değerini (kendisinden büyük olmayan en yakın tam sayıyı) üreten operatör aşağıdakilerden hangisidir?", "opts": ["*", "/", "%", "//", "**"], "correct": "//"}, "q4": {"type": "mc", "closed": true, "text": "Bağladığı karşılaştırma ifadelerinden en az bir tanesinin doğru olması durumunda True mantıksal çıktısını üreten operatör aşağıdakilerden hangisidir?", "opts": ["and", "or", "not", "==", "!="], "correct": "or"}, "q5": {"type": "open", "closed": false, "text": "asistan_verisi = 'Kod-Asistan v0.2'; print(type(asistan_verisi)); asistan_verisi = 100; print(type(asistan_verisi)); asistan_verisi = 99.9; print(type(asistan_verisi)) kod bloğu çalıştırıldığında terminale yansıyacak çıktılar sırasıyla nelerdir?"}, "q6": {"type": "open", "closed": false, "text": "1_urun = 'Bilgisayar'; ekran-karti-kapasitesi = '16 GB'; def = 1453 satırlarındaki hataları bulup kodun hatasız, güvenli hâlini yılan gösterimi (snake_case) notasyonuna uygun olarak yeniden yazınız."}, "q7": {"type": "open", "closed": false, "text": "hesaplama = 10 + 5 * 2 ve onay = 10 + 5 > 12 and not (3 == 4) satırları çalıştırıldığında değişkenlerin üreteceği nihai çıktılar nelerdir? Python'ın işlem önceliği kurallarını basamaklar hâlinde açıklayarak yazınız."}, "q8": {"type": "open", "closed": false, "text": "Kullanıcıdan adını ve o gün denetlediği kod adedini tam sayı olarak dinamik şekilde alınız. Alınan bu verilerle terminal ekranına f-string kullanarak 'Hoş geldiniz Mustafa. Bugün yapay zekâ ile 5 kod denetlediniz.' şeklinde yazdıran Python kodu nedir? Yazınız."}, "q9": {"type": "mc", "closed": true, "text": "Aşağıdaki kutucuklardan (float, and, or, //, str, not, int, %, bool) hangileri sayısal değerleri temsil etmek amacıyla kullanılan veri türleridir?", "opts": ["float, int", "and, or, not", "//, %", "str, bool", "Hepsi"], "correct": "float, int"}}}, {"no": 11, "baslik": "11. Hafta — Koşul Yapıları: if, if-else, if-elif-else", "baslangicTarihi": "2026-11-30", "konular": [{"id": "p1", "title": "Karar Yapılarına Giriş ve if (Eğer) Yapısı", "body": "Programlama dillerinde, belirlenen bir mantıksal koşulun sonucuna [Doğru (True) veya Yanlış (False)] göre program akışının farklı dallara ayrılmasını sağlayan kontrol mekanizmalarına karar yapıları (decision structures) adı verilir. Şimdiye kadar yazılan tüm kod blokları yukarıdan aşağıya doğru sırayla, tek bir çizgisel akışla çalışıyordu; ancak gerçek dünya yazılımlarının büyük bir kısmı, kullanıcının girdiği veriye veya sistemin anlık durumuna göre farklı senaryolar üretmek zorundadır. Python dilinde bu dallanma süreci if, elif ve else anahtar kelimeleriyle yönetilir.\n\nKarar yapılarının en temel basamağı if (eğer) yapısıdır. Bir koşulun doğruluğunu denetleyen bu yapı, if satırının sonuna eklenen iki nokta (:) işaretinden itibaren aşağıya doğru girintilenmiş kod satırlarının çalıştırılıp çalıştırılmayacağını belirler. Belirtilen koşulun mantıksal sonucu True (Doğru) ise if bloğu altında girintilenmiş olan kod satırları çalıştırılır; koşul False (Yanlış) ise bu blok tamamen atlanır ve yorumlayıcı doğrudan bloktan sonraki ilk girintisiz satıra geçer.\n\n# if Yapısı Söz Dizimi Şablonu\nif kosul_ifadesi:\n    gorev_satiri_1\n    gorev_satiri_2\nana_akis_satiri\n\nKod blokunda, kosul_ifadesi değeri True ise gorev_satiri_1, gorev_satiri_2 ve ana_akis_satiri sırasıyla çalışır. Eğer kosul_ifadesi değeri False ise yorumlayıcı if bloğunun tamamını atlar ve yalnızca girintisiz olan ana_akis_satiri kodu çalışır. Bu davranış, if yapısının koşullu bir eylem eklerken programın ana akışını hiçbir zaman kesintiye uğratmadığını gösterir; sadece belirli bir koşul altında akışa ek bir görev iliştirilmiş olur.\n\nGünlük hayatta bu mantık, \"Yağmur yağıyorsa şemsiyeni al.\" talimatına benzer: Şemsiye alma eylemi sadece koşul (yağmur yağması) gerçekleştiğinde tetiklenir, yağmur yağmıyorsa kişi zaten normal rutinine (ana akışa) devam eder."}, {"id": "p2", "title": "Dallanma Mantığı ve Girinti Dünyası", "body": "Python'da kod bloklarının sınırlarını belirleyen temel özelliklerden biri girinti (indentation) mimarisidir. C++, Go, C# gibi dillerde bir kod bloğunun hangi koşula veya döngüye ait olduğunu belirtmek için süslü parantezler ({ }) kullanılırken Python dil mimarisinde bu işlem, doğrudan kodun satır başından itibaren bırakılan boşluklar vasıtasıyla gerçekleştirilir.\n\nPython yorumlayıcısı, bir kontrol yapısının (if, elif, else, for veya while) başladığını belirten iki nokta (:) sembolünü gördüğü andan itibaren sonraki satırın içe doğru kaydırılmasını (4 boşluk veya 1 Tab tuşu) bekler. Aynı girinti seviyesinde bulunan tüm kod satırları, tek bir mantıksal blok olarak kabul edilir. Python kod bloklarında her girinti düzeyi için dört boşluk kullanılması önerilir. Aynı dosyada Tab ve boşluk karakterleri karıştırılmamalıdır. Girinti kuralının ihlal edilmesi durumunda sistem doğrudan IndentationError (Girinti Hatası) vererek akışı durdurur.\n\n# Standart Girinti Yapısı\nif kosul_ifadesi:\n    # Bu satır koşula bağlıdır (4 boşluk içeride).\n    gorev_satiri_1\n    gorev_satiri_2\n# Bu satır girintiden çıktığı için koşuldan bağımsızdır, her şekilde çalışır.\nana_akis_satiri\n\nGirinti mimarisi Python'a büyük bir okunabilirlik kazandırsa da yazılımcıyı disiplinli olmaya zorlar: bir kod editöründe görünmez boşluk karakterleri (Tab ile boşluğun karışması gibi) mantık hatalarına ve çalışma zamanı hatalarına yol açabilir. Bu nedenle kod editörlerinin görünmez karakterleri gösteren özelliklerinden (Render Whitespace vb.) yararlanmak, girinti kaynaklı hataları erkenden fark etmeyi kolaylaştırır."}, {"id": "p3", "title": "Çift Yönlü Alternatifler: if-else (Eğer-Değilse) Yapısı", "body": "Gerçek dünya senaryolarında koşulun doğru olması durumunda bir kod bloğunun, yanlış olması durumunda ise mutlaka başka bir kod bloğunun çalıştırılması istenir. Bu tür çift yönlü yol ayrımlarında if ifadesi else (aksi takdirde) anahtar kelimesiyle birlikte yapılandırılır. else ifadesi tek başına bir koşul barındırmaz, if şartının başarısız olduğu tüm senaryoları otomatik olarak kapsayan güvenli bir limandır.\n\n# Kullanıcı Rolü Yetki Kontrolü\nkullanici_rolu = \"Misafir\"\nif kullanici_rolu == \"Yönetici\":\n    print(\"Erişim İzni Verildi. Sistem paneli yükleniyor...\")\nelse:\n    print(\"Erişim Engellendi! Bu alanı görmeye yetkiniz yok.\")\n\nBu kod bloğu çalıştırıldığında kullanici_rolu değişkeni \"Misafir\" değerine sahip olduğundan if kullanici_rolu == \"Yönetici\" karşılaştırması False sonucu üretir ve Python yorumlayıcısı doğrudan else bloğuna geçerek \"Erişim Engellendi! Bu alanı görmeye yetkiniz yok.\" çıktısını ekrana basar.\n\n1. Örnek: Kararlı Sepet ve İndirim Hesaplama Modülü\n\nKod-Asistan projesine kullanıcıların sepet tutarlarını ve indirim haklarını hesaplayan akıllı bir finansal katman eklenecektir. Uygulamanın kampanya kuralları şu birleşik mantığa göre çalışmaktadır: Bir kullanıcının indirim alabilmesi için öncelikle kupon kodunun aktif olması ve kullanıcının yaşının 18'den büyük ya da eşit olması veya toplam sepet tutarının 500 TL'den fazla olması gerekir. Eğer bu birleşik şartlar sağlanıyorsa sepet tutarına %10 indirim uygulanacak, şartlar sağlanmıyorsa sepet tutarı aynen korunacaktır.\n\nsepet_tutari = float(input(\"Lütfen mevcut sepet tutarını giriniz (TL): \"))\nkullanici_yasi = int(input(\"Lütfen yaşınızı giriniz: \"))\nkupon_kod_aktif_mi = True\n# BİRLEŞİK OPERATÖR KULLANIMI VE İŞLEM ÖNCELİĞİ ALANI\nindirim_onaylandi_mi = kupon_kod_aktif_mi and (kullanici_yasi >= 18 or sepet_tutari > 500)\nif indirim_onaylandi_mi:\n    indirim_miktari = sepet_tutari * 0.10\n    odenecek_tutar = sepet_tutari - indirim_miktari\n    print(f\"Tebrikler! Kampanya şartlarını sağladınız. Net Ödenecek Tutar: {odenecek_tutar:.2f} TL\")\nelse:\n    print(f\"Maalesef kampanya şartları sağlanamadı. Net Ödenecek Tutar: {sepet_tutari:.2f} TL\")\n\nKod Gözden Geçirme (Code Review) Çıkarımı: Kodda (kullanici_yasi >= 18 or sepet_tutari > 500) blokunun parantez içine alınmasıyla varsayılan işlem önceliği hiyerarşisi yazılımcı tarafından değiştirilmiş ve Python yorumlayıcısının önce bu şartları hesaplaması sağlanmıştır; f-string ise değişkenlerin metin içine okunabilir ve kolay biçimlendirilebilir şekilde yerleştirilmesini sağlar."}, {"id": "p4", "title": "Karşılaştırma ve Mantıksal Operatörlerin Birleşik Kullanımı", "body": "Programlama dillerinde kararlar, çoğunlukla tek bir dinamik verinin kontrol edilmesinden çok daha karmaşıktır. Bir sistemin tanımlanan koşullara göre doğru kod bloklarını çalıştırabilmesi ve doğru çıktılar üretebilmesi, birden fazla nesnel şartın aynı anda ve birleşik bir süzgeçten geçirilmesini gerektirir. Günlük hayatta tasarruf bilinciyle yapılan bir alışverişte sadece bütçenin yeterli olması tek başına bir satın alma sebebi değildir; ürünün gerçek bir ihtiyaç olması da (bütçe yeterli ve temel ihtiyaç) gözetilir. Yazılım literatüründe de bu tarz çoklu koşulları tasarlamak için ilişkisel operatörler (<, >, ==, !=, <=, >=) vasıtasıyla üretilen tekil mantıksal çıktılar, yerleşik mantıksal operatörler (and, or, not) kullanılarak birbirine bağlanır ve tek bir nihai True ya da False değerine indirgenir.\n\nBirleşik ifadelerin doğru sonuçlar üretebilmesi için Python dil mimarisindeki Genel İşlem Önceliği Hiyerarşisi kuralları dikkate alınmalıdır. Karmaşık bir kod satırı değerlendirilirken Python yorumlayıcısı sırasıyla şu adımları izler:\n\n1. Aritmetik Operatörler: Önce matematiksel hesaplamalar (*, /, +, -) tamamlanır.\n\n2. İlişkisel (Karşılaştırma) Operatörler: Çıkan sayısal sonuçlar birbirleriyle kıyaslanır (==, >, <= vb.) ve ham True / False değerleri üretir.\n\n3. Mantıksal Operatörler: Üretilen mantıksal değerler kendi içinde önce not, sonra and ve en son or hiyerarşisiyle işlenerek tek bir karara bağlanır.\n\nBu hiyerarşinin kavranması ve kod yazarken karmaşık bölümlerin parantez ( ) ile gruplandırılarak güvence altına alınması, programın yanlış hesaplamalar yapmasının (mantıksal hataların) önüne geçmek için uygulanan en temel yazılım standartlarından biridir."}, {"id": "p5", "title": "Çok Kriterli Karar Mekanizmaları: if-elif-else Merdiveni", "body": "Günlük hayatta ve karmaşık yazılım mimarilerinde kararlar her zaman \"Evet / Hayır\" gibi iki seçenekten ibaret değildir. Çoğu zaman birbirine bağlı birden fazla koşulun sırayla kontrol edilmesi ve sadece doğru olan yolun seçilmesi gerekir. Python programlama dilinde bu tür çok kriterli karar süreçlerini yönetmek için if ve else ifadelerinin arasına \"aksi takdirde eğer\" anlamına gelen elif (else-if kısaltması) anahtar kelimesi yerleştirilir.\n\nif-elif-else yapısı yukarıdan aşağıya doğru doğrusal bir hiyerarşiyle çalışır. Python yorumlayıcısı ilk karşılaştığı if koşulunu test eder, eğer bu koşul doğru ise ilgili kod bloğunu çalıştırır ve merdivenin geri kalan tüm basamaklarını (elif ve else bloklarını) işletmeden doğrudan kontrol yapısından çıkar. Eğer ilk koşul yanlış ise sırasıyla aşağıdaki elif basamaklarını kontrol etmeye başlar. Koşulların hiçbirinin sağlanmadığı senaryoda ise en altta yer alan ve adeta güvenli bir liman olan else bloğu devreye girer.\n\n# if-elif-else Merdiven Yapısı Şablonu\nif birinci_kosul:\n    # Sadece birinci koşul True ise çalışır.\n    blok_1\nelif ikinci_kosul:\n    # Birinci koşul False VE ikinci koşul True ise çalışır.\n    blok_2\nelif ucuncu_kosul:\n    # Önceki koşullar False VE üçüncü koşul True ise çalışır.\n    blok_3\nelse:\n    # Yukarıdaki tüm koşullar False ise mutlaka çalışır.\n    varsayilan_blok\n\nif-elif-else merdiveni kurgulanırken koşulların yazım sırası programın mantıksal kararlılığı açısından kritik bir öneme sahiptir. Yorumlayıcı ilk doğru gördüğü blokta aramayı sonlandırdığı için kapsayıcılığı yüksek olan koşulların alt basamaklara, daha özel veya dar kapsamlı koşulların ise üst basamaklara yazılması gerekir. Aksi takdirde bazı kod blokları hiçbir zaman çalışmayarak ölü kod (dead code) hâline gelebilir."}], "sorular": {"q1": {"type": "fill", "closed": true, "text": "if bloklarının hangi koşula ait olduğunu belirleyen, süslü parantez yerine kullanılan Python yapısına ______ denir.", "accepted": ["girinti", "indentation"]}, "q2": {"type": "tf", "closed": true, "text": "Python'da bir if bloğunda girinti kuralına uyulmaması IndentationError hatasına yol açar.", "correct": "Doğru"}, "q3": {"type": "open", "closed": false, "text": "'Kullanıcı Rolü Yetki Kontrolü' örneğinde kullanici_rolu = 'Misafir' iken if kullanici_rolu == 'Yönetici': print('Erişim İzni Verildi...') else: print('Erişim Engellendi!...') yapısı çalıştırılırsa ekrana hangi mesaj yazılır? Nedenini açıklayınız."}, "q4": {"type": "open", "closed": false, "text": "1. Örnek'teki (Kararlı Sepet ve İndirim Hesaplama Modülü) indirim_onaylandi_mi = kupon_kod_aktif_mi and (kullanici_yasi >= 18 or sepet_tutari > 500) satırında parantezin rolü nedir? Parantez olmasaydı Python'ın varsayılan işlem önceliği bu ifadeyi nasıl farklı yorumlardı?"}, "q5": {"type": "mc", "closed": true, "text": "elif anahtar kelimesi Python'da hangi anlama gelir?", "opts": ["Ve", "Aksi takdirde eğer", "Değilse", "Döngü kur", "Fonksiyon tanımla"], "correct": "Aksi takdirde eğer"}, "q6": {"type": "open", "closed": false, "text": "1. Uygulama'daki (Çoklu Karar Yapıları ve Akıllı Menü Yönetimi) taslak kodda Kullanici_turu değişkeni büyük K ile tanımlanıp ilerleyen satırlarda kullanici_turu (küçük k) ile kullanılırsa Python hangi hatayı (NameError) verir? Bu hatayı önlemek için ne yapılmalıdır?"}, "q7": {"type": "tf", "closed": true, "text": "if-elif-else merdiveninde Python yorumlayıcısı yukarıdan aşağıya ilk True bloğu bulup çalıştırdıktan sonra kalan blokları kontrol etmeden yapıdan çıkar.", "correct": "Doğru"}}}, {"no": 12, "baslik": "12. Hafta — İç İçe Koşullar ve Büyük/Küçük Harf Duyarlılığı", "baslangicTarihi": "2026-12-07", "konular": [{"id": "p1", "title": "İç İçe (Nested) Koşul Yapıları", "body": "Yazılım dünyasında bazı problemlerde bir koşulun kontrol edilebilmesi, kendisinden önceki başka bir koşulun başarıyla gerçekleşmiş olmasına bağlı olabilir. Bir kontrol yapısının içine (girinti seviyesini bir kademe daha artırarak) yeni bir kontrol yapısı yerleştirilmesine iç içe (nested) koşul yapısı adı verilir.\n\nGünlük hayatta ehliyet alma süreci, bu mimariye verilebilecek somut örneklerden biridir. Bir adayın sürücü belgesi alabilmesi için öncelikle 18 yaşını doldurmuş olması şartı aranır. Bu ilk ve dış koşul sağlanmazsa diğer aşamalara geçilmesine izin verilmez ve süreç doğrudan sonlandırılır. Yaş şartı başarıyla sağlandığında ise adayın karşısına \"yazılı sınavı geçme\" şeklinde yeni bir iç koşul çıkar. Yazılı sınavı geçenler için de \"direksiyon sınavında başarılı olma\" gibi daha içeride yer alan başka bir koşul devreye girer. Bu ardışık ve tamamen birbirine bağımlı doğrulama aşamalarında olduğu gibi programlama dillerinde de bir kod bloğunun çalıştırılması, dıştaki ana koşulun Doğru (True) değerini üretmesine ve ardından içeriye doğru girintilenmiş diğer alt koşulların sırayla sağlanmasına bağlıdır. Bu hiyerarşik yapı, yazılımların gerçek yaşamdaki gibi güvenli ve aşamalı kararlar almasını mümkün kılar.\n\n2. Örnek: İç İçe Karar Yapıları ve İki Aşamalı Yetkilendirme\n\nKod-Asistan projesinin siber güvenlik katmanında, sisteme yetkisiz erişimleri engellemek için iki aşamalı bir kimlik doğrulama protokolü tasarlanmıştır. Kullanıcının sistemi açabilmesi için önce metinsel sistem parolasını, ardından telefonuna gelen sayısal doğrulama kodunu girmesi gereklidir. Şifrelerin doğru veya yanlış girilmesi durumlarında sistemin kendi içinde farklı yollara saparak (karar vererek) üreteceği tepkiler test edilecektir.\n\nsistem_parolasi = \"Fatih1453\"\ndogrulama_kodu = 5532\ngirilen_parola = input(\"Sistem parolasını giriniz: \")\nif girilen_parola == sistem_parolasi:\n    print(\"1. Aşama Başarılı: Parola Doğrulandı.\")\n    # İç içe geçmiş ikinci kontrol katmanı (Girinti seviyesi 8 boşluğa çıktı.)\n    girilen_kod = int(input(\"Telefonunuza gelen 4 haneli doğrulama kodunu giriniz: \"))\n    if girilen_kod == dogrulama_kodu:\n        print(\"2. Aşama Başarılı: Kimlik Doğrulandı. Giriş Yapıldı.\")\n    else:\n        print(\"Doğrulama kodu hatalı. 2. Aşama Kod Hatası! Erişim Engellendi.\")\nelse:\n    print(\"Erişim Engellendi: Hatalı Sistem Parolası!\")\n\nKod Gözden Geçirme (Code Review) Çıkarımı: Python dilinde karar yapılarının hangi kapsama ait olduğunu belirleyen yapı girinti seviyesidir. İç içe geçmiş bir güvenlik katmanı oluşturulurken kodun daha içeriden (örneğin 8 boşlukla) başlatılması, yorumlayıcıya \"Bu şart sadece ilk şart sağlanırsa geçerlidir.\" mesajını verir. Sayısal kod alınırken int(input(...)) kullanılarak tür dönüşümü yapılması, tür uyumsuzluğundan kaynaklanabilecek TypeError çökme risklerini başarıyla engeller."}, {"id": "p2", "title": "Uygulama Özeti: Çoklu Karar Yapıları ve Akıllı Menü Yönetimi", "body": "1. Uygulama'da if-elif-else yapısını kullanarak kullanıcı etkileşimli bir akıllı menü sistemi tasarlanmıştır. Kod-Asistan projesinin v0.3 sürümünde kullanıcının terminal üzerinden yapacağı sayısal seçime (1, 2 veya 3) göre sistemin ilgili modülleri (Siber Güvenlik Testi, Vücut Kitle İndeksi Hesaplayıcı veya Çıkış) tetiklemesi, menü dışı hatalı seçimlerde ise programın çökmeden güvenli bir uyarı vererek işlemi sonlandırmadan devam etmesi hedeflenmiştir.\n\nUygulamanın kod taslağında bilerek bırakılan bir mantık hatası (Kullanici_turu değişkeninin büyük K ile tanımlanıp küçük k ile kullanılması) öğrencinin NameError: name 'kullanici_turu' is not defined hatasını Python yorumlayıcısının çalışma mantığına göre gözlemlemesini ve Python'ın büyük-küçük harf duyarlılığına (case-sensitivity) sahip olduğunu hatırlayarak kodu düzeltmesini sağlamak üzere kurgulanmıştır. Uygulamanın ikinci bölümünde vki < 18.5, 18.5 <= vki < 25 ve else şeklinde üç kriterli bir if-elif-else merdiveni kurularak hesaplanan vücut kitle indeksi değerinin hangi standart aralığa düştüğü ekrana yazdırılmıştır. Uygulamanın son adımında düzeltilmiş ve kararlı çalışan kod dosyası, \"Akıllı menü yapısı if-elif-else bloklarıyla eklendi ve harf duyarlılığı hatası giderildi.\" sürüm notuyla dijital depoya yüklenmiştir."}, {"id": "p3", "title": "Uygulama Özeti: Akıllı Güvenlik Kapısı ve Veri Standardizasyonu", "body": "2. Uygulama'da kurumsal bir AR-GE merkezinin girişinde çalışacak Akıllı Güvenlik Kapısı kontrol modülü tasarlanmıştır. Sistem, personelden dinamik olarak Rol ve Güvenlik Derecesi şeklinde talep eder. Kullanıcıların yapabileceği olası yazım hatalarına (örneğin YÖNETİCİ, yonetici, Yonetici vb.) karşı güvenli geçiş için sistemin şu kuralları işletmesi istenmiştir: Kullanıcının gireceği rol bilgisi standart küçük harfe dönüştürülmelidir; rolü \"yönetici\" ise güvenlik derecesine bakılmaksızın erişim izni verilmesi; rolü \"personel\" ise sistemin iç içe bir kontrolle güvenlik derecesini sorgulaması (3 veya üzeri ise erişim izni, 3'ten küçükse uyarı) ve bu iki rol dışında geçersiz bi
