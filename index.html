 sözün gücü temasını işleyen bir liste (sozler_listesi) bulunmaktadır. Sistem, kullanıcıdan 0, 1 veya 2 numaralarından birini girmesini isteyecek ve listedeki o indeksli beyiti ekrana yazdıracaktır. Kullanıcı klavyeden 5 gibi listede karşılığı olmayan bir numara girdiğinde program doğrudan IndexError: list index out of range hatası vererek çalışmayı durdurur. Beklenen çözüm, işlemleri ValueError ve IndexError hatalarına karşı try-except yapısıyla yönetip sistemi kararlı bir şekilde ayakta tutmaktır.\n\nsozler_listesi = [\"Hikmet sözü kıldırır kâfirleri müselmân, / İhlâs ile dinlese erir dağ ile taşlar. (Hoca Ahmed Yesevî)\", \"Söz ola kese savaşı, söz ola bitire başı; / Söz ola ağılı aşı, bal ile yağ ede bir söz. (Yunus Emre)\", \"Sözü söz de söyle, gönlü bulandırmasın. / Sözü düz de söyle, kulağa inci diye takılsın. (Mevlânâ)\"]\n\nwhile True: döngüsü başlatılıp riskli veri alma adımları bir try: bloku içerisine alınır (döngü çıkışı için harf kullanılacaktır). Kullanıcının okumak istediği beyitin numarasını sayıya çevirirken sayı yerine harf girmesi ihtimaline karşı except ValueError as e: yapısı kurgulanarak uygun uyarı yazdırılır. Kullanıcının listede olmayan bir numara (örneğin 5 veya 10) girmesi ihtimaline karşı except IndexError as e: yapısı kurgulanarak ekrana \"Hata: Girdiğiniz numarada bir beyit bulunmamaktadır!\" uyarısıyla birlikte hatanın teknik detayı (e) yazdırılır. Böylece kodun farklı değerlerle çökmeden çalıştığı gözlemlenmiş ve tüm testlerden geçen dosya \"Hikmet modülüne ValueError ve IndexError istisna yapıları eklendi.\" iletisiyle Commit edilip Sync Changes butonuyla depoya push edilmiştir."}, {"id": "p6", "title": "Uygulama Özeti: Sarmal Projede Dayanıklı Kod Geliştirme", "body": "Yazılım dünyasında belirli bir modüldeki (örneğin sadece okuma modülündeki) hataları ayıklamak, o anki krizi çözmek için yeterlidir. Gelişmiş bir yazılım projesi, onlarca farklı modülün birbiriyle haberleştiği canlı bir organizma gibidir. Bir yazılım geliştirici sadece yeni yazdığı kodları korumakla kalmaz, geçmişte yazdığı tüm kod tabanını da belirli aralıklarla gözden geçirerek gözden kaçan güvenlik veya çökme açıklarını tespit eder.\n\nBu doğrultuda Sarmal Projede Dayanıklı Kod Geliştirme uygulamasında, önceki öğrenme birimlerinde adım adım geliştirilen Kod-Asistan projesinin temel modülleri (hesaplamalar, menüler vb.) yeniden ele alınır. Bu modüllerin birçoğu; kullanıcının veri girişi sırasında yapabileceği harf tuşlama, boş bırakma, mantıksal sınır ihlalleri gibi hatalara karşı henüz korunmasızdır. Beklenen; projede input() fonksiyonunun kullanıldığı ve ardından matematiksel dönüşüm (örneğin int() veya float()) yapılan en az iki riskli noktanın belirlenmesi, hatalı veri girişlerinde programın aniden çökmesini önlemek için ilgili kod bloklarının try-except yapısı içerisine alınması, bir hata oluştuğunda programın kapanmasının engellenip kullanıcıya sorunun kaynağını açıklayan anlaşılır bir hata mesajı yazdırılması ve programın hata sonrasında da normal çalışmasını (menüye veya döngüye devam etmesini) sağlayacak algoritmik düzenlemenin yapılmasıdır. Yapılan bu dayanıklılık güncellemeleri test edilerek dijital portfolyoya (dijital depoya) \"Kod-Asistan dayanıklılık yaması uygulandı ve çökme riskleri giderildi.\" sürüm notuyla birlikte push edilir."}, {"id": "p7", "title": "6.1.2. Traceback Mesajları ve Hata Ayıklama (Debugging)", "body": "Bir bilgisayar programı çalışırken beklenmeyen bir krizle karşılaşıp çöktüğünde hiçbir iz bırakmadan aniden ortadan kaybolmaz. Python yorumlayıcısı, programın neden ve nerede durduğunu yazılımcıya anlatmak için terminal ekranında genellikle kırmızı renkli bir hata raporu gösterir. Bu rapora Traceback (Geriye Dönük İz Sürme) adı verilir.\n\nTraceback mesajları aslında bilgisayarın sizden yardım isteme şeklidir. Usta bir yazılımcı, bu kırmızı metinleri bir panik sebebi olarak görmek yerine programı iyileştirmek için bırakılmış ipuçları olarak okur. Bir hata mesajı her zaman aşağıdan yukarıya doğru okunur. En alt satır hatanın kimliğini, üst satırlar ise hatanın adresini verir.\n\nÖrnek Traceback\n\nTraceback (most recent call last): File \"hesaplayici.py\", line 4, in <module>\n\nHatanın hesaplayici.py adlı dosyanın tam 4. satırında gerçekleştiğini gösterir.\n\nHatalı Kod Satırı\n\nyas = int(input(\"Yaşınızı giriniz: \"))\n\nSistem çökerken Python yorumlayıcısının okumaya çalıştığı o sorunlu kod satırını gösterir.\n\nÖrnek Traceback\n\nValueError: invalid literal for int() with base 10: 'on beş'\n\nHatanın kök nedenidir. Burada ValueError (Değer Hatası) yaşandığı ve kullanıcının rakam yerine harflerle 'on beş' yazdığı için dönüşümün yapılamadığı söylenmektedir."}, {"id": "p8", "title": "Traceback'i Bir Dedektif Gibi Okumak ve Hata Ayıklama Kültürü", "body": "Bir matematik sınavında karmaşık bir denklemin sonucu yanlış bulunduğunda, kâğıttaki tüm işlemlerin silinmesi yerine çözüm adımları sondan başa doğru takip edilerek hatanın nerede yapıldığı bulunmaya çalışılır. Yazılım dünyasında program aniden sonlandığında terminal ekranına yansıyan Traceback mesajları da bu mantıkla çalışır. Bu bildirimler bir başarısızlık tablosu değil aksine bir dedektifin karmaşık bir olay yerindeki ipuçlarını sondan başa doğru izleyerek sorunun asıl kaynağına ulaşmasını sağlayan değerli bir yol haritasıdır.\n\nBir yazılım geliştirici, ekranda beliren bu hata raporlarını panik unsuru olarak görmek yerine titiz bir dedektif gibi o izleri sürerek sistemin nerede ve neden tıkandığını satır satır tespit eder. Beklenmeyen bir veri girişi nedeniyle uygulamanın çalışmayı durdurmasını engellemek için saptanan zayıf satırlar güvenli koruma blokları (try-except) içine alınır. Böylece hem programın kararlılığı yeniden tesis edilir hem de dijital hizmetlerin kesintisiz çalışması güvence altına alınır.\n\nBu becerinin pekiştirilmesi amacıyla İz Sürme ve Hata Ayıklama uygulamasında, sabit bir bolunen = 50 değerinin kullanıcıdan alınan bolen değerine bölündüğü basit bir kod ve bu kodun ürettiği aşağıdaki Traceback hata mesajı bir Hata Avcısı gözüyle incelenir.\n\nHatalı Kod\n\nbolunen = 50\nbolen = int(input(\"Bölen sayıyı giriniz: \"))\nsonuc = bolunen / bolen\nprint(\"Sonuç:\", sonuc)\n\nTerminal Çıktısı (Traceback)\n\nTraceback (most recent call last):\n  File \"matematik.py\", line 3, in <module>\n    sonuc = bolunen / bolen\nZeroDivisionError: division by zero\n\nYukarıdaki Traceback mesajı incelendiğinde programın matematik.py dosyasının 3. satırında, sonuc = bolunen / bolen işlemi sırasında ve ZeroDivisionError (Sıfıra Bölme Hatası) nedeniyle çöktüğü saptanır. Bu hatanın kullanıcının bölen değeri olarak 0 (sıfır) girmesinden kaynaklandığı anlaşılır. Bu bölme işlemi risk taşıdığı için bir try bloku içine alınır ve tespit edilen ZeroDivisionError türü bir except ile yakalanarak programın çökmesi engellenip ekrana \"Bir sayı sıfıra bölünemez, lütfen başka bir rakam giriniz!\" şeklinde kararlı bir uyarı mesajı yazdırılır."}], "sorular": {"q1": {"type": "open", "closed": false, "text": "Ariane 5 kazasını göz önünde bulundurarak bir yazılım projesinde programın doğru çalışması ile programın dayanıklı olması arasındaki yapısal farkı değerlendiriniz. Geliştirdiğiniz Kod-Asistan projesinde try-except yapıları kullanmamanın, uygulamanın kararlılığı açısından ne tür riskler oluşturabileceğini gerekçeleriyle açıklayınız."}, "q2": {"type": "open", "closed": false, "text": "1. Uygulama'daki (Kod-Asistan Dayanıklılık Testi ve Hata Yönetimi) senaryoya göre; Vücut Kitle İndeksi (VKİ) hesaplayıcı modülü, kullanıcı boy veya kilo bilgisi yerine harf yazdığında (örneğin 75 yerine yetmiş beş) hangi hatayı, kullanıcı boy bilgisini 0 (sıfır) girdiğinde ise hangi hatayı fırlatır? İkisi için de ayrı except bloklarının nasıl kurgulanması gerektiğini açıklayınız."}, "q3": {"type": "open", "closed": false, "text": "Aşağıda, bir yazılımcının kurguladığı basit bir bölme işlemi kodu ve terminalde karşılaştığı Traceback hata mesajı verilmiştir.\nbolunen = 50\nbolen = int(input(\"Bölen sayıyı giriniz: \"))\nsonuc = bolunen / bolen\nprint(\"Sonuç:\", sonuc)\nTraceback (most recent call last):\n  File \"matematik.py\", line 3, in <module>\n    sonuc = bolunen / bolen\nZeroDivisionError: division by zero\na) Programın tam olarak hangi satırda ve hangi hata türü (Error Type) nedeniyle çöktüğünü saptayarak yazınız.\nb) Bu hatanın kullanıcıdan kaynaklanan hangi hatalı veri girişi sebebiyle oluştuğunu açıklayınız."}, "q4": {"type": "tf", "closed": true, "text": "Bir Traceback (hata raporu) mesajı okunurken en alt satır hatanın türünü (kimliğini) ve açıklamasını, üst satırlar ise hatanın hangi dosyada ve hangi satırda oluştuğunun adresini verir.", "correct": "Doğru"}, "q5": {"type": "mc", "closed": true, "text": "2. Uygulama'daki (Liste İndeksi ve Girdi Hatalarının Yönetimi) senaryoya göre sozler_listesi adlı 3 elemanlı bir liste tanımlanmıştır. Kullanıcının liste şeklinde 5 gibi karşılığı olmayan bir numara girmeye çalışması durumunda sınır aşımı nedeniyle oluşan çalışma zamanı hatası aşağıdakilerden hangisidir?", "opts": ["ValueError", "NameError", "TypeError", "ZeroDivisionError", "IndexError"], "correct": "IndexError"}, "q6": {"type": "open", "closed": false, "text": "3. Uygulama'daki (Sarmal Projede Dayanıklı Kod Geliştirme) senaryoya göre önceki öğrenme birimlerinde geliştirdiğiniz Kod-Asistan projenizde, kullanıcıdan input() ile veri alınan ve ardından int() veya float() ile tür dönüşümü yapılan en az iki riskli noktayı belirleyip bu noktaları try-except yapısı içerisine almanın projenin dayanıklılığına katkısını açıklayınız."}}}, {"no": 34, "baslik": "34. Hafta — Bilişim Etiği, KVKK ve Veri Güvenliği", "baslangicTarihi": "2027-05-24", "konular": [{"id": "p1", "title": "6.2. Bilişim Etiği ve Veri Güvenliğinin Önemi", "body": "Geliştirilen yazılımların kod hatalarından arındırılmış ve istisnalara karşı dayanıklı olması, o yazılımın güvenli ve kaliteli bir ürün olması için tek başına yeterli değildir. Teknoloji çağında yazılımlar sadece makinelerle değil insan hayatıyla, kişisel verilerle ve toplumsal yaşamla doğrudan etkileşim içindedir. Bu nedenle bir yazılım geliştiricisinin kodlama becerisinin yanı sıra bilişim etiği ve veri güvenliği ilkelerine uygun hareket etmesi mesleki bir sorumluluktur."}, {"id": "p2", "title": "6.2.1. Veri Güvenliği ve Kişisel Verilerin Korunması Kanunu (KVKK)", "body": "Bir mobil uygulama indirildiğinde veya bir web sitesine üye olunduğunda sistem tarafından genellikle ad, soyadı, e-posta adresi, telefon numarası, hatta bazen anlık konum veya sağlık bilgileri gibi kimliğin belirlenmesini sağlayan veriler talep edilir. Bireyi diğerlerinden ayıran tüm bu özgün detaylara kişisel veri adı verilir. Bir uygulamanın ne kadar güvenilir olduğu, bu verileri nasıl işlediğiyle doğrudan ölçülür. Etik bir yazılım, bu hassas bilgileri toplamadan önce neyi, neden ve hangi amaçla kullanacağını açıkça belirtmeli ve kullanıcının tamamen kendi özgür iradesiyle verdiği onay olan açık rızasını almalıdır.\n\nKişisel verilerin bu şekilde şeffafça korunması; kimlik hırsızlığı veya dolandırıcılık gibi siber riskleri en aza indirirken kullanıcıların dijital dünyaya duyduğu güveni artırır. Bu hayati güvenliği sağlamak amacıyla kişisel verilerin korunmasına yönelik tüm yasal süreçler Kişisel Verilerin Korunması Kanunu (KVKK) kapsamında güvence altına alınmıştır. Küresel yazılım ekosisteminde de benzer hassasiyetler geçerlidir. Örneğin Avrupa Birliği ülkelerinde geliştirilen projeler Genel Veri Koruma Tüzüğü (GDPR) adı verilen benzer sıkı kurallarla denetlenir."}, {"id": "p3", "title": "Verilerin Güvenli Saklanması İçin Temel İlkeler", "body": "Toplanan verilerin güvenli biçimde saklanabilmesi ve kullanılabilmesi için şu temel ilkelere dikkat edilmelidir:\n\nVeri Minimizasyonu: Bir yazılım yalnızca amacını gerçekleştirmek için gerekli olan verileri toplamalıdır. Örneğin basit bir hesap makinesi veya el feneri uygulamasının kullanıcının konum bilgisine ya da fotoğraf galerisine erişim istemesi uygun değildir.\n\nGüçlü Parola Kullanımı: Kullanıcı hesaplarının korunması için büyük-küçük harf, rakam ve özel karakterlerden oluşan güçlü parolalar tercih edilmelidir. Ayrıca kullanıcı parolaları doğrudan okunabilir şekilde saklanmamalı, uygun güvenlik yöntemleriyle korunmalıdır.\n\nVeri Paylaşımı ve Gizlilik: Kullanıcılardan elde edilen kişisel veriler, açık rıza olmadan üçüncü kişilerle paylaşılmamalıdır. Verilerin izinsiz paylaşılması hem etik ilkelere hem de yasal düzenlemelere aykırıdır."}, {"id": "p4", "title": "6.2.2. Yapay Zekâ Etiği", "body": "Yapay zekâ araçları (örneğin büyük dil modelleri), saniyeler içinde binlerce satır kod üretebilen veya hataları bulabilen eş-geliştiriciler olabilir. Bir yazılımın direksiyonunu tamamen bu araçlara teslim etmek büyük teknik ve ahlaki riskler taşır. Bir yazılımın arka planında hangi verilerin toplandığını veya kodların kimler tarafından yazıldığını kullanıcılar çoğu zaman göremez. Bu görünmezlik, yazılımcının omuzlarına büyük bir doğruluk ve güvenilirlik sorumluluğu yükler. Kullanıcılara verilen sözlere sadık kalmak, şeffaf davranmak ve yapay zekâ asistanlarından etik sınırlar çerçevesinde faydalanmak profesyonel bir yazılımcının en temel özelliğidir.\n\nYapay zekâ araçları yazılım geliştirme süreçlerinde önemli yardımcılar olabilir ancak bu araçlardan elde edilen çıktılar dikkatli şekilde değerlendirilmelidir. Yapay zekâ araçlarından yararlanırken dikkate alınabilecek temel etik ilkeler şunlardır:\n\nTelif Hakkı ve Kaynak Kullanımı: Yapay zekâ tarafından üretilen kod veya içerikler başka kaynaklardan etkilenmiş olabilir. Bu nedenle kullanılan içeriklerin telif haklarına uygun olup olmadığı kontrol edilmelidir.\n\nÖn Yargı (Bias): Yapay zekâ sistemleri, eğitildikleri verilerde bulunan ön yargıları yansıtabilir. Üretilen sonuçların ayrımcılık içermediğinden emin olunmalıdır.\n\nDoğrulama ve İnsan Denetimi: Yapay zekâ tarafından üretilen bilgiler ve kodlar doğrudan kullanılmamalıdır. Bu çıktılar doğruluk, güvenlik ve etik açıdan mutlaka insan tarafından gözden geçirilmelidir.\n\nŞeffaflık ve Dürüstlük: Bir projede yapay zekâ araçlarından yararlanıldıysa bu durum teknik dokümantasyonda veya proje açıklamalarında açıkça belirtilmelidir. Bu yaklaşım bilimsel dürüstlük ve mesleki etik açısından önemlidir."}, {"id": "p5", "title": "Düşünelim-Tartışalım: Yapay Zekâ ile Üretilen Ödevde Etik Sorumluluk", "body": "Bir öğrenci, bilişim teknolojileri dersi için geliştirilmesi istenen proje ödevinin tamamını bir yapay zekâ aracına kodlatmış ve üretilen çıktıları hiçbir değişikliğe uğratmadan veya kontrol etmeden kendi eseri gibi öğretmenine teslim etmiştir. Ayrıca projenin sürüm notlarında veya teknik dokümantasyonunda yapay zekâ desteği aldığına dair hiçbir şeffaf beyanda bulunmamıştır.\n\nBu davranış, bilişim etiğinin şeffaflık ve dürüstlük ilkeleri açısından değerlendirildiğinde ciddi bir ihlal taşır. Üretilen kodlarda yapay zekâ asistanına atıf yapılmaması, emeğe saygı ilkesi açısından hem yapay zekâ aracının kaynağının gizlenmesi hem de öğrencinin kendi katkısı olmayan bir emeği kendisininmiş gibi sunması anlamına gelir; bu durum akademik dürüstlük ihlallerine yol açabilecek bir tutumdur. Yapay zekâ asistanlarından faydalanma sürecinde bir yazılımcının (öğrencinin) en temel mesleki sorumluluğu, alınan çıktıların doğrudan kullanılmaması ve mutlaka insan denetimi süzgecinden geçirilmesidir; çünkü yapay zekâ tarafından üretilen kod her zaman hatasız, güvenli veya projenin özel ihtiyaçlarına tam uygun olmayabilir. İnsan denetiminden geçirilmeyen ve şeffafça beyan edilmeyen bir yapay zekâ çıktısı, hem teknik hem de etik açıdan projenin güvenilirliğini zedeler."}, {"id": "p6", "title": "6.2.3. Kullanıcı Girdilerinin Doğrulanması ve Arındırılması (Sanitization)", "body": "Kullanıcılardan alınan metinlerin içindeki < ve > gibi özel karakterler, web sayfalarında veya veri tabanlarında her zaman sıradan birer metin olarak okunmaz; bazen sistemi yönlendiren gizli birer komut (script) olarak algılanabilir. Kötü niyetli kişilerin sisteme sızmasını ve izinsiz komutlar çalıştırmasını engellemek amacıyla alınan verilerin diske kaydedilmeden önce bu tür tehlikeli karakterlerden (örneğin .replace() gibi metotlarla) temizlenmesi işlemine girdi arındırma (sanitization) adı verilir. Profesyonel ve güvenilir bir yazılım, kullanıcıdan gelen hiçbir veriye doğrudan güvenmez; veriyi işleme almadan önce mutlaka bu güvenlik ve arındırma süzgecinden geçirir.\n\nBilişim sistemlerinde kullanıcı verilerini onay olarak kaydetmek, sürecin sadece ilk adımını oluşturur. Elde edilen bu verilere doğrudan güvenmek ve onları olduğu gibi sistemde işlemek, çeşitli dijital riskleri beraberinde getirir. Güvenli bir yazılım mimarisi kurgulanırken, toplanan verilerin sadece yasal standartlara uygun olarak değil siber tehditlere karşı da yapısal olarak güvence altına alınması gereklidir.\n\nSisteme dâhil edilen her veriye doğrudan güvenmek, güvenlik sınırlarından geçen yolcuların bagajlarını X-ray cihazından geçirmeden uçağa kabul etmeye benzetilebilir."}, {"id": "p7", "title": "Uygulama Özeti: Kullanıcı Verilerini Koruma ve KVKK Farkındalığı", "body": "Kullanıcı Verilerini Koruma ve KVKK Farkındalığı uygulamasında Kod-Asistan projesinin profil oluşturma modülü (v3.0) ele alınır; bu modül kullanıcıdan ad, yaş, e-posta adresi gibi kişisel bilgiler almaktadır. Kişisel verilerin korunmasına ilişkin ilkeler gereği bu bilgiler kullanıcının açık izni olmadan kalıcı olarak saklanmamalıdır. Bu doğrultuda kullanıcıya bir bilgilendirme metni sunulur, verilerin kaydedilmesi için izin istenir ve kullanıcının tercihine göre kayıt işlemi yönetilir.\n\nJSON dosyalarıyla çalışabilmek için gerekli kütüphane (json) içe aktarılır. Kullanıcıdan ad, yaş ve e-posta bilgileri alınırken girilen verilerin başında veya sonunda bulunabilecek gereksiz boşlukları temizlemek için .strip() metodu kullanılır. Ad ve e-posta bilgilerinde < ve > karakterlerini .replace() ile temizlemek de girdi arındırmanın bir parçasıdır. Kullanıcının cevabı .lower() metodu ile küçük harfe çevrilir; cevap \"evet\" ise veriler json.dump() ile profil.json dosyasına kaydedilir, cevap \"hayır\" ise program veriyi kaydetmeden güvenli bir else bloğuna yönlendirerek siler.\n\nimport json\nprint(\"=== KOD-ASİSTAN PROFİL OLUŞTURMA ===\\n\")\nad_soyad = input(\"Adınızı ve soyadınızı giriniz: \").strip().replace(\"<\",\"\").replace(\">\",\"\")\nyas = input(\"Yaşınızı giriniz: \").strip()\neposta = input(\"E-posta adresinizi giriniz: \").strip().replace(\"<\",\"\").replace(\">\",\"\")\nprofil_verisi = {\n    \"ad_soyad\": ad_soyad,\n    \"yas\": yas,\n    \"eposta\": eposta\n}\nprint(\"\\n[VERİ KULLANIM BİLGİLENDİRMESİ]\")\nprint(\"Girdiğiniz bilgiler yalnızca profil oluşturma amacıyla kullanılacaktır.\")\nprint(\"Bilgileriniz üçüncü kişilerle paylaşılmayacaktır.\")\nizin = input(\n    \"\\nBilgilerinizin kaydedilmesini onaylıyor musunuz? (Evet/Hayır): \"\n).strip().lower()\nif izin == \"evet\":\n    with open(\"profil.json\", \"w\", encoding=\"utf-8\") as dosya:\n        json.dump(\n            profil_verisi,\n            dosya,\n            ensure_ascii=False,\n            indent=4\n        )\n    print(\"\\nBilgileriniz profil.json dosyasına kaydedildi.\")\nelse:\n    profil_verisi.clear()\n    print(\"\\nBilgileriniz kaydedilmemiştir.\")\n\nHazırlanan bu kod dosyası önce \"evet\" seçeneğiyle test edilerek profil.json dosyasının oluştuğu, ardından \"hayır\" seçeneğiyle tekrar çalıştırılarak bilgilerin kaydedilmediği doğrulanır. Kaynak Denetimi paneline girilerek dosya hazırlama alanına alınır ve \"Kullanıcı verilerinin gizliliği için KVKK rıza denetimi ve girdi doğrulama (sanitization) katmanı projeye eklendi.\" iletisiyle Commit edilip Sync Changes ile GitHub dijital deposuna push edilir."}, {"id": "p8", "title": "Uygulama Özeti: Şifre Maskeleme ve Güvenli Veri Kaydı", "body": "Şifre Maskeleme ve Güvenli Veri Kaydı uygulamasında Kod-Asistan projesine yeni bir kullanıcı kayıt modülü eklenir. Sistem kullanıcıdan bir hesap şifresi alacaktır. Siber güvenlik etiği ve veri gizliliği kuralları gereği kullanıcıların belirlediği şifreler sistemin veri tabanına veya JSON dosyalarına asla düz metin olarak kaydedilmemelidir. Gerçek bilgi sistemlerinde parolalar, hash algoritmalarıyla şifrelenerek saklanır. Bu uygulamada ise veri gizleme mantığının daha kolay anlaşılabilmesi amacıyla örnek olarak maskeleme yöntemi kullanılacaktır: kullanıcının girdiği şifrenin uzunluğunu bularak şifreyi aynı uzunlukta yıldız (*) karakterleriyle maskelemek ve sadece bu maskelenmiş güvenli veriyi bir JSON dosyasına kaydetmek.\n\nBu doğrultuda import json komutu eklenir, kullanıcıdan bir şifre input() fonksiyonu ile talep edilir, girilen şifrenin karakter uzunluğu len() fonksiyonu ile bulunarak aynı uzunlukta yıldız (*) karakteri üreten matematiksel işlem (\"*\" * len(sifre)) kurgulanıp sonuç maskeli_sifre adlı yeni bir değişkene atanır. Kullanıcının bilgilerini düzenli tutmak için kullanici_hesabi adında bir sözlük yapısı oluşturulur ve elde edilen maskelenmiş şifre bu sözlüğe değer olarak eklenir. with open() bağlam yöneticisi kullanılarak oluşturulan sözlük json.dump() metoduyla guvenli_kayit.json dosyasına kalıcı olarak kaydedilir. Kod çalıştırılıp terminalden şifre girildikten sonra kod editörü sol panelinden oluşan JSON dosyası açılarak şifrenin açıkça görünmediği bizzat test edilir. Son olarak Kaynak Denetimi paneline girilerek dosya hazırlama alanına alınır ve \"Kullanıcı şifreleri, maskeleme algoritmasıyla güvenli hâle getirilerek JSON formatında kaydedildi.\" iletisiyle Commit edilip Sync Changes butonuyla proje GitHub deposuna push edilir.\n\nSistemlere giriş yaparken ekranda beliren yıldız (*) karakterleri yalnızca yanınızdaki kişinin ekranı okumasını engellemek (maskelemek) içindir. Peki ya siber korsanlar sistemin arka planına sızarsa? Profesyonel yazılımlar ve dev platformlar, parolalarınızı veri tabanına asla doğrudan okunabilir metinler şeklinde kaydetmez. Bunun yerine parolalar, Hash adı verilen tek yönlü ve çok güçlü matematiksel algoritmalarla şifrelenerek saklanır. Girdiğiniz parola; arka planda \"8a2b9c...\" gibi anlamsız, karmaşık ve geri döndürülemez bir metne dönüştürülerek kilitlenir. Böylece veri tabanı ele geçirilse bile bilgisayar korsanları gerçek şifrenizin ne olduğunu asla çözemezler!"}], "sorular": {"q1": {"type": "open", "closed": false, "text": "Bir öğrenci, bilişim teknolojileri dersi için geliştirmesi istenen proje ödevinin tamamını bir yapay zekâ aracına kodlatmış ve üretilen çıktıları hiçbir değişikliğe uğratmadan veya kontrol etmeden kendi eseri gibi öğretmene teslim etmiştir; ayrıca projenin sürüm notlarında yapay zekâ desteği aldığına dair hiçbir şeffaf beyanda bulunmamıştır. Bu davranışın bilişim etiği, şeffaflık ve dürüstlük ilkeleri bağlamında nasıl değerlendirilmesi gerektiğini açıklayınız."}, "q2": {"type": "mc", "closed": true, "text": "Yapay zekâ destekli yazılım geliştirmede karşılaşılabilecek bilişim etiği riskleri arasında aşağıdakilerden hangisi yer almaz?", "opts": ["Başkalarına ait lisanslı veya telifli kodların izinsiz kullanılması", "Modeldeki veri ön yargılarının yazılım algoritmalarına doğrudan yansıtılması", "Üretilen kodların insan denetimi atlanarak aktif sisteme aktarılması", "Yapay zekâ tarafından üretilen kodların her zaman hatasız çalışması", "Proje alınan yapay zekâ desteklerinin kullanıcılardan kasten gizlenmesi"], "correct": "Yapay zekâ tarafından üretilen kodların her zaman hatasız çalışması"}, "q3": {"type": "open", "closed": false, "text": "5. Uygulama'daki (Kullanıcı Verilerini Koruma ve KVKK Farkındalığı) senaryoya göre ad_soyad ve eposta bilgilerinde .strip().replace(\"<\",\"\").replace(\">\",\"\") işleminin uygulanmasının, girdi arındırma (sanitization) açısından ne gibi bir güvenlik amacına hizmet ettiğini açıklayınız. Kullanıcı verilerinin sadece izin='evet' seçeneğinde json.dump() ile kaydedilmesinin KVKK'daki açık rıza ilkesiyle ilişkisini kurunuz."}, "q4": {"type": "tf", "closed": true, "text": "Sistemlere giriş yaparken ekranda beliren yıldız (*) karakterleri, parolayı hash algoritmasıyla şifreleyerek veri tabanına kaydeder; bu yüzden siber korsanlar veri tabanını ele geçirseler bile gerçek parolayı asla çözemez.", "correct": "Yanlış"}, "q5": {"type": "fill", "closed": true, "text": "Kullanıcılardan alınan metinlerin içindeki < ve > gibi özel karakterlerin, sisteme sızmayı önlemek amacıyla diske kaydedilmeden önce temizlenmesi işlemine girdi arındırma yani ______ adı verilir.", "accepted": ["sanitization", "girdi arındırma", "girdi arındırma (sanitization)"]}, "q6": {"type": "open", "closed": false, "text": "6. Uygulama'daki (Şifre Maskeleme ve Güvenli Veri Kaydı) senaryoya göre kullanıcının girdiği şifrenin uzunluğunu bularak aynı uzunlukta yıldız (*) karakteri üreten maskeli_sifre değişkeninin, gerçek bir bilgi sisteminde kullanılan hash algoritmasından farkı nedir? Gerçek sistemlerde parolaların neden asla düz metin (plain text) olarak saklanmadığını açıklayınız."}}}, {"no": 35, "baslik": "35. Hafta — Dijital Portfolyo, README.md ve Final Sürüm", "baslangicTarihi": "2027-05-31", "konular": [{"id": "p1", "title": "6.3. Dijital Portfolyo ve Proje Sunumunun Önemi", "body": "Algoritmik tasarım, hata ayıklama, veri yapılandırması ve etik kodlama süreçlerinin ardından geliştirilen bir yazılımın değerini belirleyen son aşama, o yazılımın ne kadar etkili ve profesyonel sunulduğudur. Bilişim dünyasında iyi çalışan bir yazılım, doğru belgelendirilmediğinde ve etkili bir şekilde sunulmadığında yeterince görünür olmayabilir. Bir yazılım geliştiricinin teknik yetkinliği kadar ürettiği çözümü anlatabilme, paylaşabilme ve savunabilme becerisi de önemlidir."}, {"id": "p2", "title": "6.3.1. Dijital Portfolyo ve Teknik Dokümantasyon (README.md)", "body": "Geliştirilen projelerin tüm kaynak kodlarını barındıran bulut depoları (örneğin GitHub) yalnızca birer yedekleme alanı değil aynı zamanda tüm dünyaya açılan dijital portfolyolardır. Bir projeyi inceleyen başka bir geliştirici, öğretmen veya gelecekteki bir işveren, çoğu zaman karmaşık kaynak kodlarını okumadan önce projenin vitrini niteliğindeki README.md dosyasıyla karşılaşır. Bu nedenle README dosyası; projenin yalnızca adını değil amacını ve mimarisini de açık, düzenli ve şeffaf bilgilerle sunmalıdır. Bir README dokümantasyonu şu temel bölümleri içermelidir:\n\nProje Amacı ve Mimarisi: Yazılımın temelde hangi sorunu çözdüğü ve modüllerin birbirleriyle nasıl ilişkilendirildiği net bir dille açıklanmalıdır.\n\nKurulum Adımları: Programın başka bir bilgisayarda sorunsuz çalıştırılabilmesi için gerekli yazılım, kütüphane ve sistem gereksinimleri belirtilmelidir.\n\nEkran Görüntüleri ve Şemalar: Programın çalışmasına ait arayüz ekran görüntüleri, algoritmayı anlatan akış şemaları veya örnek terminal çıktıları görsel bir kanıt olarak mutlaka eklenmelidir.\n\nEtik Beyan: Kullanıcı verilerinin (KVKK kapsamında) nasıl korunduğu ve kodlama aşamasında yapay zekâ araçlarından destek alındıysa bunun nasıl (İnsan Denetimi süzgeciyle) kullanıldığı bilimsel bir dürüstlükle ve şeffafça beyan edilmelidir."}, {"id": "p3", "title": "6.3.2. Final Sürümünün Yayımlanması: Release Kavramı", "body": "Yazılımın temel işlevlerinin kararlı bir şekilde çalıştığı ve kullanıma hazır hâle geldiği aşama final sürüm olarak etiketlenebilir. Dijital depoda bir Release oluşturmak, projenin belirli bir sürümünü kayıt altına alarak kullanıcıların erişimine sunmaktır."}, {"id": "p4", "title": "Uygulama Özeti: Kod-Asistan v3.0 Büyük Final ve Yazılım Lansmanı", "body": "Kod-Asistan v3.0 Büyük Final ve Yazılım Lansmanı uygulamasında sarmal projenin tüm modüllerini içeren profesyonel bir README dokümantasyonu hazırlanır, projenin final sürümü (Release v3.0) dijital depoda yayımlanır ve tüm gelişim sürecini kapsayan v3.0 final sürümü dijital portfolyo (GitHub) üzerinden savunulur. Dönem boyunca ilmek ilmek işlenen Kod-Asistan projesi; hata ayıklama yapılarıyla, iç içe geçmiş veri sözlükleriyle ve veri güvenliği kurallarıyla donatılarak daha iyi bir mimariye ulaşmıştır. Bir yazılımcı olarak artık bu değerli proje endüstri standartlarında bir dokümantasyonla dijital portfolyoda sergilenir ve sınıf arkadaşları karşısında bir \"Yazılım Lansmanı\" ile savunulur.\n\n1. Aşama: README.md Dokümantasyonunun Hazırlanması aşamasında Kod-Asistan proje klasörünün ana dizinindeki README.md dosyası açılır ve belge aşağıdaki Markdown şablonuna göre kendi cümleleriyle doldurularak projenin vitrini tasarlanır.\n\n# KOD-ASİSTAN (v3.0 Final Sürüm)\n**Geliştirici:** [Adınız Soyadınız]\n## 1. Projenin Amacı ve Mimarisi\nBu proje, kullanıcılara günlük hesaplamalarda yardımcı olan, aynı zamanda verilerini JSON formatında kalıcı olarak saklayan kararlı bir dijital asistandır. Projede modüler yapı kullanılmış olup fonksiyonlar farklı dosyalara bölünmüştür.\n## 2. Temel Modüller ve Özellikler\n* **Çoklu İstisna Yönetimi:** Kullanıcı hatalarında program çökmez, `try-except` bloklarıyla kararlı çalışır.\n* **JSON Tabanlı Veri Saklama:** Kullanıcı tercihleri ve ayarları JSON dosyalarında saklanır.\n* **Veri Gizliliği (KVKK):** Kişisel veriler açık rıza olmadan asla diske kaydedilmez ve bellekten anında silinir.\n## 3. Kurulum ve Çalıştırma\nSistemi bilgisayarınızda çalıştırmak için VS Code terminalinde `python kod_asistan_ana.py` komutunu çalıştırmanız yeterlidir. Hassas ayar dosyaları `.gitignore` ile korunmaktadır.\n## 4. Etik Beyan ve Kaynakça\nBu projenin şifreleme algoritmaları tasarlanırken yapay zekâ asistanlarından yardım alınmış ancak tüm kodlar İnsan Denetimi süzgecinden geçirilerek doğrulanmıştır.\n\n2. Aşama: Final Sürümünün (Release v3.0) Yayımlanması aşamasında hazırlanan README dosyası kaydedilir, kod editörünün Kaynak Denetimi paneli açılarak tüm değişiklikler hazırlama alanına alınır, \"README dokümantasyonu final sürümü için güncellendi.\" mesajıyla Commit edilip proje Push edilir. Ardından internet tarayıcısından depoya girilerek sağ taraftaki Releases bölümünden Create a new release butonuna tıklanır; etiket (Tag) alanına v3.0, başlık alanına ise Kod-Asistan Büyük Final Sürümü yazılarak Publish release butonuyla proje yayımlanır.\n\n3. Aşama: Tüm Gelişim Sürecinin Dijital Portfolyo (GitHub) Üzerinden Savunulması aşamasında; Release işlemi bittikten sonra GitHub deposundaki Source code (zip) bağlantısına tıklanarak projenin nihai hâli bilgisayara indirilir, arşivdeki kaynak kodların v3.0 etiketiyle ilişkilendirilen commit içeriğiyle uyumlu olduğu kontrol edilir. Sınıftan sıra arkadaşıyla eşleşilerek yalnızca son yazılan kodlar değil; v0.1 tasarımından başlayarak v3.0 final sürümüne kadar uzanan tüm gelişim süreci, GitHub deposundaki sürüm notları (commit history) ve güncel README.md dosyası kanıt olarak gösterilerek (dijital portfolyo üzerinden) arkadaşa savunulur. Kod denetçisi rolündeki arkadaştan gelen sorular şeffaflıkla ve mühendislik öz güveniyle cevaplanır. Arkadaşın dijital portfolyosu incelenerek kod kalitesi (değişken isimlendirmeleri, yorum satırları) ve etik şeffaflık (yapay zekâ beyanı vb.) bağlamında ona teknik geri bildirimler (Code Review) verilir."}, {"id": "p5", "title": "Öğrenme Yolculuğunun Değerlendirilmesi: Zihinsel Beceriler ve Mesleki Gelişim", "body": "Bir mimar, boş bir araziye temel atarak başladığı inşaat sürecini yapının kullanıma açıldığı gün tamamlar ve ardından tüm süreci gözden geçirir. Yazılım geliştirme süreci de ürünün dijital depoda yayımlanmasıyla (lansman) olgunluk evresine ulaşır. Temel veri türlerinden başlanıp karmaşık hata yönetimi ve veri güvenliği yapılarıyla donatılan Kod-Asistan projesi, adım adım geliştirilerek profesyonel bir dijital araca dönüşmüştür. Bu uzun süreçte ortaya konulan nihai ürün kadar o ürünü inşa ederken karşılaşılan hatalar, üretilen mantıksal çözümler ve kazanılan dijital tecrübeler de büyük bir mesleki değer taşır.\n\nGeliştirilen profesyonel bir yazılımın son kullanıcıya sunulmasının ardından yazılım geliştiricisinin kendi öğrenme yolculuğunu değerlendirmesi ve zihinsel becerilerini tartması beklenir. Tüm tasarım, kodlama ve hata ayıklama adımlarının eleştirel süzgeçten geçirilerek zihinde bıraktığı kalıcı izlerin analiz edilmesi, mesleki gelişimin ve kendini düzenleme becerisinin en temel gerekliliklerinden biridir. Elde edilen bu dijital birikimi somutlaştırmak ve eksiklikleri tespit etmek amacıyla öğrenme sürecinin yapılandırılmış bir öz değerlendirmesinin yapılması, bir yazılımcının kendi ustalık yolculuğunu bilinçli bir şekilde sürdürebilmesi için değerlidir."}, {"id": "p6", "title": "Öz Değerlendirme: Üçgen-Kare-Çember Yöntemiyle Öğrenme Yolculuğunun Gözden Geçirilmesi", "body": "Dayanıklılık, Etik ve Sunum öğrenme birimi boyunca gerçekleştirilen tüm hata ayıklama etkinlikleri, veri güvenliği (KVKK) süreçleri ve Kod-Asistan projesinin v3.0 Final Sürümü lansmanı, üç farklı geometrik sembol üzerinden kısa bir öz değerlendirmeye tabi tutulabilir: Üçgen ile zihinde net biçimde şekillenen ve artık başkasına rahatlıkla anlatılabilecek temel kazanımlar (hata yönetimi, bilişim etiği ve sürüm yayınlama becerisi); Kare ile hata ayıklama yapılarını kurgularken, girdi arındırma işlemlerini yönetirken veya projeyi v3.0 Release paketi olarak dijital depoda yayımlarken hâlâ zihinde tam olarak oturmayan ve öğretmenden sorulması gereken köşeli/pürüzlü noktalar; Çember ile ise yazılım dünyasında kullanıcıların hassas kişisel verilerini şeffaflıkla korumanın önemi, yapay zekâ destekli kodlamada dürüstlük ve kaynak gösterme beyanı gibi zihinde dönen ve mesleki öz güvene katkı sunan etik boyutlar. Bu üç sembol üzerinden yapılan kısa değerlendirme, öğrencinin ünite boyunca kazandığı teknik ve etik becerileri bilinçli bir şekilde özümsemesine yardımcı olur."}], "sorular": {"q1": {"type": "open", "closed": false, "text": "7. Uygulama'daki (Kod-Asistan v3.0 Büyük Final ve Yazılım Lansmanı) senaryoya göre README.md dosyasının '1. Projenin Amacı ve Mimarisi', '2. Temel Modüller ve Özellikler', '3. Kurulum ve Çalıştırma' ve '4. Etik Beyan ve Kaynakça' bölümlerinin her birinin projeyi ilk kez inceleyen bir geliştirici için neden gerekli olduğunu açıklayınız."}, "q2": {"type": "mc", "closed": true, "text": "Sürüm kontrol platformlarında Release oluşturmanın mantığı aşağıdakilerden hangisidir?", "opts": ["Projenin silinmiş eski kodlarını kurtarmak", "Projenin kararlı ve test edilmiş bir sürümünü kullanıcılarla paylaşmak", "Depoyu diğer yazılımcıların görmesine tamamen kapatmak", "Kodlarda yeni hatalar oluşturarak denetim sürecini başlatmak", "Programın çalışma zamanındaki sonsuz döngülerini durdurmak"], "correct": "Projenin kararlı ve test edilmiş bir sürümünü kullanıcılarla paylaşmak"}, "q3": {"type": "tf", "closed": true, "text": "Bir projenin README.md dosyasında yalnızca proje adının ve geliştirici adının bulunması, teknik dokümantasyon için yeterlidir.", "correct": "Yanlış"}, "q4": {"type": "open", "closed": false, "text": "Dijital bir portfolyoda sergilenen projenin vitrini olan README.md dosyasında hangi ana başlıkların bulunması bir zorunluluktur? Projeyi hazırlayan kişinin kariyeri açısından bu dosyanın önemini açıklayınız."}, "q5": {"type": "open", "closed": false, "text": "7. Uygulama'nın 2. Aşamasında (Final Sürümünün / Release v3.0 Yayımlanması) GitHub deposunda Releases bölümünden Create a new release ile Etiket (Tag) alanına v3.0 yazılıp Publish release butonuna basılması, projenin Kod-Asistan Büyük Final Sürümü olarak nasıl kayıt altına alındığını açıklayınız."}}}, {"no": 36, "baslik": "36. Hafta — Ünite 6 Ölçme ve Değerlendirme", "baslangicTarihi": "2027-06-07", "konular": [{"id": "p1", "title": "Ünite 6 Genel Tekrarı: Hata Sınıflandırması ve İstisna Yönetimi Mimarisi", "body": "Bu ünitede, programların söz dizimi hataları (syntax errors) ile çalışma zamanı hataları (runtime errors) arasındaki farkın yanı sıra bir yazılımın beklenmedik durumlara karşı çökmeden çalışmaya devam edebilme özelliği olan dayanıklılık (robustness) kavramı öğrenilmiştir. Riskli kodların try bloğuna alınması, olası hata türlerinin except BeklenenHataTuru as e: yapısıyla ayrı ayrı yakalanması ve hata çıksa da çıkmasa da çalışması gereken işlemlerin finally bloğuna yazılması, bir programın kullanıcı hatalarına karşı güvenli bir kalkanla korunmasını sağlayan temel mimariyi oluşturmuştur."}, {"id": "p2", "title": "Ünite 6 Genel Tekrarı: Traceback Analizi ve Hata Ayıklama (Debugging) Kültürü", "body": "Bir programın çöktüğü anda terminale yansıyan ve aşağıdan yukarıya doğru okunan Traceback (Geriye Dönük İz Sürme) mesajlarının, hatanın türünü ve programın hangi dosyada, hangi satırda durduğunu gösteren değerli birer ipucu olduğu kavranmıştır. Bir hata avcısı gibi bu izleri sondan başa doğru takip ederek sorunun kök nedenine ulaşma becerisi, yazılım dünyasında debugging (hata ayıklama) adı verilen mesleki disiplinin temelini oluşturur. Ariane 5 örneği, istisna yönetimi ihmal edildiğinde küçük bir tip dönüşüm hatasının bile bütün bir sistemi çökertebileceğini gözler önüne sermiştir."}, {"id": "p3", "title": "Ünite 6 Genel Tekrarı: Bilişim Etiği, KVKK ve Veri Güvenliği İlkeleri", "body": "Bu ünitede ayrıca bir yazılımın teknik olarak kusursuz çalışmasının yeterli olmadığı, kullanıcıların kişisel verilerinin (KVKK/GDPR ilkeleri çerçevesinde) veri minimizasyonu, güçlü parola kullanımı ve açık rıza esaslarına göre korunması gerektiği öğrenilmiştir. Yapay zekâ araçlarından yararlanırken telif hakkına saygı, ön yargı (bias) farkındalığı, insan denetimi ve şeffaflık ilkelerine uyulması gerektiği; kullanıcıdan alınan girdilerin ise sisteme zarar verebilecek karakterlerden .strip() ve .replace() gibi yöntemlerle arındırılması (sanitization) ve hassas verilerin (parola gibi) maskeleme veya hash gibi yöntemlerle güvence altına alınması gerektiği kavranmıştır."}, {"id": "p4", "title": "Ünite 6 Genel Tekrarı: Dijital Portfolyo, README.md ve Final Sürüm Yayımlama", "body": "Ünitenin son bölümünde, bir yazılım projesinin GitHub gibi dijital depolarda yalnızca yedeklenmediği, aynı zamanda projenin amacını, mimarisini, kurulum adımlarını ve etik beyanını şeffafça sunan bir README.md dosyasıyla dijital bir portfolyo hâline geldiği öğrenilmiştir. Projenin kararlı ve kullanıma hazır hâle gelen sürümünün dijital depoda bir Release olarak etiketlenip yayımlanmasının ve tüm gelişim sürecinin (commit history) bir Yazılım Lansmanı ile savunulmasının, bir yazılımcının teknik yetkinliği kadar üretimini anlatabilme ve savunabilme becerisinin de değerlendirildiği son aşama olduğu kavranmıştır."}], "sorular": {"q1": {"type": "mc", "closed": true, "text": "Yazılım geliştirme sürecinde çalışma zamanı hatalarının programı çökertmesini engellemek için kullanılan standart hata yönetim mimarisi aşağıdakilerden hangisidir?", "opts": ["if-elif-else yapıları", "while-for döngüleri", "try-except-finally blokları", "import ve modül yönetimi", "json.dump() ve json.load() metotları"], "correct": "try-except-finally blokları"}, "q2": {"type": "mc", "closed": true, "text": "Üç elemanlı bir liste (örneğin liste = [\"A\", \"B\", \"C\"]) tanımlanmıştır. Kullanıcının liste[5] şeklinde bir eleman çağırmaya çalışması durumunda sınır aşımı nedeniyle oluşan çalışma zamanı hatası aşağıdakilerden hangisidir?", "opts": ["ValueError", "NameError", "TypeError", "ZeroDivisionError", "IndexError"], "correct": "IndexError"}, "q3": {"type": "mc", "closed": true, "text": "try-except hata yönetim mimarisinde finally bloğunun temel işlevi aşağıdakilerden hangisidir?", "opts": ["Belirli bir hata durumu oluştuğunda devreye girmek", "Hata oluşmayan durumlarda kod bloklarını çalıştırmak", "Her koşulda çalışarak bellek temizliğini sağlamak", "Programı tamamen kapatıp bilgisayarı yeniden başlatmak", "Oluşan hatayı doğrudan GitHub sunucularına raporlamak"], "correct": "Her koşulda çalışarak bellek temizliğini sağlamak"}, "q4": {"type": "mc", "closed": true, "text": "Yapay zekâ destekli yazılım geliştirmede karşılaşılabilecek bilişim etiği riskleri arasında aşağıdakilerden hangisi yer almaz?", "opts": ["Başkalarına ait lisanslı veya telifli kodların izinsiz kullanılması", "Modeldeki veri ön yargılarının yazılım algoritmalarına doğrudan yansıtılması", "Üretilen kodların insan denetimi atlanarak aktif sisteme aktarılması", "Yapay zekâ tarafından üretilen kodların her zaman hatasız çalışması", "Proje alınan yapay zekâ desteklerinin kullanıcılardan kasten gizlenmesi"], "correct": "Yapay zekâ tarafından üretilen kodların her zaman hatasız çalışması"}, "q5": {"type": "mc", "closed": true, "text": "Sürüm kontrol platformlarında Release oluşturmanın mantığı aşağıdakilerden hangisidir?", "opts": ["Projenin silinmiş eski kodlarını kurtarmak", "Projenin kararlı ve test edilmiş bir sürümünü kullanıcılarla paylaşmak", "Depoyu diğer yazılımcıların görmesine tamamen kapatmak", "Kodlarda yeni hatalar oluşturarak denetim sürecini başlatmak", "Programın çalışma zamanındaki sonsuz döngülerini durdurmak"], "correct": "Projenin kararlı ve test edilmiş bir sürümünü kullanıcılarla paylaşmak"}, "q6": {"type": "mc", "closed": true, "text": "Bir kullanıcının sisteme girdiği \"Abc!123\" şifresini, JSON dosyasına \"*******\" şekline dönüştürerek kaydetme işlemine bilişim güvenliğinde ne ad verilir?", "opts": ["İnsan Denetimi", "Şifre Maskeleme", "Tip Dönüşümü", "Sürüm Kontrolü", "İstisna Yönetimi"], "correct": "Şifre Maskeleme"}, "q7": {"type": "mc", "closed": true, "text": "Bir yazılımcının kullanıcıdan kişisel verileri almadan önce hukuki bir aydınlatma metni sunması ve verileri kullanıcının onay vermesi durumunda kaydetmesi, hangi yasal / etik kavramla doğrudan ilişkilidir?", "opts": ["Release", "Syntax Checking", "Açık Rıza ve KVKK Farkındalığı", "Output Analysis", "Divide and Conquer"], "correct": "Açık Rıza ve KVKK Farkındalığı"}, "q8": {"type": "open", "closed": false, "text": "Yazılım projelerinde try, except ve finally bloklarının görev hiyerarşisini, programın kararlılığı (çökmeden çalışmaya devam etmesi) bağlamında açıklayınız."}, "q9": {"type": "open", "closed": false, "text": "Siber güvenlik ve veri bütünlüğü ilkeleri gereği kullanıcının girdiği bir metinsel veriyi doğrudan json.dump() ile diske kaydetmek yerine neden önce Sanitization (girdi arındırma) işleminden geçirilmelidir? Gerekçeleriyle açıklayınız."}, "q10": {"type": "open", "closed": false, "text": "Dijital bir portfolyoda sergilenen projenin vitrini olan README.md dosyasında hangi ana başlıkların bulunması bir zorunluluktur? Projeyi hazırlayan kişinin kariyeri açısından bu dosyanın önemini açıklayınız."}}}, {"no": 37, "baslik": "37. Hafta — Yıl Sonu Genel Tekrar", "baslangicTarihi": "2027-06-14", "konular": [{"id": "p1", "title": "Ünite 1 Özeti: Algoritma, Problem Çözme ve GİÇ Modeli", "body": "Yıl boyunca öğrenilen ilk temel, bir problemi çözerken izlenecek adımların algoritma olarak tanımlanması ve bu adımların Girdi-İşlem-Çıktı (GİÇ) modeliyle düzenlenmesiydi. Algoritmalar günlük dilde sözde kod (pseudocode) ile ifade edilmiş, ardından akış şemalarındaki standart semboller (başlangıç/bitiş, işlem, karar, girdi/çıktı) kullanılarak görselleştirilmiş ve elle çalıştırma yöntemiyle adım adım test edilmiştir."}, {"id": "p2", "title": "Ünite 2 Özeti: Python, Veri Türleri ve Operatörler", "body": "İkinci ünitede Python programlama dili ve geliştirme ortamları tanıtılmış, değişken tanımlama kuralları, temel veri türleri (int, float, str, bool) ve sabitler öğrenilmiştir. Kullanıcıdan input() ile veri alma, tür dönüşümü (type casting) ve aritmetik, karşılaştırma ile mantıksal operatörlerin işlem önceliğine göre kullanımı bu ünitenin temel kazanımları arasında yer almıştır."}, {"id": "p3", "title": "Ünite 3 Özeti: Karar Yapıları, Döngüler ve Turtle", "body": "Üçüncü ünitede programın akışını yönlendiren if, if-else ve if-elif-else koşul yapıları ile iç içe koşullar öğrenilmiştir. Ardından belirli sayıda tekrar için for ve range(), belirsiz sayıda tekrar için while döngüleri işlenmiş; kazanılan bu döngü mantığı turtle modülüyle geometrik şekiller ve fraktal desenler çizerek pekiştirilmiş ve GitHub'da Release kavramıyla tanışılmı   function el(tag, attrs, children){
    var e = document.createElement(tag);
    attrs = attrs || {};
    for (var k in attrs){
      if (k === "class") e.className = attrs[k];
      else if (k === "html") e.innerHTML = attrs[k];
      else if (k.indexOf("on") === 0) e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    }
    (children||[]).forEach(function(c){ if (c!==null && c!==undefined) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return e;
  }
  function toast(msg){
    var t = document.getElementById("toast");
    if (!t) return;
    t.textContent = msg; t.classList.add("show");
    setTimeout(function(){ t.classList.remove("show"); }, 2200);
  }
  function nowIso(){ return new Date().toISOString(); }
  function fmtDate(iso){
    if (!iso) return "—";
    return new Date(iso).toLocaleDateString("tr-TR", {day:"numeric", month:"long", year:"numeric"});
  }
  function toDateInputValue(iso){
    if (!iso) return "";
    var d = new Date(iso);
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }
  function progKey(no, wk){ return "p_"+String(no).replace(/[^A-Za-z0-9_.\-]/g,"_")+"_w"+wk; }
  function emptyProgress(no, wk){ return { okul_no:no, hafta_no:wk, pages:{}, answers:{}, completed_at:null }; }
  function sortedWeekNos(){ return Object.keys(state.weeks).map(Number).sort(function(a,b){ return a-b; }); }

  function closedScore(prog, week){
    var total=0, correct=0;
    var sorular = week.sorular || {};
    Object.keys(sorular).forEach(function(qid){
      var q = sorular[qid]; if (!q.closed) return; total++;
      var a = prog.answers && prog.answers[qid]; if (a && a.correct) correct++;
    });
    return total ? correct/total : 0;
  }
  function allPagesRead(prog, week){
    if (week.sayfalar && week.sayfalar.length){
      return week.sayfalar.every(function(p){ return prog.pages && prog.pages[p.id]; });
    }
    var konular = week.konular || [];
    if (!konular.length) return true;
    return konular.every(function(t){ return prog.pages && prog.pages[t.id]; });
  }
  function isAnsweredNonClosed(q, a){
    if (!a) return false;
    if (q.type === "list") return (a.values||[]).some(function(v){ return v && v.trim(); });
    return !!a.text;
  }
  function allOpenSubmitted(prog, week){
    var sorular = week.sorular || {};
    return Object.keys(sorular).every(function(qid){
      var q = sorular[qid]; if (q.closed) return true;
      return isAnsweredNonClosed(q, prog.answers && prog.answers[qid]);
    });
  }
  function hasClosedQuestions(week){ return Object.keys(week.sorular||{}).some(function(qid){ return week.sorular[qid].closed; }); }
  function computeFlow(week){
    var sorular = week.sorular || {};
    if (week.sayfalar && week.sayfalar.length){
      var sflow = week.sayfalar.map(function(p){ return {type:"sayfa", id:p.id}; });
      Object.keys(sorular).sort(function(a,b){
        return (parseInt(a.replace(/\D/g,""),10)||0) - (parseInt(b.replace(/\D/g,""),10)||0);
      }).forEach(function(qid){ sflow.push({type:"soru", id:qid}); });
      return sflow;
    }
    var konular = week.konular || [];
    var sira = week.sira || [];
    var flow = [];
    var seen = {};
    sira.forEach(function(item){
      var key = item.type+":"+item.id;
      if (seen[key]) return;
      if (item.type === "konu" && konular.some(function(t){ return t.id === item.id; })){ flow.push({type:"konu", id:item.id}); seen[key]=true; }
      else if (item.type === "soru" && sorular[item.id]){ flow.push({type:"soru", id:item.id}); seen[key]=true; }
    });
    konular.forEach(function(t){
      var key = "konu:"+t.id;
      if (!seen[key]){ flow.push({type:"konu", id:t.id}); seen[key]=true; }
    });
    Object.keys(sorular).sort(function(a,b){
      return (parseInt(a.replace(/\D/g,""),10)||0) - (parseInt(b.replace(/\D/g,""),10)||0);
    }).forEach(function(qid){
      var key = "soru:"+qid;
      if (!seen[key]){ flow.push({type:"soru", id:qid}); seen[key]=true; }
    });
    return flow;
  }
  async function setFlow(weekNo, flow){
    var week = state.weeks[weekNo];
    await db.collection("haftalar").doc("hafta"+weekNo).set(Object.assign({}, week, { sira: flow }));
  }
  function moveFlowItem(weekNo, idx, dir){
    var week = state.weeks[weekNo];
    var flow = computeFlow(week).slice();
    var j = idx + dir;
    if (j < 0 || j >= flow.length) return;
    var tmp = flow[idx]; flow[idx] = flow[j]; flow[j] = tmp;
    setFlow(weekNo, flow);
  }
  function isComplete(prog, week){
    var closedOk = hasClosedQuestions(week) ? (closedScore(prog, week) >= CLOSED_THRESHOLD) : true;
    return allPagesRead(prog, week) && allOpenSubmitted(prog, week) && closedOk;
  }
  function computeStatus(prog, week){
    prog = prog || emptyProgress("", week.hafta_no);
    var deadlineIso = week.bitis_tarihi;
    var deadlinePassed = deadlineIso && new Date() > new Date(deadlineIso);
    var complete = isComplete(prog, week);
    if (complete && prog.completed_at && deadlineIso && new Date(prog.completed_at) > new Date(deadlineIso)) return "late";
    if (complete) return "done";
    if (deadlinePassed) return "warn";
    var started = (prog.pages && Object.keys(prog.pages).length>0) || (prog.answers && Object.keys(prog.answers).length>0);
    return started ? "progress" : "notstarted";
  }
  function statusMeta(s){
    return {
      done:{ label:"Tamamlandı", cls:"ok", icon:"✓" },
      late:{ label:"Gecikmeli tamamlandı", cls:"late", icon:"⟳" },
      warn:{ label:"Süresi geçti", cls:"warn", icon:"!" },
      progress:{ label:"Devam ediyor", cls:"progress", icon:"…" },
      notstarted:{ label:"Başlamadı", cls:"progress", icon:"·" }
    }[s];
  }
  function hasUnreviewedOpen(prog, week){
    var sorular = week.sorular || {};
    return Object.keys(sorular).some(function(qid){
      var q = sorular[qid]; if (q.closed) return false;
      var a = prog.answers && prog.answers[qid];
      if (!isAnsweredNonClosed(q, a)) return false;
      return !a.review || a.review === "bekliyor";
    });
  }
  function firstUnreadIndex(prog, week){
    var konular = week.konular || [];
    for (var i=0;i<konular.length;i++){ if (!(prog.pages && prog.pages[konular[i].id])) return i; }
    return Math.max(0, konular.length-1);
  }
  function firstUnfinishedFlowIndex(prog, week){
    var flow = computeFlow(week);
    for (var i=0;i<flow.length;i++){
      var it = flow[i];
      var done = (it.type==="konu"||it.type==="sayfa") ? (prog.pages && prog.pages[it.id]) : (prog.answers && prog.answers[it.id]);
      if (!done) return i;
    }
    return Math.max(0, flow.length-1);
  }

  // Hafta kilidi: iki kural birlikte gecerli - tarihi gelmediyse VEYA onceki hafta tamamlanmadiysa kilitli
  function weekLockInfo(weekNo, studentProgressMap){
    var nos = sortedWeekNos();
    var idx = nos.indexOf(weekNo);
    var week = state.weeks[weekNo];
    var dateOk = new Date() >= new Date(week.baslangic_tarihi);
    if (!dateOk) return { locked:true, reason:"tarihi henüz gelmedi" };
    if (idx === 0) return { locked:false };
    var prevNo = nos[idx-1];
    var prevWeek = state.weeks[prevNo];
    var prevProg = studentProgressMap[prevNo] || emptyProgress("", prevNo);
    if (!isComplete(prevProg, prevWeek)) return { locked:true, reason:(prevNo+". hafta tamamlanmadı") };
    return { locked:false };
  }

  /* ---------------- DB KATMANI (Supabase) ---------------- */

  // Prototipte kullanılan claude "db" capability'siyle aynı arayüzü
  // (collection(x).doc(y).set/get/delete, collection(x).limit(n).get,
  // collection(x).onSnapshot) Supabase üzerinde birebir taklit eden katman.
  // Böylece uygulamanın geri kalanı (render, state, tüm özellikler) hiç
  // değişmeden çalışmaya devam ediyor.
  function makeSupabaseDb(sb){
    function collection(name){
      return {
        doc: function(id){
          var docId = String(id);
          return {
            set: async function(obj){
              var { error } = await sb.from("store").upsert(
                { collection:name, id:docId, data:obj, updated_at:new Date().toISOString() },
                { onConflict:"collection,id" }
              );
              if (error) throw error;
            },
            delete: async function(){
              var { error } = await sb.from("store").delete().eq("collection", name).eq("id", docId);
              if (error) throw error;
            },
            get: async function(){
              var { data, error } = await sb.from("store").select("data").eq("collection", name).eq("id", docId).maybeSingle();
              if (error) throw error;
              return { exists: !!data, data: function(){ return data ? data.data : undefined; } };
            }
          };
        },
        limit: function(n){
          return {
            get: async function(){
              var { data, error } = await sb.from("store").select("id,data").eq("collection", name).limit(n);
              if (error) throw error;
              return {
                empty: !data.length,
                docs: data.map(function(r){ return { id:r.id, data:function(){ return r.data; } }; })
              };
            }
          };
        },
        onSnapshot: function(cb){
          var fetchAll = async function(){
            var { data, error } = await sb.from("store").select("id,data").eq("collection", name);
            if (error){ console.error(error); return; }
            cb({ docs: data.map(function(r){ return { id:r.id, data:function(){ return r.data; } }; }) });
          };
          fetchAll();
          var channel = sb.channel("store-"+name+"-"+Math.random().toString(36).slice(2))
            .on("postgres_changes", { event:"*", schema:"public", table:"store", filter:"collection=eq."+name }, fetchAll)
            .subscribe();
          return function unsubscribe(){ sb.removeChannel(channel); };
        }
      };
    }
    return { collection: collection };
  }

  async function ensureDb(){
    if (db) return db;
    if (typeof window.supabase === "undefined" || SUPABASE_URL.indexOf("BURAYA") !== -1) return null;
    var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    db = makeSupabaseDb(sb);
    return db;
  }

  async function seedIfEmpty(){
    var qs = await db.collection("haftalar").limit(1).get();
    if (qs.empty){
      var base = new Date();
      for (var i=0;i<WEEKS_SEED.length;i++){
        var w = WEEKS_SEED[i];
        var start = w.baslangicTarihi ? new Date(w.baslangicTarihi + "T00:00:00") : (function(){ var d = new Date(base); d.setDate(d.getDate() + i*7); return d; })();
        var end = new Date(start); end.setDate(end.getDate() + 7);
        await db.collection("haftalar").doc("hafta"+w.no).set({
          hafta_no: w.no, baslik: w.baslik,
          baslangic_tarihi: start.toISOString(), bitis_tarihi: end.toISOString(),
          konular: w.konular, sorular: w.sorular
        });
      }
    }
  }

  function subscribeAll(){
    unsubs.forEach(function(u){ u(); });
    unsubs = [];

      state.siniflar = m; render();

  async function upsertProgress(no, wk, patch){
    var key = progKey(no, wk);
    var current = state.progress[key] || emptyProgress(no, wk);
    var week = state.weeks[wk];
    var body = Object.assign({}, current, patch, { okul_no:no, hafta_no:wk, updated_at: nowIso() });
    if (isComplete(body, week) && !body.completed_at) body.completed_at = nowIso();
    if (!isComplete(body, week)) body.completed_at = null;
    await db.collection("progress").doc(key).set(body);
  }
  async function savePage(no, wk, pageId, val){
    var key = progKey(no, wk);
    var current = state.progress[key] || emptyProgress(no, wk);
    var pages = Object.assign({}, current.pages||{}); pages[pageId] = val;
    await upsertProgress(no, wk, { pages: pages, answers: current.answers||{} });
  }
  async function saveAnswer(no, wk, qid, answerObj){
    var key = progKey(no, wk);
    var current = state.progress[key] || emptyProgress(no, wk);
    var answers = Object.assign({}, current.answers||{}); answers[qid] = answerObj;
    await upsertProgress(no, wk, { pages: current.pages||{}, answers: answers });
  }
  async function reviewAnswer(no, wk, qid, verdict){
    var key = progKey(no, wk);
    var current = state.progress[key] || emptyProgress(no, wk);
    var answers = Object.assign({}, current.answers||{});
    if (!answers[qid]) return;
    answers[qid] = Object.assign({}, answers[qid], { review: verdict });
    await upsertProgress(no, wk, { pages: current.pages||{}, answers: answers });
  }

  function captureScrollPositions(){
    var pos = {};
    document.querySelectorAll("[data-scroll-key]").forEach(function(elx){
      pos[elx.getAttribute("data-scroll-key")] = elx.scrollTop;
    });
    return pos;
  }
  function restoreScrollPositions(pos){
    document.querySelectorAll("[data-scroll-key]").forEach(function(elx){
      var key = elx.getAttribute("data-scroll-key");
      if (pos[key] !== undefined) elx.scrollTop = pos[key];
    });
  }
  function captureFocusKey(){
    var a = document.activeElement;
    if (!a || !a.getAttribute) return null;
    var key = a.getAttribute("data-focus-key");
    if (!key) return null;
    return { key: key, selStart: (typeof a.selectionStart === "number") ? a.selectionStart : null };
  }
  function restoreFocusKey(info){
    if (!info) return;
    var el2 = document.querySelector('[data-focus-key="'+info.key+'"]');
    if (!el2) return;
    el2.focus();
    if (info.selStart !== null && typeof el2.setSelectionRange === "function"){
      try { el2.setSelectionRange(info.selStart, info.selStart); } catch(e){}
    }
  }
  function render(){
    var root = document.getElementById("app");
    var scrollPos = captureScrollPositions();
    var focusInfo = captureFocusKey();
    root.innerHTML = "";
    if (state.view === "login") root.appendChild(renderLogin());
    else if (state.view === "student") root.appendChild(renderStudent());
    else if (state.view === "teacher") root.appendChild(renderTeacher());
    restoreScrollPositions(scrollPos);
    if (state._pendingFocusKey){
      var pk = state._pendingFocusKey; state._pendingFocusKey = null;
      var pel = document.querySelector('[data-focus-key="'+pk+'"]');
      if (pel) pel.focus(); else restoreFocusKey(focusInfo);
    } else {
      restoreFocusKey(focusInfo);
    }
  }

  function renderFlow(prog, week){
    var flow = computeFlow(week);
    var box = el("div", { class:"reader" });
    if (!flow.length){
      box.appendChild(el("p", { class:"empty-hint" }, ["Bu hafta için henüz içerik eklenmedi."]));
      return box;
    }
    var idx = Math.max(0, Math.min(state.flowIndex, flow.length-1));
    var item = flow[idx];
    var konular = week.konular || [];
    var sorular = week.sorular || {};
    var dots = el("div", { class:"reader-dots" });
    flow.forEach(function(fi,i){
      var done = (fi.type==="konu"||fi.type==="sayfa") ? (prog.pages && prog.pages[fi.id]) : (prog.answers && prog.answers[fi.id]);
      dots.appendChild(el("span", { class:"rd"+(done?" read":"")+(i===idx?" current":"") }));
    });
    dots.appendChild(el("span", { class:"rd-label" }, [(idx+1)+" / "+flow.length]));
    box.appendChild(dots);

    var isLast = idx === flow.length-1;
    var nextLabel = null;
    if (item.type === "sayfa"){
      var sp = (week.sayfalar||[]).filter(function(x){ return x.id===item.id; })[0];
      if (sp){
        box.appendChild(renderSayfa(sp, prog, week));
        nextLabel = isLast ? "Bitir ✓" : "İleri →";
      }
    } else if (item.type === "konu"){
      var t = konular.filter(function(x){ return x.id===item.id; })[0];
      if (t){
        box.appendChild(el("h3", {}, [t.title]));
        box.appendChild(el("p", { class:"body" }, [t.body]));
        nextLabel = isLast ? "Okudum, Bitir ✓" : "Okudum, İleri →";
      }
    } else {

  function renderExercise(qid, q, prog, week){
    var box = el("div", { class:"ex" });
    box.appendChild(el("div", { class:"ex-kicker "+(q.closed?"closed":"open") }, [q.closed?"Kapalı Soru":(q.type==="list"?"Kelime Listesi":"Açık Uçlu Soru")]));
    box.appendChild(el("p", { class:"q" }, [q.text]));
    var existing = prog.answers && prog.answers[qid];

    if (q.type === "mc" || q.type === "tf"){
      var options = q.type==="mc" ? q.opts : ["Doğru","Yanlış"];
      var opts = el("div", { class:"opts" });
      options.forEach(function(o){
        var radio = el("input", { type:"radio", name:qid });
        radio.checked = existing && existing.value === o;
        opts.appendChild(el("label", {}, [radio, o]));
        radio.addEventListener("change", function(){
          saveAnswer(state.currentStudent, state.currentWeek, qid, { value:o, correct: o===q.correct, submitted_at: nowIso() });
          render();
        });
      });
      box.appendChild(opts);
    } else if (q.type === "fill"){
      var inp = el("input", { type:"text", placeholder:"cevabınızı yazın" });
      inp.value = existing ? existing.value : "";
      box.appendChild(inp);
      box.appendChild(el("div", { class:"ex-foot" }, [ el("button", { class:"btn small", onclick:function(){
        var v = inp.value.trim().toLowerCase();
        saveAnswer(state.currentStudent, state.currentWeek, qid, { value:inp.value, correct: (q.accepted||[]).indexOf(v)!==-1, submitted_at: nowIso() });
        advanceFlowIfPossible(week);
        render();
      } }, ["Cevabı Gönder"]) ]));
    } else if (q.type === "list"){
      var count = q.count || 5;
      var existingVals = (existing && existing.values) || [];
      var listWrap = el("div", { class:"list-answers", style:"display:flex; flex-direction:column; gap:8px;" });
      var saveListLine = function(i, value){
        var vals = existingVals.slice();
        while (vals.length < count) vals.push("");
        vals[i] = value;
        saveAnswer(state.currentStudent, state.currentWeek, qid, { values: vals, submitted_at: nowIso(), review: (existing&&existing.review)||"bekliyor" });
        var allFilled = vals.slice(0, count).every(function(v){ return v && v.trim(); });
        if (allFilled){
          advanceFlowIfPossible(week);
        } else {
          state._pendingFocusKey = "list:"+qid+":"+Math.min(i+1, count-1);
        }
        render();
      };
      for (var li=0; li<count; li++){
        (function(i){
          var row = el("div", { style:"display:flex; align-items:center; gap:8px;" });
          row.appendChild(el("span", { style:"font-weight:600; min-width:20px; color:var(--ink-muted);" }, [(i+1)+"."]));
          var liInp = el("input", { type:"text", "data-focus-key":"list:"+qid+":"+i, placeholder:"kelime "+(i+1) });
          liInp.value = existingVals[i] || "";
          liInp.addEventListener("keydown", function(e){
            if (e.key !== "Enter") return;
            e.preventDefault();
            saveListLine(i, liInp.value);
          });
          liInp.addEventListener("blur", function(){
            if ((existingVals[i]||"") === liInp.value) return;
            var vals = existingVals.slice();
            while (vals.length < count) vals.push("");
            vals[i] = liInp.value;
            saveAnswer(state.currentStudent, state.currentWeek, qid, { values: vals, submitted_at: nowIso(), review: (existing&&existing.review)||"bekliyor" });
          });
          row.appendChild(liInp);
          row.appendChild(el("button", { class:"btn small primary", title:"Bu satırı onayla", style:"flex-shrink:0;", onclick:function(){ saveListLine(i, liInp.value); } }, ["↵"]));
          listWrap.appendChild(row);
        })(li);
      }
      box.appendChild(listWrap);
    } else {
      var ta = el("textarea", { placeholder:"cevabınızı buraya yazın..." });
      ta.value = existing ? (existing.text||"") : "";
      box.appendChild(ta);
      box.appendChild(el("div", { class:"ex-foot" }, [ el("button", { class:"btn small primary", onclick:function(){
        if (!ta.value.trim()){ toast("Lütfen cevabını yazmadan gönderme."); return; }
        saveAnswer(state.currentStudent, state.currentWeek, qid, { text:ta.value, submitted_at: nowIso(), review: (existing&&existing.review)||"bekliyor" });
        advanceFlowIfPossible(week);
        render();
      } }, ["Cevabı Gönder"]) ]));
    }

    if (existing){
      if (q.closed){
        box.appendChild(el("div", { class:"ex-result "+(existing.correct?"correct":"wrong") }, [existing.correct?"✓ Doğru":"✗ Yanlış, tekrar deneyebilirsin"]));
      } else {
        var rv = existing.review || "bekliyor";
        var cls = rv==="yeterli"?"reviewed-ok":rv==="gelistirilmeli"?"reviewed-bad":"pending";
        var label = rv==="yeterli"?"✓ Öğretmen: yeterli":rv==="gelistirilmeli"?"△ Öğretmen: geliştirilmeli":"⟳ Gönderildi, öğretmen incelemesi bekliyor";
        box.appendChild(el("div", { class:"ex-result "+cls }, [label]));
      }
    }
    return box;
  }

  function renderAddQuestionForm(weekNo, editQid, editQ){
    var isEdit = !!editQid;
    var f = el("div", { class:"add-form" });
    var typeSel = el("select", { class:"inp" }, [
      el("option", { value:"mc" }, ["Çoktan Seçmeli"]),
      el("option", { value:"tf" }, ["Doğru / Yanlış"]),
      el("option", { value:"fill" }, ["Boşluk Doldurma"]),
      el("option", { value:"open" }, ["Açık Uçlu"]),
      el("option", { value:"list" }, ["Kelime Listesi (Çoklu Boşluk)"])
    ]);
    var type = isEdit ? (state.teacher.editQType || editQ.type) : state.teacher.addQOpen;
    typeSel.value = type;
    typeSel.addEventListener("change", function(e){
      if (isEdit) state.teacher.editQType = e.target.value; else state.teacher.addQOpen = e.target.value;
      render();
    });
    f.appendChild(typeSel);

    var textTa = el("textarea", { class:"inp", style:"min-height:60px;", placeholder:"Soru metni" });
    if (isEdit) textTa.value = editQ.text || "";
    f.appendChild(textTa);

    var optionInputs = [];
    var correctRadios = [];
    var tfSelect, fillInput, countInput;

    if (type === "list"){
      countInput = el("input", { class:"inp", type:"number", min:"2", max:"10", placeholder:"Boşluk sayısı" });
      countInput.value = (isEdit && editQ.type==="list") ? (editQ.count||5) : 5;
      f.appendChild(el("label", { style:"font-size:12px; color:var(--ink-muted);" }, ["Boşluk sayısı (öğrenci bu kadar satır görecek)"]));
      f.appendChild(countInput);
    }

    if (type === "mc"){
      var existingOpts = (isEdit && editQ.type==="mc") ? (editQ.opts||[]) : [];
      for (var i=0;i<4;i++){
        var row = el("div", { class:"opt-row" });
        var radio = el("input", { type:"radio", name:"correctopt" });
        var oi = el("input", { type:"text", placeholder:"Seçenek "+(i+1) });
        if (existingOpts[i] !== undefined){
          oi.value = existingOpts[i];
          if (existingOpts[i] === editQ.correct) radio.checked = true;
        } else if (i===0 && !existingOpts.length){
          radio.checked = true;
        }
        optionInputs.push(oi); correctRadios.push(radio);
        row.appendChild(radio); row.appendChild(oi);
        f.appendChild(row);
      }
    } else if (type === "tf"){
      tfSelect = el("select", { class:"inp" }, [ el("option",{value:"Doğru"},["Doğru cevap: Doğru"]), el("option",{value:"Yanlış"},["Doğru cevap: Yanlış"]) ]);
      if (isEdit && editQ.type==="tf") tfSelect.value = editQ.correct;
      f.appendChild(tfSelect);
    } else if (type === "fill"){
      fillInput = el("input", { class:"inp", type:"text", placeholder:"Kabul edilen cevaplar (virgülle ayır)" });
      if (isEdit && editQ.type==="fill") fillInput.value = (editQ.accepted||[]).join(", ");
      f.appendChild(fillInput);
    }

    var row2 = el("div", { style:"display:flex; gap:8px; justify-content:flex-end;" });
    row2.appendChild(el("button", { class:"btn small", onclick:function(){
      if (isEdit){ state.teacher.editingQuestion=null; state.teacher.editQType=null; } else { state.teacher.addQOpen=null; }
      render();
    } }, ["Vazgeç"]));
    row2.appendChild(el("button", { class:"btn small primary", onclick:function(){
      var text = textTa.value.trim();
      if (!text){ toast("Lütfen soru metnini gir."); return; }
      var qDef;
      if (type === "mc"){
        var opts = optionInputs.map(function(i){ return i.value.trim(); });
        if (opts.some(function(o){ return !o; })) { toast("4 seçeneği de doldur."); return; }
        var correctIdx = correctRadios.findIndex(function(r){ return r.checked; });
        if (correctIdx === -1) correctIdx = 0;
        qDef = { type:"mc", closed:true, text:text, opts:opts, correct:opts[correctIdx] };
      } else if (type === "tf"){
        qDef = { type:"tf", closed:true, text:text, correct:tfSelect.value };
      } else if (type === "fill"){
        var accepted = fillInput.value.split(",").map(function(s){ return s.trim().toLowerCase(); }).filter(Boolean);
        if (!accepted.length){ toast("En az bir kabul edilen cevap gir."); return; }
        qDef = { type:"fill", closed:true, text:text, accepted:accepted };
      } else if (type === "list"){
        var cnt = parseInt(countInput.value, 10);
        if (!cnt || cnt < 2) cnt = 5;
        qDef = { type:"list", closed:false, text:text, count:cnt };
      } else {
        qDef = { type:"open", closed:false, text:text };
      }
      if (isEdit){ state.teacher.editQType=null; updateQuestion(weekNo, editQid, qDef); }
      else addQuestion(weekNo, qDef);
    } }, ["Kaydet"]));
    f.appendChild(row2);
    return f;
  }

    var modal = el("div", { class:"modal" });
    modal.appendChild(el("h3", {}, ["Yeni Hafta Ekle"]));
    var noInp = el("input", { class:"inp", type:"number" }); noInp.value = suggestedNo;
    var baslikInp = el("input", { class:"inp", type:"text", placeholder:"Hafta başlığı" }); baslikInp.value = suggestedNo+". Hafta";
    var startInp = el("input", { class:"inp", type:"date" }); startInp.value = toDateInputValue(suggestedStart.toISOString());
    var endInp = el("input", { class:"inp", type:"date" }); endInp.value = toDateInputValue(suggestedEnd.toISOString());
    modal.appendChild(el("label", { style:"font-size:12px; color:var(--ink-muted);" }, ["Hafta No"])); modal.appendChild(noInp);
    modal.appendChild(el("label", { style:"font-size:12px; color:var(--ink-muted);" }, ["Başlık"])); modal.appendChild(baslikInp);
    modal.appendChild(el("label", { style:"font-size:12px; color:var(--ink-muted);" }, ["Başlangıç Tarihi (kilidin açılacağı gün)"])); modal.appendChild(startInp);
    modal.appendChild(el("label", { style:"font-size:12px; color:var(--ink-muted);" }, ["Bitiş Tarihi (teslim/deadline)"])); modal.appendChild(endInp);
    var row = el("div", { style:"display:flex; gap:8px; justify-content:flex-end; margin-top:6px;" });
    row.appendChild(el("button", { class:"btn small", onclick:function(){ state.teacher.addWeekModal=false; render(); } }, ["Vazgeç"]));
    row.appendChild(el("button", { class:"btn small primary", onclick:function(){
      var n = parseInt(noInp.value,10);
      if (!n || !baslikInp.value.trim() || !startInp.value || !endInp.value){ toast("Lütfen tüm alanları doldur."); return; }
      if (state.weeks[n]){ toast("Bu hafta numarası zaten var."); return; }
      addWeek(n, baslikInp.value.trim(), new Date(startInp.value).toISOString(), new Date(endInp.value).toISOString());
      render();
    } }, ["Ekle"]));
    modal.appendChild(row);
    backdrop.appendChild(modal);
    return backdrop;
  }

  async function boot(){
    render();
    var d = await ensureDb();
    if (!d){
      document.getElementById("app").innerHTML = "<div style='padding:40px; font-family:sans-serif; color:#b23a2e;'>Bu görünümde paylaşılan veri (db) kullanılamıyor.</div>";
      return;
    }
    await seedIfEmpty();
    subscribeAll();
    render();
  }

  boot();
})();

</script>
</body>
</html>
